<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Status — treillis</title>
<meta name="description" content="Le livre de Cecilia L. Ridgeway, Status: Why Is It Everywhere? Why Does It Matter? (2019), reconstruit dans l'ordre géométrique : concepts, prémisses, thèses, positions écartées. Cecilia Ridgeway's Status, reconstructed in geometrical order.">

<style>
:root {
  --bg: #f7f6f2; --panel: #ffffff; --ink: #1f1d1a; --muted: #6b665d; --line: #e2ded5;
  --accent: #2f5d8a; --hl: #fff3c4;
  --definition: #3b6ea8; --auteur: #6b5bb0; --etude: #2f8a5b; --these: #c0702a; --refutee: #b83a3a; --manquant: #9b9b9b;
  --ok: #2f8a5b; --warn: #b7791f; --err: #b83a3a;
  --band: rgba(0,0,0,.035); --gut: 30px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --panel: #1f2023; --ink: #e8e6e1; --muted: #9a968d; --line: #33353a;
    --accent: #7fb0e0; --hl: #4a4220;
    --definition: #6d9fd6; --auteur: #a294e0; --etude: #5fbf8b; --these: #e39a55; --refutee: #e07070; --manquant: #777;
    --band: rgba(255,255,255,.04);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }

#app { display: grid; grid-template-columns: 290px 1fr; grid-template-rows: 48px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-family: var(--serif); font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .01em; }
header .meta { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.navbtn { border: 1px solid var(--line); background: none; border-radius: 6px; width: 30px; height: 28px; cursor: pointer; font-size: 15px; line-height: 1; color: var(--ink); }
.navbtn:hover:not(:disabled) { background: var(--bg); }
.navbtn:disabled { opacity: .3; cursor: default; }
#nav { display: flex; gap: 4px; }
#trail { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; font-size: 12px; flex: 1; }
#trail .step { border: 0; background: none; cursor: pointer; padding: 3px 6px; border-radius: 4px; white-space: nowrap; color: var(--c, var(--muted)); font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
#trail .step:hover { background: var(--bg); }
#trail .step.cur { background: var(--bg); outline: 1px solid var(--c, var(--line)); }
#trail .step.fwd { opacity: .45; }
#trail .step .tt { font-weight: 400; color: var(--muted); margin-left: 4px; }
#trail .arrow { color: var(--line); }
#trail .lbl { color: var(--muted); margin-right: 4px; white-space: nowrap; }
.seq { display: flex; gap: 6px; }
.seq a { font-size: 12px; text-decoration: none; border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; color: var(--muted); white-space: nowrap; }
.seq a:hover { color: var(--ink); border-color: var(--ink); }
.seq a.off { visibility: hidden; }

/* Barre latérale */
#side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
#search { margin: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
#filters { padding: 0 12px 8px; display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chip.on { color: var(--ink); border-color: var(--ink); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
#list { overflow: auto; flex: 1; padding: 4px 0 16px; }
.group { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 14px 4px; }
.item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 14px; cursor: pointer; border-left: 3px solid transparent; }
.item:hover { background: var(--bg); }
.item.sel { background: var(--bg); border-left-color: var(--accent); }
.item .id { font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 6px; }
.item .t { color: var(--ink); }
.item .snip { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .badge-err { color: var(--err); font-size: 11px; margin-left: 4px; }
mark { background: var(--hl); color: inherit; padding: 0 1px; }

/* Zone principale */
#main { display: grid; grid-template-columns: 1fr 6px var(--readerW, 44%); min-height: 0; min-width: 0; }
#main.reading { grid-template-columns: 0 0 1fr; }
#main.reading #graphwrap, #main.reading #resizer { display: none; }
#graphwrap { position: relative; min-width: 0; overflow: hidden; }
#graph { position: absolute; top: 0; bottom: 0; left: var(--gut); width: calc(100% - var(--gut)); height: 100%; display: block; cursor: grab; user-select: none; }
#graph.drag { cursor: grabbing; }
#toolbar { position: absolute; top: 10px; left: calc(var(--gut) + 10px); z-index: 3; display: flex; gap: 4px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
#toolbar button { border: 0; background: none; padding: 4px 9px; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--muted); }
#toolbar button:hover { background: var(--bg); color: var(--ink); }
#toolbar button.on { background: var(--bg); color: var(--ink); font-weight: 600; }
#toolbar .sep { width: 1px; background: var(--line); margin: 2px 2px; }
#legend { position: absolute; bottom: 10px; left: calc(var(--gut) + 10px); z-index: 3; font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - var(--gut) - 20px); }
#legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; background: var(--c); }
#empty { position: absolute; inset: 0 0 0 var(--gut); display: none; align-items: center; justify-content: center; color: var(--muted); }
#resizer { cursor: col-resize; background: var(--line); opacity: .5; }
#resizer:hover { opacity: 1; }
#legend span.dash::before { height: 0; border-top: 2px dashed var(--c); background: none; vertical-align: 3px; }
/* Marge des parties (reprise de SpinozaGraph) : hors du graphe, ne recouvre jamais les nœuds */
#gutter { position: absolute; top: 0; bottom: 0; left: 0; width: var(--gut); background: var(--panel); border-right: 1px solid var(--line); overflow: hidden; z-index: 2; }
.glabel { position: absolute; left: 3px; right: 3px; border-radius: 6px; background: var(--band); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
.glabel:hover { border-color: var(--ink); }
.glabel span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 100%; font-family: var(--serif); font-size: 12.5px; padding: 6px 0; }
.glabel b { font-weight: 700; }
.glabel i { color: var(--muted); }
.band { fill: var(--band); cursor: pointer; }
.band:hover { fill: var(--hl); fill-opacity: .25; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 0 6px 4px 0; }
.seg button { border: 0; border-right: 1px solid var(--line); background: none; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--bg); color: var(--ink); font-weight: 600; }

/* Nœuds */
.node rect { fill: var(--panel); stroke: var(--c); stroke-width: 1.5; }
.node .bar { fill: var(--c); stroke: none; }
.node text { fill: var(--ink); font-size: 12px; pointer-events: none; }
.node text.nid { font-weight: 700; fill: var(--c); }
.node { cursor: pointer; transition: opacity .15s; }
.node.missing rect { stroke-dasharray: 4 3; }
.node.st-brouillon rect { stroke-dasharray: none; }
.node.st-retire { opacity: .45; }
.node.sel rect { stroke-width: 3; fill: var(--hl); }
.node.dim { opacity: .18; }
.node .status { stroke: var(--panel); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: .5; transition: opacity .15s; }
.edge.anc { stroke: var(--accent); stroke-width: 2.2; opacity: .95; }
.edge.desc { stroke: var(--these); stroke-width: 2.2; opacity: .95; }
.edge.dim { opacity: .07; }
.edge.missing { stroke-dasharray: 4 3; }
.edge.xpart { stroke-dasharray: 6 4; opacity: .35; }
.edge.contre { stroke: var(--refutee); stroke-dasharray: 2 4; stroke-width: 1.6; opacity: .7; }
.citation { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); margin: -10px 0 22px 19px; }
.citation .pg { font-style: normal; font-size: 12px; margin-left: 6px; }
#graph.m-all .edge.xpart:not(.anc):not(.desc) { display: none; }

/* Lecteur */
#reader { overflow: auto; background: var(--panel); border-left: 1px solid var(--line); min-width: 0; }
#reader .inner { max-width: 760px; margin: 0 auto; padding: 24px 32px 80px; }
#reader .crumbs { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
#reader .crumbs button { border: 1px solid var(--line); background: none; border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 12px; color: var(--muted); }
#reader .crumbs button:hover { color: var(--ink); }
#reader h1.title { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 4px 0 8px; line-height: 1.2; }
#reader h1.title .eid { color: var(--c); margin-right: 10px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.badge { font-size: 11px; border-radius: 4px; padding: 2px 7px; border: 1px solid var(--line); color: var(--muted); }
.badge b { color: var(--ink); font-weight: 600; }
.badge.type { background: var(--c); color: #fff; border-color: var(--c); }
.enonce { font-family: var(--serif); font-size: 17px; line-height: 1.55; border-left: 3px solid var(--c); padding: 4px 0 4px 16px; margin: 0 0 22px; }
.rel { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; font-size: 13px; padding: 14px 16px; background: var(--bg); border-radius: 8px; margin-bottom: 26px; }
.rel .k { color: var(--muted); }
.pill { display: inline-block; border: 1px solid var(--c, var(--line)); color: var(--c, var(--ink)); border-radius: 4px; padding: 0 6px; margin: 0 4px 4px 0; cursor: pointer; font-weight: 600; font-size: 12px; background: var(--panel); text-decoration: none; }
.pill:hover { background: var(--c); color: #fff; }
.pill.missing { --c: var(--err); border-style: dashed; }
.pill .pt { font-weight: 400; margin-left: 4px; }
.chain { margin: 0; padding: 0; list-style: none; }
.chain li { padding: 1px 0; }
.md { font-family: var(--serif); font-size: 16px; line-height: 1.65; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--sans); line-height: 1.3; }
.md h1 { font-size: 24px; }
.md h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.md h3 { font-size: 15px; margin: 22px 0 6px; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 3px 0; }
.md code { font-family: ui-monospace, Consolas, monospace; font-size: .85em; background: var(--bg); padding: 1px 4px; border-radius: 3px; }
.md pre { background: var(--bg); padding: 12px; border-radius: 6px; overflow: auto; font-size: 13px; line-height: 1.45; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; font-family: var(--sans); font-size: 13px; margin: 12px 0; width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--bg); }
.md blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }
.md a.ref { font-family: var(--sans); font-size: .82em; font-weight: 700; text-decoration: none; border: 1px solid var(--c); color: var(--c); border-radius: 3px; padding: 0 4px; cursor: pointer; }
.md a.ref:hover { background: var(--c); color: #fff; }
.md .ref.missing { color: var(--err); border: 1px dashed var(--err); border-radius: 3px; padding: 0 4px; font-family: var(--sans); font-size: .82em; }
.sources { font-size: 13px; line-height: 1.5; padding-left: 0; list-style: none; }
.sources li { border-left: 3px solid var(--warn); padding: 6px 0 6px 12px; margin: 8px 0; }
.sources li.ok { border-left-color: var(--ok); }
.sources .flag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--warn); }
.sources li.ok .flag { color: var(--ok); }
.sources .note { color: var(--muted); display: block; margin-top: 2px; }
.file { color: var(--muted); font-size: 12px; margin-top: 30px; font-family: ui-monospace, Consolas, monospace; }
.home h2 { font-family: var(--serif); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 16px 0 24px; }
.stat { background: var(--bg); border-radius: 8px; padding: 10px 12px; border-top: 3px solid var(--c, var(--line)); }
.stat .n { font-size: 22px; font-weight: 700; }
.stat .l { color: var(--muted); font-size: 12px; }
.audit h3 { font-size: 14px; margin: 22px 0 6px; display: flex; gap: 8px; align-items: center; }
.audit .count { font-size: 11px; border-radius: 999px; padding: 1px 8px; background: var(--bg); color: var(--muted); }
.audit .count.err { background: var(--err); color: #fff; }
.audit .count.warn { background: var(--warn); color: #fff; }
.audit .count.ok { background: var(--ok); color: #fff; }
.audit ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
.regimes table.grid { border-collapse: separate; border-spacing: 6px; width: 100%; margin: 10px 0 18px; }
.regimes .grid th { font: 600 12px/1.3 var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 4px; }
.regimes .grid td { vertical-align: top; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); font-size: 14px; line-height: 1.5; width: 42%; }
.regimes .grid td.empty { color: var(--muted); font-style: italic; background: transparent; border-style: dashed; }
.regimes .grid td b { font-family: var(--serif); font-size: 16px; font-weight: 600; display: block; margin-bottom: 4px; }
.regimes .grid td.sad { border-left: 4px solid var(--refutee); }
.regimes .grid td.joy { border-left: 4px solid var(--these); }
.regimes ol.timeline { list-style: none; padding: 0; margin: 8px 0 18px; border-left: 2px solid var(--line); }
.regimes ol.timeline li { position: relative; padding: 2px 0 14px 18px; font-size: 14px; line-height: 1.55; }
.regimes ol.timeline li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--accent)); }
.regimes ol.timeline li b { font-family: var(--serif); font-size: 16px; }
.audit .hint { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
.langsw { display: flex; gap: 2px; }
.langsw button { border: 1px solid var(--line); background: none; border-radius: 5px; padding: 3px 7px; font-size: 12px; cursor: pointer; color: var(--muted); }
.langsw button.on { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.kbd { font-family: ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><i>Status</i> · Ridgeway</h1>
    <div id="nav">
      <button class="navbtn" id="back" title="Précédent (Alt+←)">←</button>
      <button class="navbtn" id="fwd" title="Suivant (Alt+→)">→</button>
    </div>
    <div id="trail"></div>
    <span class="meta" id="meta"></span>
    <div class="langsw" role="group" aria-label="Langue / Language"><button data-lang="fr" title="Français">FR</button><button data-lang="en" title="English">EN</button></div>
  </header>
  <aside id="side">
    <input id="search" type="search" placeholder="Rechercher (id, titre, texte) — touche /" autocomplete="off">
    <div id="filters"></div>
    <nav id="list"></nav>
  </aside>
  <section id="main">
    <div id="graphwrap">
      <div id="gutter"></div>
      <svg id="graph"><g id="viewport"><g id="bands"></g><g id="edges"></g><g id="nodes"></g></g></svg>
      <div id="toolbar">
        <button data-mode="all" class="on" title="Tout le graphe ; la sélection met en évidence ses appuis et ses conséquences">Tout</button>
        <button data-mode="anc" title="Seulement le chemin qui mène à l'élément sélectionné">Chemin vers</button>
        <button data-mode="desc" title="Seulement ce qui découle de l'élément sélectionné">Conséquences</button>
        <button data-mode="near" title="Voisins directs">Voisinage</button>
        <span class="sep"></span>
        <button id="fit" title="Recadrer (touche F)">Recadrer</button>
        <button id="read" title="Masquer le graphe pour lire (touche R)">Lecture</button>
      </div>
      <div id="legend"></div>
      <div id="empty">Aucun élément à afficher avec ces filtres.</div>
    </div>
    <div id="resizer" title="Glisser pour redimensionner"></div>
    <article id="reader"><div class="inner" id="readerInner"></div></article>
  </section>
</div>

<script>
const DATA = /*__DATA__*/null;

// ---------- Langue ----------
// Préférence partagée avec l'accueil du site (clé treillis-lang) ; ?lang=en dans l'URL l'emporte.
const LANGS = ["fr", "en"];
let LANG = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem("treillis-lang"); if (LANGS.includes(s)) return s; } catch {}
  return (navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en";
})();
const tr = (fr, en) => LANG === "en" ? en : fr;
// Champs traduits : on garde l'original (_fr) et on bascule titre / enonce / body selon la langue.
const I18N_FIELDS = ["titre", "enonce", "body", "resume"];
function swapLang(o) {
  for (const k of I18N_FIELDS) if (k in o) {
    if (!(k + "_fr" in o)) o[k + "_fr"] = o[k];
    o[k] = LANG === "en" && o[k + "_en"] ? o[k + "_en"] : o[k + "_fr"];
  }
}
function applyData() {
  DATA.elements.forEach(swapLang);
  (DATA.partie_docs || []).forEach(swapLang);
  DATA.documents.forEach(swapLang);
  for (const p of DATA.partie_docs || []) DATA.parties[p.id] = p.titre;
}
applyData();

// ---------- Modèle ----------
const TYPES = ["definition", "auteur", "etude", "these", "refutee"];
let TYPE_LABEL, TYPE_SING, STATUT_LABEL;
function setLabels() {
  TYPE_LABEL = tr({ definition: "Concepts", auteur: "Prémisses : auteurs", etude: "Prémisses : études", these: "Thèses", refutee: "Positions écartées", manquant: "Manquant" },
                  { definition: "Concepts", auteur: "Premises: authors", etude: "Premises: studies", these: "Theses", refutee: "Rejected positions", manquant: "Missing" });
  TYPE_SING = tr({ definition: "Concept", auteur: "Prémisse (auteur)", etude: "Prémisse (étude)", these: "Thèse", refutee: "Position écartée", manquant: "Référence manquante" },
                 { definition: "Concept", auteur: "Premise (author)", etude: "Premise (study)", these: "Thesis", refutee: "Rejected position", manquant: "Missing reference" });
  STATUT_LABEL = tr({ brouillon: "brouillon", "verifie-texte": "vérifié sur le texte" }, { brouillon: "draft", "verifie-texte": "checked against the text" });
}
setLabels();
const STATUTS = ["brouillon", "verifie-texte"];
const STATUT_COLOR = { brouillon: "var(--muted)", "verifie-texte": "var(--ok)" };
const partLabel = p => p === "P" ? tr("Prémisses", "Premises") : tr("Chapitre ", "Chapter ") + p;
// Repères : pages de l'édition papier, regroupées en intervalles (p. 39-42, 45).

function inline(s) {
  const keep = [];
  const hold = h => `\u0000${keep.push(h) - 1}\u0000`;
  s = s.replace(/`([^`]+)`/g, (_, c) => hold(`<code>${esc(c)}</code>`));
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`));
  s = s.replace(/https?:\/\/[^\s<>»)]+/g, u => hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`));
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^\w])_(?!\s)([^_]+?)_(?!\w)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
}
function markdown(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  let out = "", i = 0;
  const isBlockStart = l => /^(#{1,6}\s|```|>|\s*([-*+]|\d+\.)\s|\|)/.test(l) || /^(-{3,}|\*{3,})\s*$/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++; out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const n = m[1].length; out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(l)) { out += "<hr>"; i++; continue; }
    if (l.startsWith("|") && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const row = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      out += "<table><thead><tr>" + row(l).map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith("|")) out += "<tr>" + row(lines[i++]).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      out += "</tbody></table>"; continue;
    }
    if (l.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, ""));
      out += `<blockquote>${markdown(buf.join("\n"))}</blockquote>`; continue;
    }
    if (/^\s*([-*+]|\d+\.)\s/.test(l)) {
      const stack = [];
      while (i < lines.length && (/^\s*([-*+]|\d+\.)\s/.test(lines[i]) || (lines[i].trim() && /^\s{2,}/.test(lines[i]) && stack.length))) {
        const li = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if (!li) { out += " " + inline(lines[i].trim()); i++; continue; }
        const ind = li[1].length, tag = /\d/.test(li[2]) ? "ol" : "ul";
        while (stack.length && ind < stack[stack.length - 1].ind) out += `</li></${stack.pop().tag}>`;
        if (!stack.length || ind > stack[stack.length - 1].ind) { out += `<${tag}><li>`; stack.push({ ind, tag }); }
        else out += "</li><li>";

      continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out += `<p>${inline(buf.join(" "))}</p>`;
  }
  return out;
}

function linkify(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const targets = [];
  while (walker.nextNode()) {
    const n = walker.currentNode;
    if (n.parentElement.closest("a, code, pre")) continue;
    if (/\b[DAETR]\d{2,3}(?:-C\d+)?\b/.test(n.nodeValue)) targets.push(n);
  }
  for (const n of targets) {
    const frag = document.createDocumentFragment();
    let last = 0;
    n.nodeValue.replace(/\b([DAETR]\d{2,3}(?:-C\d+)?)\b/g, (m, id, off) => {
      frag.append(n.nodeValue.slice(last, off));
      const r = resolve(id);
      if (byId.has(r)) {
        const a = document.createElement("a");
        a.className = "ref"; a.href = "#" + r; a.textContent = id;
        a.style.setProperty("--c", color(r)); a.title = byId.get(r).titre + " — " + byId.get(r).enonce;
        frag.append(a);
      } else { const s = document.createElement("span"); s.className = "ref missing"; s.textContent = id; s.title = tr("Élément inexistant", "Missing element"); frag.append(s); }
      last = off + m.length;
    });
    frag.append(n.nodeValue.slice(last));
    n.replaceWith(frag);
  }
}

const HKEY = "explorer-history";
let hist = { stack: [], i: -1 };
try { hist = JSON.parse(sessionStorage.getItem(HKEY)) || hist; } catch {}
function track(h) {
  const st = history.state;
  if (st && typeof st.i === "number" && hist.stack[st.i] === h) hist.i = st.i;      // précédent / suivant / rechargement
  else if (hist.stack[hist.i] !== h) {                                               // nouvelle visite
    hist.stack = hist.stack.slice(0, hist.i + 1); hist.stack.push(h); hist.i = hist.stack.length - 1;
    if (hist.stack.length > 200) { hist.stack.shift(); hist.i--; }
    history.replaceState({ i: hist.i }, "");
  } else history.replaceState({ i: hist.i }, "");
  try { sessionStorage.setItem(HKEY, JSON.stringify(hist)); } catch {}
  renderTrail();
}
function label(h) {
  if (h === "home") return { t: tr("Vue d'ensemble", "Overview") };
  if (h === "audit") return { t: "Audit" };
  if (h === "ordres") return { t: tr("Les trois ordres de croyance", "The three orders of belief") };
  if (h === "cycle") return { t: tr("Du micro au macro", "From micro to macro") };
  if (h.startsWith("doc:")) return { t: h.slice(4) };
  if (h.startsWith("partie:")) return { t: partLabel(h.slice(7)) };
  return { id: h, t: byId.get(h)?.titre || tr("manquant", "missing"), c: color(h) };
}
function renderTrail() {
  $("#back").disabled = hist.i <= 0;
  $("#fwd").disabled = hist.i >= hist.stack.length - 1;
  const from = Math.max(0, hist.i - 7), to = Math.min(hist.stack.length, hist.i + 3);
  const steps = [];
  for (let k = from; k < to; k++) {
    const L = label(hist.stack[k]), cur = k === hist.i;
    steps.push(`<button class="step ${cur ? "cur" : ""} ${k > hist.i ? "fwd" : ""}" data-k="${k}" ${L.c ? `style="--c:${L.c}"` : ""} title="${esc((L.id ? L.id + " — " : "") + L.t)}">${L.id ? esc(L.id) + (cur ? `<span class="tt">${esc(L.t)}</span>` : "") : esc(L.t)}</button>`);
  }
  $("#trail").innerHTML = hist.stack.length > 1 ? `<span class="lbl">${from > 0 ? "… " : ""}${tr("Historique", "History")}</span>` + steps.join(`<span class="arrow">›</span>`) : "";
}
// Aller à une page : si c'est la page précédente (ou suivante) de l'historique,
// s'y déplacer au lieu de créer une nouvelle entrée.
function go(h) {
  h = String(h || "home");
  if (hist.stack[hist.i] === h) return;
  if (hist.i > 0 && hist.stack[hist.i - 1] === h) history.back();
  else if (hist.stack[hist.i + 1] === h) history.forward();
  else location.hash = h;
}
document.addEventListener("click", ev => {
  if (ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey) return;
  const a = ev.target.closest && ev.target.closest('a[href^="#"]');
  if (!a) return;
  ev.preventDefault();
  go(decodeURIComponent(a.getAttribute("href").slice(1)));
});
$("#back").onclick = () => history.back();
$("#fwd").onclick = () => history.forward();
$("#trail").onclick = ev => { const b = ev.target.closest("[data-k]"); if (b) { const d = +b.dataset.k - hist.i; if (d) history.go(d); } };

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "home";
  track(h);
  const prevSel = state.sel;
  renderView(h);
  $("#reader").scrollTop = 0;
  renderList();
  renderGraph(state.mode !== "all" && prevSel !== state.sel);
  document.querySelector("#list .sel")?.scrollIntoView({ block: "nearest" });
}
function renderView(h) {
  if (h === "home") { state.view = "home"; state.sel = null; renderHome(); }
  else if (h === "audit") { state.view = "audit"; state.sel = null; renderAudit(); }
  else if (h === "ordres") { state.view = "ordres"; state.sel = null; renderOrdres(); }
  else if (h === "cycle") { state.view = "cycle"; state.sel = null; renderCycle(); }
  else if (h.startsWith("doc:")) { state.view = "doc:" + h.slice(4); state.sel = null; renderDoc(h.slice(4)); }
  else if (h.startsWith("partie:")) { state.view = h; state.sel = null; renderPartie(h.slice(7)); }
  else { state.view = "el"; state.sel = h; renderElement(h); }
}
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => fit());
document.addEventListener("keydown", ev => {
  if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (ev.target.matches?.("input")) { if (ev.key === "Escape") { ev.target.value = ""; state.q = ""; renderList(); ev.target.blur(); } return; }
  if (ev.key === "/") { ev.preventDefault(); $("#search").focus(); }
  else if (ev.key === "Escape") go("home");
  else if (ev.key === "[") stepSeq(-1);
  else if (ev.key === "]") stepSeq(1);
  else if (ev.key === "Backspace") history.back();
  else if (ev.key === "f" || ev.key === "F") fit();
  else if (ev.key === "r" || ev.key === "R") $("#read").click();
  else if ("1234".includes(ev.key)) document.querySelectorAll("#toolbar [data-mode]")[+ev.key - 1].click();
});

// Textes fixes de l'interface, et bascule de langue.
function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = tr("Status (Ridgeway) — treillis", "Status (Ridgeway) — lattice");
  $("#back").title = tr("Précédent (Alt+←)", "Back (Alt+←)");
  $("#fwd").title = tr("Suivant (Alt+→)", "Forward (Alt+→)");
  $("#search").placeholder = tr("Rechercher (id, titre, texte) — touche /", "Search (id, title, text) — key /");
  const modes = { all: ["Tout", "All", "Tout le graphe ; la sélection met en évidence ses appuis et ses conséquences", "Whole graph; the selection highlights its grounds and consequences"],
    anc: ["Chemin vers", "Path to", "Seulement le chemin qui mène à l'élément sélectionné", "Only the path leading to the selected element"],
    desc: ["Conséquences", "Consequences", "Seulement ce qui découle de l'élément sélectionné", "Only what follows from the selected element"],
    near: ["Voisinage", "Neighbours", "Voisins directs", "Direct neighbours"] };
  for (const [m, [f, en, tf, ten]] of Object.entries(modes)) { const x = $(`#toolbar [data-mode="${m}"]`); x.textContent = tr(f, en); x.title = tr(tf, ten); }
  $("#fit").textContent = tr("Recadrer", "Fit"); $("#fit").title = tr("Recadrer (touche F)", "Fit (key F)");
  $("#read").textContent = tr("Lecture", "Read"); $("#read").title = tr("Masquer le graphe pour lire (touche R)", "Hide the graph to read (key R)");
  $("#empty").textContent = tr("Aucun élément à afficher avec ces filtres.", "No element to show with these filters.");
  $("#resizer").title = tr("Glisser pour redimensionner", "Drag to resize");
  $("#meta").textContent = tr(`${els.length} éléments · généré le ${DATA.generated}`, `${els.length} elements · generated ${DATA.generated}`);
  document.querySelectorAll(".langsw [data-lang]").forEach(x => { x.classList.toggle("on", x.dataset.lang === LANG); x.setAttribute("aria-pressed", x.dataset.lang === LANG); });
  renderLegend();
}
function setLang(l) {
  if (!LANGS.includes(l) || l === LANG) return;
  LANG = l;
  try { localStorage.setItem("treillis-lang", l); } catch {}
  const u = new URL(location.href); u.searchParams.set("lang", l);
  history.replaceState(history.state, "", u.pathname + u.search + u.hash);
  applyData(); setLabels(); runAudit(); applyStatic();
  renderFilters(); renderTrail(); renderView(decodeURIComponent(location.hash.slice(1)) || "home"); renderList(); renderGraph();
}
document.querySelector(".langsw").onclick = ev => { const x = ev.target.closest("[data-lang]"); if (x) setLang(x.dataset.lang); };
applyStatic();
renderFilters();
route();
requestAnimationFrame(fit);
</script>
</body>
</html>
