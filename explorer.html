<script>
const DATA = {"generated": "2026-11-13 19:19", "elements": [{"id": "D01", "file": "definitions/D01.md", "type": "definition", "partie": "1", "titre": "Statut", "enonce": "Le statut est un classement social comparatif de personnes, de groupes ou d'objets selon l'estime, l'honneur et le respect qu'on leur accorde.", "titre_en": "Status", "enonce_en": "Status is a comparative social ranking of people, groups, or objects in terms of the esteem, honour, and respect accorded to them.", "titre_de": "Status", "enonce_de": "Status ist eine vergleichende soziale Rangordnung von Personen, Gruppen oder Objekten nach der Wertschätzung, der Ehre und dem Respekt, die man ihnen entgegenbringt.", "body_de": "## Bei Ridgeway\n\nDas ist die „einfache“ Definition, die zu Beginn gegeben (S. 1) und in Kapitel 1 wieder aufgenommen und entfaltet wird: Sie ist „trügerisch“ einfach, denn jeder ihrer Begriffe bringt eine Eigenschaft des Status mit sich (S. 10; T002). Status betrifft Individuen, Gruppen (Rassen, Geschlechter, Berufe) und Objekte; der Status von Objekten leitet sich aus dem der Personen oder Gruppen ab, mit denen sie verbunden sind (S. 10).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "“status is a comparative social ranking of people, groups, or objects in terms of the social esteem, honor, and respect accorded to them”", "pages": [1, 10], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nC'est la définition « simple » posée dès l'ouverture (p. 1), puis reprise et dépliée au chapitre 1 : elle est « trompeusement » simple, car chacun de ses termes engage une propriété du statut (p. 10 ; T002). Le statut porte sur des individus, des groupes (races, genres, professions) et des objets ; le statut des objets dérive de celui des personnes ou des groupes qui leur sont associés (p. 10).", "body_en": "## In Ridgeway\n\nThis is the \"simple\" definition laid down at the opening (p. 1), then taken up and unfolded in chapter 1: it is \"deceptively\" simple, for each of its terms involves a property of status (p. 10; T002). Status bears on individuals, groups (races, genders, occupations) and objects; the status of objects derives from that of the people or groups associated with them (p. 10).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["T002"], "corollaires": [], "mtime": 1794593161.2440977}, {"id": "D02", "file": "definitions/D02.md", "type": "definition", "partie": "1", "titre": "Hiérarchie de statut", "enonce": "Une hiérarchie de statut interpersonnelle est un ordre d'estime et d'influence qui se lit dans trois inégalités corrélées : la participation et la visibilité (qui occupe l'attention du groupe), l'évaluation (qui reçoit l'approbation) et l'influence sur les décisions.", "titre_en": "Status hierarchy", "enonce_en": "An interpersonal status hierarchy is an order of esteem and influence that shows in three correlated inequalities: participation and prominence (who holds the group's attention), evaluation (who receives approval), and influence over decisions.", "titre_de": "Statushierarchie", "enonce_de": "Eine interpersonale Statushierarchie ist eine Ordnung der Wertschätzung und des Einflusses, die sich in drei zusammenhängenden Ungleichheiten zeigt: Beteiligung und Sichtbarkeit (wer die Aufmerksamkeit der Gruppe auf sich zieht), Bewertung (wer Zustimmung erhält) und Einfluss auf Entscheidungen.", "body_de": "## Bei Ridgeway\n\nDie Indikatoren stammen aus den Studien von Bales (E01): Beteiligung und Sichtbarkeit, bewertende Reaktionen und Urteile sowie Einfluss gehen zusammen; sie sind „die Verhaltensindikatoren“ einer Hierarchie der Wertschätzung und des Einflusses (S. 8). Der allgemeine Indikator ist nicht, mehr zu reden – ein Zug einer amerikanischen Kultur, die Durchsetzungsvermögen schätzt –, sondern im Mittelpunkt der Aufmerksamkeit zu stehen: derjenige zu sein, dem man zuhört und dessen Meinung man einholt (S. 9-10).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [8, 9, 10], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes indicateurs viennent des études de Bales (E01) : participation et visibilité, réactions évaluatives et jugements, influence vont ensemble ; ce sont « les indicateurs comportementaux » d'une hiérarchie d'estime et d'influence (p. 8). L'indicateur général n'est pas de parler davantage, trait propre à une culture américaine qui valorise l'affirmation de soi, mais d'être au centre de l'attention, celui qu'on écoute et dont on sollicite l'avis (p. 9-10).", "body_en": "## In Ridgeway\n\nThe indicators come from Bales's studies (E01): participation and prominence, evaluative reactions and assessments, and influence go together; they are \"the behavioral indicators\" of a hierarchy of esteem and influence (p. 8). The general indicator is not talking more, a trait of an American culture that values assertiveness, but being the centre of attention, the one who is listened to and whose opinion is sought (p. 9-10).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["E01"], "corollaires": [], "mtime": 1794593161.245103}, {"id": "D03", "file": "definitions/D03.md", "type": "definition", "partie": "1", "titre": "Interdépendance coopérative et compétitive", "enonce": "Situation où des personnes dépendent les unes des autres pour atteindre un but qu'elles valorisent (interdépendance coopérative), ce qui crée entre elles une rivalité pour les termes de la coopération et le partage de ses fruits (interdépendance compétitive).", "titre_en": "Cooperative and competitive interdependence", "enonce_en": "A situation in which people depend on one another to reach a goal they value (cooperative interdependence), which creates among them a rivalry over the terms of cooperation and the division of its fruits (competitive interdependence).", "titre_de": "Kooperative und kompetitive Interdependenz", "enonce_de": "Eine Situation, in der Menschen voneinander abhängen, um ein Ziel zu erreichen, das sie schätzen (kooperative Interdependenz), was unter ihnen eine Rivalität um die Bedingungen der Zusammenarbeit und die Verteilung ihrer Früchte erzeugt (kompetitive Interdependenz).", "body_de": "## Bei Ridgeway\n\nVon Geburt an ist man auf andere angewiesen, um zu leben und zu bekommen, was man will; wir sind eine Gruppenspezies (S. 2-3). Doch die Abstimmung der Anstrengungen wirft sofort Fragen auf: Wer steht im Mittelpunkt, nach wessen Urteil handelt man, wie viel gibt und erhält jeder? Jeder hat ein Interesse an der Zusammenarbeit und ein Interesse daran, möglichst viel aus ihr herauszuholen (S. 3). Statushierarchien entstehen vor allem in solchen Situationen: in Ausschusssitzungen, Diskussionen im Unterricht, Familienentscheidungen (S. 20).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [2, 3, 20], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDès la naissance, on dépend des autres pour vivre et pour obtenir ce qu'on veut ; nous sommes une espèce de groupe (p. 2-3). Mais coordonner ses efforts pose aussitôt des questions : qui sera au centre de l'attention, selon le jugement de qui agira-t-on, combien chacun donnera-t-il et recevra-t-il ? Chacun a intérêt à coopérer et intérêt à tirer le plus de la coopération (p. 3). Les hiérarchies de statut apparaissent surtout dans ces situations : réunions de comité, discussions de classe, décisions de famille (p. 20).", "body_en": "## In Ridgeway\n\nFrom birth one depends on others to live and to get what one wants; we are a group species (p. 2-3). But coordinating efforts at once raises questions: who will be the centre of attention, by whose judgement will we act, how much will each give and receive? Everyone has an interest in cooperating and an interest in getting the most out of cooperation (p. 3). Status hierarchies arise above all in such situations: committee meetings, classroom discussions, family decisions (p. 20).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.245103}, {"id": "D04", "file": "definitions/D04.md", "type": "definition", "partie": "1", "titre": "Schème culturel du statut", "enonce": "Le schème culturel du statut est un ensemble de règles apprises et partagées pour organiser les relations sociales dans les situations d'interdépendance coopérative et compétitive. Il est double : une norme d'attribution du statut (D05), implicite et profondément apprise, et des croyances de statut (D06), plus explicites et historiquement changeantes.", "titre_en": "The cultural schema of status", "enonce_en": "The cultural schema of status is a set of learned and shared rules for organising social relations in situations of cooperative and competitive interdependence. It is twofold: a norm of status allocation (D05), implicit and deeply learned, and status beliefs (D06), more explicit and historically changing.", "titre_de": "Das kulturelle Schema des Status", "enonce_de": "Das kulturelle Schema des Status ist ein Bündel erlernter und geteilter Regeln, um soziale Beziehungen in Situationen kooperativer und kompetitiver Interdependenz zu ordnen. Es ist zweifach: eine Norm der Statuszuteilung (D05), implizit und tief erlernt, und Statusüberzeugungen (D06), expliziter und historisch wandelbar.", "body_de": "## Bei Ridgeway\n\nDas Schema ist ein „Bauplan“, ein Bündel erlernter und geteilter Regeln (S. 3). Es ist strukturell im Sinne Sewells (A01): Wird es umgesetzt, bringt es eine Statushierarchie im Verhalten hervor (S. 3). Die Norm ist seine „Grammatik“, die Statusüberzeugungen sind sein „Vokabular“ (S. 4). „Normativ“ ist im soziologischen Sinn gemeint: eine kulturelle Regel, die durch Sanktionen anderer durchgesetzt wird, kein vorgeschriebenes Ideal (S. 4). Ridgeway nennt ihre Argumentation die Theorie des kulturellen Schemas des Status (S. 3).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "“a set of learned and shared rules”", "pages": [3, 4], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe schème est un « blueprint », un ensemble de règles apprises et partagées (p. 3). Il est structurel au sens de Sewell (A01) : mis en œuvre, il produit une hiérarchie de statut comportementale (p. 3). La norme en est la « grammaire » et les croyances de statut le « vocabulaire » (p. 4). « Normatif » s'entend au sens sociologique : une règle culturelle sanctionnée par les autres, non un idéal prescrit (p. 4). Ridgeway appelle son argument la théorie du schème culturel du statut (p. 3).", "body_en": "## In Ridgeway\n\nThe schema is a \"blueprint\", a set of learned and shared rules (p. 3). It is structural in Sewell's sense (A01): when enacted, it produces a behavioural status hierarchy (p. 3). The norm is its \"grammar\" and status beliefs its \"vocabulary\" (p. 4). \"Normative\" is meant in the sociological sense: a cultural rule enforced by others' sanctions, not a prescribed ideal (p. 4). Ridgeway calls her argument the cultural schema theory of status (p. 3).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["A01"], "corollaires": [], "mtime": 1794593161.2461054}, {"id": "D05", "file": "definitions/D05.md", "type": "definition", "partie": "2", "titre": "Norme fondamentale du statut", "enonce": "La norme fondamentale du statut veut que la déférence et le statut soient accordés à chacun en proportion de la compétence qu'on lui prête dans l'effort collectif vers le but commun.", "titre_en": "The basic status norm", "enonce_en": "The basic status norm holds that deference and status be granted to each in proportion to the competence attributed to them in the collective effort towards the shared goal.", "titre_de": "Die grundlegende Statusnorm", "enonce_de": "Die grundlegende Statusnorm besagt, dass jedem Ehrerbietung und Status im Verhältnis zu der Kompetenz zuerkannt werden, die man ihm in der gemeinsamen Anstrengung für das geteilte Ziel zuschreibt.", "body_de": "## Bei Ridgeway\n\nSie ist die erste Komponente des Schemas (D04), entstanden als unbeabsichtigtes Nebenprodukt der Koordination (S. 37). Sie erzeugt ein Netz gegenseitiger Erwartungen: Jeder darf erwarten, dass der Status der anderen auf ihrer wahrgenommenen Kompetenz beruht, und die anderen erwarten von jedem, dass er sich größerer wahrgenommener Kompetenz beugt (S. 37). In Kapitel 3 umfasst der „wahrgenommene Wert“ die zielbezogene Kompetenz und die gruppenorientierte Motivation (S. 54).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "“deference and status should be granted in proportion to an individual’s perceived competence at the collective goal effort”", "pages": [37, 54], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nC'est la première composante du schème (D04), formée comme sous-produit non voulu de la coordination (p. 37). Elle crée une toile d'attentes mutuelles : chacun peut attendre que le statut des autres repose sur leur compétence perçue, et les autres attendent de lui qu'il s'incline devant une compétence perçue supérieure (p. 37). Au chapitre 3, la « valeur perçue » inclut la compétence liée au but et la motivation tournée vers le groupe (p. 54).", "body_en": "## In Ridgeway\n\nIt is the first component of the schema (D04), formed as an unintended by-product of coordination (p. 37). It creates a web of mutual expectations: each can expect others' status to rest on their perceived competence, and others expect each to defer to greater perceived competence (p. 37). In chapter 3, \"perceived value\" includes goal-related competence and group-oriented motivation (p. 54).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["D04"], "corollaires": [], "mtime": 1794593161.2461054}, {"id": "D06", "file": "definitions/D06.md", "type": "definition", "partie": "4", "titre": "Croyance de statut", "enonce": "Une croyance de statut est une croyance culturelle largement répandue qui associe une différence sociale reconnue entre des acteurs (genre, race, profession, classe…) à plus ou moins de valeur sociale (status-worthiness) et de compétence.", "titre_en": "Status belief", "enonce_en": "A status belief is a widely held cultural belief that links a recognised social difference among actors (gender, race, occupation, class…) with greater or lesser status-worthiness and competence.", "titre_de": "Statusüberzeugung", "enonce_de": "Eine Statusüberzeugung ist eine weit verbreitete kulturelle Überzeugung, die einen anerkannten sozialen Unterschied zwischen Akteuren (Geschlecht, Rasse, Beruf, Klasse…) mit mehr oder weniger Statuswürdigkeit und Kompetenz verbindet.", "body_de": "## Bei Ridgeway\n\nIn Kapitel 2 als zweite Komponente des Schemas eingeführt (S. 38), eher beschreibend als normativ, werden die Statusüberzeugungen in Kapitel 4 definiert (S. 69). Ein anerkannter Unterschied teilt die Akteure in gegensätzliche Gruppen; die Überzeugung unterscheidet sie nicht nur, sie ordnet sie danach, wer würdiger und kompetenter ist (S. 69). Sie betreffen „Typen“ von Akteuren, Individuen oder kollektive Akteure (Goldman Sachs und die Kreditgenossenschaft, Harvard und das staatliche College) (S. 69-70).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "“Status beliefs are widely held cultural beliefs that link a recognized social difference among actors with greater or lesser status-worthiness and competence”", "pages": [38, 69, 70], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nIntroduites au chapitre 2 comme seconde composante du schème (p. 38), plus descriptives que normatives, les croyances de statut sont définies au chapitre 4 (p. 69). Une différence reconnue divise les acteurs en groupes contrastés ; la croyance ne se contente pas de les distinguer, elle les ordonne selon qui est le plus estimable et le plus compétent (p. 69). Elles portent sur des « types » d'acteurs, individus ou acteurs collectifs (Goldman Sachs et la caisse de crédit, Harvard et l'université d'État) (p. 69-70).", "body_en": "## In Ridgeway\n\nIntroduced in chapter 2 as the second component of the schema (p. 38), more descriptive than normative, status beliefs are defined in chapter 4 (p. 69). A recognised difference divides actors into contrasting groups; the belief does not merely distinguish them, it ranks them by who is more worthy and more competent (p. 69). They bear on \"types\" of actors, individuals or corporate actors (Goldman Sachs and the credit union, Harvard and the state college) (p. 69-70).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2471063}, {"id": "D07", "file": "definitions/D07.md", "type": "definition", "partie": "2", "titre": "Capacité de performance et compétence", "enonce": "La capacité de performance est la capacité perçue de contribuer au but du groupe. Elle comprend les savoir-faire liés à la tâche, l'effort agentique pour les mettre en œuvre et la motivation tournée vers le groupe. Ridgeway appelle « compétence » la combinaison des capacités et de l'effort dirigés vers le but.", "titre_en": "Performance capacity and competence", "enonce_en": "Performance capacity is the perceived capacity to contribute to the group's goal. It comprises task-relevant skills, the agentic effort to apply them, and group-oriented motivation. Ridgeway calls \"competence\" the combination of abilities and effort directed to the goal.", "titre_de": "Leistungsfähigkeit und Kompetenz", "enonce_de": "Leistungsfähigkeit ist die wahrgenommene Fähigkeit, zum Ziel der Gruppe beizutragen. Sie umfasst aufgabenbezogene Fertigkeiten, die agentische Anstrengung, sie einzusetzen, und eine gruppenorientierte Motivation. „Kompetenz“ nennt Ridgeway die auf das Ziel gerichtete Verbindung von Fähigkeiten und Anstrengung.", "body_de": "## Bei Ridgeway\n\nDer Wert für die Gruppe ist nicht bloß Fachwissen, die „Informationsgüter“ des Prestigemodells (D26): Er ist die Fähigkeit, zum Ziel beizutragen (S. 26). Im Lesekreis gewinnt nicht unbedingt, wer die meiste literarische Bildung hat, die Oberhand, sondern wer die Initiative ergreift, dieses Wissen in den Dienst der Diskussion zu stellen (S. 26-27). Fähigkeiten und Anstrengung verbinden sich zu einem Eindruck zielbezogener Kompetenz, dem Kern der Leistungsfähigkeit; die Gruppenorientierung (D08) setzt ihr Grenzen (S. 27).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [26, 27], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLa valeur pour le groupe n'est pas seulement l'expertise, les « biens informationnels » du modèle du prestige (D26) : c'est la capacité de contribuer au but (p. 26). Dans le club de lecture, ce n'est pas le plus formé en littérature qui prend l'ascendant, mais celui qui prend l'initiative de mettre ses savoirs au service de la discussion (p. 26-27). Capacités et effort se combinent en une impression de compétence liée au but, noyau de la capacité de performance ; l'orientation vers le groupe (D08) en fixe les bornes (p. 27).", "body_en": "## In Ridgeway\n\nValue to the group is not just expertise, the \"information goods\" of the prestige model (D26): it is the capacity to contribute to the goal (p. 26). In the book club, it is not the one with the most literary training who gains ascendancy, but the one who takes the initiative to put that knowledge at the service of the discussion (p. 26-27). Abilities and effort combine into an impression of goal-related competence, the core of performance capacity; group orientation (D08) sets its bounds (p. 27).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["D08", "D26"], "corollaires": [], "mtime": 1794593161.2471063}, {"id": "D08", "file": "definitions/D08.md", "type": "definition", "partie": "2", "titre": "Orientation vers le groupe", "enonce": "L'orientation vers le groupe est l'engagement perçu à agir dans l'intérêt du groupe, et non seulement dans le sien. Elle est la seconde dimension de la valeur perçue, à côté de la compétence.", "titre_en": "Group orientation", "enonce_en": "Group orientation is the perceived commitment to act in the group's interest, not only one's own. It is the second dimension of perceived value, beside competence.", "titre_de": "Gruppenorientierung", "enonce_de": "Gruppenorientierung ist die wahrgenommene Bereitschaft, im Interesse der Gruppe zu handeln und nicht nur im eigenen. Sie ist neben der Kompetenz die zweite Dimension des wahrgenommenen Werts.", "body_de": "## Bei Ridgeway\n\nSie ist der Eindruck, dass jemand bereit ist, für die Gruppe zu arbeiten und nicht nur für sich; sie kann den Wert seiner Kompetenz begrenzen (S. 27). Sie entspringt der Spannung zwischen Führenden und Folgenden: Die Mitglieder wollen sicher sein, dass derjenige, dem sie Einfluss geben, ihn für die Gruppe nutzt (S. 44). Ihr Gewicht bei der Statuszuteilung hängt vom Kontext ab (S. 98).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [27, 44, 98], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nC'est le sentiment que quelqu'un est prêt à travailler pour le groupe et pas seulement pour soi ; il peut borner la valeur de sa compétence (p. 27). Il naît de la tension entre meneurs et suiveurs : on veut s'assurer que celui à qui l'on donne de l'influence l'utilisera pour le groupe (p. 44). Son poids dans l'attribution du statut varie avec le contexte (p. 98).", "body_en": "## In Ridgeway\n\nIt is the sense that someone is willing to work for the group and not only for themselves; it can bound the value of their competence (p. 27). It arises from the tension between leaders and followers: members want assurance that the one they give influence to will use it for the group (p. 44). Its weight in allocating status varies with context (p. 98).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2481036}, {"id": "D09", "file": "definitions/D09.md", "type": "definition", "partie": "2", "titre": "Attentes de premier et de second ordre", "enonce": "Les attentes de premier ordre sont celles qu'on forme soi-même sur la compétence et le rang de chacun (« je pense que tu es meilleur que moi »). Les attentes de second ordre sont celles qu'on prête aux autres (« je pense qu'ils pensent que tu es meilleur que moi »).", "titre_en": "First- and second-order expectations", "enonce_en": "First-order expectations are those one forms oneself about each person's competence and rank (\"I think you are better than me\"). Second-order expectations are those one attributes to others (\"I think they think you are better than me\").", "titre_de": "Erwartungen erster und zweiter Ordnung", "enonce_de": "Erwartungen erster Ordnung sind die, die man selbst über die Kompetenz und den Rang jedes Einzelnen bildet („ich denke, du bist besser als ich“). Erwartungen zweiter Ordnung sind die, die man den anderen zuschreibt („ich denke, sie denken, dass du besser bist als ich“).", "body_de": "## Bei Ridgeway\n\nDie Unterscheidung stammt aus der Erwartungszustandstheorie (A05). Ein Konsens kann sich auf beiden Ebenen bilden: als Übereinstimmung der persönlichen Erwartungen oder als Übereinstimmung darüber, was die anderen von jedem, einen selbst eingeschlossen, erwarten (S. 39).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [39], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLa distinction vient de la théorie des états d'attente (A05). Un consensus peut se former à l'un ou l'autre niveau : accord des attentes personnelles, ou accord sur ce que les autres attendent de chacun, soi compris (p. 39).", "body_en": "## In Ridgeway\n\nThe distinction comes from expectation states theory (A05). A consensus can form at either level: agreement of personal expectations, or agreement on what others expect of each, self included (p. 39).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["A05"], "corollaires": [], "mtime": 1794593161.2481036}, {"id": "D10", "file": "definitions/D10.md", "type": "definition", "partie": "4", "titre": "Croyance de troisième ordre", "enonce": "Une croyance de troisième ordre porte sur ce que pense « la plupart des gens », la communauté dans son ensemble. Les croyances de statut sont de cet ordre : ni simple opinion personnelle (premier ordre), ni perception de ce que pensent des interlocuteurs précis (second ordre).", "titre_en": "Third-order belief", "enonce_en": "A third-order belief bears on what \"most people\", the community as a whole, think. Status beliefs are of this order: neither mere personal opinion (first order) nor a perception of what specific others think (second order).", "titre_de": "Überzeugung dritter Ordnung", "enonce_de": "Eine Überzeugung dritter Ordnung betrifft das, was „die meisten Leute“, die Gemeinschaft als Ganze, denken. Statusüberzeugungen sind von dieser Ordnung: weder bloß persönliche Meinung (erste Ordnung) noch Wahrnehmung dessen, was bestimmte andere denken (zweite Ordnung).", "body_de": "## Bei Ridgeway\n\nWeil sie betreffen, was „die meisten Leute“ denken, nennen Ridgeway und andere Statusüberzeugungen Überzeugungen dritter Ordnung (S. 71). Man kann sie haben, ohne sie zu teilen: Männer und Frauen teilen Geschlechterstereotype, die Männer begünstigen, ohne dass alle sie persönlich billigen (S. 71-72).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [71, 72], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nParce qu'elles portent sur ce que « la plupart des gens » pensent, Ridgeway et d'autres appellent les croyances de statut des croyances de troisième ordre (p. 71). On peut les tenir sans y adhérer : hommes et femmes partagent des stéréotypes de genre favorables aux hommes sans que toutes et tous les endossent personnellement (p. 71-72).", "body_en": "## In Ridgeway\n\nBecause they bear on what \"most people\" think, Ridgeway and others call status beliefs third-order beliefs (p. 71). One can hold them without endorsing them: men and women share gender stereotypes favouring men without all personally endorsing them (p. 71-72).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2491055}, {"id": "D11", "file": "definitions/D11.md", "type": "definition", "partie": "2", "titre": "Savoir commun", "enonce": "Un savoir commun est un savoir qu'on possède et dont on peut supposer que les autres le possèdent aussi ; il se distingue du simple savoir partagé, que plusieurs ont sans pouvoir le présumer des autres.", "titre_en": "Common knowledge", "enonce_en": "Common knowledge is knowledge one has and can assume others also have; it differs from merely shared knowledge, which several people have without being able to presume it of others.", "titre_de": "Gemeinsames Wissen", "enonce_de": "Gemeinsames Wissen ist Wissen, das man hat und von dem man annehmen kann, dass auch die anderen es haben; es unterscheidet sich von bloß geteiltem Wissen, das mehrere haben, ohne es bei den anderen voraussetzen zu können.", "body_de": "## Bei Ridgeway\n\nDer Begriff stammt von Spieltheoretikern (A07): etwas, das man weiß und von dem man annehmen kann, dass die anderen es wissen (S. 35). In Kapitel 4 unterscheidet Ridgeway geteiltes Wissen (die meisten kennen es) von gemeinsamem Wissen (jeder kann vernünftigerweise annehmen, dass die anderen es kennen); Letzteres verlangt die Koordination (S. 74).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [35, 74], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe terme vient des théoriciens des jeux (A07) : quelque chose qu'on sait et dont on peut supposer que les autres le savent (p. 35). Au chapitre 4, Ridgeway distingue le savoir partagé (la plupart le connaissent) du savoir commun (chacun peut raisonnablement présumer que les autres le connaissent), qui est ce qu'exige la coordination (p. 74).", "body_en": "## In Ridgeway\n\nThe term comes from game theorists (A07): something one knows and can assume others know (p. 35). In chapter 4, Ridgeway distinguishes shared knowledge (most people know it) from common knowledge (each can reasonably presume others know it), which is what coordination requires (p. 74).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["A07"], "corollaires": [], "mtime": 1794593161.2491055}, {"id": "D12", "file": "definitions/D12.md", "type": "definition", "partie": "1", "titre": "Attentes de performance", "enonce": "Les attentes de performance sont des anticipations implicites, souvent inconscientes, de l'utilité probable des contributions de chacun à l'effort commun, comparées aux siennes et à celles des autres. Elles forment un ordre de rang.", "titre_en": "Performance expectations", "enonce_en": "Performance expectations are implicit, often unconscious anticipations of how useful each person's contributions to the shared effort are likely to be, compared with one's own and others'. They form a rank order.", "titre_de": "Leistungserwartungen", "enonce_de": "Leistungserwartungen sind implizite, oft unbewusste Vorwegnahmen, wie nützlich die Beiträge jedes Einzelnen zur gemeinsamen Anstrengung voraussichtlich sein werden, verglichen mit den eigenen und denen der anderen. Sie bilden eine Rangordnung.", "body_de": "## Bei Ridgeway\n\nDer Begriff stammt aus der Erwartungszustandstheorie (A05) (S. 9). In Kapitel 5 sind diese Erwartungen die Begriffe, in denen die Theorie die Urteile über den wahrgenommenen Wert ausdrückt, um die sich die grundlegende Norm (D05) dreht (S. 101).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [9, 101], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe concept vient de la théorie des états d'attente (A05) (p. 9). Au chapitre 5, ces attentes sont les termes dans lesquels la théorie exprime les jugements de valeur perçue sur lesquels tourne la norme fondamentale (D05) (p. 101).", "body_en": "## In Ridgeway\n\nThe concept comes from expectation states theory (A05) (p. 9). In chapter 5, these expectations are the terms in which the theory expresses the judgements of perceived value on which the basic norm (D05) turns (p. 101).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["A05", "D05"], "corollaires": [], "mtime": 1794593161.2491055}, {"id": "D13", "file": "definitions/D13.md", "type": "definition", "partie": "4", "titre": "Avantage de statut", "enonce": "Il y a avantage de statut quand des acteurs désignés comme de haut statut par une croyance de statut sont traités comme plus estimables et compétents qu'ils ne le seraient sans cette étiquette, et ceux de bas statut comme moins.", "titre_en": "Status advantage", "enonce_en": "There is status advantage when actors labelled high status by a status belief are treated as more worthy and competent than they would be without that label, and those labelled low status as less so.", "titre_de": "Statusvorteil", "enonce_de": "Ein Statusvorteil liegt vor, wenn Akteure, die eine Statusüberzeugung als hochrangig ausweist, als würdiger und kompetenter behandelt werden, als sie es ohne diese Kennzeichnung würden, und die als niedrigrangig ausgewiesenen als weniger würdig und kompetent.", "body_de": "## Bei Ridgeway\n\nDefinition (S. 72-73), mit dem Gedankenexperiment derselben Absolventin oder desselben Absolventen, gleiche Fertigkeiten, gleiche Persönlichkeit, einmal als weißer Mann aus der oberen Mittelschicht, einmal als afroamerikanische Frau aus der Arbeiterschicht vorgestellt (S. 73). Für kollektive Akteure wie für Individuen besteht der Vorteil darin, als kompetenter und wertvoller wahrgenommen und im Austausch bevorzugt zu werden, über das hinaus, was man ohne diesen Rang wäre (S. 93-94).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [72, 73, 93, 94], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDéfinition (p. 72-73), avec l'expérience de pensée du même diplômé, même savoir-faire, même personnalité, imaginé homme blanc de milieu aisé puis femme afro-américaine d'origine ouvrière (p. 73). Pour les acteurs collectifs comme pour les individus, l'avantage tient à être perçu plus compétent, plus précieux et préféré dans l'échange, au-delà de ce qu'on serait sans ce rang (p. 93-94).", "body_en": "## In Ridgeway\n\nDefinition (p. 72-73), with the thought experiment of the same graduate, same skills, same personality, imagined as a white man from an upper-middle-class background and then as an African American woman from a working-class background (p. 73). For corporate actors as for individuals, the advantage consists in being perceived as more competent, more valuable and favoured in exchange, beyond what one would be without that rank (p. 93-94).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2501073}, {"id": "D14", "file": "definitions/D14.md", "type": "definition", "partie": "4", "titre": "Caractéristique de statut diffuse", "enonce": "Une caractéristique de statut diffuse est une différence de groupe que les croyances de statut associent à une compétence générale : on présume les membres du groupe de haut statut « meilleurs » dans la plupart des choses. Genre, race, éducation et profession en sont.", "titre_en": "Diffuse status characteristic", "enonce_en": "A diffuse status characteristic is a group difference that status beliefs associate with general competence: members of the high-status group are presumed \"better\" at most things. Gender, race, education and occupation are such characteristics.", "titre_de": "Diffuses Statusmerkmal", "enonce_de": "Ein diffuses Statusmerkmal ist ein Gruppenunterschied, den Statusüberzeugungen mit allgemeiner Kompetenz verbinden: Den Mitgliedern der hochrangigen Gruppe unterstellt man, in den meisten Dingen „besser“ zu sein. Geschlecht, Rasse, Bildung und Beruf sind solche Merkmale.", "body_de": "## Bei Ridgeway\n\nDer Begriff stammt aus der Theorie der Statusmerkmale (A05): Die allgemeine Kompetenz macht diese Überzeugungen für eine Vielzahl von Aufgaben bedeutsam (S. 77). Von der bevorzugten Gruppe erwartet man sogar, dass sie bei Aufgaben glänzt, die nicht mit ihr verbunden sind: Große Köche seien Männer (S. 77). Diese Merkmale tragen auch stereotype spezifische Fertigkeiten mit sich (Kochen, Mathematik) (S. 77). Ein salientes diffuses Merkmal wirkt auch dann, wenn es mit der Aufgabe nichts zu tun hat (S. 108).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [77, 108], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe terme vient de la théorie des caractéristiques de statut (A05) : la compétence générale rend ces croyances pertinentes pour une grande variété de tâches (p. 77). On attend même du groupe favorisé qu'il excelle dans des tâches qui ne lui sont pas associées : les grands chefs seraient des hommes (p. 77). Ces caractéristiques portent aussi des savoir-faire spécifiques stéréotypés (cuisine, mathématiques) (p. 77). Une caractéristique diffuse saillante agit même sans rapport avec la tâche (p. 108).", "body_en": "## In Ridgeway\n\nThe term comes from status characteristics theory (A05): general competence makes these beliefs relevant to a wide variety of tasks (p. 77). The favoured group is even expected to excel at tasks not linked to it: great chefs would be men (p. 77). These characteristics also carry stereotyped specific skills (cooking, mathematics) (p. 77). A salient diffuse characteristic acts even when unrelated to the task (p. 108).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["A05"], "corollaires": [], "mtime": 1794593161.2501073}, {"id": "D15", "file": "definitions/D15.md", "type": "definition", "partie": "4", "titre": "Caractéristique de statut spécifique", "enonce": "Une caractéristique de statut spécifique associe une différence à une compétence bornée, pertinente pour certaines tâches seulement : langue étrangère, programmation, plomberie.", "titre_en": "Specific status characteristic", "enonce_en": "A specific status characteristic associates a difference with a bounded competence, relevant only to some tasks: a foreign language, programming, plumbing.", "titre_de": "Spezifisches Statusmerkmal", "enonce_de": "Ein spezifisches Statusmerkmal verbindet einen Unterschied mit einer begrenzten Kompetenz, die nur für manche Aufgaben bedeutsam ist: eine Fremdsprache, Programmieren, Klempnerarbeit.", "body_de": "## Bei Ridgeway\n\nIn einer Gesellschaft, die instrumentelle Kompetenz schätzt, bringt Spezialwissen ein gewisses Maß an Wertschätzung, doch es zählt nur dort, wo es dem Ziel der Gruppe dient: Auf Reisen im Ausland hört man auf den, der die Sprache spricht; zu Hause, bei einer anderen Aufgabe, zählt dieses Wissen wenig (S. 77-78).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [77, 78], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDans une société qui valorise la compétence instrumentale, une expertise spécialisée porte une part d'estime, mais elle ne pèse que là où elle sert le but du groupe : en voyage à l'étranger, celui qui parle la langue est écouté ; de retour, pour une autre tâche, son savoir compte peu (p. 77-78).", "body_en": "## In Ridgeway\n\nIn a society that values instrumental competence, specialised expertise carries a measure of esteem, but it weighs only where it serves the group's goal: travelling abroad, the one who speaks the language is listened to; back home, for another task, that knowledge counts for little (p. 77-78).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2511036}, {"id": "D16", "file": "definitions/D16.md", "type": "definition", "partie": "4", "titre": "Généralisation du statut", "enonce": "La généralisation du statut est le processus par lequel le statut des groupes sociaux auxquels on appartient façonne les attentes de compétence, donc l'estime et l'influence, dans un contexte local.", "titre_en": "Status generalization", "enonce_en": "Status generalization is the process by which the status of the social groups one belongs to shapes expectations of competence, and so esteem and influence, in a local context.", "titre_de": "Statusgeneralisierung", "enonce_de": "Statusgeneralisierung ist der Prozess, durch den der Status der sozialen Gruppen, denen man angehört, die Kompetenzerwartungen und damit Wertschätzung und Einfluss in einem lokalen Kontext prägt.", "body_de": "## Bei Ridgeway\n\nSeit Jahrzehnten beobachtet: In einer Studie über Geschworene in den 1950er-Jahren gehörten Geschlecht und beruflicher Status zu den wichtigsten Bestimmungsgrößen des Einflusses (S. 80). Ein salientes Statusmerkmal löst diesen Prozess aus, dessen Wirkungen sich selbst erfüllen (S. 106-107).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [80, 106, 107], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nObservé depuis des décennies : dans une étude des jurys des années 1950, le genre et le statut professionnel comptaient parmi les principaux déterminants de l'influence (p. 80). Une caractéristique de statut saillante déclenche ce processus, aux effets autoréalisateurs (p. 106-107).", "body_en": "## In Ridgeway\n\nObserved for decades: in a study of juries in the 1950s, gender and occupational status were among the main determinants of influence (p. 80). A salient status characteristic triggers this process, whose effects are self-fulfilling (p. 106-107).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2511036}, {"id": "D17", "file": "definitions/D17.md", "type": "definition", "partie": "5", "titre": "Indices de statut", "enonce": "Les indices de statut sont les informations sociales qui, saillantes dans une situation, façonnent les attentes de performance : caractéristiques de statut diffuses et spécifiques, récompenses sociales, style de comportement, évaluations explicites de la performance.", "titre_en": "Status cues", "enonce_en": "Status cues are the social information that, when salient in a situation, shape performance expectations: diffuse and specific status characteristics, social rewards, behavioural style, explicit performance evaluations.", "titre_de": "Statushinweise", "enonce_de": "Statushinweise sind die sozialen Informationen, die, wenn sie in einer Situation salient sind, die Leistungserwartungen prägen: diffuse und spezifische Statusmerkmale, soziale Belohnungen, Verhaltensstil, ausdrückliche Leistungsbewertungen.", "body_de": "## Bei Ridgeway\n\nDie Forschung zu Erwartungszuständen hat diese Arten von Hinweisen ermittelt; Statusmerkmale gehören zu den wirkmächtigsten (S. 104).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [104], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLa recherche sur les états d'attente a identifié ces types d'indices ; les caractéristiques de statut sont parmi les plus puissants (p. 104).", "body_en": "## In Ridgeway\n\nExpectation states research has identified these kinds of cues; status characteristics are among the most powerful (p. 104).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2521043}, {"id": "D18", "file": "definitions/D18.md", "type": "definition", "partie": "5", "titre": "Légitimité d'une hiérarchie", "enonce": "Une hiérarchie de statut est légitime quand ses membres la tiennent non seulement pour ce qu'elle est, mais pour ce qu'elle doit être. La légitimité permet aux membres de haut statut de passer de l'influence à l'autorité.", "titre_en": "Legitimacy of a hierarchy", "enonce_en": "A status hierarchy is legitimate when its members take it to be not only as it is but as it should be. Legitimacy allows high-status members to move from influence to authority.", "titre_de": "Legitimität einer Hierarchie", "enonce_de": "Eine Statushierarchie ist legitim, wenn ihre Mitglieder sie nicht nur für das halten, was sie ist, sondern für das, was sie sein soll. Legitimität erlaubt den Mitgliedern mit hohem Status, vom Einfluss zur Autorität überzugehen.", "body_de": "## Bei Ridgeway\n\nDefinition und Tragweite (S. 116): Die Legitimität bedingt die Fähigkeit, mit Autorität zu handeln und Gehorsam zu erwarten, daher die Verbindung von Status, Führung und Macht.", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [116], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDéfinition et enjeu (p. 116) : la légitimité conditionne la capacité d'agir avec autorité en s'attendant à être obéi, donc le lien entre statut, direction et pouvoir.", "body_en": "## In Ridgeway\n\nDefinition and stakes (p. 116): legitimacy conditions the ability to act with authority and expect compliance, hence the link between status, leadership and power.", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2521043}, {"id": "D19", "file": "definitions/D19.md", "type": "definition", "partie": "5", "titre": "Biais de statut", "enonce": "Le biais de statut est l'ensemble des biais d'évaluation de la compétence et de la valeur que déclenchent les caractéristiques de statut diffuses saillantes : attentes initiales, évaluation de la performance, attribution d'aptitude, et enfin octroi d'influence et d'estime.", "titre_en": "Status bias", "enonce_en": "Status bias is the whole range of evaluative biases about competence and worth unleashed by salient diffuse status characteristics: initial expectations, evaluation of performance, attribution of ability, and finally the granting of influence and esteem.", "titre_de": "Statusverzerrung", "enonce_de": "Statusverzerrung ist die ganze Bandbreite bewertender Verzerrungen von Kompetenz und Wert, die saliente diffuse Statusmerkmale auslösen: anfängliche Erwartungen, Bewertung der Leistung, Zuschreibung von Fähigkeit und schließlich die Gewährung von Einfluss und Wertschätzung.", "body_de": "## Bei Ridgeway\n\nSie ist die erste der drei Verzerrungen; sie beginnt mit den anfänglichen Erwartungen und ihren sich selbst erfüllenden Wirkungen und gipfelt in der ungleichen Gewährung von Einfluss und Wertschätzung (S. 121).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [121], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nC'est le premier des trois biais ; il commence par les attentes initiales et leurs effets autoréalisateurs et culmine dans l'octroi inégal d'influence et d'estime (p. 121).", "body_en": "## In Ridgeway\n\nIt is the first of the three biases; it begins with initial expectations and their self-fulfilling effects and culminates in the unequal granting of influence and esteem (p. 121).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2531066}, {"id": "D20", "file": "definitions/D20.md", "type": "definition", "partie": "5", "titre": "Biais de légitimité", "enonce": "Le biais de légitimité est la tendance à tenir les acteurs avantagés par les caractéristiques de statut diffuses pour des titulaires plus légitimes des positions élevées, et à sanctionner les conduites qui contestent le classement des groupes.", "titre_en": "Legitimacy bias", "enonce_en": "Legitimacy bias is the tendency to treat actors advantaged by diffuse status characteristics as more legitimate occupants of high positions, and to sanction behaviour that challenges the ranking of groups.", "titre_de": "Legitimitätsverzerrung", "enonce_de": "Legitimitätsverzerrung ist die Neigung, durch diffuse Statusmerkmale begünstigte Akteure als legitimere Inhaber hoher Positionen zu behandeln und Verhalten zu sanktionieren, das die Rangordnung der Gruppen in Frage stellt.", "body_de": "## Bei Ridgeway\n\nSie erzeugt die Abwehrreaktion gegen Mitglieder benachteiligter Gruppen, die sich durchsetzen, und begrenzt die Autorität derer, die eine hohe Position erreichen, etwa des afroamerikanischen Vorgesetzten (S. 121-122).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [121, 122], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nIl produit les réactions de rejet (backlash) contre les membres de groupes désavantagés qui s'affirment, et limite l'autorité de ceux qui ont atteint une position élevée, comme le patron afro-américain (p. 121-122).", "body_en": "## In Ridgeway\n\nIt produces the backlash against members of disadvantaged groups who act assertively, and limits the authority of those who reach a high position, such as the African American boss (p. 121-122).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2531066}, {"id": "D21", "file": "definitions/D21.md", "type": "definition", "partie": "5", "titre": "Biais de préférence associative", "enonce": "Le biais de préférence associative est la préférence pour s'associer aux membres des groupes de haut statut, parce que le statut se propage par association. Il renforce l'entre-soi des groupes de haut statut et émousse celui des groupes de bas statut.", "titre_en": "Associational preference bias", "enonce_en": "Associational preference bias is the preference for associating with members of high-status groups, because status spreads through association. It reinforces in-group ties among high-status groups and blunts them among low-status groups.", "titre_de": "Verzerrung durch Assoziationspräferenz", "enonce_de": "Die Verzerrung durch Assoziationspräferenz ist die Vorliebe, sich mit Mitgliedern hochrangiger Gruppen zu verbinden, weil Status sich durch Verbindung überträgt. Sie verstärkt den Zusammenhalt unter hochrangigen Gruppen und schwächt ihn unter niedrigrangigen.", "body_de": "## Bei Ridgeway\n\nHomophilie beherrscht die Beziehungen, doch der Status derer, mit denen man verkehrt, färbt auf einen selbst ab (S. 122). Mitglieder hochrangiger Gruppen haben allen Grund, ihresgleichen vorzuziehen, auch beim Einstellen und Befördern; die niedrigrangiger Gruppen sind hin- und hergerissen zwischen ihrer Gruppe und höheren Verbindungen (S. 122). Die Verzerrung untergräbt die Solidarität unten und verdichtet oben Netzwerke, Informationen und Gelegenheiten (S. 122).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [122], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nL'homophilie domine les associations, mais le statut de ceux qu'on fréquente rejaillit sur soi (p. 122). Les membres des groupes de haut statut ont toutes les raisons de préférer leurs semblables, y compris pour embaucher et promouvoir ; ceux des groupes de bas statut sont tiraillés entre leur groupe et des liens plus hauts (p. 122). Le biais mine la solidarité en bas et resserre en haut les réseaux, l'information et les occasions (p. 122).", "body_en": "## In Ridgeway\n\nHomophily dominates associations, but the status of those one associates with rubs off on oneself (p. 122). Members of high-status groups have every reason to prefer their own, including for hiring and promotion; those of low-status groups are torn between their group and higher ties (p. 122). The bias undermines solidarity below and tightens networks, information and opportunities above (p. 122).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2541926}, {"id": "D22", "file": "definitions/D22.md", "type": "definition", "partie": "4", "titre": "Inférence socialement endogène", "enonce": "L'inférence socialement endogène est le processus par lequel une croyance de statut biaise le jugement personnel (de premier ordre) qu'on porte sur la compétence d'autrui, parce qu'on la tient pour le résumé de l'évaluation d'une communauté.", "titre_en": "Socially endogenous inference", "enonce_en": "Socially endogenous inference is the process by which a status belief biases one's personal (first-order) judgement of another's competence, because one takes it as a summary of a community's evaluation.", "titre_de": "Sozial endogene Inferenz", "enonce_de": "Sozial endogene Inferenz ist der Prozess, durch den eine Statusüberzeugung das eigene (erstrangige) Urteil über die Kompetenz eines anderen verzerrt, weil man sie für die Zusammenfassung der Bewertung einer Gemeinschaft hält.", "body_de": "## Bei Ridgeway\n\nDie Überzeugungen gelten als Summe der Urteile einer Gemeinschaft über die durchschnittliche Kompetenz eines Typs von Akteuren; doch sie häufen Fehler an und verzerren, indem sie die Erwartungen prägen, sogar die tatsächliche Leistung, sodass ihre Fehler sich selbst erfüllen (S. 94).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [94], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes croyances sont perçues comme l'agrégat des jugements d'une communauté sur la compétence moyenne d'un type d'acteur ; mais elles accumulent des erreurs, et, en façonnant les attentes, elles biaisent jusqu'aux performances réelles, si bien que leurs erreurs se réalisent (p. 94).", "body_en": "## In Ridgeway\n\nBeliefs are perceived as the aggregate of a community's judgements about a type of actor's average competence; but they accumulate errors, and by shaping expectations they bias even actual performance, so that their errors become self-fulfilling (p. 94).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2541926}, {"id": "D23", "file": "definitions/D23.md", "type": "definition", "partie": "4", "titre": "Inférence de troisième ordre", "enonce": "L'inférence de troisième ordre est le processus par lequel, quand l'issue d'un choix dépend des réactions d'autrui, on s'appuie sur ce que « la plupart des gens » tiennent pour le meilleur, au-delà de son propre jugement.", "titre_en": "Third-order inference", "enonce_en": "Third-order inference is the process by which, when the outcome of a choice depends on others' reactions, one relies on what \"most people\" take to be best, beyond one's own judgement.", "titre_de": "Inferenz dritter Ordnung", "enonce_de": "Inferenz dritter Ordnung ist der Prozess, durch den man sich, wenn das Ergebnis einer Wahl von den Reaktionen anderer abhängt, über das eigene Urteil hinaus auf das stützt, was „die meisten Leute“ für das Beste halten.", "body_de": "## Bei Ridgeway\n\nUm die Wahl vorwegzunehmen, die andere für „die beste“ halten werden, nutzt man Statusüberzeugungen als Überzeugungen darüber, was die meisten Leute denken, und wählt, was am wirksamsten akzeptiert werden wird (S. 95).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [95], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nPour anticiper le choix que les autres jugeront « le meilleur », on se sert des croyances de statut en tant que croyances sur ce que pense la plupart des gens, et l'on choisit ce qui sera le plus efficacement accepté (p. 95).", "body_en": "## In Ridgeway\n\nTo anticipate the choice that others will judge \"best\", one uses status beliefs as beliefs about what most people think, and chooses what will be most effectively accepted (p. 95).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2552006}, {"id": "D24", "file": "definitions/D24.md", "type": "definition", "partie": "3", "titre": "Contexte relationnel social", "enonce": "Un contexte relationnel social est toute situation où l'on se considère en relation avec un autre dont il faut tenir compte pour savoir comment agir : interaction directe, en personne ou en ligne, mais aussi relation indirecte ou imaginée.", "titre_en": "Social relational context", "enonce_en": "A social relational context is any situation in which one considers oneself in relation to another who must be taken into account to figure out how to act: direct interaction, in person or online, but also indirect or imagined relations.", "titre_de": "Sozialer Beziehungskontext", "enonce_de": "Ein sozialer Beziehungskontext ist jede Situation, in der man sich in Beziehung zu einem anderen sieht, den man berücksichtigen muss, um zu wissen, wie man handeln soll: direkte Interaktion, persönlich oder online, aber auch mittelbare oder vorgestellte Beziehungen.", "body_de": "## Bei Ridgeway\n\nEin Beispiel für eine vorgestellte Beziehung: einem Politiker zuzuhören, der von „Leuten wie uns“ spricht (S. 48). In diesen Kontexten erhält man Status, da er von anderen verliehen wird, und sieht seinen Wert für die Gruppe gespiegelt (S. 48).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [48], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExemple de relation imaginée : écouter un politicien parler des « gens comme nous » (p. 48). C'est dans ces contextes que l'on reçoit le statut, puisqu'il est donné par les autres, et qu'on y voit reflétée sa valeur pour le groupe (p. 48).", "body_en": "## In Ridgeway\n\nAn example of an imagined relation: listening to a politician speak about \"people like us\" (p. 48). It is in these contexts that one receives status, since it is given by others, and sees one's value to the group reflected (p. 48).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2552006}, {"id": "D25", "file": "definitions/D25.md", "type": "definition", "partie": "2", "titre": "Hiérarchie de dominance", "enonce": "Une hiérarchie de dominance est un ordre de rang fondé sur la peur et l'intimidation : la déférence y repose sur une menace implicite.", "titre_en": "Dominance hierarchy", "enonce_en": "A dominance hierarchy is a rank order based on fear and intimidation: deference in it rests on an implied threat.", "titre_de": "Dominanzhierarchie", "enonce_de": "Eine Dominanzhierarchie ist eine Rangordnung, die auf Angst und Einschüchterung beruht: Die Ehrerbietung in ihr stützt sich auf eine unausgesprochene Drohung.", "body_de": "## Bei Ridgeway\n\nDominanzbeziehungen beruhen auf einer unausgesprochenen Drohung (S. 22). Dominanzakte sind Zurschaustellungen, die den anderen unter Stress setzen sollen; wer die Spannung am schlechtesten erträgt, gibt nach (S. 23). Diese Hierarchien verteilen vorhandene Ressourcen mit einem Minimum an Kämpfen: Sie sind „Hackordnungen“ (S. 23).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [22, 23], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes relations de dominance reposent sur une menace implicite (p. 22). Les actes de dominance sont des démonstrations destinées à stresser l'autre ; celui qui supporte le moins la tension cède (p. 23). Ces hiérarchies répartissent les ressources existantes avec un minimum de combats : ce sont des « ordres de becquetage » (p. 23).", "body_en": "## In Ridgeway\n\nDominance relations rest on an implied threat (p. 22). Dominance acts are displays meant to stress the other; whoever bears the tension least backs down (p. 23). These hierarchies distribute existing resources with a minimum of fighting: they are \"pecking orders\" (p. 23).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2562008}, {"id": "D26", "file": "definitions/D26.md", "type": "definition", "partie": "2", "titre": "Prestige", "enonce": "Le prestige est une déférence fondée sur le respect et l'admiration librement accordés à quelqu'un pour sa capacité perçue à offrir des informations culturelles utiles.", "titre_en": "Prestige", "enonce_en": "Prestige is deference based on respect and admiration freely granted to someone for their perceived ability to offer useful cultural information.", "titre_de": "Prestige", "enonce_de": "Prestige ist Ehrerbietung, die auf Respekt und Bewunderung beruht und jemandem freiwillig für seine wahrgenommene Fähigkeit zuerkannt wird, nützliche kulturelle Informationen zu bieten.", "body_de": "## Bei Ridgeway\n\nPrestige steht dem Status näher als die Dominanz, da es freiwillig gewährt wird (S. 25). Wer dem Inhaber besserer „Informationsgüter“ Ehrerbietung erweist, kommt ihm näher und lernt seine Fertigkeiten, was ein evolutionärer Vorteil wäre (S. 25; R04).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [25], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe prestige est plus proche du statut que la dominance, puisqu'il est librement accordé (p. 25). En déférant à qui détient de meilleurs « biens informationnels », on se rapproche de lui et l'on apprend ses savoirs, ce qui serait un avantage évolutif (p. 25 ; R04).", "body_en": "## In Ridgeway\n\nPrestige is closer to status than dominance is, since it is freely granted (p. 25). By deferring to whoever holds better \"information goods\", one comes closer and learns their skills, which would be an evolutionary advantage (p. 25; R04).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["R04"], "corollaires": [], "mtime": 1794593161.2562008}, {"id": "D27", "file": "definitions/D27.md", "type": "definition", "partie": "5", "titre": "Double standard", "enonce": "Il y a double standard quand, pour une performance de même qualité, on exige davantage de preuves d'aptitude de la personne désavantagée par une caractéristique de statut que de la personne avantagée.", "titre_en": "Double standard", "enonce_en": "There is a double standard when, for a performance of the same quality, more proof of ability is demanded of the person disadvantaged by a status characteristic than of the advantaged one.", "titre_de": "Doppelter Standard", "enonce_de": "Ein doppelter Standard liegt vor, wenn bei einer Leistung gleicher Qualität von der durch ein Statusmerkmal benachteiligten Person mehr Beweise ihrer Fähigkeit verlangt werden als von der begünstigten.", "body_de": "## Bei Ridgeway\n\nAngesichts einer guten Leistung einer benachteiligten Person denken die anderen, und manchmal sie selbst: „Beweise es noch einmal“; bei der begünstigten Person bestätigt eine gute Leistung einfach ihre Fähigkeit (S. 111). Der doppelte Standard nimmt auch die Form wechselnder Kriterien an (S. 111; E40).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [111], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nFace à la bonne performance d'une personne désavantagée, les autres, et parfois elle-même, pensent : « Prouve-le encore » ; pour la personne avantagée, une bonne performance confirme simplement son aptitude (p. 111). Le double standard prend aussi la forme de critères mouvants (p. 111 ; E40).", "body_en": "## In Ridgeway\n\nFaced with a good performance by a disadvantaged person, others, and sometimes the person herself, think: \"Prove it again\"; for the advantaged person, a good performance simply confirms ability (p. 111). The double standard also takes the form of shifting criteria (p. 111; E40).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["E40"], "corollaires": [], "mtime": 1794593161.2572012}, {"id": "D28", "file": "definitions/D28.md", "type": "definition", "partie": "6", "titre": "Institutions-portails", "enonce": "Les institutions-portails sont les organisations dominantes (écoles, entreprises, administrations, institutions de santé) qui commandent l'accès aux biens valorisés : santé, argent, positions de pouvoir.", "titre_en": "Gateway institutions", "enonce_en": "Gateway institutions are the dominant organisations (schools, workplaces, government, health institutions) that control access to valued outcomes: health, money, positions of power.", "titre_de": "Zugangsinstitutionen", "enonce_de": "Zugangsinstitutionen (gateway institutions) sind die vorherrschenden Organisationen (Schulen, Arbeitsstätten, Verwaltung, Gesundheitseinrichtungen), die über den Zugang zu begehrten Gütern entscheiden: Gesundheit, Geld, Machtpositionen.", "body_de": "## Bei Ridgeway\n\nIhre Verfahren und Normen spiegeln die vorherrschenden Akteure, die sie kontrollieren und überproportional aus ranghöheren rassischen Gruppen und aus der Mittel- oder Oberschicht stammen (S. 135).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [135], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLeurs procédures et leurs normes reflètent les acteurs dominants qui les contrôlent, de manière disproportionnée issus des groupes raciaux de haut statut et des classes moyennes ou supérieures (p. 135).", "body_en": "## In Ridgeway\n\nTheir procedures and norms reflect the dominant actors who control them, disproportionately from higher-status racial groups and middle- or upper-class groups (p. 135).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2582002}, {"id": "D29", "file": "definitions/D29.md", "type": "definition", "partie": "6", "titre": "Essentialisation", "enonce": "L'essentialisation est le degré auquel une différence de groupe est culturellement comprise comme enracinée dans la nature des personnes et leur corps, plutôt que dans des goûts ou des savoirs acquis. C'est un continuum, non une dichotomie.", "titre_en": "Essentialization", "enonce_en": "Essentialization is the degree to which a group difference is culturally understood as rooted in people's nature and bodies, rather than in acquired tastes or knowledge. It is a continuum, not a dichotomy.", "titre_de": "Essentialisierung", "enonce_de": "Essentialisierung ist das Maß, in dem ein Gruppenunterschied kulturell als im Wesen und im Körper der Menschen verankert verstanden wird, statt in erworbenen Vorlieben oder Kenntnissen. Sie ist ein Kontinuum, keine Dichotomie.", "body_de": "## Bei Ridgeway\n\nStatusüberzeugungen verorten den Unterschied in vereinfachten Eigenschaften; diese reichen von unveränderlichen Wesenszügen bis zu erworbenen kulturellen Unterschieden (S. 136). Die Unterscheidung ist dem klassischen Gegensatz zwischen zugeschriebenem und erworbenem Status verwandt, aber nicht mit ihm identisch (S. 137). Entscheidend ist nicht, ob der Unterschied „tatsächlich“ wesenhaft ist, sondern ob er in Überzeugungen dritter Ordnung kulturell so verstanden wird (S. 136).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [136, 137], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes croyances de statut localisent la différence dans des attributs simplifiés ; ceux-ci vont d'essences immuables à des différences culturelles acquises (p. 136). La distinction est voisine, mais non identique, de l'opposition classique entre statut assigné et statut acquis (p. 137). Ce qui compte n'est pas que la différence soit « réellement » essentielle, mais qu'elle soit culturellement comprise comme telle dans des croyances de troisième ordre (p. 136).", "body_en": "## In Ridgeway\n\nStatus beliefs locate difference in simplified attributes; these range from immutable essences to acquired cultural differences (p. 136). The distinction is related, but not identical, to the classic opposition between ascribed and achieved status (p. 137). What matters is not whether the difference \"actually is\" essential, but whether it is culturally understood as such in third-order beliefs (p. 136).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2582002}, {"id": "D30", "file": "definitions/D30.md", "type": "definition", "partie": "6", "titre": "Structure matérielle de l'inégalité", "enonce": "La structure matérielle de l'inégalité se définit par deux processus liés : le contrôle des ressources matérielles et l'accès aux positions de pouvoir dans les organisations qui produisent et distribuent ces ressources.", "titre_en": "Material structure of inequality", "enonce_en": "The material structure of inequality is defined by two related processes: control over material resources and access to positions of power in the organisations that produce and distribute those resources.", "titre_de": "Materielle Struktur der Ungleichheit", "enonce_de": "Die materielle Struktur der Ungleichheit wird durch zwei verbundene Prozesse bestimmt: die Kontrolle über materielle Ressourcen und den Zugang zu Machtpositionen in den Organisationen, die diese Ressourcen hervorbringen und verteilen.", "body_de": "## Bei Ridgeway\n\nEine von Weber und Tilly übernommene, bewusst enge Definition: Status ist Teil der Struktur der Ungleichheit, doch ihn davon abzuheben erlaubt, seine Wirkungen auf die materielle Ungleichheit zu isolieren (S. 125).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [125], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDéfinition reprise de Weber et de Tilly, et volontairement étroite : le statut fait partie de la structure de l'inégalité, mais l'en séparer permet d'isoler ses effets sur l'inégalité matérielle (p. 125).", "body_en": "## In Ridgeway\n\nA definition taken from Weber and Tilly, and deliberately narrow: status is part of the structure of inequality, but setting it apart makes it possible to isolate its effects on material inequality (p. 125).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2591984}, {"id": "D31", "file": "definitions/D31.md", "type": "definition", "partie": "6", "titre": "Classe comme culture", "enonce": "La classe comme culture est la classe entendue comme style de vie et pratiques culturelles, et non seulement comme richesse.", "titre_en": "Class-as-culture", "enonce_en": "Class-as-culture is class understood as lifestyle and cultural practices, not just as wealth.", "titre_de": "Klasse als Kultur", "enonce_de": "Klasse als Kultur ist Klasse, verstanden als Lebensstil und kulturelle Praktiken, nicht nur als Reichtum.", "body_de": "## Bei Ridgeway\n\nMit Geschlecht und Rasse ist sie eine der drei Statusunterscheidungen, die Kapitel 6 untersucht; der Status erlaubt diesen Unterschieden, zu eigenständigen Ungleichheitssystemen zu werden (S. 125).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [125], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nAvec le genre et la race, c'est l'une des trois distinctions de statut étudiées au chapitre 6 ; le statut permet à ces différences de devenir des systèmes d'inégalité à part entière (p. 125).", "body_en": "## In Ridgeway\n\nWith gender and race, it is one of the three status distinctions studied in chapter 6; status allows these differences to become systems of inequality in their own right (p. 125).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2591984}, {"id": "D32", "file": "definitions/D32.md", "type": "definition", "partie": "5", "titre": "Typifications de statut", "enonce": "Les typifications de statut sont des croyances de statut sur le style de comportement : les acteurs de haut statut seraient plus affirmés, agentiques et compétents, ceux de bas statut plus réactifs et tournés vers les autres.", "titre_en": "Status typifications", "enonce_en": "Status typifications are status beliefs about behavioural style: high-status actors would be more assertive, agentic and competent, low-status actors more reactive and communal.", "titre_de": "Statustypisierungen", "enonce_de": "Statustypisierungen sind Statusüberzeugungen über den Verhaltensstil: Akteure mit hohem Status seien durchsetzungsfähiger, agentischer und kompetenter, Akteure mit niedrigem Status reaktiver und gemeinschaftsbezogener.", "body_de": "## Bei Ridgeway\n\nDer Begriff ist der der Erwartungszustandstheorie für die in Nordamerika geteilten Überzeugungen über den Stil von hohem und niedrigem Status (S. 113-114).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [113, 114], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe terme est celui de la théorie des états d'attente pour les croyances partagées en Amérique du Nord sur le style de haut et de bas statut (p. 113-114).", "body_en": "## In Ridgeway\n\nThe term is expectation states theory's for the beliefs shared in North America about high- and low-status styles (p. 113-114).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2601986}, {"id": "A01", "file": "premisses/A01.md", "type": "auteur", "partie": "P", "titre": "Sewell : la dualité des structures", "enonce": "(Sewell, après Giddens.) Une structure sociale est double : un schème culturel, ensemble de règles implicites pour la mettre en œuvre, et la distribution matérielle de ressources et de conduites qui résulte de cette mise en œuvre. Une fois acquis, un schème s'applique largement, au-delà de son contexte d'origine.", "titre_en": "Sewell: the duality of structures", "enonce_en": "(Sewell, following Giddens.) A social structure is dual: a cultural schema, a set of implicit rules for enacting it, and the material distribution of resources and behaviours that results from that enactment. Once acquired, a schema is applied permissively, beyond its context of origin.", "titre_de": "Sewell: die Dualität der Strukturen", "enonce_de": "(Sewell, im Anschluss an Giddens.) Eine soziale Struktur ist doppelt: ein kulturelles Schema, ein Bündel impliziter Regeln, um sie umzusetzen, und die materielle Verteilung von Ressourcen und Verhaltensweisen, die aus dieser Umsetzung hervorgeht. Ist ein Schema einmal erworben, wendet man es großzügig an, über seinen Ursprungskontext hinaus.", "body_de": "## Bei Ridgeway\n\nDas Statusschema ist in diesem Sinne ein strukturelles Schema (S. 3). In Kapitel 4 erklärt der zweite Gedanke, warum Status sich überallhin ausbreitet: Es ist wie mit einer Schere; hat man sie einmal, fallen einem neue Dinge ein, die man damit schneiden kann (S. 91).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [3, 91], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe schème du statut est un schème structurel en ce sens (p. 3). Au chapitre 4, la seconde idée explique que le statut se répande partout : c'est comme une paire de ciseaux ; une fois qu'on l'a, on trouve de nouvelles choses à couper (p. 91).", "body_en": "## In Ridgeway\n\nThe status schema is a structural schema in this sense (p. 3). In chapter 4, the second idea explains why status spreads everywhere: it is like a pair of scissors; once you have them, you think of new things to cut (p. 91).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2601986}, {"id": "A02", "file": "premisses/A02.md", "type": "auteur", "partie": "P", "titre": "Weber : le pouvoir et l'influence", "enonce": "(Weber.) Le pouvoir est la capacité d'obtenir l'obéissance d'autrui malgré sa résistance, sans dépendre de son consentement. Il diffère du pouvoir « doux » que donne le statut, celui de l'influence.", "titre_en": "Weber: power and influence", "enonce_en": "(Weber.) Power is the ability to get the other to comply despite resistance, without depending on consent. It differs from the \"soft\" power that status brings, the power of influence.", "titre_de": "Weber: Macht und Einfluss", "enonce_de": "(Weber.) Macht ist die Fähigkeit, den anderen auch gegen seinen Widerstand zum Gehorsam zu bringen, ohne auf seine Zustimmung angewiesen zu sein. Sie unterscheidet sich von der „weichen“ Macht, die der Status verleiht, der Macht des Einflusses.", "body_de": "## Bei Ridgeway\n\nStatus als Wertschätzung und Aufmerksamkeit erhöht die Fähigkeit, andere zu überzeugen, vor allem in Bezug auf die gemeinsame Anstrengung; er verleiht für sich genommen nicht die Fähigkeit, sie zu zwingen (S. 14).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [14], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe statut, comme estime et attention, accroît la capacité de persuader les autres, surtout pour l'effort commun ; il ne donne pas, à lui seul, celle de les forcer (p. 14).", "body_en": "## In Ridgeway\n\nStatus, as esteem and attention, increases the ability to persuade others, especially regarding the shared effort; it does not by itself give the capacity to force them (p. 14)."
