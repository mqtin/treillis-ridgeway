t oder sanktioniert wird (S. 154-155).\n2. Dieser Konsens stimmt die Norm ab, verbindet die Beiträge zu einer Handlungslinie und löst Meinungsverschiedenheiten: Er ist die organisatorische Lösung der Probleme der Interdependenz (S. 155).\n3. Nach T021 bleiben die Hierarchien trotz der Rivalität stabil: Wer sich nicht fügt, wird sanktioniert, wer sich fügt, wird als vernünftig respektiert; der Konsens zweiter Ordnung sichert die Stabilität ab (S. 155-156).\n4. Nach T031 ordnet dasselbe Schema Organisationen, mit derselben Verbindung von Rang und wahrgenommener Qualität, demselben Vorteil und derselben Ausbreitung durch Verbindung; im Grenzfall betrifft die Zusammenarbeit nur noch eine gemeinsame öffentliche Rangliste (S. 156-158). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["T012", "T021", "T031"], "citation": "", "pages": [154, 155, 156, 157, 158], "depends_on": ["T012", "T021", "T031"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T012, le consensus qui gouverne la hiérarchie porte sur ce que les *autres* attendent ; c'est ce qui donne sa force au statut et explique que les attentes de second ordre l'emportent sur les siennes : elles disent si l'on sera respecté ou sanctionné (p. 154-155).\n2. Ce consensus coordonne la norme, combine les contributions en une ligne d'action et résout les désaccords : c'est la solution d'organisation aux problèmes de l'interdépendance (p. 155).\n3. Par T021, les hiérarchies restent stables malgré la rivalité : qui ne défère pas est sanctionné, qui défère est respecté comme raisonnable ; le consensus de second ordre adosse la stabilité (p. 155-156).\n4. Par T031, le même schème organise les organisations, avec la même association entre rang et qualité perçue, le même avantage et la même propagation par association ; à la limite, la coopération ne porte plus que sur un classement public commun (p. 156-158). ∎", "body_en": "## Demonstration\n\n1. By T012, the consensus governing the hierarchy bears on what *others* expect; this is what gives status its force and explains why second-order expectations prevail over one's own: they tell whether one will be respected or sanctioned (p. 154-155).\n2. This consensus coordinates the norm, combines contributions into a line of action and resolves disagreements: it is the organisational solution to the problems of interdependence (p. 155).\n3. By T021, hierarchies remain stable despite rivalry: whoever does not defer is sanctioned, whoever defers is respected as reasonable; the second-order consensus backstops stability (p. 155-156).\n4. By T031, the same schema organises organisations, with the same association between rank and perceived quality, the same advantage and the same spread by association; at the limit, cooperation bears only on a shared public ranking (p. 156-158). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["T012", "T021", "T031"], "sections": ["Démonstration"], "demo_refs": ["T012", "T021", "T031"], "mentions": ["T012", "T021", "T031"], "corollaires": [], "mtime": 1794593161.329528}, {"id": "T058", "file": "theses/T058.md", "type": "these", "partie": "7", "titre": "Pourquoi le statut est partout, et pourquoi il importe", "enonce": "Le statut est partout parce que la tension entre coopération et rivalité est partout, parce que les gens y tiennent profondément, et parce qu'il se propage par association. Il importe parce que, par les croyances sur les différences, il crée des biais qui s'accumulent, s'inscrit dans les organisations, donne à l'inégalité de groupe une capacité autonome de se reproduire et la justifie par le mérite.", "titre_en": "Why status is everywhere, and why it matters", "enonce_en": "Status is everywhere because the tension between cooperation and rivalry is everywhere, because people care deeply about it, and because it spreads through association. It matters because, through beliefs about differences, it creates biases that accumulate, is written into organisations, gives group inequality an autonomous capacity to reproduce itself and justifies it by merit.", "titre_de": "Warum Status überall ist und warum er wichtig ist", "enonce_de": "Status ist überall, weil die Spannung zwischen Zusammenarbeit und Rivalität überall ist, weil den Menschen viel an ihm liegt und weil er sich durch Verbindung ausbreitet. Er ist wichtig, weil er durch Überzeugungen über Unterschiede Verzerrungen schafft, die sich anhäufen, sich in Organisationen einschreibt, der Gruppenungleichheit eine eigenständige Fähigkeit zur Reproduktion verleiht und sie durch Verdienst rechtfertigt.", "body_de": "## Beweis\n\n1. Nach T001 sind Situationen der Interdependenz überall, und man bringt das Schema in sie ein; es wird zu einem Grundbaustein der Organisation von Gruppen, bis hin zu den Beziehungen zwischen Gruppen (S. 4).\n2. Nach T016 liegt den Menschen am Status, der öffentlichen Darstellung ihres Werts; was uns so wichtig ist, wird überall salient (S. 5).\n3. Nach T039 breitet sich Status durch Verbindung aus, von Besitzern und Herstellern auf Objekte und Konsumenten: der bewunderte Sportler, die Turnschuhe des Jungen (S. 5).\n4. Er ist vor allem für die Ungleichheit wichtig: Nach T047 häufen sich die aus Überzeugungen über Unterschiede entstehenden Verzerrungen an und lenken zu ungleichen Lebenschancen (S. 158-159).\n5. Nach T048 schreiben sie sich in die Praktiken der Organisationen ein, die einen „idealen Arbeitnehmer“ aus hochrangigen Gruppen unterstellen (S. 159).\n6. Zusammen verleihen sie der auf Unterschieden beruhenden Ungleichheit eine eigenständige Fähigkeit zur Reproduktion; nach T053 rechtfertigen sie sie durch das Verdienst, das sie selbst hervorgebracht haben (S. 159-160). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["T001", "T016", "T039", "T047", "T048", "T053"], "citation": "", "pages": [4, 5, 158, 159, 160], "depends_on": ["T001", "T016", "T039", "T047", "T048", "T053"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T001, les situations d'interdépendance sont partout, et l'on y apporte le schème ; il devient un élément de base de l'organisation des groupes, jusqu'aux relations entre groupes (p. 4).\n2. Par T016, on tient au statut, représentation publique de sa valeur ; ce qui nous importe tant devient saillant partout (p. 5).\n3. Par T039, le statut se propage par association, des propriétaires et producteurs aux objets et aux consommateurs : l'athlète admiré, les baskets du gamin (p. 5).\n4. Il importe surtout pour l'inégalité : par T047, les biais nés des croyances sur les différences s'accumulent et orientent vers des destins inégaux (p. 158-159).\n5. Par T048, ils s'inscrivent dans les pratiques des organisations, qui supposent un « travailleur idéal » des groupes de haut statut (p. 159).\n6. Ensemble, ils donnent à l'inégalité fondée sur la différence une capacité autonome de se reproduire ; par T053, ils la justifient par le mérite qu'ils ont eux-mêmes produit (p. 159-160). ∎", "body_en": "## Demonstration\n\n1. By T001, situations of interdependence are everywhere, and people bring the schema to them; it becomes a basic building block of group organisation, up to relations between groups (p. 4).\n2. By T016, people care about status, the public representation of their worth; what matters so much to us becomes salient everywhere (p. 5).\n3. By T039, status spreads through association, from owners and producers to objects and consumers: the admired athlete, the kid's sneakers (p. 5).\n4. It matters above all for inequality: by T047, the biases arising from beliefs about differences accumulate and steer people towards unequal outcomes (p. 158-159).\n5. By T048, they are written into organisational practices, which presume an \"ideal worker\" from high-status groups (p. 159).\n6. Together, they give difference-based inequality an autonomous capacity to reproduce itself; by T053, they justify it by the merit they themselves produced (p. 159-160). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["T001", "T016", "T039", "T047", "T048", "T053"], "sections": ["Démonstration"], "demo_refs": ["T001", "T016", "T039", "T047", "T048", "T053"], "mentions": ["T001", "T016", "T039", "T047", "T048", "T053"], "corollaires": [], "mtime": 1794593161.3305366}, {"id": "T059", "file": "theses/T059.md", "type": "these", "partie": "7", "titre": "Le statut, une épée à double tranchant", "enonce": "Dans les groupes coopératifs, la hiérarchie de statut rapporte à tous : elle aide à atteindre le but et protège contre le tyran. Mais elle coûte en estime aux membres de bas statut et repose sur des croyances biaisées, ce qui la rend injuste et seulement bornément efficace. Entre les groupes d'une société, les gains sont moindres et les méfaits patents ; et les deux faces sont indissociables, car les croyances sur les groupes sont le vocabulaire même du statut.", "titre_en": "Status, a double-edged sword", "enonce_en": "In cooperative groups, the status hierarchy pays off for everyone: it helps reach the goal and protects against the tyrant. But it costs low-status members esteem and rests on biased beliefs, which makes it unjust and only boundedly efficient. Between the groups of a society, the payoffs are fewer and the harms plain; and the two faces are inseparable, since beliefs about groups are the very vocabulary of status.", "titre_de": "Status, ein zweischneidiges Schwert", "enonce_de": "In kooperativen Gruppen zahlt sich die Statushierarchie für alle aus: Sie hilft, das Ziel zu erreichen, und schützt vor dem Tyrannen. Doch sie kostet die Rangniedrigen Wertschätzung und beruht auf verzerrten Überzeugungen, was sie ungerecht und nur begrenzt effizient macht. Zwischen den Gruppen einer Gesellschaft sind die Erträge geringer und die Schäden offenkundig; und beide Seiten sind untrennbar, denn die Überzeugungen über Gruppen sind das Vokabular des Status selbst.", "body_de": "## Argumentation\n\n1. Die Frage ist für eine Egalitaristin wie Ridgeway unbequem, aber nötig, um das Fortbestehen des Status zu verstehen (S. 160).\n2. Nach T003 ist die Hierarchie in kooperativen Gruppen eine begrenzt funktionale Lösung, von der selbst die Rangniedrigen einen Anteil erhalten (S. 160).\n3. Nach T009 schützt sie die Gruppe auch vor dem Tyrannen, der durch Einschüchterung herrschen würde; das ist sogar der Grund ihrer Erfindung (S. 160-161).\n4. Ihre Kosten: Der niedrige Status zahlt mit Wertschätzung; und die Statusüberzeugungen, eine Abkürzung, deren Genauigkeit nach T011 nie gesichert ist, machen die Zuteilung ungerecht und weniger effizient: daher „begrenzt“ (S. 161).\n5. Zwischen Gruppen sind die Erträge geringer und die Schäden offenkundig; doch diese Rangordnungen gehören zum Status selbst, da das Schema über Überzeugungen über Gruppen wirkt (S. 161).\n6. Nach T046 verdinglichen sie Unterschiede zu „Typen“ von Menschen, verfestigen materielle Ungleichheit und rechtfertigen sie durch Verdienst, selbst in meritokratischen Institutionen (S. 161-162). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["T003", "T009", "T011", "T046"], "citation": "", "pages": [160, 161, 162], "depends_on": ["T003", "T009", "T046", "T011"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Argumentation\n\n1. La question est gênante pour une égalitariste comme Ridgeway, mais nécessaire pour comprendre la persistance du statut (p. 160).\n2. Par T003, dans les groupes coopératifs, la hiérarchie est une solution bornément fonctionnelle, dont même les membres de bas statut tirent une part (p. 160).\n3. Par T009, elle protège aussi le groupe du tyran qui voudrait régner par l'intimidation ; c'est même la raison de son invention (p. 160-161).\n4. Ses coûts : le bas statut paie en estime ; et les croyances de statut, raccourci dont l'exactitude, par T011, n'est jamais garantie, rendent l'attribution injuste et moins efficace : d'où « bornément » (p. 161).\n5. Entre groupes, les gains sont moindres et les méfaits patents ; or ces classements sont inhérents au statut, car le schème passe par les croyances sur les groupes (p. 161).\n6. Par T046, ils réifient les différences en « types » de personnes, consolident l'inégalité matérielle et la justifient par le mérite, jusque dans les institutions méritocratiques (p. 161-162). ∎", "body_en": "## Argument\n\n1. The question is awkward for an egalitarian like Ridgeway, but needed to understand the persistence of status (p. 160).\n2. By T003, in cooperative groups, the hierarchy is a boundedly functional solution, from which even low-status members get a share (p. 160).\n3. By T009, it also protects the group from the tyrant who would rule by intimidation; this is even the reason for its invention (p. 160-161).\n4. Its costs: low status pays in esteem; and status beliefs, a shorthand whose accuracy, by T011, is never assured, make the allocation unjust and less efficient: hence \"boundedly\" (p. 161).\n5. Between groups, payoffs are fewer and harms plain; yet these rankings are inherent to status, since the schema works through beliefs about groups (p. 161).\n6. By T046, they reify differences into \"types\" of people, consolidate material inequality and justify it by merit, even in meritocratic institutions (p. 161-162). ∎", "sections_en": ["Argument"], "demo_refs_en": ["T003", "T009", "T011", "T046"], "sections": ["Argumentation"], "demo_refs": ["T003", "T009", "T011", "T046"], "mentions": ["T003", "T009", "T011", "T046"], "corollaires": [], "mtime": 1794593161.3315363}, {"id": "T060", "file": "theses/T060.md", "type": "these", "partie": "7", "titre": "Le statut ne disparaîtra pas, mais l'inégalité de groupe n'est pas inévitable", "enonce": "Le statut est une force conservatrice et ne disparaîtra pas. Mais qu'un petit nombre de différences, comme le genre et la race, décide des destins n'est pas inévitable : on peut éroder les croyances qui les soutiennent, en sapant leur apparence de consensus et en réduisant les écarts de compétence qu'elles impliquent, vers des distinctions multiples et entrecroisées.", "titre_en": "Status will not disappear, but group inequality is not inevitable", "enonce_en": "Status is a conservative force and will not disappear. But that a few differences, like gender and race, decide life outcomes is not inevitable: the beliefs behind them can be eroded, by undermining their appearance of consensus and narrowing the competence differences they imply, towards multiple, cross-cutting distinctions.", "titre_de": "Status wird nicht verschwinden, doch Gruppenungleichheit ist nicht unvermeidlich", "enonce_de": "Status ist eine konservative Kraft und wird nicht verschwinden. Doch dass einige wenige Unterschiede, wie Geschlecht und Rasse, über Lebenschancen entscheiden, ist nicht unvermeidlich: Man kann die Überzeugungen hinter ihnen aushöhlen, indem man ihren Anschein von Konsens untergräbt und die Kompetenzunterschiede verkleinert, die sie unterstellen, hin zu vielfältigen, sich kreuzenden Unterscheidungen.", "body_de": "## Beweis\n\n1. Statusprozesse verlangsamen den Wandel und legitimieren den Status quo: Sie sind eine konservative Kraft (S. 162).\n2. So tief verwurzelt, wird Status nicht verschwinden; doch Ungleichheiten, die auf wenigen vereinfachten Unterschieden beruhen, sind nicht unvermeidlich (S. 162).\n3. Nach T052 ändert sich eine Überzeugung zuerst, indem man ihren scheinbaren Konsens untergräbt: Die öffentliche Infragestellung der Überzeugung, das Geschlecht sei bei der Geburt festgelegt, beginnt den Essentialismus von T050 zu lockern, den problematischsten Gehalt dieser Überzeugungen (S. 162-163).\n4. Auch die Kompetenzunterschiede, die sie unterstellen, und ihre Allgemeinheit müssen verkleinert werden: Die Lage der Frauen in der Erwerbsarbeit hat dazu ein wenig beigetragen; Geschlecht und Rasse würden weniger durchgängig begünstigen oder benachteiligen (S. 163).\n5. An ihre Stelle könnten vielfältige, sich kreuzende Unterscheidungen treten, und weniger Ungleichheit; doch Ungleichheit wird sich nicht ändern, ohne den Status zu berücksichtigen (S. 163). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["T050", "T052"], "citation": "“If we want to change patterns of inequality in society, we will not succeed without taking status processes into account.”", "pages": [162, 163], "depends_on": ["T052", "T050"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Les processus de statut ralentissent le changement et légitiment le statu quo : ils sont une force conservatrice (p. 162).\n2. Si profondément enraciné, le statut ne disparaîtra pas ; mais des inégalités fondées sur quelques différences simplifiées ne sont pas inévitables (p. 162).\n3. Par T052, une croyance se change d'abord en sapant son consensus apparent : la contestation publique de l'idée que le genre est fixé à la naissance commence à desserrer l'essentialisme de T050, contenu le plus problématique de ces croyances (p. 162-163).\n4. Il faut aussi réduire les écarts de compétence qu'elles impliquent, et leur généralité : la situation des femmes dans l'emploi l'a un peu fait ; genre et race deviendraient moins systématiquement avantageux ou désavantageux (p. 163).\n5. À la place, on aurait des distinctions multiples et entrecroisées, et moins d'inégalité ; mais on ne changera pas l'inégalité sans tenir compte du statut (p. 163). ∎", "body_en": "## Demonstration\n\n1. Status processes slow change and legitimate the status quo: they are a conservative force (p. 162).\n2. So deeply rooted, status will not disappear; but inequalities based on a few simplified differences are not inevitable (p. 162).\n3. By T052, a belief changes first by undermining its apparent consensus: public challenges to the belief that gender is fixed at birth begin to loosen the essentialism of T050, the most problematic content of these beliefs (p. 162-163).\n4. The competence differences they imply, and their generality, must also be narrowed: women's situation in paid work has done so a little; gender and race would become less consistently advantaging or disadvantaging (p. 163).\n5. In their place, there could be multiple, cross-cutting distinctions, and less inequality; but inequality will not change without taking status into account (p. 163). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["T050", "T052"], "sections": ["Démonstration"], "demo_refs": ["T050", "T052"], "mentions": ["T050", "T052"], "corollaires": [], "mtime": 1794593161.3315363}, {"id": "R01", "file": "refutees/R01.md", "type": "refutee", "partie": "1", "titre": "Le statut, une vanité sociale", "enonce": "Le statut serait un aspect relativement trivial de la vie sociale, une vanité sans grande conséquence.", "titre_en": "Status as a social vanity", "enonce_en": "Status would be a relatively trivial aspect of social life, a vanity of little consequence.", "titre_de": "Status als soziale Eitelkeit", "enonce_de": "Status wäre ein vergleichsweise belangloser Aspekt des sozialen Lebens, eine Eitelkeit von geringer Bedeutung.", "body_de": "## Wie Ridgeway sie darstellt\n\nDas ist die gewöhnliche Sicht: Man denkt kaum an Status, und wenn doch, misst man ihm keine große Bedeutung bei (S. 1). Dennoch verhalten sich die Menschen, als läge ihnen zutiefst an ihm: der Jugendliche, der auf der Straße „Respekt“ sucht, der Vorstandschef im Sitzungssaal, der Vater, der stolz von „meiner Tochter, der Anwältin“ spricht (S. 1-2).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [1, 2], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nC'est la vue ordinaire : on ne pense guère au statut, et, quand on y pense, on ne lui prête pas grande conséquence (p. 1). Pourtant les gens se conduisent comme s'ils en étaient profondément soucieux : l'adolescent qui cherche le « respect » dans la rue, le PDG au conseil, le père fier de « ma fille l'avocate » (p. 1-2).", "body_en": "## As Ridgeway presents it\n\nThis is the ordinary view: we hardly think about status, and when we do, we do not credit it with much consequence (p. 1). Yet people behave as if deeply concerned with it: the teenager looking for \"respect\" on the street, the CEO in the boardroom, the father proud of \"my daughter the lawyer\" (p. 1-2).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.3315363}, {"id": "R02", "file": "refutees/R02.md", "type": "refutee", "partie": "1", "titre": "La fonctionnalité explique les hiérarchies de statut", "enonce": "Les hiérarchies de statut existeraient parce qu'elles sont fonctionnelles pour atteindre des buts collectifs ; leur utilité suffirait à expliquer leur apparition et leur persistance.", "titre_en": "Functionality explains status hierarchies", "enonce_en": "Status hierarchies would exist because they are functional for attaining collective goals; their usefulness would suffice to explain their emergence and persistence.", "titre_de": "Funktionalität erklärt Statushierarchien", "enonce_de": "Statushierarchien gäbe es, weil sie für das Erreichen gemeinsamer Ziele funktional sind; ihr Nutzen würde genügen, um ihr Entstehen und Fortbestehen zu erklären.", "body_de": "## Wie Ridgeway sie darstellt\n\nDer funktionale Ansatz beherrscht die Statusforschung, und mehrere Autoren sehen in Statushierarchien eine „begrenzt funktionale“ Lösung (S. 13-14). Ridgeway übernimmt den Befund, nicht die Erklärung: Man kann sich nicht auf die Annahme der Funktionalität verlassen, um zu erklären, warum Status überall ist (S. 14); Funktionalität genügt nicht, um zu sagen, wie diese Hierarchien entstehen (S. 20).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [13, 14, 20], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nL'approche fonctionnelle domine la recherche sur le statut, et plusieurs auteurs voient dans les hiérarchies de statut une solution « bornément fonctionnelle » (p. 13-14). Ridgeway en endosse le constat, mais non l'explication : on ne peut se reposer sur la présomption de fonctionnalité pour expliquer pourquoi le statut est partout (p. 14) ; la fonctionnalité ne suffit pas à dire comment ces hiérarchies se forment (p. 20).", "body_en": "## As Ridgeway presents it\n\nThe functional approach dominates status research, and several scholars see status hierarchies as a \"boundedly functional\" solution (p. 13-14). Ridgeway endorses the finding, not the explanation: we cannot rest on the presumption of functionality to explain why status is everywhere (p. 14); functionality is not enough to say how these hierarchies develop (p. 20).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.333045}, {"id": "R03", "file": "refutees/R03.md", "type": "refutee", "partie": "2", "titre": "Les hiérarchies humaines reposent sur la dominance", "enonce": "Sous les apparences, les hiérarchies humaines, comme celles des autres animaux, se formeraient par la dominance, fondée sur l'intimidation et héritée de l'évolution ; même la déférence volontaire ne serait que la lecture des signes de dominance de l'autre.", "titre_en": "Human hierarchies rest on dominance", "enonce_en": "Beneath appearances, human hierarchies, like those of other animals, would form through dominance, based on intimidation and inherited from evolution; even voluntary deference would only be the reading of the other's dominance signs.", "titre_de": "Menschliche Hierarchien beruhen auf Dominanz", "enonce_de": "Unter der Oberfläche würden sich menschliche Hierarchien wie die anderer Tiere durch Dominanz bilden, die auf Einschüchterung beruht und evolutionär ererbt ist; selbst freiwillige Ehrerbietung wäre nur das Ablesen der Dominanzzeichen des anderen.", "body_de": "## Wie Ridgeway sie darstellt\n\nEine alte Sichtweise, von Cheng und ihren Kollegen wiederbelebt (S. 21-22). Bei Mazur erzeugen Dominanzakte (starrer Blick, Haltung, soziale Machtzeichen) einen Stresswettkampf, den verliert, wer nachgibt; die kampflose Ehrerbietung im Lesekreis wäre noch Dominanz: Man fügt sich im Wissen, dass man einen offenen Streit verlöre (S. 22-23).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [21, 22, 23], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nPerspective ancienne, relancée par Cheng et ses collègues (p. 21-22). Chez Mazur, les actes de dominance (regard fixe, posture, signes sociaux de pouvoir) créent un concours de stress que perd celui qui cède ; la déférence sans combat du club de lecture serait encore de la dominance : on défère quand on se sait perdant d'un conflit ouvert (p. 22-23).", "body_en": "## As Ridgeway presents it\n\nA long-standing perspective, revived by Cheng and her colleagues (p. 21-22). In Mazur, dominance acts (staring, posture, social signs of power) create a stress contest lost by whoever backs down; the uncontested deference in the book club would still be dominance: one defers knowing one would lose an open contest (p. 22-23).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.333045}, {"id": "R04", "file": "refutees/R04.md", "type": "refutee", "partie": "2", "titre": "Le prestige suffit à expliquer les hiérarchies", "enonce": "À côté de la dominance, l'évolution aurait doté les humains d'une déférence au prestige, accordée à ceux qui offrent de meilleurs « biens informationnels » ; dominance et prestige suffiraient, ensemble, à expliquer les hiérarchies d'influence.", "titre_en": "Prestige suffices to explain hierarchies", "enonce_en": "Beside dominance, evolution would have endowed humans with deference to prestige, granted to those who offer better \"information goods\"; dominance and prestige together would suffice to explain hierarchies of influence.", "titre_de": "Prestige genügt, um Hierarchien zu erklären", "enonce_de": "Neben der Dominanz hätte die Evolution den Menschen eine Ehrerbietung gegenüber Prestige mitgegeben, die denen gewährt wird, die bessere „Informationsgüter“ bieten; Dominanz und Prestige zusammen würden genügen, um Einflusshierarchien zu erklären.", "body_de": "## Wie Ridgeway sie darstellt\n\nHenrich und Gil-White schlagen diesen zweiten evolutionären Weg vor; Cheng und ihre Kollegen sehen in Dominanz und Prestige zwei parallele Quellen des Einflusses (S. 25). Ridgeway leugnet diese evolvierten Reaktionen nicht, doch diese Theorien sagen nicht, wie beide Systeme zusammenwirken (S. 26).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [25, 26], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nHenrich et Gil-White proposent cette seconde voie évolutive ; Cheng et ses collègues tiennent dominance et prestige pour deux sources parallèles d'influence (p. 25). Ridgeway ne nie pas ces réponses évoluées, mais ces théories ne disent pas comment les deux systèmes se combinent (p. 26).", "body_en": "## As Ridgeway presents it\n\nHenrich and Gil-White propose this second evolutionary route; Cheng and her colleagues treat dominance and prestige as two parallel sources of influence (p. 25). Ridgeway does not deny these evolved responses, but these theories do not say how the two systems work together (p. 26).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.3340526}, {"id": "R05", "file": "refutees/R05.md", "type": "refutee", "partie": "2", "titre": "Les différences individuelles déterminent la hiérarchie", "enonce": "La hiérarchie qui émerge serait déterminée par les différences individuelles de traits ou d'états que les participants apportent (force, expertise, confiance), et ne serait que l'agrégation de relations de déférence deux à deux.", "titre_en": "Individual differences determine the hierarchy", "enonce_en": "The hierarchy that emerges would be determined by the individual differences in traits or states that participants bring (strength, expertise, confidence), and would be merely the aggregation of pairwise deference relations.", "titre_de": "Individuelle Unterschiede bestimmen die Hierarchie", "enonce_de": "Die entstehende Hierarchie würde durch die individuellen Unterschiede der Eigenschaften oder Zustände bestimmt, die die Beteiligten mitbringen (Kraft, Fachwissen, Zuversicht), und wäre bloß die Summe paarweiser Unterordnungsbeziehungen.", "body_de": "## Wie Ridgeway sie darstellt\n\nEine stillschweigende Annahme vieler Argumente und notwendig die der evolutionären Theorien der Dominanz und des Prestiges, die auf individuelle Fitness und dyadische Unterordnung abstellen (S. 28).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [28], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nPrésupposé implicite de bien des arguments, et nécessairement celui des théories évolutives de la dominance et du prestige, qui portent sur la valeur adaptative individuelle et la déférence dyadique (p. 28).", "body_en": "## As Ridgeway presents it\n\nAn implicit assumption of many arguments, and necessarily that of evolutionary theories of dominance and prestige, which focus on individual fitness and dyadic deference (p. 28).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.3340526}, {"id": "R06", "file": "refutees/R06.md", "type": "refutee", "partie": "3", "titre": "Le statut se réduit à l'appartenance", "enonce": "Le souci du statut ne serait qu'une forme du besoin d'appartenance, d'être aimé et accepté par le groupe.", "titre_en": "Status reduces to belonging", "enonce_en": "Concern for status would be only a form of the need to belong, to be liked and accepted by the group.", "titre_de": "Status lässt sich auf Zugehörigkeit zurückführen", "enonce_de": "Die Sorge um Status wäre nur eine Form des Bedürfnisses nach Zugehörigkeit, gemocht und von der Gruppe akzeptiert zu werden.", "body_de": "## Wie Ridgeway sie darstellt\n\nZugehörigkeit ist ein weithin anerkanntes grundlegendes menschliches Motiv; die Frage ist, ob Status sich auf sie zurückführen lässt (S. 49-50). Ridgeway zeigt, dass dem nicht so ist: Status sagt das Wohlbefinden auch bei gleichem Gefühl der Akzeptanz voraus (S. 58).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [49, 50, 58], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nL'appartenance est un motif humain fondamental largement reconnu ; la question est de savoir si le statut s'y ramène (p. 49-50). Ridgeway montre qu'il n'en est rien : le statut prédit le bien-être même à sentiment d'acceptation égal (p. 58).", "body_en": "## As Ridgeway presents it\n\nBelonging is a widely acknowledged fundamental human motive; the question is whether status reduces to it (p. 49-50). Ridgeway shows it does not: status predicts well-being even holding feelings of acceptance constant (p. 58).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.3351276}, {"id": "R07", "file": "refutees/R07.md", "type": "refutee", "partie": "2", "titre": "Il faut un consensus de premier ordre", "enonce": "Une hiérarchie de statut ne fonctionnerait que si chaque membre jugeait personnellement mérité le rang de chacun, le sien compris.", "titre_en": "A first-order consensus is required", "enonce_en": "A status hierarchy would function only if each member personally judged everyone's rank, their own included, to be deserved.", "titre_de": "Es braucht einen Konsens erster Ordnung", "enonce_de": "Eine Statushierarchie würde nur funktionieren, wenn jedes Mitglied persönlich den Rang aller, den eigenen eingeschlossen, für verdient hielte.", "body_de": "## Wie Ridgeway sie darstellt\n\nDas ist einer der beiden Wege, auf denen sich ein Konsens bilden könnte: die Übereinstimmung der persönlichen Erwartungen (S. 39). Doch Unstimmigkeiten über den Rang auf der Ebene des Ego sind häufig (S. 41-42); bräuchte es einen solchen Konsens, wären Hierarchien weit seltener (S. 154-155).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [39, 41, 42, 154, 155], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nC'est l'une des deux façons dont un consensus pourrait se former : l'accord des attentes personnelles (p. 39). Or les désaccords de rang au niveau de l'ego sont fréquents (p. 41-42) ; s'il fallait un tel consensus, les hiérarchies seraient bien plus rares (p. 154-155).", "body_en": "## As Ridgeway presents it\n\nThis is one of the two ways a consensus could form: agreement of personal expectations (p. 39). Yet rank disagreements at the ego level are common (p. 41-42); if such a consensus were needed, hierarchies would be far rarer (p. 154-155).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.3361287}, {"id": "R08", "file": "refutees/R08.md", "type": "refutee", "partie": "4", "titre": "La richesse suffit à expliquer les croyances de statut", "enonce": "Que les groupes acquièrent d'abord la richesse, puis le statut (Weber), suffirait à expliquer comment naissent les croyances de statut.", "titre_en": "Wealth suffices to explain status beliefs", "enonce_en": "That groups first acquire wealth, then status (Weber), would suffice to explain how status beliefs arise.", "titre_de": "Reichtum genügt, um Statusüberzeugungen zu erklären", "enonce_de": "Dass Gruppen zuerst Reichtum und dann Status erwerben (Weber), würde genügen, um zu erklären, wie Statusüberzeugungen entstehen.", "body_de": "## Wie Ridgeway sie darstellt\n\nDie Beobachtung ist eingängig und bekannt, sagt aber nicht, durch welche Prozesse ein Gruppenunterschied zu einem Unterschied an Wert und Kompetenz wird, noch, wie die Überzeugung auch die benachteiligte Gruppe gewinnt; sie bezeichnet nur eine günstige strukturelle Bedingung (S. 82).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [82], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nL'observation est séduisante et connue, mais elle ne dit pas par quels processus une différence de groupe devient une différence de valeur et de compétence, ni comment la croyance gagne aussi le groupe défavorisé ; elle désigne seulement une condition structurelle propice (p. 82).", "body_en": "## As Ridgeway presents it\n\nThe observation is appealing and well known, but it does not say through what processes a group difference becomes a difference in worth and competence, nor how the belief also wins over the disfavoured group; it only points to a favourable structural condition (p. 82).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.3361287}, {"id": "R09", "file": "refutees/R09.md", "type": "refutee", "partie": "6", "titre": "Le statut, un vernis idéologique après coup", "enonce": "(Tilly.) L'idéologie, y compris les croyances de statut, ne ferait que lisser après coup l'apparence d'une inégalité produite par l'exploitation et l'accaparement ; elle ne serait pas une force causale.", "titre_en": "Status as an after-the-fact ideological gloss", "enonce_en": "(Tilly.) Ideology, including status beliefs, would only smooth over after the fact the appearance of an inequality produced by exploitation and hoarding; it would not be a causal force.", "titre_de": "Status als nachträglicher ideologischer Firnis", "enonce_de": "(Tilly.) Die Ideologie, einschließlich der Statusüberzeugungen, würde den Anschein einer durch Ausbeutung und Horten erzeugten Ungleichheit nur nachträglich glätten; sie wäre keine ursächliche Kraft.", "body_de": "## Wie Ridgeway sie darstellt\n\nTilly räumt ein, dass Ideologie materielle Ungleichheit stabilisiert, aber als Firnis; Ridgeway urteilt wie andere, dass seine Mechanismen eher Ziele und Wirkungen als Prozesse beschreiben, und hält diese Sicht für einen Irrtum (S. 126-127).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [126, 127], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nTilly reconnaît que l'idéologie stabilise l'inégalité matérielle, mais comme un vernis ; Ridgeway, comme d'autres, juge que ses mécanismes disent les buts et les effets plutôt que les processus, et tient cette vue pour une erreur (p. 126-127).", "body_en": "## As Ridgeway presents it\n\nTilly recognises that ideology stabilises material inequality, but as a gloss; Ridgeway, like others, judges that his mechanisms describe goals and effects rather than processes, and holds this view to be a mistake (p. 126-127).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.3361287}, {"id": "R10", "file": "refutees/R10.md", "type": "refutee", "partie": "5", "titre": "Le rejet des femmes affirmées sanctionne un manque de douceur", "enonce": "La réaction hostile aux femmes très affirmées viendrait de ce qu'elles violent le stéréotype selon lequel les femmes doivent être chaleureuses et « gentilles ».", "titre_en": "Backlash against assertive women sanctions a lack of niceness", "enonce_en": "The hostile reaction to highly assertive women would come from their violating the stereotype that women should be warm and \"nice\".", "titre_de": "Die Abwehr gegen selbstbewusste Frauen bestraft einen Mangel an Freundlichkeit", "enonce_de": "Die feindselige Reaktion auf sehr selbstbewusste Frauen käme daher, dass sie gegen das Stereotyp verstoßen, Frauen sollten warm und „nett“ sein.", "body_de": "## Wie Ridgeway sie darstellt\n\nEine Erklärung, die die Arbeiten von Rudman und Mitarbeitern zurückweisen: Die Reaktion entsteht, weil diese Frauen „zu dominant“ erscheinen, auf eine Weise, die die Geschlechterhierarchie verletzt (S. 52; S. 118).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [52, 118], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nExplication écartée par les travaux de Rudman et ses collègues : la réaction vient de ce que ces femmes paraissent « trop dominantes », d'une façon qui viole la hiérarchie de genre (p. 52 ; p. 118).", "body_en": "## As Ridgeway presents it\n\nAn explanation set aside by the work of Rudman and colleagues: the reaction comes from these women appearing \"too dominant\", in a way that violates the gender hierarchy (p. 52; p. 118).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.337126}, {"id": "R11", "file": "refutees/R11.md", "type": "refutee", "partie": "5", "titre": "Les écarts entre groupes viennent de différences individuelles préalables", "enonce": "Les écarts de déférence et d'influence entre personnes de groupes différents s'expliqueraient par des différences préexistantes de personnalité ou de conduite entre ces groupes.", "titre_en": "Gaps between groups come from prior individual differences", "enonce_en": "Gaps in deference and influence between people of different groups would be explained by preexisting differences in personality or behaviour between those groups.", "titre_de": "Unterschiede zwischen Gruppen kommen aus vorherigen individuellen Unterschieden", "enonce_de": "Unterschiede an Ehrerbietung und Einfluss zwischen Menschen verschiedener Gruppen ließen sich durch vorab bestehende Unterschiede in Persönlichkeit oder Verhalten zwischen diesen Gruppen erklären.", "body_de": "## Wie Ridgeway sie darstellt\n\nEine Hypothese, die die Studien ausschließen: Die Wirkungen der Statusmerkmale sind von solchen Unterschieden unabhängig und lassen sich nicht aus ihnen erklären (S. 108).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [108], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nHypothèse que les études écartent : les effets des caractéristiques de statut sont indépendants de telles différences et ne peuvent s'en déduire (p. 108).", "body_en": "## As Ridgeway presents it\n\nA hypothesis the studies rule out: the effects of status characteristics are independent of such differences and cannot be accounted for by them (p. 108).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.337126}, {"id": "R12", "file": "refutees/R12.md", "type": "refutee", "partie": "6", "titre": "Chacun reçoit selon son mérite individuel", "enonce": "Les récompenses matérielles devraient reposer, et reposent largement, sur l'accomplissement individuel, le talent et l'effort, quel que soit le groupe d'origine : le système serait juste.", "titre_en": "Everyone gets what their individual merit deserves", "enonce_en": "Material rewards should rest, and largely do rest, on individual achievement, talent and hard work, whatever group one comes from: the system would be fair.", "titre_de": "Jeder erhält, was sein individuelles Verdienst wert ist", "enonce_de": "Materielle Belohnungen sollten auf individueller Leistung, Begabung und harter Arbeit beruhen, und tun es weitgehend, unabhängig von der Herkunftsgruppe: Das System wäre gerecht.", "body_de": "## Wie Ridgeway sie darstellt\n\nEs ist eine mächtige, ja grundlegende Ideologie in den Vereinigten Staaten, die des amerikanischen Traums; begünstigte Gruppen hängen ihr stärker an, doch sie ist weit verbreitet (S. 147-148).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [147, 148], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nC'est une idéologie puissante, fondatrice aux États-Unis, celle du rêve américain ; les groupes avantagés y adhèrent davantage, mais elle est largement partagée (p. 147-148).", "body_en": "## As Ridgeway presents it\n\nIt is a powerful, even foundational ideology in the United States, that of the American Dream; advantaged groups endorse it more, but acceptance is widespread (p. 147-148).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.3382473}, {"id": "R13", "file": "refutees/R13.md", "type": "refutee", "partie": "3", "titre": "Le pouvoir est insatiable", "enonce": "Le pouvoir serait addictif : plus on en a, plus on en veut.", "titre_en": "Power is insatiable", "enonce_en": "Power would be addictive: the more one has, the more one wants.", "titre_de": "Macht ist unersättlich", "enonce_de": "Macht würde süchtig machen: Je mehr man hat, desto mehr will man.", "body_de": "## Wie Ridgeway sie darstellt\n\nDas nimmt man oft an, doch das wenige, was die Forschung dazu sagt, zeigt nach Hays und Greer, dass die meisten Menschen nach einem mäßigen Maß an Macht das Interesse an mehr verlieren (S. 59).", "sections_de": ["Wie Ridgeway sie darstellt"], "demo_refs_de": [], "citation": "", "pages": [59], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Telle que Ridgeway la présente\n\nOn le suppose souvent, mais le peu de recherches existantes, selon Hays et Greer, montre qu'après un pouvoir modéré la plupart des gens s'en désintéressent (p. 59).", "body_en": "## As Ridgeway presents it\n\nIt is often assumed, but what little research exists, according to Hays and Greer, shows that after a moderate amount of power most people become less interested in more (p. 59).", "sections_en": ["As Ridgeway presents it"], "demo_refs_en": [], "sections": ["Telle que Ridgeway la présente"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.3382473}], "documents": [{"name": "PARCOURS.md", "kind": "projet", "body": "# Parcours de lecture\n\nLe treillis se parcourt dans tous les sens. Pour une première lecture, voici un fil de seize étapes, de la question du livre à sa conclusion. Chaque étape renvoie à un élément ; de là, « Chemin vers » montre ce sur quoi il repose, « Conséquences » ce qui en découle.\n\n## I. Ce qu'est le statut\n\n**1.** D01, T001. Le statut est un classement d'estime. Les hiérarchies de statut sont une invention culturelle pour gérer une tension de la condition humaine : on doit coopérer, et l'on se dispute les termes de la coopération.\n\n**2.** T002. Le statut est relationnel, social, consensuel et public ; surtout, il est donné par les autres, non pris.\n\n**3.** T003, T004. Il organise la coopération, mais seulement « bornément » ; il diffère du pouvoir et de la richesse, tout en leur étant lié.\n\n## II. D'où vient le schème\n\n**4.** T005, T006. Ni la dominance ni le prestige n'expliquent les hiérarchies de statut.\n\n**5.** T007, T008, T009. À trois ou plus, les témoins comptent : chacun a intérêt à ce que les autres défèrent à la compétence, et les tiers se liguent contre le dominateur. Une norme se révèle.\n\n**6.** T011. Le schème est double : une norme fondamentale (la grammaire) et des croyances de statut (le vocabulaire).\n\n**7.** T012. Le consensus qui gouverne la hiérarchie porte sur ce que les autres attendent, non sur ce que chacun croit mériter.\n\n## III. Pourquoi on y tient\n\n**8.** T016, T019. Le désir de statut est un motif fondamental, et insatiable, parce que le statut n'est jamais acquis.\n\n**9.** T020. Le schème récompense même le bas statut : qui défère est respecté comme raisonnable.\n\n## IV. Les croyances de statut\n\n**10.** T024, T025. Les croyances de statut portent sur ce que pense « la plupart des gens » ; c'est ce qui leur donne leur force.\n\n**11.** T028. Elles naissent de rencontres où un groupe est systématiquement avantagé.\n\n**12.** T032. Elles créent un avantage de statut qui passe pour du mérite.\n\n## V. Dans l'interaction\n\n**13.** T034, T036. Les attentes de performance sont autoréalisatrices, et les caractéristiques diffuses (genre, race, classe) les cadrent dès le début.\n\n**14.** T044. Trois biais (de statut, de légitimité, de préférence associative) s'accumulent sur une vie.\n\n## VI. L'inégalité durable\n\n**15.** T046, T047, T053. Les croyances de statut consolident l'inégalité matérielle avec la différence, lui donnent le pouvoir de se reproduire et la légitiment par le mérite.\n\n**16.** T059, T060. Le statut est une épée à double tranchant ; il ne disparaîtra pas, mais l'inégalité de groupe n'est pas inévitable.\n", "body_en": "# Reading path\n\nThe lattice can be read in every direction. For a first reading, here is a thread of sixteen steps, from the book's question to its conclusion. Each step points to an element; from there, \"Path to\" shows what it rests on, \"Consequences\" what follows from it.\n\n## I. What status is\n\n**1.** D01, T001. Status is a ranking of esteem. Status hierarchies are a cultural invention for managing a tension in the human condition: we must cooperate, and we contend over the terms of cooperation.\n\n**2.** T002. Status is relational, social, consensual and public; above all, it is given by others, not taken.\n\n**3.** T003, T004. It organises cooperation, but only \"boundedly\"; it differs from power and wealth, while linked to them.\n\n## II. Where the schema comes from\n\n**4.** T005, T006. Neither dominance nor prestige explains status hierarchies.\n\n**5.** T007, T008, T009. With three or more, bystanders matter: each has an interest in others deferring to competence, and third parties side against the dominator. A norm is revealed.\n\n**6.** T011. The schema is twofold: a basic norm (the grammar) and status beliefs (the vocabulary).\n\n**7.** T012. The consensus governing the hierarchy bears on what others expect, not on what each thinks they deserve.\n\n## III. Why we care\n\n**8.** T016, T019. The desire for status is a fundamental motive, and insatiable, because status is never secured.\n\n**9.** T020. The schema rewards even low status: whoever defers is respected as reasonable.\n\n## IV. Status beliefs\n\n**10.** T024, T025. Status beliefs bear on what \"most people\" think; that is what gives them their force.\n\n**11.** T028. They arise from encounters in which one group is systematically advantaged.\n\n**12.** T032. They create a status advantage that passes for merit.\n\n## V. In interaction\n\n**13.** T034, T036. Performance expectations are self-fulfilling, and diffuse characteristics (gender, race, class) frame them from the start.\n\n**14.** T044. Three biases (status, legitimacy, associational preference) accumulate over a lifetime.\n\n## VI. Durable inequality\n\n**15.** T046, T047, T053. Status beliefs consolidate material inequality with difference, give it the power to reproduce itself and legitimate it by merit.\n\n**16.** T059, T060. Status is a double-edged sword; it will not disappear, but group inequality is not inevitable.\n", "body_de": "# Lesepfad\n\nDas Gitter lässt sich in alle Richtungen lesen. Für eine erste Lektüre hier ein Faden in sechzehn Schritten, von der Frage des Buches bis zu seinem Schluss. Jeder Schritt verweist auf ein Element; von dort zeigt „Pfad zu“, worauf es beruht, und „Folgen“, was aus ihm folgt.\n\n## I. Was Status ist\n\n**1.** D01, T001. Status ist eine Rangordnung der Wertschätzung. Statushierarchien sind eine kulturelle Erfindung, um eine Spannung der menschlichen Lage zu bewältigen: Wir müssen zusammenarbeiten, und wir streiten um die Bedingungen der Zusammenarbeit.\n\n**2.** T002. Status ist relational, sozial, konsensuell und öffentlich; vor allem wird er von anderen verliehen, nicht genommen.\n\n**3.** T003, T004. Er organisiert die Zusammenarbeit, aber nur „begrenzt“; er unterscheidet sich von Macht und Reichtum und ist doch mit ihnen verbunden.\n\n## II. Woher das Schema kommt\n\n**4.** T005, T006. Weder Dominanz noch Prestige erklären Statushierarchien.\n\n**5.** T007, T008, T009. Ab drei Personen zählen die Zuschauer: Jeder hat ein Interesse daran, dass die anderen sich der Kompetenz fügen, und Dritte stellen sich gegen den Dominierenden. Eine Norm zeigt sich.\n\n**6.** T011. Das Schema ist zweifach: eine grundlegende Norm (die Grammatik) und Statusüberzeugungen (das Vokabular).\n\n**7.** T012. Der Konsens, der die Hierarchie regiert, betrifft das, was die anderen erwarten, nicht das, was jeder zu verdienen meint.\n\n## III. Warum uns am Status liegt\n\n**8.** T016, T019. Das Streben nach Status ist ein grundlegendes Motiv, und unersättlich, weil Status nie gesichert ist.\n\n**9.** T020. Das Schema belohnt selbst den niedrigen Status: Wer sich fügt, wird als vernünftig respektiert.\n\n## IV. Die Statusüberzeugungen\n\n**10.** T024, T025. Statusüberzeugungen betreffen das, was „die meisten Leute“ denken; das verleiht ihnen ihre Kraft.\n\n**11.** T028. Sie entstehen aus Begegnungen, in denen eine Gruppe systematisch begünstigt ist.\n\n**12.** T032. Sie erzeugen einen Statusvorteil, der als Verdienst gilt.\n\n## V. In der Interaktion\n\n**13.** T034, T036. Leistungserwartungen erfüllen sich selbst, und diffuse Merkmale (Geschlecht, Rasse, Klasse) rahmen sie von Anfang an.\n\n**14.** T044. Drei Verzerrungen (Status, Legitimität, Assoziationspräferenz) häufen sich über ein Leben an.\n\n## VI. Die dauerhafte Ungleichheit\n\n**15.** T046, T047, T053. Statusüberzeugungen verfestigen materielle Ungleichheit mit dem Unterschied, verleihen ihr die Kraft, sich zu reproduzieren, und legitimieren sie durch Verdienst.\n\n**16.** T059, T060. Status ist ein zweischneidiges Schwert; er wird nicht verschwinden, doch Gruppenungleichheit ist nicht unvermeidlich.\n"}, {"name": "NOTICE.md", "kind": "projet", "body": "# Sources, droits et mentions\n\nCe projet reconstruit l'argument d'un livre sous droits. Il n'en reproduit pas le texte : il le **reformule**, en renvoyant à chaque page, et n'en **cite** que de courts extraits. **Pour lire Ridgeway, lisez Ridgeway.**\n\n## Le livre\n\n- Cecilia L. Ridgeway, *Status: Why Is It Everywhere? Why Does It Matter?*, New York, Russell Sage Foundation, 2019. © Russell Sage Foundation.\n- Ce que le dépôt contient du livre : de courtes citations (quelques mots, au plus une phrase), chacune avec sa page, et les titres de ses chapitres. Le texte lui-même n'est pas distribué : le dossier `source/` est exclu du dépôt, et `outils/check.py` vérifie qu'il le reste.\n- Ces citations relèvent du droit de courte citation (Code de la propriété intellectuelle, art. L122-5, 3°) : elles sont incorporées à un travail d'analyse et leur source est indiquée. Elles ne sont **pas** couvertes par les licences du dépôt (voir `LICENSE`).\n\n## Les langues\n\n- La reconstruction est écrite en français et traduite en anglais et en allemand par nous. Les mots de Ridgeway sont cités en anglais, tels quels ; dans le corps français, certains sont traduits par nous.\n- À notre connaissance, le livre n'a pas de traduction française ni allemande publiée ; les équivalents français et allemands des concepts (schème culturel, croyances de statut, etc.) sont les nôtres.\n\n## Les autres auteurs\n\nLes travaux d'autres auteurs (Weber, Goffman, Sewell, Tilly, Blumer, Fiske…) et les études empiriques sont présentés tels que Ridgeway les rapporte, avec la page où elle le fait ; leurs références complètes sont dans les notes du livre.\n\n## Le projet\n\n- Reconstruction, traductions anglaise et allemande, outils et explorateur : auteur du dépôt [mqtin](https://github.com/mqtin), 2026, avec l'aide de Claude (Anthropic).\n- L'explorateur est l'outil commun aux treillis d'idées du même auteur (<https://treillis.qpetit.com>).\n- Licences : code sous GPL-3.0, travail de reconstruction (et ses traductions) sous CC BY-SA 4.0, citations exclues (voir `LICENSE`).\n\n**Ces mentions doivent être conservées** dans toute redistribution du dépôt ou d'`explorer.html`.\n", "body_en": "# Sources, rights and credits\n\nThis project reconstructs the argument of a book under copyright. It does not reproduce its text: it **paraphrases** it, pointing to each page, and **quotes** only short extracts. **To read Ridgeway, read Ridgeway.**\n\n## The book\n\n- Cecilia L. Ridgeway, *Status: Why Is It Everywhere? Why Does It Matter?*, New York, Russell Sage Foundation, 2019. © Russell Sage Foundation.\n- What the repository contains of the book: short quotations (a few words, at most one sentence), each with its page, and the titles of its chapters. The text itself is not distributed: the `source/` folder is excluded from the repository, and `outils/check.py` checks that it stays so.\n- These quotations fall under the right of short quotation (French Intellectual Property Code, art. L122-5, 3°): they are incorporated into a work of analysis and their source is given. They are **not** covered by the repository's licences (see `LICENSE`).\n\n## Languages\n\n- The reconstruction is written in French and translated into English by us. Ridgeway's words are quoted in English, as they are; in the French bodies, some are translated by us.\n- To our knowledge, the book has no published French translation; the French equivalents of its concepts (schème culturel, croyances de statut, etc.) are ours.\n\n## Other authors\n\nThe work of other authors (Weber, Goffman, Sewell, Tilly, Blumer, Fiske…) and the empirical studies are presented as Ridgeway reports them, with the page where she does so; their full references are in the book's notes.\n\n## The project\n\n- Reconstruction, translation, tools and explorer: repository author [mqtin](https://github.com/mqtin), 2026, with the help of Claude (Anthropic).\n- The explorer is the tool shared by the same author's idea lattices (<https://treillis.qpetit.com>).\n- Licences: code under GPL-3.0, reconstruction work (and its translation) under CC BY-SA 4.0, quotations excluded (see `LICENSE`).\n\n**These notices must be kept** in any redistribution of the repository or of `explorer.html`.\n", "body_de": "# Quellen, Rechte und Angaben\n\nDieses Projekt rekonstruiert die Argumentation eines urheberrechtlich geschützten Buches. Es gibt seinen Text nicht wieder: Es **paraphrasiert** ihn, mit Verweis auf jede Seite, und **zitiert** nur kurze Auszüge. **Wer Ridgeway lesen will, lese Ridgeway.**\n\n## Das Buch\n\n- Cecilia L. Ridgeway, *Status: Why Is It Everywhere? Why Does It Matter?*, New York, Russell Sage Foundation, 2019. © Russell Sage Foundation.\n- Was das Repository vom Buch enthält: kurze Zitate (wenige Wörter, höchstens ein Satz), jeweils mit Seitenangabe, und die Titel seiner Kapitel. Der Text selbst wird nicht verbreitet: Der Ordner `source/` ist aus dem Repository ausgeschlossen, und `outils/check.py` prüft, dass es so bleibt.\n- Diese Zitate fallen unter das Recht des kurzen Zitats (französisches Gesetzbuch über geistiges Eigentum, Art. L122-5, 3°): Sie sind in eine analytische Arbeit eingebunden, und ihre Quelle ist angegeben. Sie fallen **nicht** unter die Lizenzen des Repositorys (siehe `LICENSE`).\n\n## Die Sprachen\n\n- Die Rekonstruktion ist auf Französisch verfasst und von uns ins Englische und Deutsche übersetzt. Das hervorgehobene Zitat (Feld `citation`) steht in Ridgeways eigenen, englischen Worten; in den französischen und deutschen Texten sind ihre Worte teils von uns übertragen.\n- Seitenangaben beziehen sich auf die Druckausgabe von 2019.\n- Unseres Wissens gibt es keine veröffentlichte französische oder deutsche Übersetzung des Buches; die französischen und deutschen Entsprechungen seiner Begriffe (kulturelles Schema, Statusüberzeugungen usw.) sind unsere.\n\n## Andere Autoren\n\nDie Arbeiten anderer Autoren (Weber, Goffman, Sewell, Tilly, Blumer, Fiske…) und die empirischen Studien werden so dargestellt, wie Ridgeway sie wiedergibt, mit der Seite, auf der sie es tut; ihre vollständigen Angaben stehen in den Anmerkungen des Buches.\n\n## Das Projekt\n\n- Rekonstruktion, Übersetzungen, Werkzeuge und Explorer: Autor des Repositorys [mqtin](https://github.com/mqtin), 2026, mit Hilfe von Claude (Anthropic).\n- Der Explorer ist das gemeinsame Werkzeug der Ideengitter desselben Autors (<https://treillis.qpetit.com>).\n- Lizenzen: Code unter GPL-3.0, Rekonstruktionsarbeit (und ihre Übersetzungen) unter CC BY-SA 4.0, Zitate ausgenommen (siehe `LICENSE`).\n\n**Diese Angaben müssen** bei jeder Weitergabe des Repositorys oder von `explorer.html` **erhalten bleiben**.\n"}, {"name": "AGENT.md", "kind": "projet", "body": "# AGENT.md : *Status* de Cecilia Ridgeway en treillis\n\nCe fichier définit l'objectif, la méthode et les conventions du projet. Il s'adresse à l'agent (Claude) et à l'auteur. Tout travail dans ce dépôt doit s'y conformer. Il évolue avec le projet, et toute modification est discutée avec l'auteur.\n\nProjet indépendant, publié parmi les « treillis d'idées » (treillis.qpetit.com), dont il partage l'outillage. Projet voisin par le sujet : Homo Status (`/status`, dépôt `status-and-politics`), qui prend chez Ridgeway ses définitions du statut.\n\n## 1. Objectif\n\nReconstruire **fidèlement** l'argument de Cecilia L. Ridgeway, *Status: Why Is It Everywhere? Why Does It Matter?* (New York, Russell Sage Foundation, 2019), dans l'ordre géométrique, et le rendre explorable comme un graphe. Depuis une thèse, on doit pouvoir voir le chemin qui y mène, jusqu'aux concepts et aux prémisses (travaux d'autres auteurs, résultats d'études), et ce qui en découle.\n\nC'est une **reconstruction, non une critique**. On ne juge pas les thèses, on ne cherche pas de rivales et on ne dit pas ce qui les réfuterait : ce travail appartient à Homo Status. Ici, la seule question est : *qu'est-ce que Ridgeway dit, et comment est-ce que cela s'enchaîne ?*\n\n## 2. Fidélité\n\n1. **Rien qui ne soit dans le livre.** Chaque élément reformule un passage du livre. Si un pas manque pour relier deux thèses, on le signale (§ 2.4) ; on n'ajoute pas de contenu.\n2. **Toute affirmation a son repère** : la page de l'édition papier, entre parenthèses, « (p. 37) » ou « (p. 37-39) ». Le champ `pages` est la liste exacte des pages citées dans le corps français ; `check.py` le vérifie.\n3. **Les travaux cités sont ceux de Ridgeway.** Une prémisse A ou E dit ce qu'un auteur ou une étude établit *tel que Ridgeway le rapporte* ; on ne va pas vérifier la source, et on ne cite pas d'étude qu'elle ne cite pas.\n4. **Explicite ou reconstruit.** Le champ `lien_explicite` d'une thèse dit si Ridgeway fait elle-même les liens déclarés dans `depends_on` (`true`) ou si on les a reconstruits (`false`). Dans le corps, un pas qu'elle ne fait pas est marqué *[reconstruit]*.\n5. **Démonstration ou argumentation.** Une thèse a une `## Démonstration` quand Ridgeway enchaîne des raisons, et une `## Argumentation` quand elle établit par exemples, comparaison ou réfutation. On ne fabrique pas de déduction absente du livre.\n6. **Le vocabulaire de Ridgeway** est conservé et traduit de façon constante : schème culturel (*cultural schema*), norme fondamentale du statut (*basic status norm*), croyances de statut (*status beliefs*), attentes de performance, caractéristiques de statut diffuses et spécifiques, généralisation du statut, avantage de statut, inférence de troisième ordre, biais de légitimité, biais de préférence associative, institutions-portails (*gateway institutions*). Il n'existe pas, à notre connaissance, de traduction française publiée du livre ; ces traductions sont les nôtres.\n\n## 3. Types d'éléments\n\n| type | préfixe | dossier | rôle |\n|---|---|---|---|\n| `definition` | `D` | `definitions/` | un concept que Ridgeway définit ou reprend (statut, schème culturel, croyance de statut…) |\n| `auteur` | `A` | `premisses/` | la thèse d'un autre auteur ou d'une autre théorie que Ridgeway prend comme prémisse (Sewell, Weber, Tilly, la théorie des états d'attente…) |\n| `etude` | `E` | `premisses/` | un résultat empirique que Ridgeway cite (Bales, Ridgeway et Diekema, Hays et Greer…) |\n| `these` | `T` | `theses/` | une thèse de Ridgeway, avec sa démonstration ou son argumentation |\n| `refutee` | `R` | `refutees/` | une position que Ridgeway écarte (la dominance comme fondement, le statut comme vanité, le vernis idéologique de Tilly…), énoncée telle qu'elle la présente |\n\n- Concepts, prémisses et positions écartées ne s'appuient que sur des concepts et des prémisses. Seules les thèses s'appuient sur des thèses.\n- Le champ `contre` d'une thèse liste les positions `R` qu'elle écarte. Ces arêtes « contre » n'entrent ni dans le chemin ni dans les conséquences.\n- Les identifiants sont globaux et numérotés dans l'ordre d'apparition dans le livre ; toute renumérotation est répercutée partout.\n\n## 4. Structure du dépôt\n\n```\nAGENT.md          ce fichier\nREADME.md\nPARCOURS.md       parcours de lecture : un fil de seize étapes, de la question du livre à sa conclusion\nPARCOURS.en.md    sa version anglaise ; de même NOTICE.en.md (§ 5 bis) ; PARCOURS.de.md, NOTICE.de.md en allemand (§ 5 ter)\nINDEX.md          table de tous les éléments (générée), plan, journal\nparties/          P (prémisses), 1 à 7 (chapitres) : titre, pages, résumé\ndefinitions/      D01.md …\npremisses/        A01.md …, E01.md …\ntheses/           T001.md …\nrefutees/         R01.md …\noutils/           build_explorer.py, explorer_template.html, check.py, audit_citations.py, audit_pages.py, build_index.py, extract_epub.py\nsource/           NON VERSIONNÉ : le fichier du livre et le texte extrait (§ 6)\nexplorer.html     généré\n```\n\nChaque élément porte un champ `partie` : `P` pour les prémisses A et E, sinon le chapitre où il apparaît. `INDEX.md` est régénéré par `python outils/build_index.py` (le journal est conservé).\n\n## 5. Format d'un fichier\n\n```markdown\n---\nid: T012\ntype: these                 # definition | auteur | etude | these | refutee\npartie: \"2\"                 # P | 1 … 7\ntitre: \"Titre court\"\nenonce: \"Reformulation de la thèse, en une ou deux phrases.\"\npages: [39, 40, 41, 42]     # exactement les pages citées dans le corps français\ncitation: \"“…”\"             # facultative ; une phrase au plus, en anglais, mot pour mot (§ 6)\ndepends_on: [T011, D09, E09]\ncontre: [R07]               # thèses seulement\nlien_explicite: true        # thèses seulement (§ 2.4)\nstatut_revision: brouillon  # brouillon | verifie-texte\ntitre_en: \"…\"\nenonce_en: \"…\"\n---\n\n## Démonstration            (ou ## Argumentation)\n1. Par T011, … (p. 39-40).\n2. Par E09, … (p. 40). ∎\n\n## Scolie\nExemples et digressions du livre, résumés.\n\n<!-- en -->\n\n## Demonstration\n1. By T011, … (p. 39-40).\n2. By E09, … (p. 40). ∎\n\n## Scholium\n…\n```\n\nConcepts et prémisses ont une section `## Chez Ridgeway` (*In Ridgeway*) ; les positions écartées, `## Telle que Ridgeway la présente` (*As Ridgeway presents it*).\n\n`depends_on` correspond exactement aux identifiants invoqués dans la démonstration ou l'argumentation.\n\n**§ 5 bis. Version anglaise.** Chaque élément et chaque partie a sa version anglaise dans le même fichier : `titre_en`, `enonce_en` (ou `resume_en`) dans le front-matter, et, après une ligne `<!-- en -->`, le corps anglais. Il garde les mêmes étapes, les mêmes identifiants et les mêmes repères que le français, ce que `check.py` vérifie. Le livre étant en anglais, les mots de Ridgeway y sont cités tels quels entre guillemets droits ; dans le corps français, ils sont soit cités en anglais, soit traduits par nous entre « ». Un document `NOM.md` a sa version dans `NOM.en.md`. Toute correction du français se reporte dans l'anglais.\n\n**§ 5 ter. Version allemande.** Sur le même modèle, chaque élément et chaque partie a sa version allemande : `titre_de`, `enonce_de` (ou `resume_de`), et, après une ligne `<!-- de -->` placée après le corps anglais, le corps allemand, avec les sections `## Beweis` (ou `## Argumentation`), `## Anmerkung`, `## Bei Ridgeway`, `## Wie Ridgeway sie darstellt`. Il garde les mêmes étapes, les mêmes identifiants et les mêmes repères (pages en « (S. 37) »), ce que `check.py` vérifie. Il traduit la reconstruction, sans recourir à une traduction publiée du livre ; les mots de Ridgeway y sont rendus brièvement par nous entre guillemets allemands („…“). Un document `NOM.md` a sa version dans `NOM.de.md`. Toute correction du français se reporte dans l'anglais et dans l'allemand.\n\n## 6. Droits et texte source\n\nLe livre est sous droits (© Russell Sage Foundation, 2019).\n\n- Le fichier du livre et le texte extrait vivent dans `source/`, **exclu de Git** (`.gitignore`). On ne les publie jamais, ni en tout ni en partie. `outils/check.py` signale une erreur si un fichier de `source/` est suivi par Git ou si une citation dépasse 300 caractères.\n- Les citations ne sont pas couvertes par les licences du dépôt (CC BY-SA 4.0 pour la reconstruction, GPL-3.0 pour le code) : voir `LICENSE` et `NOTICE.md`.\n- Les éléments **reformulent**. Une citation tient en une phrase au plus, entre guillemets, avec sa page, et seulement quand la formule compte. `outils/audit_citations.py` vérifie que le champ `citation` et les passages entre guillemets du corps anglais sont dans le livre mot pour mot.\n- **Repères.** L'EPUB conserve la pagination de l'édition papier ; `outils/extract_epub.py` l'extrait dans `source/texte/` (marques `[p37]`), avec un fichier par chapitre.\n\n## 7. Méthode de travail\n\n1. Le livre a été reconstruit d'un seul tenant le 13 novembre 2026, tous les éléments en `brouillon`.\n2. **Audit de fidélité** : chaque élément est relu contre les pages citées (reformulation exacte, page juste, liens explicites ou reconstruits bien marqués), puis passe à `verifie-texte`.\n3. **Relecture par l'auteur** : toute correction est consignée dans le journal d'`INDEX.md`.\n4. Après chaque modification : `python outils/check.py`, `python outils/audit_citations.py`, `python outils/build_index.py`, `python outils/build_explorer.py`.\n5. Les commits et les push se font seulement à la demande de l'auteur.\n\n## 8. Contrôles\n\n`python outils/check.py` vérifie : identifiants et types, pages présentes et concordantes avec le corps, longueur des citations, existence des dépendances, absence de cycle, concordance entre `depends_on` et la démonstration, arêtes `contre` vers des `R`, cohérence avec `INDEX.md`, exclusion de `source/`, complétude et concordance des versions anglaise et allemande (§ 5 bis et 5 ter). L'onglet « Audit » de l'explorateur affiche les mêmes contrôles.\n\n`python outils/audit_citations.py` vérifie les citations contre le livre ; `python outils/audit_pages.py` vérifie, page par page, que chaque citation (y compris les passages anglais du corps français), chaque auteur nommé dans une prémisse et chaque chiffre se trouvent aux pages citées (les deux demandent `source/texte/`).\n\nAucun de ces contrôles ne remplace l'audit de fidélité.\n\n## 9. Style\n\nLe style est celui des projets voisins : phrases courtes, vocabulaire précis, pas de jargon ajouté. Le texte est écrit en français, avec ses versions anglaise et allemande.\n", "body_en": "", "body_de": ""}, {"name": "INDEX.md", "kind": "projet", "body": "# INDEX\n\nTable de tous les éléments, par partie. Chaque ligne : identifiant, type, titre, pages, statut. Régénérée par `outils/build_index.py` à chaque ajout, modification ou retrait (AGENT.md § 4).\n\n**Texte de travail** : EPUB de l'édition Russell Sage Foundation (2019), avec la pagination de l'édition papier ; repères en pages, extraits par `outils/extract_epub.py` (AGENT.md § 6).\n\n## Plan\n\n| partie | titre | pages | éléments |\n|---|---|---|---|\n| P | Prémisses | — | 70 |\n| 1 | Qu'est-ce que le statut comme forme d'inégalité ? | p. 1–19 | 11 |\n| 2 | Les fondements d'un schème culturel du statut | p. 20–46 | 21 |\n| 3 | Pourquoi tenons-nous au statut ? | p. 47–67 | 10 |\n| 4 | Les croyances de statut et l'organisation de l'inégalité | p. 68–96 | 20 |\n| 5 | La microdynamique du statut | p. 97–123 | 21 |\n| 6 | Statut, différence et durabilité de l'inégalité | p. 124–149 | 17 |\n| 7 | Conclusion | p. 150–163 | 5 |\n\n## P. Prémisses\n\n| id | type | titre | pages | statut |\n|---|---|---|---|---|\n| A01 | auteur | Sewell : la dualité des structures | 3, 91 | brouillon |\n| A02 | auteur | Weber : le pouvoir et l'influence | 14 | brouillon |\n| A03 | auteur | La théorie rouillon |\n| E11 | étude | Anderson, Willer et coll. : on défère quand les autres savent | 41 | brouillon |\n| E12 | étude | Van Vugt : on quitte les groupes autocratiques | 43 | brouillon |\n| E13 | étude | Hahl et Zuckerman : le soupçon qui entoure le haut statut | 44, 79 | brouillon |\n| E14 | étude | Anderson, Hildreth et Howland : un motif fondamental | 50 | brouillon |\n| E15 | étude | On surveille le statut et on le perçoit juste | 50-51 | brouillon |\n| E16 | étude | Le manque de respect suscite colère et agression | 51-52 | brouillon |\n| E17 | étude | Menace de statut et choix politiques | 52-53, 146 | brouillon |\n| E18 | étude | Ce que rapporte le haut statut | 55 | brouillon |\n| E19 | étude | Les émotions du statut | 57 | brouillon |\n| E20 | étude | Le statut local prédit le bien-être | 58 | brouillon |\n| E21 | étude | Hays et Greer : le désir de statut ne se rassasie pas | 59-60 | brouillon |\n| E22 | étude | Le statut tourne vers les autres, le pouvoir vers soi | 60 | brouillon |\n| E23 | étude | Ridgeway et Nakagawa : le respect pour la déférence raisonnable | 62-63 | brouillon |\n| E24 | étude | Les hiérarchies interpersonnelles sont stables | 64-65, 156 | brouillon |\n| E25 | étude | Fiske : les stéréotypes de groupe contiennent des croyances de statut | 75-76, 78-79 | brouillon |\n| E26 | étude | Bianchi : les croyances de statut des programmeurs libres | 76, 92 | brouillon |\n| E27 | étude | Le savoir commun autorise la coordination risquée | 75 | brouillon |\n| E28 | étude | Les expériences de la construction du statut | 84-86 | brouillon |\n| E29 | étude | Hamilton : on infère spontanément les traits d'un groupe | 85 | brouillon |\n| E30 | étude | Wood, Eagly et Huber : division sexuelle du travail et ressources | 87-88 | brouillon |\n| E31 | étude | Une autorité légitime suffit à créer une croyance de statut | 89-90 | brouillon |\n| E32 | étude | Le statut des organisations | 90-92 | brouillon |\n| E33 | étude | Les expériences sur l'infér
