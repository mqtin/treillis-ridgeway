mbiguous; high-status members also steer away from ground where they would fail; but when they occur, they change expectations (p. 115).\n5. By E42, under clear evaluations, extraverts' status declines and that of underestimated members rises (p. 115-116). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D32", "E08", "E35", "E42", "T014", "T035"], "sections": ["Démonstration"], "demo_refs": ["D32", "E08", "E35", "E42", "T014", "T035"], "mentions": ["D32", "E08", "E35", "E42", "T014", "T035"], "corollaires": [], "mtime": 1794593161.3197863}, {"id": "T041", "file": "theses/T041.md", "type": "these", "partie": "5", "titre": "La légitimité vient de la validité, et les caractéristiques diffuses la renforcent", "enonce": "Toute hiérarchie conforme à l'ordre des attentes a une légitimité de base ; au-delà, elle est légitime dans la mesure où elle paraît socialement valide, traitée comme telle par les autres et conforme aux croyances sur qui doit être en haut. Le haut statut qui « a le physique de l'emploi » obtient plus d'obéissance ; une hiérarchie plus « méritocratique » est paradoxalement moins légitime.", "titre_en": "Legitimacy comes from validity, and diffuse characteristics strengthen it", "enonce_en": "Any hierarchy that matches the order of expectations has a baseline legitimacy; beyond that, it is legitimate to the extent that it seems socially valid, treated as such by others and consistent with beliefs about who should be on top. The high-status member who \"looks the part\" obtains more compliance; a more \"meritocratic\" hierarchy is paradoxically less legitimate.", "titre_de": "Legitimität entsteht aus Gültigkeit, und diffuse Merkmale verstärken sie", "enonce_de": "Jede Hierarchie, die der Ordnung der Erwartungen entspricht, hat eine grundlegende Legitimität; darüber hinaus ist sie in dem Maß legitim, in dem sie sozial gültig erscheint, von anderen so behandelt wird und mit Überzeugungen darüber übereinstimmt, wer oben stehen sollte. Wer „die Rolle verkörpert“, erhält mehr Gehorsam; eine „meritokratischere“ Hierarchie ist paradoxerweise weniger legitim.", "body_de": "## Beweis\n\n1. Nach D18 ermöglicht Legitimität Autorität; nach E43 zeigen ranghohe Mitglieder, solange sie fehlt, Großzügigkeit, die verschwinden kann, wenn sie sich festigt (S. 116).\n2. Eine Hierarchie, die der Ordnung der Erwartungen entspricht, achtet die grundlegende Norm und hat eine grundlegende Legitimität (S. 116-117).\n3. Wie der Konsens von T012 beruht die Legitimität weniger auf persönlicher Zustimmung als auf sozialer Gültigkeit: auf der Behandlung durch andere und auf der Übereinstimmung mit Überzeugungen über die Typen von Menschen, die oben stehen (S. 117).\n4. Hoher Status, der von diffusen Merkmalen gestützt wird, wirkt daher „richtig“; der distinguiert aussehende weiße Mann an der Spitze einer Arbeitsgruppe „verkörpert die Rolle“ (S. 117).\n5. Nach E44 erhält er bei gleichem Einfluss mehr Gehorsam als jemand, dessen Rang aus erwiesenem Fachwissen stammt: Die „meritokratische“ Hierarchie ist weniger legitim (S. 117-118). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D18", "E43", "E44", "T012"], "citation": "", "pages": [116, 117, 118], "depends_on": ["D18", "T012", "E43", "E44"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D18, la légitimité permet l'autorité ; par E43, tant qu'elle manque, le haut statut se montre généreux, et cette générosité peut disparaître quand elle s'affermit (p. 116).\n2. Une hiérarchie conforme à l'ordre des attentes respecte la norme fondamentale et a une légitimité de base (p. 116-117).\n3. Comme le consensus de T012, la légitimité repose moins sur l'adhésion personnelle que sur la validité sociale : le traitement par les autres, et l'accord avec les croyances sur les types de personnes en haut (p. 117).\n4. Le haut statut appuyé sur des caractéristiques diffuses paraît donc « juste » ; l'homme blanc distingué à la tête d'une commission a « le physique de l'emploi » (p. 117).\n5. Par E44, à influence égale, il obtient plus d'obéissance que celui qui doit son rang à une expertise prouvée : la hiérarchie « méritocratique » est moins légitime (p. 117-118). ∎", "body_en": "## Demonstration\n\n1. By D18, legitimacy enables authority; by E43, while it is lacking, high-status members show generosity, which may disappear as it firms up (p. 116).\n2. A hierarchy that matches the order of expectations respects the basic norm and has a baseline legitimacy (p. 116-117).\n3. Like the consensus of T012, legitimacy rests less on personal endorsement than on social validity: treatment by others, and agreement with beliefs about the types of people on top (p. 117).\n4. High status backed by diffuse characteristics therefore looks \"right\"; the distinguished-looking white man leading a task force \"looks the part\" (p. 117).\n5. By E44, at equal influence, he obtains more compliance than someone whose rank comes from proven expertise: the \"meritocratic\" hierarchy is less legitimate (p. 117-118). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D18", "E43", "E44", "T012"], "sections": ["Démonstration"], "demo_refs": ["D18", "E43", "E44", "T012"], "mentions": ["D18", "E43", "E44", "T012"], "corollaires": [], "mtime": 1794593161.320912}, {"id": "T042", "file": "theses/T042.md", "type": "these", "partie": "5", "titre": "Le rejet frappe qui conteste la hiérarchie des groupes", "enonce": "Parce que les croyances de statut légitiment certaines hiérarchies, elles suscitent une résistance contre ceux qui semblent les contester : les membres de groupes désavantagés qui s'affirment trop sont rejetés, non pour manque de douceur, mais parce qu'ils paraissent « trop dominants » pour leur rang.", "titre_en": "Backlash strikes those who challenge the ranking of groups", "enonce_en": "Because status beliefs legitimate some hierarchies, they evoke resistance against those who seem to challenge them: members of disadvantaged groups who are too assertive are rejected, not for lack of niceness, but because they appear \"too dominant\" for their rank.", "titre_de": "Die Abwehr trifft, wer die Rangordnung der Gruppen in Frage stellt", "enonce_de": "Weil Statusüberzeugungen bestimmte Hierarchien legitimieren, rufen sie Widerstand gegen jene hervor, die sie in Frage zu stellen scheinen: Mitglieder benachteiligter Gruppen, die sich zu sehr behaupten, werden abgelehnt, nicht aus Mangel an Freundlichkeit, sondern weil sie für ihren Rang „zu dominant“ erscheinen.", "body_de": "## Beweis\n\n1. Nach T041 legitimieren Überzeugungen darüber, wer oben stehen sollte, die Hierarchien; sie erzeugen daher Widerstand gegen das, was sie in Frage stellt (S. 118).\n2. Nach E45 ruft dominantes Verhalten einer weißen Frau oder eines afroamerikanischen Mannes Ablehnung und Widerstand hervor und verringert ihre Einstellungschancen (S. 118).\n3. Das Problem ist kein Mangel an Wärme, sondern eine Dominanz, die die Geschlechterhierarchie in Frage stellt; ausdrückliche Anweisungen, nicht ein selbstsicherer Blick, lösen die Abwehr aus (S. 118).\n4. Frauen of Color, weniger prototypisch, entgehen der Abwehr manchmal; doch diese Unsichtbarkeit begrenzt auch ihre Legitimität in hohen Positionen (S. 118-119).\n5. Rasse und Geschlecht erzeugen so Verzerrungen gegen die Legitimität der Bemühungen Benachteiligter, aufzusteigen oder Autorität auszuüben (S. 119). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["E45", "T041"], "citation": "", "pages": [118, 119], "depends_on": ["T041", "E45"], "contre": ["R10"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T041, les croyances sur qui doit être en haut légitiment les hiérarchies ; elles créent donc une résistance contre ce qui les conteste (p. 118).\n2. Par E45, la conduite dominante d'une femme blanche ou d'un homme afro-américain suscite antipathie et résistance, et réduit son employabilité (p. 118).\n3. Le problème n'est pas un manque de chaleur, mais une dominance qui conteste la hiérarchie de genre ; ce sont les ordres explicites, non le regard affirmé, qui déclenchent le rejet (p. 118).\n4. Les femmes de couleur, moins prototypiques, échappent parfois au rejet ; mais cette invisibilité limite aussi leur légitimité aux postes élevés (p. 118-119).\n5. Race et genre créent ainsi des biais contre la légitimité des efforts des désavantagés pour monter ou exercer l'autorité (p. 119). ∎", "body_en": "## Demonstration\n\n1. By T041, beliefs about who should be on top legitimate hierarchies; they therefore create resistance against what challenges them (p. 118).\n2. By E45, dominant behaviour from a white woman or an African American man evokes dislike and resistance, and reduces their hireability (p. 118).\n3. The problem is not a lack of warmth, but a dominance that challenges the gender hierarchy; explicit directives, not an assertive gaze, trigger the backlash (p. 118).\n4. Women of color, less prototypical, sometimes escape backlash; but this invisibility also limits their legitimacy in high positions (p. 118-119).\n5. Race and gender thus create biases against the legitimacy of disadvantaged people's efforts to rise or to exercise authority (p. 119). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E45", "T041"], "sections": ["Démonstration"], "demo_refs": ["E45", "T041"], "mentions": ["E45", "T041"], "corollaires": [], "mtime": 1794593161.320912}, {"id": "T043", "file": "theses/T043.md", "type": "these", "partie": "5", "titre": "Surmonter la généralisation du statut : possible, mais pas juste", "enonce": "On peut surmonter un désavantage diffus en changeant les attentes des *autres* : en apportant une information valide et pertinente (scores, formation, appui d'une autorité) et en joignant l'affirmation de sa compétence à une orientation coopérative manifeste. Ces techniques marchent, mais ne sont pas justes : il faut travailler plus, être plus aimable et prouver davantage pour être traité en égal.", "titre_en": "Overcoming status generalization: possible, but not fair", "enonce_en": "A diffuse disadvantage can be overcome by changing *others'* expectations: by bringing valid, relevant information (scores, training, an authority's backing) and by combining assertion of competence with a clear cooperative orientation. These techniques work, but they are not fair: one must work harder, be nicer and prove more to be treated as an equal.", "titre_de": "Die Statusgeneralisierung überwinden: möglich, aber nicht gerecht", "enonce_de": "Einen diffusen Nachteil kann man überwinden, indem man die Erwartungen der *anderen* ändert: durch gültige und einschlägige Informationen (Testergebnisse, Ausbildung, die Unterstützung einer Autorität) und durch die Verbindung von Selbstbehauptung der eigenen Kompetenz mit einer deutlich kooperativen Ausrichtung. Diese Techniken wirken, sind aber nicht gerecht: Man muss härter arbeiten, freundlicher sein und mehr beweisen, um als gleich behandelt zu werden.", "body_de": "## Beweis\n\n1. Nach T036 rahmt ein diffuser Nachteil auch die eigenen Erwartungen; man muss sie zunächst durch sichere Fertigkeiten stützen, doch das genügt nicht, da die Hierarchie auf den Erwartungen der anderen beruht, die sich sträuben (S. 119).\n2. Nach T041 erscheint ihnen die Veränderung unrechtmäßig; zwei Techniken zerstreuen diese Sorge (S. 119).\n3. Erstens: legitime, eindeutige und einschlägige Statusinformationen einbringen, wie öffentliche Testergebnisse oder belegte Ausbildung; behaupten genügt nicht, es braucht einen „Beweis“, manchmal die Unterstützung einer etablierten Autorität (S. 119-120).\n4. Zweitens: selbstsicheres Verhalten mit deutlichen Zeichen kooperativer Absicht verbinden; das gelingt nur, wenn man wirklich kompetent ist, und es ist ein Drahtseilakt (S. 120).\n5. Keine ist gerecht: Man muss härter arbeiten, freundlicher sein und mehr beweisen, um als gleich behandelt zu werden; doch sie öffnen den Zugang zu Macht und Einfluss (S. 120). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["T036", "T041"], "citation": "", "pages": [119, 120], "depends_on": ["T036", "T041"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T036, un désavantage diffus cadre aussi ses propres attentes ; il faut d'abord les étayer par des compétences sûres, mais cela ne suffit pas, car la hiérarchie tient aux attentes des autres, qui résistent (p. 119).\n2. Par T041, ce changement leur paraît illégitime ; deux techniques apaisent ce souci (p. 119).\n3. Première : introduire une information de statut légitime, sans ambiguïté et pertinente, comme des scores publics ou une formation attestée ; affirmer ne suffit pas, il faut une « preuve », parfois l'appui d'une autorité établie (p. 119-120).\n4. Seconde : allier une conduite affirmée à des signes clairs d'intention coopérative ; elle ne marche que si l'on est réellement compétent, et c'est une corde raide (p. 120).\n5. Aucune n'est juste : il faut travailler plus, être plus aimable et prouver davantage pour être traité en égal ; mais elles ouvrent l'accès au pouvoir et à l'influence (p. 120). ∎", "body_en": "## Demonstration\n\n1. By T036, a diffuse disadvantage also frames one's own expectations; they must first be shored up with solid skills, but that is not enough, since the hierarchy rests on others' expectations, which resist (p. 119).\n2. By T041, the change seems illegitimate to them; two techniques assuage this concern (p. 119).\n3. First: introducing legitimate, unambiguous and relevant status information, such as public test scores or documented training; claiming is not enough, \"proof\" is needed, sometimes an established authority's backing (p. 119-120).\n4. Second: combining assertive behaviour with clear signs of cooperative intent; it works only if one is really competent, and it is a tightrope (p. 120).\n5. Neither is fair: one must work harder, be nicer and prove more to be treated as an equal; but they open access to power and influence (p. 120). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["T036", "T041"], "sections": ["Démonstration"], "demo_refs": ["T036", "T041"], "mentions": ["T036", "T041"], "corollaires": [], "mtime": 1794593161.3219125}, {"id": "T044", "file": "theses/T044.md", "type": "these", "partie": "5", "titre": "Trois biais s'accumulent sur une vie", "enonce": "Les caractéristiques diffuses déclenchent dans les contextes décisifs trois biais : biais de statut, biais de légitimité, biais de préférence associative. Petits dans chaque situation, variables selon le contexte, ils s'accumulent sur les situations et les vies, et créent un avantage systématique d'accès à l'emploi, à la promotion, à la reconnaissance et au pouvoir.", "titre_en": "Three biases accumulate over a lifetime", "enonce_en": "Diffuse characteristics trigger three biases in consequential contexts: status bias, legitimacy bias, associational preference bias. Small in each situation, varying with context, they accumulate over situations and lifetimes, and create a systematic advantage in access to jobs, promotion, recognition and power.", "titre_de": "Drei Verzerrungen häufen sich über ein Leben an", "enonce_de": "Diffuse Merkmale lösen in folgenreichen Kontexten drei Verzerrungen aus: Statusverzerrung, Legitimitätsverzerrung, Verzerrung durch Assoziationspräferenz. In jeder Situation klein und je nach Kontext verschieden, häufen sie sich über Situationen und Lebensläufe an und schaffen einen systematischen Vorteil beim Zugang zu Arbeit, Beförderung, Anerkennung und Macht.", "body_de": "## Beweis\n\n1. Diffuse Merkmale entsprechen den Achsen der Ungleichheit; die mit ihnen verbundenen Überzeugungen prägen, wie jeder in einer folgenreichen Begegnung nach der anderen bewertet wird (S. 121).\n2. Nach D19 verzerren sie Erwartungen und Leistung (T037), Bewertung und Zuschreibung von Fähigkeit (T038) sowie die Gewährung von Einfluss (S. 121).\n3. Nach D20 lassen sie die Begünstigten oben legitimer erscheinen und sanktionieren Infragestellung, daher die Abwehr von T042 (S. 121-122).\n4. Nach D21 verzerren sie Verbindungen zugunsten der Netzwerke hochrangiger Gruppen, vor allem in instrumentellen Kontexten, die auch über den Zugang zu begehrten Gütern entscheiden (S. 122).\n5. In Stärke und sogar Richtung wechselnd, häufen sich diese Verzerrungen über Situationen und Lebensläufe an und schaffen einen systematischen Vorteil für hochrangige Gruppen (S. 123). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D19", "D20", "D21", "T037", "T038", "T042"], "citation": "", "pages": [121, 122, 123], "depends_on": ["D19", "D20", "D21", "T037", "T038", "T042"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Les caractéristiques diffuses correspondent aux axes de l'inégalité ; les croyances qui s'y attachent façonnent l'évaluation de chacun dans une rencontre décisive après l'autre (p. 121).\n2. Par D19, elles biaisent les attentes et la performance (T037), l'évaluation et l'attribution d'aptitude (T038), et l'octroi d'influence (p. 121).\n3. Par D20, elles font tenir les avantagés pour plus légitimes en haut et sanctionnent la contestation, d'où le rejet de T042 (p. 121-122).\n4. Par D21, elles biaisent les associations, au profit des réseaux des groupes de haut statut, surtout dans les contextes instrumentaux, qui sont aussi ceux qui commandent l'accès aux biens valorisés (p. 122).\n5. Variables en force et même en direction, ces biais s'accumulent sur les situations et les vies, et créent un avantage systématique pour les groupes de haut statut (p. 123). ∎", "body_en": "## Demonstration\n\n1. Diffuse characteristics correspond to the axes of inequality; the beliefs attached to them shape how each person is evaluated in one consequential encounter after another (p. 121).\n2. By D19, they bias expectations and performance (T037), evaluation and attribution of ability (T038), and the granting of influence (p. 121).\n3. By D20, they make the advantaged seem more legitimate at the top and sanction challenges, hence the backlash of T042 (p. 121-122).\n4. By D21, they bias associations, in favour of the networks of high-status groups, especially in instrumental contexts, which are also those that control access to valued outcomes (p. 122).\n5. Varying in strength and even direction, these biases accumulate over situations and lifetimes, and create a systematic advantage for high-status groups (p. 123). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D19", "D20", "D21", "T037", "T038", "T042"], "sections": ["Démonstration"], "demo_refs": ["D19", "D20", "D21", "T037", "T038", "T042"], "mentions": ["D19", "D20", "D21", "T037", "T038", "T042"], "corollaires": [], "mtime": 1794593161.3229144}, {"id": "T045", "file": "theses/T045.md", "type": "these", "partie": "6", "titre": "Le statut est une cause de l'inégalité durable, non un vernis", "enonce": "Pour durer, l'inégalité matérielle doit être consolidée avec une différence catégorielle (Tilly). Mais l'exploitation et l'accaparement disent les buts plus que les processus : ce sont les processus de statut qui consolident la différence avec l'inégalité, accomplissent au quotidien exploitation et accaparement, et stabilisent l'ensemble en le légitimant.", "titre_en": "Status is a cause of durable inequality, not a gloss", "enonce_en": "To last, material inequality must be consolidated with a categorical difference (Tilly). But exploitation and hoarding describe goals more than processes: it is status processes that consolidate difference with inequality, accomplish exploitation and hoarding day to day, and stabilise the whole by legitimating it.", "titre_de": "Status ist eine Ursache dauerhafter Ungleichheit, kein Firnis", "enonce_de": "Um Bestand zu haben, muss materielle Ungleichheit mit einem kategorialen Unterschied verfestigt werden (Tilly). Doch Ausbeutung und Horten beschreiben eher Ziele als Prozesse: Es sind Statusprozesse, die den Unterschied mit der Ungleichheit verfestigen, Ausbeutung und Horten im Alltag vollziehen und das Ganze stabilisieren, indem sie es legitimieren.", "body_de": "## Argumentation\n\n1. Nach A10 ist eine Ungleichheit, die nur auf individuellen Unterschieden beruht, instabil; um dauerhaft zu werden, muss die Kontrolle über Ressourcen mit „Typen“ von Menschen verbunden werden, und genau diese ordnen die Statusüberzeugungen (S. 126).\n2. Tillys These überzeugt, doch ihre Mechanismen, Ausbeutung und Horten, beschreiben eher die Ziele oder Wirkungen des Handelns herrschender Gruppen als die Prozesse, durch die es sich vollzieht (S. 126-127).\n3. Tilly sieht in der Ideologie einen nachträglichen Firnis; Ridgeway hält das für einen Irrtum (S. 127).\n4. Statusprozesse verfestigen durch in Beziehungen wirkende Überzeugungen über Gruppen den Unterschied mit der Ungleichheit, vollziehen Ausbeutung und Horten im Alltag und stabilisieren, indem sie legitimieren, die Ungleichheit und untergraben den Widerstand von unten (S. 127). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["A10"], "citation": "", "pages": [126, 127], "depends_on": ["A10"], "contre": ["R09"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Argumentation\n\n1. Par A10, une inégalité fondée sur les seules différences individuelles est instable ; pour devenir durable, le contrôle des ressources doit être associé à des « types » de personnes, ce que précisément les croyances de statut ordonnent (p. 126).\n2. La thèse de Tilly convainc, mais ses mécanismes, exploitation et accaparement, disent les buts ou les effets de l'action des dominants plutôt que les processus par lesquels ils s'accomplissent (p. 126-127).\n3. Tilly voit dans l'idéologie un vernis après coup ; Ridgeway y voit une erreur (p. 127).\n4. Les processus de statut, par des croyances sur les groupes agissant dans les relations, consolident la différence avec l'inégalité, accomplissent au quotidien exploitation et accaparement, et, en légitimant, stabilisent l'inégalité et affaiblissent la résistance d'en bas (p. 127). ∎", "body_en": "## Argument\n\n1. By A10, inequality based on individual differences alone is unstable; to become durable, control over resources must be associated with \"types\" of people, which is precisely what status beliefs rank (p. 126).\n2. Tilly's thesis is persuasive, but its mechanisms, exploitation and hoarding, describe the goals or effects of dominant group actions rather than the processes through which they are accomplished (p. 126-127).\n3. Tilly sees ideology as an after-the-fact gloss; Ridgeway sees this as a mistake (p. 127).\n4. Status processes, through beliefs about groups acting in relations, consolidate difference with inequality, accomplish exploitation and hoarding day to day, and, by legitimating, stabilise inequality and undercut resistance from below (p. 127). ∎", "sections_en": ["Argument"], "demo_refs_en": ["A10"], "sections": ["Argumentation"], "demo_refs": ["A10"], "mentions": ["A10"], "corollaires": [], "mtime": 1794593161.3229144}, {"id": "T046", "file": "theses/T046.md", "type": "these", "partie": "6", "titre": "Les croyances de statut consolident l'inégalité matérielle avec la différence", "enonce": "Quand une différence de groupe est corrélée à une inégalité de ressources, les rencontres entre groupes créent ou renforcent des croyances de statut partagées des deux côtés. Elles transforment l'avantage individuel en droit supérieur fondé sur l'identité de groupe : ce sont elles qui consolident la différence avec l'inégalité, et qui la stabilisent.", "titre_en": "Status beliefs consolidate material inequality with difference", "enonce_en": "When a group difference is correlated with inequality of resources, encounters between groups create or reinforce status beliefs shared on both sides. They transform individual advantage into a superior right based on group identity: it is they that consolidate difference with inequality, and stabilise it.", "titre_de": "Statusüberzeugungen verfestigen materielle Ungleichheit mit dem Unterschied", "enonce_de": "Ist ein Gruppenunterschied mit ungleichen Ressourcen verbunden, so erzeugen oder verstärken Begegnungen zwischen den Gruppen Statusüberzeugungen, die beide Seiten teilen. Sie verwandeln individuellen Vorteil in ein höheres Recht, das auf der Gruppenidentität beruht: Sie verfestigen den Unterschied mit der Ungleichheit und stabilisieren sie.", "body_de": "## Beweis\n\n1. Nach T045 stützt sich eine Gruppe, die ihre Kontrolle über Ressourcen (D30) stabilisieren will, auf eine Unterschiedsgrenze, eine vorgefundene (Geschlecht, Ethnie) oder eine geschaffene (Praktiken, Lebensstile); sie wirkt nur, indem sie Statusüberzeugungen schafft oder ausnutzt; das ist die Seite von T004, auf der Reichtum Status hervorbringt (S. 127).\n2. Nach T028 erzeugen Begegnungen schnell Überzeugungen, wenn ein Unterschied mit Ressourcen verbunden ist: Die reichere Gruppe erscheint in den Augen beider Gruppen würdiger und kompetenter, wenn auch weniger warm (S. 127-128).\n3. Dieser Prozess hat plausiblerweise beim Geschlecht (T029) gewirkt, bei der Rasse (Technik, Sklaverei) und bei der Klasse, die unmittelbar auf Ressourcen beruht (S. 128).\n4. Da die reichere Gruppe besser erscheint, scheint sie ihre Vorteile zu verdienen; *individueller* Vorteil wird zu einem Recht, das auf der *Gruppen*identität beruht (S. 128-129).\n5. Es sind also die Statusüberzeugungen, die den Unterschied mit der Ungleichheit verfestigen, und sie liefern das Mittel, sie zu stabilisieren (S. 129). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D30", "T004", "T028", "T029", "T045"], "citation": "“It is status beliefs, in other words, that really do the work of consolidating categorical group difference with inequality.”", "pages": [127, 128, 129], "depends_on": ["T045", "T028", "D30", "T004", "T029"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T045, un groupe qui veut stabiliser son contrôle des ressources (D30) s'appuie sur une frontière de différence, recrutée (genre, ethnie) ou créée (pratiques, styles de vie) ; elle n'agit qu'en créant ou en exploitant des croyances de statut ; c'est la face de T004 où la richesse produit le statut (p. 127).\n2. Par T028, quand une différence est corrélée aux ressources, les rencontres créent vite des croyances : le groupe riche paraît plus estimable et compétent, quoique moins chaleureux, aux yeux des deux groupes (p. 127-128).\n3. Ce processus a plausiblement joué pour le genre (T029), pour la race (techniques, esclavage) et pour la classe, fondée directement sur les ressources (p. 128).\n4. Le groupe riche paraissant meilleur, il semble mériter ses avantages ; l'avantage *individuel* devient droit fondé sur l'identité de *groupe* (p. 128-129).\n5. Ce sont donc les croyances de statut qui consolident la différence avec l'inégalité, et elles fournissent le moyen de la stabiliser (p. 129). ∎", "body_en": "## Demonstration\n\n1. By T045, a group seeking to stabilise its control of resources (D30) relies on a boundary of difference, recruited (gender, ethnicity) or created (practices, lifestyles); it works only by creating or exploiting status beliefs; this is the side of T004 where wealth produces status (p. 127).\n2. By T028, when a difference is correlated with resources, encounters quickly create beliefs: the richer group seems more worthy and competent, if less warm, in the eyes of both groups (p. 127-128).\n3. This process plausibly operated for gender (T029), for race (technology, slavery) and for class, based directly on resources (p. 128).\n4. Since the richer group seems better, it seems to deserve its advantages; *individual* advantage becomes a right based on *group* identity (p. 128-129).\n5. It is therefore status beliefs that consolidate difference with inequality, and they provide the means to stabilise it (p. 129). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D30", "T004", "T028", "T029", "T045"], "sections": ["Démonstration"], "demo_refs": ["D30", "T004", "T028", "T029", "T045"], "mentions": ["D30", "T004", "T028", "T029", "T045"], "corollaires": [], "mtime": 1794593161.3239512}, {"id": "T047", "file": "theses/T047.md", "type": "these", "partie": "6", "titre": "Le statut donne à l'inégalité de groupe le pouvoir de se reproduire", "enonce": "Quand une différence devient caractéristique de statut diffuse, elle donne à chacun, à ressources et pouvoir égaux, un avantage ou un désavantage propre dans l'accès aux ressources et au pouvoir futurs. Par les trois biais, accumulés et le plus souvent inaperçus, le statut est le moyen quotidien de l'exploitation et de l'accaparement, et donne à l'inégalité fondée sur la différence une capacité autonome de se reproduire.", "titre_en": "Status gives group inequality the power to reproduce itself", "enonce_en": "When a difference becomes a diffuse status characteristic, it gives each person, at equal resources and power, an advantage or disadvantage of its own in access to future resources and power. Through the three biases, accumulated and mostly unnoticed, status is the everyday means of exploitation and hoarding, and gives difference-based inequality an autonomous capacity to reproduce itself.", "titre_de": "Status verleiht der Gruppenungleichheit die Kraft, sich selbst zu reproduzieren", "enonce_de": "Wird ein Unterschied zum diffusen Statusmerkmal, so verschafft er jedem bei gleichen Ressourcen und gleicher Macht einen eigenen Vor- oder Nachteil beim Zugang zu künftigen Ressourcen und künftiger Macht. Durch die drei Verzerrungen, angehäuft und meist unbemerkt, ist Status das alltägliche Mittel von Ausbeutung und Horten und verleiht der auf Unterschieden beruhenden Ungleichheit eine eigenständige Fähigkeit, sich zu reproduzieren.", "body_de": "## Beweis\n\n1. Nach T046 verfestigt die Statusüberzeugung den Unterschied mit der Ungleichheit; ihre alltäglichen Wirkungen sind daher ein wesentliches Element der Dauerhaftigkeit dieser Ungleichheit (S. 129).\n2. Der zum diffusen Merkmal gewordene Unterschied verschafft bei gleichen Ressourcen und gleicher Macht einen eigenen Vorteil: Der Mann oder der Weiße, dem man etwas mehr Kompetenz unterstellt, erhält die größere Gehaltserhöhung oder die mächtigere Stelle (S. 129).\n3. Nach T044 lenken die drei Verzerrungen die Begünstigten zu Ressourcen und Machtpositionen; das ist zugleich eine Abschöpfung von Wert (Ausbeutung) und ein Horten von Chancen (S. 130-131).\n4. Jedes Mal klein, häufen sie sich an: Nach E46 häuft sich rassistische Diskriminierung über die Etappen eines Immobiliengeschäfts an und erweckt den Anschein des Verdienstes (S. 131).\n5. Diese impliziten Verzerrungen bleiben unter dem Radar; sie schließen das absichtliche Handeln der herrschenden Gruppen nicht aus, geben ihm aber eine breite und starke Grundlage (S. 131). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["E46", "T044", "T046"], "citation": "", "pages": [129, 130, 131], "depends_on": ["T046", "T044", "E46"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T046, la croyance de statut consolide la différence avec l'inégalité ; ses effets quotidiens sont donc un élément essentiel de la durabilité de cette inégalité (p. 129).\n2. La différence devenue caractéristique diffuse donne, à ressources et pouvoir égaux, un avantage propre : l'homme ou le Blanc présumé un peu plus compétent obtient la plus forte augmentation ou le poste plus puissant (p. 129).\n3. Par T044, les trois biais orientent les avantagés vers les ressources et les postes de pouvoir ; c'est à la fois une extraction de valeur (exploitation) et un accaparement des opportunités (p. 130-131).\n4. Petits à chaque fois, ils s'accumulent : par E46, la discrimination raciale s'accumule au fil des étapes d'une transaction immobilière, et donne l'apparence du mérite (p. 131).\n5. Ces biais implicites passent sous le radar ; ils n'excluent pas l'action intentionnelle des dominants, mais lui donnent une base diffuse et puissante (p. 131). ∎", "body_en": "## Demonstration\n\n1. By T046, the status belief consolidates difference with inequality; its everyday effects are therefore an essential element of that inequality's durability (p. 129).\n2. The difference, become a diffuse characteristic, gives at equal resources and power an advantage of its own: the man or white person presumed slightly more competent gets the bigger raise or the more powerful position (p. 129).\n3. By T044, the three biases steer the advantaged towards resources and positions of power; this is at once an extraction of value (exploitation) and the hoarding of opportunity (p. 130-131).\n4. Small each time, they accumulate: by E46, racial discrimination accumulates over the stages of a real estate transaction, and gives the appearance of merit (p. 131).\n5. These implicit biases fly below the radar; they do not exclude dominant groups' intentional action, but give it a diffuse and powerful base (p. 131). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E46", "T044", "T046"], "sections": ["Démonstration"], "demo_refs": ["E46", "T044", "T046"], "mentions": ["E46", "T044", "T046"], "corollaires": [], "mtime": 1794593161.3249612}, {"id": "T048", "file": "theses/T048.md", "type": "these", "partie": "6", "titre": "Le statut s'inscrit dans les pratiques des organisations", "enonce": "Les procédures et les pratiques des organisations naissent dans des comités, des équipes et des interactions répétées, où les croyances de statut décident de qui est entendu et de qui est absent ; même entre semblables, on y inscrit les pratiques distinctives de son groupe. Les présupposés sur la supériorité de certains groupes s'inscrivent ainsi dans la structure même du travail, et y persistent par inertie.", "titre_en": "Status is written into organisational practices", "enonce_en": "Organisational procedures and practices arise in committees, teams and repeated interactions, where status beliefs decide who is heard and who is absent; even among similar people, members write in the distinctive practices of their group. Assumptions about some groups' superiority are thus written into the very structure of work, and persist there through inertia.", "titre_de": "Status schreibt sich in die Praktiken der Organisationen ein", "enonce_de": "Die Verfahren und Praktiken von Organisationen entstehen in Ausschüssen, Teams und wiederholten Interaktionen, in denen Statusüberzeugungen darüber entscheiden, wer gehört wird und wer fehlt; selbst unter Gleichartigen schreibt man die kennzeichnenden Praktiken der eigenen Gruppe ein. Annahmen über die Überlegenheit bestimmter Gruppen werden so in die Struktur der Arbeit selbst eingeschrieben und bestehen dort aus Trägheit fort.", "body_de": "## Beweis\n\n1. Nach T047 reproduzieren die Überzeugungen Ungleichheit durch Interaktionen; sie wirken auch mittelbar, auf der Ebene der Organisationen (S. 131-132).\n2. Nach E47 sind Annahmen über herrschende Gruppen in Strukturen eingeschrieben, und diese Praktiken bestehen aus Trägheit fort (S. 132).\n3. Diese Strukturen entstehen in Ausschüssen und Teams oder durch wiederholte Interaktionen; die Statusüberzeugungen entscheiden dort, wessen Stimme gehört wird und wessen Interessen zählen, bis hin dazu, wer fehlt (S. 132-133).\n4. In gemischten Gruppen macht der Unterschied die Überzeugungen salient, wie beim Aufbau von Stellenbewertungssystemen (S. 133).\n5. In homogenen Gruppen lässt die geteilte Identität die Mitglieder auf die Praktiken ihres „Typs“ von Menschen zurückgreifen (Individualität an einer Eliteschule, eine aggressive „Männerkultur“ an einem männlichen Arbeitsplatz), die den Status der Gruppe in sich tragen (S. 133). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["E47", "T047"], "citation": "", "pages": [131, 132, 133], "depends_on": ["T047", "E47"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T047, les croyances reproduisent l'inégalité par les interactions ; elles agissent aussi indirectement, au niveau des organisations (p. 131-132).\n2. Par E47, des présupposés sur les groupes dominants sont inscrits dans les structures, et ces pratiques persistent par inertie (p. 132).\n3. Ces structures naissent dans des comités et des équipes, ou par interactions répétées ; les croyances de statut y décident des voix entendues et des intérêts pris en compte, y compris de qui est absent (p. 132-133).\n4. Dans les groupes mêlés, la différence rend les croyances saillantes, comme dans la construction des grilles de classification des emplois (p. 133).\n5. Dans les groupes homogènes, l'identité partagée fait puiser dans les pratiques de son « type » de personnes (l'individualité dans une école d'élite, la « culture de mecs » dans un atelier masculin), qui portent le statut du groupe (p. 133). ∎", "body_en": "## Demonstration\n\n1. By T047, beliefs reproduce inequality through interactions; they also act indirectly, at the level of organisations (p. 131-132).\n2. By E47, assumptions about dominant groups are embedded in structures, and these practices persist through inertia (p. 132).\n3. These structures arise in committees and teams, or through repeated interactions; status beliefs there decide whose voices are heard and whose interests count, including who is absent (p. 132-133).\n4. In mixed groups, the difference makes beliefs salient, as in the construction of job classification systems (p. 133).\n5. In homogeneous groups, shared identity leads members to draw on the practices of their \"type\" of people (individuality at an elite school, an aggressive \"guy culture\" in a male workplace), which carry the group's status (p. 133). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E47", "T047"], "sections": ["Démonstration"], "demo_refs": ["E47", "T047"], "mentions": ["E47", "T047"], "corollaires": [], "mtime": 1794593161.325556}, {"id": "T049", "file": "theses/T049.md", "type": "these", "partie": "6", "titre": "Les rencontres entre catégories sont les lieux décisifs", "enonce": "C'est dans les rencontres entre catégories que la différence de statut devient avantage matériel. Elles sont quotidiennes et intimes pour le genre, ce qui fait des processus de statut le premier moteur de l'inégalité entre hommes et femmes ; plus rares pour la race et la classe, elles ont lieu dans les institutions-portails, où elles décident de l'accès aux ressources.", "titre_en": "Cross-category encounters are the decisive sites", "enonce_en": "It is in cross-category encounters that status difference becomes material advantage. They are daily and intimate for gender, which makes status processes the main engine of inequality between men and women; rarer for race and class, they take place in gateway institutions, where they decide access to resources.", "titre_de": "Begegnungen zwischen Kategorien sind die entscheidenden Orte", "enonce_de": "In Begegnungen zwischen Kategorien wird der Statusunterschied zum materiellen Vorteil. Beim Geschlecht sind sie alltäglich und intim, was die Statusprozesse zum Hauptmotor der Ungleichheit zwischen Männern und Frauen macht; bei Rasse und Klasse seltener, finden sie in den Zugangsinstitutionen statt, wo sie über den Zugang zu Ressourcen entscheiden.", "body_de": "## Beweis\n\n1. Nach T047 übersetzen die Verzerrungen Unterschied in Vorteil; sie wirken vor allem in Begegnungen zwischen Kategorien, in denen die Merkmale salient sind (S. 133-134).\n2. Das Geschlecht ist einzigartig: alltägliche und intime Interaktionen in den Haushalten, zwei gleich große Gruppen, ein Unterschied, der alle anderen kreuzt; die Statusprozesse sind dort plausiblerweise der stärkste Faktor der Reproduktion von Ungleichheit, bis in die Familie (S. 134).\n3. Begegnungen zwischen Klassen sind selten und instrumentell, durch Wohnsegregation begrenzt; die Rasse liegt dazwischen, näher an der Klasse (S. 134-135).\n4. Doch nach D28 sind Begegnungen mit den Zugangsinstitutionen für Mitglieder niedrigrangiger Gruppen Begegnungen zwischen Kategorien; dort treffen sie auf Unterstellungen von Inkompetenz, gerade in den Augenblicken, die über ihren Zugang zu Ressourcen entscheiden (S. 135). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D28", "T047"], "citation": "", "pages": [133, 134, 135], "depends_on": ["T047", "D28"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T047, les biais traduisent la différence en avantage ; ils jouent surtout dans les rencontres entre catégories, où les caractéristiques sont saillantes (p. 133-134).\n2. Le genre est unique : interactions quotidiennes et intimes dans les ménages, deux groupes de taille égale, différence qui traverse toutes les autres ; les processus de statut y sont plausiblement le facteur le plus puissant de reproduction de l'inégalité, jusque dans la famille (p. 134).\n3. Les rencontres entre classes sont rares et instrumentales, la ségrégation résidentielle les limite ; la race se situe entre les deux, plus près de la classe (p. 134-135).\n4. Mais, par D28, les rencontres avec les institutions-portails sont, pour les membres des groupes de bas statut, des rencontres entre catégories ; ils y affrontent des présomptions d'incompétence aux moments qui décident de leur accès aux ressources (p. 135). ∎", "body_en": "## Demonstration\n\n1. By T047, the biases translate difference into advantage; they operate above all in cross-category encounters, where characteristics are salient (p. 133-134).\n2. Gender is unique: daily and intimate interactions in households, two groups of equal size, a difference that cuts across all others; status processes are plausibly the most powerful factor in reproducing inequality there, even within the family (p. 134).\n3. Cross-class encounters are rare and instrumental, limited by residential segregation; race lies in between, closer to class (p. 134-135).\n4. But, by D28, encounters with gateway institutions are cross-category for members of low-status groups; there they face presumptions of incompetence at the moments that decide their access to resources (p. 135). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D28", "T047"], "sections": ["Démonstration"], "demo_refs": ["D28", "T047"], "mentions": ["D28", "T047"], "corollaires": [], "mtime": 1794593161.325556}, {"id": "T050", "file": "theses/T050.md", "type": "these", "partie": "6", "titre": "Genre et race, essentialisés, sont toujours à l'œuvre", "enonce": "Le genre et la race sont culturellement essentialisés : une fois catégorisé, on le reste dans toute la relation, si bien que leurs processus de statut sont toujours en cours. Acquérir la culture du groupe dominant ne suffit donc pas à y être admis.", "titre_en": "Gender and race, essentialised, are always at work", "enonce_en": "Gender and race are culturally essentialised: once categorised, one remains so throughout the relationship, so that their status processes are always going on. Acquiring the culture of the dominant group is therefore not enough to be accepted in it.", "titre_de": "Geschlecht und Rasse, essentialisiert, wirken immer", "enonce_de": "Geschlecht und Rasse sind kulturell essentialisiert: Einmal kategorisiert, bleibt man es in der ganzen Beziehung, sodass ihre Statusprozesse ständig ablaufen. Die Kultur der herrschenden Gruppe zu erwerben genügt daher nicht, um in sie aufgenommen zu werden.", "body_de": "## Beweis\n\n1. Nach D29 reichen Unterschiede von unterstellten Wesenszügen bis zu erworbenen Kulturen; entscheidend ist die kulturelle Überzeugung dritter Ordnung (S. 136).\n2. Das Geschlecht, ein Unterschied innerhalb der Familie, ist am stärksten essentialisiert, an den Körper gebunden, auch wenn die Sichtbarkeit trans- und genderqueerer Identitäten andere Möglichkeiten eröffnet; erworbene Fertigkeiten kommen hinzu, ohne die Annahmen über männliche Handlungsmacht anzutasten (S. 137).\n3. Auch die Rasse ist essentialisiert; als Unterschied zwischen Gruppen wird sie zusätzlich von kulturellen Markierungen begleitet; nach E48 ordnen Kompetenz und kulturelle Fremdheit die rassischen Gruppen (S. 137-138).\n4. Ein essentialisierter Unterschied verlässt die Beziehung nie; nach T036 rahmt er daher stets die Erwartungen: Geschlecht und Rasse sind primäre Kategorien, und ihre Statusprozesse laufen ständig, was zur Dauerhaftigkeit der Ungleichheit beiträgt (S. 138-139).\n5. Man kann sich daher nicht einfügen, indem man die herrschende Kultur lernt: Nach E49 blieben Frauen ausgeschlossen, selbst wenn sie Sport pflegten; Afroamerikaner werden für Fehler härter beurteilt; asiatische Amerikaner werden weiter als „fremd“ behandelt (S. 139-140). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D29", "E48", "E49", "T036"], "citation": "", "pages": [136, 137, 138, 139, 140], "depends_on": ["D29", "E48", "E49", "T036"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D29, les différences vont d'essences supposées à des cultures acquises ; ce qui compte est la croyance culturelle de troisième ordre (p. 136).\n2. Le genre, différence interne à la famille, est le plus essentialisé, rattaché au corps, même si la visibilité des identités trans et queer ouvre d'autres possibilités ; des savoir-faire acquis s'y ajoutent, sans entamer les présupposés sur l'agentivité masculine (p. 137).\n3. La race est aussi essentialisée ; étant une différence entre groupes, elle s'accompagne en plus de marqueurs culturels ; par E48, compétence et étrangeté culturelle hiérarchisent les groupes raciaux (p. 137-138).\n4. Une différence essentialisée ne quitte jamais la relation ; par T036, elle cadre donc toujours les attentes : genre et race sont des catégories primaires, et leurs processus de statut toujours en cours, ce qui contribue à la durabilité de l'inégalité (p. 138-139).\n5. On ne peut donc s'intégrer en apprenant la culture dominante : par E49, les femmes restaient exclues même en cultivant le sport ; les Afro-Américains sont jugés plus sévèrement pour leurs erreurs ; les Asiatiques américains restent traités en « étrangers » (p. 139-140). ∎", "body_en": "## Demonstration\n\n1. By D29, differences range from supposed essences to acquired cultures; what matters is the third-order cultural belief (p. 136).\n2. Gender, a difference within the family, is the most essentialised, tied to the body, even if the visibility of trans and gender-queer identities opens other possibilities; acquired skills are added, without touching presumptions of male agency (p. 137).\n3. Race is also essentialised; being a difference between groups, it is further accompanied by cultural markers; by E48, competence and cultural foreignness rank racial groups (p. 137-138).\n4. An essentialised difference never leaves the relationship; by T036, it therefore always frames expectations: gender and race are primary categories, and their status processes always going on, which contributes to the durability of inequality (p. 138-139).\n5. One therefore cannot fit in by learning the dominant culture: by E49, women remained excluded even when cultivating sport; African Americans are judged more harshly for mistakes; Asian Americans are still treated as \"foreign\" (p. 139-140). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D29", "E48", "E49", "T036"], "sections": ["Démonstration"], "demo_refs": ["D29", "E48", "E49", "T036"], "mentions": ["D29", "E48", "E49", "T036"], "corollaires": [], "mtime": 1794593161.3265622}, {"id": "T051", "file": "theses/T051.md", "type": "these", "partie": "6", "titre": "La classe se maintient par un capital culturel exclusif", "enonce": "Les Américains croient la classe acquise plutôt qu'essentielle, et ses indices forment un ensemble flou, variable selon les contextes. La frontière de classe repose donc sur la possession par le haut d'un capital culturel exclusif, qui doit sans cesse changer à mesure que le bas en acquiert les formes anciennes.", "titre_en": "Class is maintained through exclusive cultural capital", "enonce_en": "Americans believe class to be achieved rather than essential, and its cues form a fuzzy set, varying across contexts. The class boundary therefore rests on the upper group's possession of exclusive cultural capital, which must keep changing as lower groups acquire its earlier forms.", "titre_de": "Klasse erhält sich durch exklusives kulturelles Kapital", "enonce_de": "Amerikaner halten Klasse eher für erworben als für wesenhaft, und ihre Hinweise bilden eine unscharfe Menge, die je nach Kontext schwankt. Die Klassengrenze beruht daher auf dem Besitz eines exklusiven kulturellen Kapitals durch die obere Gruppe, das sich ständig wandeln muss, während die unteren Gruppen seine früheren Formen erwerben.", "body_de": "## Beweis\n\n1. Nach E50 gilt Klasse als erworben und veränderlich, obwohl der Habitus sie auch in die Körper einschreibt, und ihre Hinweise bilden eine unscharfe Menge (S. 140).\n2. Nach D29, und anders als Geschlecht und Rasse (T050), bietet ein weniger essentialisierter Unterschied eine weniger feste Grenze; seine Wirkungen schwanken stärker je nach Kontext und verbinden sich mit denen von Rasse und Geschlecht (S. 140).\n3. Nach D31 hängt die Klassengrenze daher von *exklusivem* kulturellem Kapital ab; um elitär zu bleiben, muss es sich wandeln, während die unteren Gruppen es erwerben: so das Insiderwissen darüber, was die Zulassungsausschüsse von Elitehochschulen beeindruckt (S. 140). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D29", "D31", "E50", "T050"], "citation": "", "pages": [140], "depends_on": ["D29", "D31", "E50", "T050"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par E50, la classe passe pour acquise et changeante, quoique l'habitus l'inscrive aussi dans les corps, et ses indices forment un ensemble flou (p. 140).\n2. Par D29, et à la différence du genre et de la race (T050), une différence moins essentialisée offre une frontière moins ferme ; ses effets varient davantage d'un contexte à l'autre et se combinent à ceux de la race et du genre (p. 140).\n3. Par D31, la frontière de classe tient donc à un capital culturel *exclusif* ; pour rester élitaire, il doit changer à mesure qu'on l'acquiert en bas : ainsi le savoir d'initié sur ce qu'attendent les jurys d'admission des universités d'élite (p. 140). ∎", "body_en": "## Demonstration\n\n1. By E50, class passes for achieved and changeable, although habitus also writes it on bodies, and its cues form a fuzzy set (p. 140).\n2. By D29, and unlike gender and race (T050), a less essentialised difference offers a less firm boundary; its effects vary more across contexts and interact with those of race and gender (p. 140).\n3. By D31, the class boundary therefore depends on *exclusive* cultural capital; to remain elite, it must change as lower groups acquire it: thus the inside knowledge of what impresses admissions committees at elite colleges (p. 140). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D29", "D31", "E50", "T050"], "sections": ["Démonstration"], "demo_refs": ["D29", "D31", "E50", "T050"], "mentions": ["D29", "D31", "E50", "T050"], "corollaires": [], "mtime": 1794593161.3265622}, {"id": "T052", "file": "theses/T052.md", "type": "these", "partie": "6", "titre": "Croyances et inégalité se soutiennent ; on les change en sapant leur consensus", "enonce": "L'inégalité matérielle fournit aux croyances de statut les preuves dont elles ont besoin pour durer : la relation est réciproque. Les croyances changent quand leur apparence de consensus s'érode : des changements matériels et des mouvements sociaux multiplient les rencontres qui les démentent, jusqu'à une ignorance plurielle fragile. Souvent, elles ne changent que lentement et partiellement.", "titre_en": "Beliefs and inequality sustain each other; they change by eroding consensus", "enonce_en": "Material inequality supplies status beliefs with the evidence they need to last: the relationship is reciprocal. Beliefs change when their appearance of consensus erodes: material changes and social movements multiply disconfirming encounters, up to a fragile pluralistic ignorance. Often they change only slowly and partially.", "titre_de": "Überzeugungen und Ungleichheit stützen einander; sie ändern sich, wenn der Konsens schwindet", "enonce_de": "Materielle Ungleichheit liefert den Statusüberzeugungen die Belege, die sie zum Fortbestehen brauchen: Die Beziehung ist wechselseitig. Überzeugungen ändern sich, wenn ihr Anschein von Konsens schwindet: Materielle Veränderungen und soziale Bewegungen vervielfachen die widerlegenden Begegnungen bis zu einer fragilen pluralistischen Ignoranz. Oft ändern sie sich nur langsam und teilweise.", "body_de": "## Beweis\n\n1. Nach T046 liefert die Verfestigung den alltäglichen Beleg, dass bestimmte Typen von Menschen reicher und „besser“ sind (S. 141).\n2. Nach T027 bestätigen sich die Überzeugungen schon durch die Hierarchien, die sie hervorbringen; doch ohne *materielle* Belege halten sie sich schlecht: „Wenn du so klug bist, warum bist du nicht reich?“; die Beziehung ist daher wechselseitig (S. 141-142).\n3. Ungleichheit lässt sich also nicht dauerhaft ändern, ohne die Überzeugungen zu ändern; und diese haben sich geändert: Iren und Italiener, einst von niedrigem Status, sind es nicht mehr (S. 142).\n4. Nach D10 wirkt eine Überzeugung, solange sie von „den meisten Leuten“ geteilt scheint; wer nach ihr handelt, erweckt diesen Anschein, sodass die Überzeugungen hinter den materiellen Veränderungen herhinken (S. 142).\n5. Wirtschaftliche oder technische Veränderungen und soziale Bewegungen vervielfachen die Begegnungen, die die Überzeugung widerlegen; die persönliche Zustimmung schwindet bis zu einer fragilen pluralistischen Ignoranz, die zusammenbrechen kann (S. 142-143).\n6. Häufiger ist der Wandel bescheiden: Nach E51 haben sich die Geschlechterüberzeugungen wenig bewegt, mangels Veränderung bei den familiären Verpflichtungen (S. 143). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D10", "E51", "T027", "T046"], "citation": "", "pages": [141, 142, 143], "depends_on": ["T046", "D10", "E51", "T027"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T046, la consolidation offre la preuve quotidienne que certains types de personnes sont plus riches et « meilleurs » (p. 141).\n2. Par T027, les croyances se valident déjà par les hiérarchies qu'elles produisent ; mais elles durent mal sans preuve *matérielle* : « si tu es si malin, pourquoi n'es-tu pas riche ? » ; la relation est donc réciproque (p. 141-142).\n3. On ne change donc pas durablement l'inégalité sans changer les croyances ; or elles ont changé : les Irlandais et les Italiens, jadis de bas statut, ne le sont plus (p. 142).\n4. Par D10, une croyance agit tant qu'elle paraît partagée par « la plupart » ; ceux qui agissent selon elle en donnent l'apparence, si bien que les croyances retardent sur les changements matériels (p. 142).\n5. Changements économiques ou techniques et mouvements sociaux multiplient les rencontres qui démentent la croyance ; l'adhésion personnelle recule, jusqu'à une ignorance plurielle fragile qui peut s'effondrer (p. 142-143).\n6. Plus souvent, le changement est modeste : par E51, les croyances de genre ont peu bougé, faute de changement dans les charges familiales (p. 143). ∎", "body_en": "## Demonstration\n\n1. By T046, consolidation offers everyday evidence that some types of people are richer and \"better\" (p. 141).\n2. By T027, beliefs already validate themselves through the hierarchies they produce; but they last poorly without *material* evidence: \"if you are so smart, why aren't you rich?\"; the relationship is therefore reciprocal (p. 141-142).\n3. Inequality therefore cannot be durably changed without changing beliefs; and beliefs have changed: the Irish and Italians, once low status, no longer are (p. 142).\n4. By D10, a belief acts as long as it seems held by \"most people\"; those who act on it give that appearance, so that beliefs lag behind material changes (p. 142).\n5. Economic or technological changes and social movements multiply encounters that disconfirm the belief; personal endorsement declines, up to a fragile pluralistic ignorance that may collapse (p. 142-143).\n6. More often, change is modest: by E51, gender beliefs have moved little, for want of change in family responsibilities (p. 143). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D10", "E51", "T027", "T046"], "sections": ["Démonstration"], "demo_refs": ["D10", "E51", "T027", "T046"], "mentions": ["D10", "E51", "T027", "T046"], "corollaires": [], "mtime": 1794593161.3275611}, {"id": "T053", "file": "theses/T053.md", "type": "these", "partie": "6", "titre": "Les croyances de statut légitiment l'inégalité par le mérite", "enonce": "Les rencontres quotidiennes où les membres des groupes de haut statut paraissent plus compétents donnent à tous la leçon de leur supériorité : ils semblent avoir mérité leurs avantages. Les croyances de statut sont l'idéologie légitimante qui stabilise l'inégalité ; même ceux qu'elles désavantagent ont intérêt à les accepter pour se coordonner, et elles émoussent leur résistance.", "titre_en": "Status beliefs legitimate inequality through merit", "enonce_en": "Everyday encounters in which members of high-status groups seem more competent teach everyone the lesson of their superiority: they seem to have earned their advantages. Status beliefs are the legitimating ideology that stabilises inequality; even those they disadvantage have an interest in accepting them in order to coordinate, and they blunt their resistance.", "titre_de": "Statusüberzeugungen legitimieren Ungleichheit durch Verdienst", "enonce_de": "Alltägliche Begegnungen, in denen Mitglieder hochrangiger Gruppen kompetenter erscheinen, lehren alle ihre Überlegenheit: Sie scheinen ihre Vorteile verdient zu haben. Statusüberzeugungen sind die legitimierende Ideologie, die Ungleichheit stabilisiert; selbst die von ihnen Benachteiligten haben ein Interesse, sie anzunehmen, um sich abzustimmen, und sie schwächen ihren Widerstand.", "body_de": "## Beweis\n\n1. Wiederholte Begegnungen, in denen Männer, Weiße und Angehörige der Mittel- oder Oberschicht kompetenter erscheinen, lehren alle ihre Überlegenheit, daher die Vorstellung, sie hätten ihre Vorteile verdient (S. 143).\n2. Nach A12 würde die Verfestigung von T046 ohne legitimierende Ideologie den Kampf auf die Gruppenebene verlagern; die Statusüberzeugungen spielen diese Rolle, rechtfertigen das Handeln der Herrschenden und schwächen vor allem den Widerstand der Beherrschten (S. 143-144).\n3. Nach E52 teilen benachteiligte Gruppen dieselben Überzeugungen dritter Ordnung, auch wenn sie ihnen weniger zustimmen; in einer Welt, in der die meisten sie teilen, haben sie ein trübes, aber unvermeidliches Interesse, sie anzunehmen, um sich abzustimmen (S. 144).\n4. Nach T020 besänftigen die Ausgleiche, die niedrigem Status geboten werden, etwa die ihm zugeschriebene Wärme, den Widerstand zusätzlich (S. 144).\n5. Manchmal leistet man Widerstand, vom frostigen Kellner bis zu Bewegungen wie Black Lives Matter; doch meist „spielt man mit, um Ruhe zu haben“, was Ungewissheit verringert; nach A16 macht es die Struktur verständlich, die Überzeugungen anzunehmen (S. 144-145). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["A12", "A16", "E52", "T020", "T046"], "citation": "", "pages": [143, 144, 145], "depends_on": ["A12", "E52", "A16", "T020", "T046"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Les rencontres répétées où hommes, Blancs et classes moyennes ou supérieures paraissent plus compétents donnent à tous la leçon de leur supériorité, d'où l'idée qu'ils ont mérité leurs avantages (p. 143).\n2. Par A12, sans idéologie légitimante la consolidation de T046 déplacerait la lutte au niveau des groupes ; les croyances de statut jouent ce rôle, justifient l'action des dominants et surtout émoussent la résistance des dominés (p. 143-144).\n3. Par E52, les groupes défavorisés tiennent les mêmes croyances de troisième ordre, même s'ils les endossent moins ; dans un monde où la plupart les tiennent, ils ont un intérêt, morne mais inévitable, à les accepter pour se coordonner (p. 144).\n4. Par T020, les compensations offertes au bas statut, comme la chaleur qu'on lui prête, apaisent encore la résistance (p. 144).\n5. On résiste parfois, du serveur glacial aux mouvements comme Black Lives Matter ; mais le plus souvent on « suit pour avancer », ce qui réduit l'incertitude ; par A16, accepter les croyances rend la structure intelligible (p. 144-145). ∎", "body_en": "## Demonstration\n\n1. Repeated encounters in which men, whites and middle- or upper-class people seem more competent teach everyone the lesson of their superiority, hence the idea that they have earned their advantages (p. 143).\n2. By A12, without a legitimating ideology the consolidation of T046 would move the scramble to the group level; status beliefs play that role, justify the actions of the dominant and above all blunt the resistance of the dominated (p. 143-144).\n3. By E52, disadvantaged groups hold the same third-order beliefs, even if they endorse them less; in a world where most hold them, they have an interest, dreary but unavoidable, in accepting them in order to coordinate (p. 144).\n4. By T020, the compensations offered to low status, such as the warmth attributed to it, further placate resistance (p. 144).\n5. People sometimes resist, from the frosty waiter to movements like Black Lives Matter; but most often they find themselves \"going along to get along\", which reduces uncertainty; by A16, accepting the beliefs makes the structure intelligible (p. 144-145). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A12", "A16", "E52", "T020", "T046"], "sections": ["Démonstration"], "demo_refs": ["A12", "A16", "E52", "T020", "T046"], "mentions": ["A12", "A16", "E52", "T020", "T046"], "corollaires": [], "mtime": 1794593161.3275611}, {"id": "T054", "file": "theses/T054.md", "type": "these", "partie": "6", "titre": "Le sentiment de position de groupe défend la hiérarchie et divise le bas", "enonce": "Les croyances de statut donnent à chacun un sentiment de la position de son groupe, vécue comme personnelle. Les groupes intermédiaires, avantagés sur un plan et désavantagés sur un autre, défendent avec force leur rang menacé ; les groupes de bas statut, tentés par la dignité offerte à la déférence, sont détournés de l'action collective. Ainsi le statut protège la structure de l'inégalité.", "titre_en": "The sense of group position defends the hierarchy and divides those below", "enonce_en": "Status beliefs give each person a sense of their group's position, felt as personal. Intermediate groups, advantaged on one dimension and disadvantaged on another, strongly defend their threatened rank; low-status groups, tempted by the dignity offered for deference, are diverted from collective action. Thus status protects the structure of inequality.", "titre_de": "Das Gefühl der Gruppenposition verteidigt die Hierarchie und spaltet die Unteren", "enonce_de": "Statusüberzeugungen geben jedem ein Gefühl für die Position seiner Gruppe, das als persönlich erlebt wird. Mittlere Gruppen, auf einer Ebene begünstigt und auf einer anderen benachteiligt, verteidigen ihren bedrohten Rang heftig; niedrigrangige Gruppen, verlockt von der für Ehrerbietung gebotenen Würde, werden vom gemeinsamen Handeln abgelenkt. So schützt der Status die Struktur der Ungleichheit.", "body_de": "## Beweis\n\n1. Nach A11 erzeugen weithin akzeptierte Überzeugungen ein „Gefühl der Gruppenposition“, das Selbstwertgefühl und anerkannte Würde berührt; man erlebt die Behandlung seiner Gruppe als persönlich (S. 145).\n2. Wie bei den Bedrohungen von T017 lässt dieses Gefühl auf Veränderungen reagieren, die den Vorteil der Gruppe bedrohen: Nach E53 sorgen sich Weiße wegen Diversitätspolitik; nach E17 nährt die Bedrohung die Ablehnung von Sozialleistungen und den Rechtspopulismus (S. 145-146).\n3. Nicht die höchsten Gruppen reagieren so, geschützt durch vielfache Vorteile und die Kontrolle der Institutionen, sondern die auf einer Ebene Begünstigten und auf einer anderen nicht, wie Hochschilds Bewohner Louisianas (S. 146-147).\n4. Diese Verteidigung ist die kollektive Wirkung derselben Reaktion, die Legitimitätsverzerrung und Abwehr hervorbringt (T042). Niedrigrangige Gruppen wissen, wo sie stehen; doch die zugeschriebene Wärme und die für Ehrerbietung gebotene Würde (T020) verlocken sie und untergraben das gemeinsame Handeln, was die Legitimierung von T053 fortsetzt: Man „spielt mit, um voranzukommen“ (S. 147).\n5. Status motiviert daher die mittleren und oberen Gruppen zur Verteidigung der Struktur und schwächt die Motive für Veränderung unten (S. 147). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["A11", "E17", "E53", "T017", "T020", "T042", "T053"], "citation": "", "pages": [145, 146, 147], "depends_on": ["A11", "E53", "E17", "T053", "T017", "T042", "T020"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par A11, les croyances largement acceptées créent un « sentiment de position de groupe », qui affecte l'estime de soi et la dignité reconnue ; on vit comme personnel le traitement de son groupe (p. 145).\n2. Comme pour les menaces de T017, ce sentiment fait réagir aux changements qui menacent l'avantage du groupe : par E53, des Blancs s'inquiètent devant les politiques de diversité ; par E17, la menace nourrit l'opposition aux aides sociales et le populisme de droite (p. 145-146).\n3. Ce ne sont pas les groupes les plus hauts qui réagissent ainsi, protégés par de multiples avantages et par le contrôle des institutions, mais ceux qui sont avantagés sur un plan et non sur un autre, comme les Louisianais de Hochschild (p. 146-147).\n4. Cette défense est l'effet collectif de la même réaction qui produit le biais de légitimité et le rejet (T042). Les groupes de bas statut savent où ils se tiennent ; mais la chaleur prêtée et la dignité offerte à la déférence (T020) les tentent et sapent l'action collective, ce qui prolonge la légitimation de T053 : on « suit pour avancer » (p. 147).\n5. Le statut motive donc la défense de la structure par les groupes moyens et hauts et dilue les motifs de changement en bas (p. 147). ∎", "body_en": "## Demonstration\n\n1. By A11, widely accepted beliefs create a \"sense of group position\", which affects self-esteem and acknowledged dignity; people experience their group's treatment as personal (p. 145).\n2. As with the threats of T017, this sense makes people react to changes that threaten their group's advantage: by E53, whites worry about diversity policies; by E17, the threat fuels opposition to welfare and right-wing populism (p. 145-146).\n3. It is not the highest groups that react this way, protected by multiple advantages and control of institutions, but those advantaged on one dimension and not another, like Hochschild's Louisianans (p. 146-147).\n4. This defence is the collective effect of the same response that produces legitimacy bias and backlash (T042). Low-status groups know where they stand; but the warmth attributed and the dignity offered for deference (T020) tempt them and undercut collective action, which extends the legitimation of T053: they \"go along in order to get ahead\" (p. 147).\n5. Status therefore motivates defence of the structure by middle and higher groups and dilutes the motives for change below (p. 147). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A11", "E17", "E53", "T017", "T020", "T042", "T053"], "sections": ["Démonstration"], "demo_refs": ["A11", "E17", "E53", "T017", "T020", "T042", "T053"], "mentions": ["A11", "E17", "E53", "T017", "T020", "T042", "T053"], "corollaires": [], "mtime": 1794593161.3275611}, {"id": "T055", "file": "theses/T055.md", "type": "these", "partie": "6", "titre": "Le déni du statut", "enonce": "Les croyances de statut créent un avantage de groupe tout en le logeant dans les attributs personnels des membres. L'idéologie américaine de l'accomplissement rend donc à la fois très attentif aux signes de statut et rétif à reconnaître ses effets : les reconnaître, ce serait admettre que le système n'est pas juste. Le statut joue ainsi un rôle puissant et invisible.", "titre_en": "The denial of status", "enonce_en": "Status beliefs create a group advantage while locating it in members' personal attributes. The American ideology of achievement therefore makes people both highly attentive to signs of status and resistant to acknowledging its effects: acknowledging them would mean admitting the system is not fair. Status thus plays a powerful and invisible role.", "titre_de": "Die Verleugnung des Status", "enonce_de": "Statusüberzeugungen schaffen einen Gruppenvorteil und verorten ihn zugleich in den persönlichen Eigenschaften der Mitglieder. Die amerikanische Leistungsideologie macht daher zugleich sehr aufmerksam für Statuszeichen und abgeneigt, seine Wirkungen anzuerkennen: Sie anzuerkennen hieße zuzugeben, dass das System nicht gerecht ist. Status spielt so eine mächtige und unsichtbare Rolle.", "body_de": "## Beweis\n\n1. Nach T053 legitimieren die Überzeugungen durch Verdienst; doch sie verorten den Unterschied nicht in der Gruppe, sondern in den persönlichen Eigenschaften ihrer Mitglieder, und verdecken so den Gruppenvorteil, den sie schaffen (S. 147).\n2. Die Ideologie der individuellen Leistung ist in den Vereinigten Staaten grundlegend; sie macht aufmerksam für Zeichen der Fähigkeit, die die der Statusüberzeugungen sind, und lässt selbst eine benachteiligende Überzeugung annehmen, die das Scheitern in den eigenen Fähigkeiten verortet (S. 147-148).\n3. Verzerrungen anzuerkennen heißt, das System als ungerecht zu sehen: für die Ranghohen, dass man es nicht verdient hat; für die Rangniedrigen, dass man diskriminiert wurde; nach E54 ist beides unangenehm (S. 148-149).\n4. Daher das Paradox: Man achtet auf Statuszeichen und weigert sich, den Status anzuerkennen; grundlegend für die Ungleichheit, bleibt er weitgehend unsichtbar (S. 149). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["E54", "T053"], "citation": "", "pages": [147, 148, 149], "depends_on": ["T053", "E54"], "contre": ["R12"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T053, les croyances légitiment par le mérite ; or elles logent la différence non dans le groupe mais dans les attributs personnels de ses membres, et masquent ainsi l'avantage de groupe qu'elles créent (p. 147).\n2. L'idéologie de l'accomplissement individuel est fondatrice aux États-Unis ; elle rend attentif aux signes de capacité, qui sont ceux des croyances de statut, et fait accepter même une croyance désavantageuse, qui situe l'échec dans ses propres capacités (p. 147-148).\n3. Reconnaître les biais, c'est voir le système injuste : pour le haut statut, qu'on n'a pas mérité ; pour le bas, qu'on a été discriminé ; par E54, les deux sont désagréables (p. 148-149).\n4. D'où le paradoxe : on est attentif aux signes de statut et l'on refuse de le reconnaître ; fondamental à l'inégalité, le statut reste largement invisible (p. 149). ∎", "body_en": "## Demonstration\n\n1. By T053, beliefs legitimate through merit; yet they locate difference not in the group but in its members' personal attributes, and so mask the group advantage they create (p. 147).\n2. The ideology of individual achievement is foundational in the United States; it makes people attentive to signs of capacity, which are those of status beliefs, and leads them to accept even a disadvantaging belief, which locates failure in their own capacities (p. 147-148).\n3. Recognising biases means seeing the system as unfair: for the high-status, that one did not earn it; for the low-status, that one was discriminated against; by E54, both are unpleasant (p. 148-149).\n4. Hence the paradox: people are attentive to signs of status and refuse to acknowledge it; fundamental to inequality, status remains largely invisible (p. 149). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E54", "T053"], "sections": ["Démonstration"], "demo_refs": ["E54", "T053"], "mentions": ["E54", "T053"], "corollaires": [], "mtime": 1794593161.3275611}, {"id": "T056", "file": "theses/T056.md", "type": "these", "partie": "7", "titre": "Le statut est un schème culturel normatif", "enonce": "Sans nier les réponses évoluées à la dominance et au prestige, le statut est une construction culturelle qui ne s'y réduit pas, presque aussi fondamentale que le langage. Le schème est inventé pour organiser la poursuite d'un but tout en contrôlant le dominateur. Qu'il soit normatif se voit à son application : on sanctionne ses violations et l'on récompense la déférence attendue, même envers un autre.", "titre_en": "Status is a normative cultural schema", "enonce_en": "Without denying evolved responses to dominance and prestige, status is a cultural construction not reducible to them, almost as basic as language. The schema is invented to organise goal pursuit while controlling the dominator. That it is normative shows in its enforcement: violations are sanctioned and expected deference is rewarded, even towards another.", "titre_de": "Status ist ein normatives kulturelles Schema", "enonce_de": "Ohne evolvierte Reaktionen auf Dominanz und Prestige zu leugnen, ist Status eine kulturelle Konstruktion, die sich nicht auf sie zurückführen lässt, fast so grundlegend wie die Sprache. Das Schema wird erfunden, um das Verfolgen eines Ziels zu organisieren und zugleich den Dominierenden zu kontrollieren. Dass es normativ ist, zeigt seine Durchsetzung: Verstöße werden sanktioniert, und erwartete Ehrerbietung wird belohnt, auch gegenüber einem anderen.", "body_de": "## Argumentation\n\n1. Eine kulturelle Theorie des Status muss sich mit evolutionären Argumenten auseinandersetzen; sie muss evolvierte Reaktionen nicht leugnen, doch der auf ihnen aufbauende Status ist eine kulturelle Konstruktion, wie die Sprache (S. 152-153).\n2. Nach T007 eröffnet die Ungewissheit der Hierarchiebildung ab drei Personen der Gruppe die Möglichkeit, die Ehrerbietung normativ zu kontrollieren; das Motiv ist das geteilte Interesse, das Ziel zu organisieren und den Dominierenden zu kontrollieren, der nichts beiträgt (S. 153).\n3. Das Schema kontrolliert diesen Dominierenden mit Zuckerbrot (Wertschätzung und Einfluss für die, die beitragen, T013) und mit der Peitsche von T009 (Ablehnung und gemeinsamer Widerstand) (S. 153).\n4. Status, ein von einer Gemeinschaft verliehener Rang der Wertschätzung, ist an sich normativ; das zeigt sich an der Durchsetzung der Norm: Verstöße werden spontan bestraft, und nach E23 wird erwartete Ehrerbietung belohnt, gegenüber einem anderen wie gegenüber einem selbst (S. 153).\n5. Für die Überzeugungen zeigen nach A05 Jahrzehnte der Forschung, dass der Rang von Überzeugungen über Identitäten abhängt; und diese Überzeugungen sind nach T025 gemeinsames Wissen über alle Gruppen der Ungleichheit (S. 154). ∎", "sections_de": ["Argumentation"], "demo_refs_de": ["A05", "E23", "T007", "T009", "T013", "T025"], "citation": "", "pages": [152, 153, 154], "depends_on": ["T007", "T009", "T025", "E23", "A05", "T013"], "contre": ["R03", "R04"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Argumentation\n\n1. Une théorie culturelle du statut doit affronter les thèses évolutionnistes ; elle n'a pas à nier les réponses évoluées, mais le statut, posé sur elles, est une construction culturelle, comme le langage (p. 152-153).\n2. Par T007, l'incertitude de la formation à trois ou plus ouvre au groupe la possibilité de prendre le contrôle normatif de la déférence ; le motif en est l'intérêt partagé à organiser le but et à contrôler le dominateur qui ne contribue pas (p. 153).\n3. Le schème contrôle ce dominateur par la carotte (estime et influence pour qui contribue, T013) et par le bâton de T009 (antipathie et résistance collective) (p. 153).\n4. Le statut, rang d'estime accordé par une communauté, est en soi normatif ; on le voit à l'application de la norme : ses violations sont punies spontanément, et, par E23, la déférence attendue est récompensée, envers un autre comme envers soi (p. 153).\n5. Pour les croyances, par A05, des décennies de recherche montrent que le rang dépend des croyances sur les identités ; et ces croyances, par T025, sont des savoirs communs sur tous les groupes de l'inégalité (p. 154). ∎", "body_en": "## Argument\n\n1. A cultural theory of status must come to grips with evolutionary arguments; it need not deny evolved responses, but status, laid on them, is a cultural construction, like language (p. 152-153).\n2. By T007, the uncertainty of formation among three or more opens to the group the possibility of taking normative control of deference; the motive is the shared interest in organising the goal and controlling the dominator who does not contribute (p. 153).\n3. The schema controls this dominator by carrots (esteem and influence for contributors, T013) and by the sticks of T009 (dislike and collective resistance) (p. 153).\n4. Status, a rank of esteem granted by a community, is in itself normative; this shows in the norm's enforcement: violations are spontaneously punished, and, by E23, expected deference is rewarded, towards another as towards self (p. 153).\n5. For beliefs, by A05, decades of research show that rank depends on beliefs about identities; and these beliefs, by T025, are common knowledge about all the groups of inequality (p. 154). ∎", "sections_en": ["Argument"], "demo_refs_en": ["A05", "E23", "T007", "T009", "T013", "T025"], "sections": ["Argumentation"], "demo_refs": ["A05", "E23", "T007", "T009", "T013", "T025"], "mentions": ["A05", "E23", "T007", "T009", "T013", "T025"], "corollaires": [], "mtime": 1794593161.3275611}, {"id": "T057", "file": "theses/T057.md", "type": "these", "partie": "7", "titre": "Ce que la théorie du schème explique en propre", "enonce": "La théorie du schème culturel explique trois choses : que le consensus qui gouverne la hiérarchie soit de second ordre, d'où la primauté des attentes d'autrui ; que des hiérarchies convoitées restent stables, grâce à la pression normative ; et que le statut s'étende des individus aux groupes, aux organisations et aux objets, jusqu'à la limite où l'on ne coopère plus que sur le classement lui-même.", "titre_en": "What the schema theory distinctively explains", "enonce_en": "The cultural schema theory explains three things: that the consensus governing the hierarchy is second-order, hence the primacy of others' expectations; that coveted hierarchies remain stable, thanks to normative pressure; and that status extends from individuals to groups, organisations and objects, up to the limit where people cooperate only on the ranking itself.", "titre_de": "Was die Schematheorie eigens erklärt", "enonce_de": "Die Theorie des kulturellen Schemas erklärt drei Dinge: dass der Konsens, der die Hierarchie regiert, von zweiter Ordnung ist, daher der Vorrang der Erwartungen anderer; dass begehrte Hierarchien dank normativen Drucks stabil bleiben; und dass Status sich von Individuen auf Gruppen, Organisationen und Objekte ausdehnt, bis zur Grenze, an der man nur noch über die Rangliste selbst zusammenarbeitet.", "body_de": "## Beweis\n\n1. Nach T012 betrifft der Konsens, der die Hierarchie regiert, das, was die *anderen* erwarten; das verleiht dem Status seine Kraft und erklärt, warum Erwartungen zweiter Ordnung über die eigenen siegen: Sie sagen, ob man respektier
