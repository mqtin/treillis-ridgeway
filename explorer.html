const DATA = {"generated": "2026-11-13 18:46", "elements": [{"id": "D01", "file": "definitions/D01.md", "type": "definition", "partie": "1", "titre": "Statut", "enonce": "Le statut est un classement social comparatif de personnes, de groupes ou d'objets selon l'estime, l'honneur et le respect qu'on leur accorde.", "titre_en": "Status", "enonce_en": "Status is a comparative social ranking of people, groups, or objects in terms of the esteem, honour, and respect accorded to them.", "citation": "“status is a comparative social ranking of people, groups, or objects in terms of the social esteem, honor, and respect accorded to them”", "pages": [1, 10], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nC'est la définition « simple » posée dès l'ouverture (p. 1), puis reprise et dépliée au chapitre 1 : elle est « trompeusement » simple, car chacun de ses termes engage une propriété du statut (p. 10 ; T002). Le statut porte sur des individus, des groupes (races, genres, professions) et des objets ; le statut des objets dérive de celui des personnes ou des groupes qui leur sont associés (p. 10).", "body_en": "## In Ridgeway\n\nThis is the \"simple\" definition laid down at the opening (p. 1), then taken up and unfolded in chapter 1: it is \"deceptively\" simple, for each of its terms involves a property of status (p. 10; T002). Status bears on individuals, groups (races, genders, occupations) and objects; the status of objects derives from that of the people or groups associated with them (p. 10).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["T002"], "corollaires": [], "mtime": 1794590968.3172605}, {"id": "D02", "file": "definitions/D02.md", "type": "definition", "partie": "1", "titre": "Hiérarchie de statut", "enonce": "Une hiérarchie de statut interpersonnelle est un ordre d'estime et d'influence qui se lit dans trois inégalités corrélées : la participation et la visibilité (qui occupe l'attention du groupe), l'évaluation (qui reçoit l'approbation) et l'influence sur les décisions.", "titre_en": "Status hierarchy", "enonce_en": "An interpersonal status hierarchy is an order of esteem and influence that shows in three correlated inequalities: participation and prominence (who holds the group's attention), evaluation (who receives approval), and influence over decisions.", "citation": "", "pages": [8, 9, 10], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes indicateurs viennent des études de Bales (E01) : participation et visibilité, réactions évaluatives et jugements, influence vont ensemble ; ce sont « les indicateurs comportementaux » d'une hiérarchie d'estime et d'influence (p. 8). L'indicateur général n'est pas de parler davantage, trait propre à une culture américaine qui valorise l'affirmation de soi, mais d'être au centre de l'attention, celui qu'on écoute et dont on sollicite l'avis (p. 9-10).", "body_en": "## In Ridgeway\n\nThe indicators come from Bales's studies (E01): participation and prominence, evaluative reactions and assessments, and influence go together; they are \"the behavioral indicators\" of a hierarchy of esteem and influence (p. 8). The general indicator is not talking more, a trait of an American culture that values assertiveness, but being the centre of attention, the one who is listened to and whose opinion is sought (p. 9-10).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["E01"], "corollaires": [], "mtime": 1794590968.3202603}, {"id": "D03", "file": "definitions/D03.md", "type": "definition", "partie": "1", "titre": "Interdépendance coopérative et compétitive", "enonce": "Situation où des personnes dépendent les unes des autres pour atteindre un but qu'elles valorisent (interdépendance coopérative), ce qui crée entre elles une rivalité pour les termes de la coopération et le partage de ses fruits (interdépendance compétitive).", "titre_en": "Cooperative and competitive interdependence", "enonce_en": "A situation in which people depend on one another to reach a goal they value (cooperative interdependence), which creates among them a rivalry over the terms of cooperation and the division of its fruits (competitive interdependence).", "citation": "", "pages": [2, 3, 20], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDès la naissance, on dépend des autres pour vivre et pour obtenir ce qu'on veut ; nous sommes une espèce de groupe (p. 2-3). Mais coordonner ses efforts pose aussitôt des questions : qui sera au centre de l'attention, selon le jugement de qui agira-t-on, combien chacun donnera-t-il et recevra-t-il ? Chacun a intérêt à coopérer et intérêt à tirer le plus de la coopération (p. 3). Les hiérarchies de statut apparaissent surtout dans ces situations : réunions de comité, discussions de classe, décisions de famille (p. 20).", "body_en": "## In Ridgeway\n\nFrom birth one depends on others to live and to get what one wants; we are a group species (p. 2-3). But coordinating efforts at once raises questions: who will be the centre of attention, by whose judgement will we act, how much will each give and receive? Everyone has an interest in cooperating and an interest in getting the most out of cooperation (p. 3). Status hierarchies arise above all in such situations: committee meetings, classroom discussions, family decisions (p. 20).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3212607}, {"id": "D04", "file": "definitions/D04.md", "type": "definition", "partie": "1", "titre": "Schème culturel du statut", "enonce": "Le schème culturel du statut est un ensemble de règles apprises et partagées pour organiser les relations sociales dans les situations d'interdépendance coopérative et compétitive. Il est double : une norme d'attribution du statut (D05), implicite et profondément apprise, et des croyances de statut (D06), plus explicites et historiquement changeantes.", "titre_en": "The cultural schema of status", "enonce_en": "The cultural schema of status is a set of learned and shared rules for organising social relations in situations of cooperative and competitive interdependence. It is twofold: a norm of status allocation (D05), implicit and deeply learned, and status beliefs (D06), more explicit and historically changing.", "citation": "“a set of learned and shared rules”", "pages": [3, 4], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe schème est un « blueprint », un ensemble de règles apprises et partagées (p. 3). Il est structurel au sens de Sewell (A01) : mis en œuvre, il produit une hiérarchie de statut comportementale (p. 3). La norme en est la « grammaire » et les croyances de statut le « vocabulaire » (p. 4). « Normatif » s'entend au sens sociologique : une règle culturelle sanctionnée par les autres, non un idéal prescrit (p. 4). Ridgeway appelle son argument la théorie du schème culturel du statut (p. 3).", "body_en": "## In Ridgeway\n\nThe schema is a \"blueprint\", a set of learned and shared rules (p. 3). It is structural in Sewell's sense (A01): when enacted, it produces a behavioural status hierarchy (p. 3). The norm is its \"grammar\" and status beliefs its \"vocabulary\" (p. 4). \"Normative\" is meant in the sociological sense: a cultural rule enforced by others' sanctions, not a prescribed ideal (p. 4). Ridgeway calls her argument the cultural schema theory of status (p. 3).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["A01"], "corollaires": [], "mtime": 1794590968.3222604}, {"id": "D05", "file": "definitions/D05.md", "type": "definition", "partie": "2", "titre": "Norme fondamentale du statut", "enonce": "La norme fondamentale du statut veut que la déférence et le statut soient accordés à chacun en proportion de la compétence qu'on lui prête dans l'effort collectif vers le but commun.", "titre_en": "The basic status norm", "enonce_en": "The basic status norm holds that deference and status be granted to each in proportion to the competence attributed to them in the collective effort towards the shared goal.", "citation": "“deference and status should be granted in proportion to an individual’s perceived competence at the collective goal effort”", "pages": [37, 54], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nC'est la première composante du schème (D04), formée comme sous-produit non voulu de la coordination (p. 37). Elle crée une toile d'attentes mutuelles : chacun peut attendre que le statut des autres repose sur leur compétence perçue, et les autres attendent de lui qu'il s'incline devant une compétence perçue supérieure (p. 37). Au chapitre 3, la « valeur perçue » inclut la compétence liée au but et la motivation tournée vers le groupe (p. 54).", "body_en": "## In Ridgeway\n\nIt is the first component of the schema (D04), formed as an unintended by-product of coordination (p. 37). It creates a web of mutual expectations: each can expect others' status to rest on their perceived competence, and others expect each to defer to greater perceived competence (p. 37). In chapter 3, \"perceived value\" includes goal-related competence and group-oriented motivation (p. 54).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["D04"], "corollaires": [], "mtime": 1794590968.3237693}, {"id": "D06", "file": "definitions/D06.md", "type": "definition", "partie": "4", "titre": "Croyance de statut", "enonce": "Une croyance de statut est une croyance culturelle largement répandue qui associe une différence sociale reconnue entre des acteurs (genre, race, profession, classe…) à plus ou moins de valeur sociale (status-worthiness) et de compétence.", "titre_en": "Status belief", "enonce_en": "A status belief is a widely held cultural belief that links a recognised social difference among actors (gender, race, occupation, class…) with greater or lesser status-worthiness and competence.", "citation": "“Status beliefs are widely held cultural beliefs that link a recognized social difference among actors with greater or lesser status-worthiness and competence”", "pages": [38, 69, 70], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nIntroduites au chapitre 2 comme seconde composante du schème (p. 38), plus descriptives que normatives, les croyances de statut sont définies au chapitre 4 (p. 69). Une différence reconnue divise les acteurs en groupes contrastés ; la croyance ne se contente pas de les distinguer, elle les ordonne selon qui est le plus estimable et le plus compétent (p. 69). Elles portent sur des « types » d'acteurs, individus ou acteurs collectifs (Goldman Sachs et la caisse de crédit, Harvard et l'université d'État) (p. 69-70).", "body_en": "## In Ridgeway\n\nIntroduced in chapter 2 as the second component of the schema (p. 38), more descriptive than normative, status beliefs are defined in chapter 4 (p. 69). A recognised difference divides actors into contrasting groups; the belief does not merely distinguish them, it ranks them by who is more worthy and more competent (p. 69). They bear on \"types\" of actors, individuals or corporate actors (Goldman Sachs and the credit union, Harvard and the state college) (p. 69-70).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3252943}, {"id": "D07", "file": "definitions/D07.md", "type": "definition", "partie": "2", "titre": "Capacité de performance et compétence", "enonce": "La capacité de performance est la capacité perçue de contribuer au but du groupe. Elle comprend les savoir-faire liés à la tâche, l'effort agentique pour les mettre en œuvre et la motivation tournée vers le groupe. Ridgeway appelle « compétence » la combinaison des capacités et de l'effort dirigés vers le but.", "titre_en": "Performance capacity and competence", "enonce_en": "Performance capacity is the perceived capacity to contribute to the group's goal. It comprises task-relevant skills, the agentic effort to apply them, and group-oriented motivation. Ridgeway calls \"competence\" the combination of abilities and effort directed to the goal.", "citation": "", "pages": [26, 27], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLa valeur pour le groupe n'est pas seulement l'expertise, les « biens informationnels » du modèle du prestige (D26) : c'est la capacité de contribuer au but (p. 26). Dans le club de lecture, ce n'est pas le plus formé en littérature qui prend l'ascendant, mais celui qui prend l'initiative de mettre ses savoirs au service de la discussion (p. 26-27). Capacités et effort se combinent en une impression de compétence liée au but, noyau de la capacité de performance ; l'orientation vers le groupe (D08) en fixe les bornes (p. 27).", "body_en": "## In Ridgeway\n\nValue to the group is not just expertise, the \"information goods\" of the prestige model (D26): it is the capacity to contribute to the goal (p. 26). In the book club, it is not the one with the most literary training who gains ascendancy, but the one who takes the initiative to put that knowledge at the service of the discussion (p. 26-27). Abilities and effort combine into an impression of goal-related competence, the core of performance capacity; group orientation (D08) sets its bounds (p. 27).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["D08", "D26"], "corollaires": [], "mtime": 1794590968.326301}, {"id": "D08", "file": "definitions/D08.md", "type": "definition", "partie": "2", "titre": "Orientation vers le groupe", "enonce": "L'orientation vers le groupe est l'engagement perçu à agir dans l'intérêt du groupe, et non seulement dans le sien. Elle est la seconde dimension de la valeur perçue, à côté de la compétence.", "titre_en": "Group orientation", "enonce_en": "Group orientation is the perceived commitment to act in the group's interest, not only one's own. It is the second dimension of perceived value, beside competence.", "citation": "", "pages": [27, 44, 98], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nC'est le sentiment que quelqu'un est prêt à travailler pour le groupe et pas seulement pour soi ; il peut borner la valeur de sa compétence (p. 27). Il naît de la tension entre meneurs et suiveurs : on veut s'assurer que celui à qui l'on donne de l'influence l'utilisera pour le groupe (p. 44). Son poids dans l'attribution du statut varie avec le contexte (p. 98).", "body_en": "## In Ridgeway\n\nIt is the sense that someone is willing to work for the group and not only for themselves; it can bound the value of their competence (p. 27). It arises from the tension between leaders and followers: members want assurance that the one they give influence to will use it for the group (p. 44). Its weight in allocating status varies with context (p. 98).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.326301}, {"id": "D09", "file": "definitions/D09.md", "type": "definition", "partie": "2", "titre": "Attentes de premier et de second ordre", "enonce": "Les attentes de premier ordre sont celles qu'on forme soi-même sur la compétence et le rang de chacun (« je pense que tu es meilleur que moi »). Les attentes de second ordre sont celles qu'on prête aux autres (« je pense qu'ils pensent que tu es meilleur que moi »).", "titre_en": "First- and second-order expectations", "enonce_en": "First-order expectations are those one forms oneself about each person's competence and rank (\"I think you are better than me\"). Second-order expectations are those one attributes to others (\"I think they think you are better than me\").", "citation": "", "pages": [39], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLa distinction vient de la théorie des états d'attente (A05). Un consensus peut se former à l'un ou l'autre niveau : accord des attentes personnelles, ou accord sur ce que les autres attendent de chacun, soi compris (p. 39).", "body_en": "## In Ridgeway\n\nThe distinction comes from expectation states theory (A05). A consensus can form at either level: agreement of personal expectations, or agreement on what others expect of each, self included (p. 39).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["A05"], "corollaires": [], "mtime": 1794590968.327307}, {"id": "D10", "file": "definitions/D10.md", "type": "definition", "partie": "4", "titre": "Croyance de troisième ordre", "enonce": "Une croyance de troisième ordre porte sur ce que pense « la plupart des gens », la communauté dans son ensemble. Les croyances de statut sont de cet ordre : ni simple opinion personnelle (premier ordre), ni perception de ce que pensent des interlocuteurs précis (second ordre).", "titre_en": "Third-order belief", "enonce_en": "A third-order belief bears on what \"most people\", the community as a whole, think. Status beliefs are of this order: neither mere personal opinion (first order) nor a perception of what specific others think (second order).", "citation": "", "pages": [71, 72], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nParce qu'elles portent sur ce que « la plupart des gens » pensent, Ridgeway et d'autres appellent les croyances de statut des croyances de troisième ordre (p. 71). On peut les tenir sans y adhérer : hommes et femmes partagent des stéréotypes de genre favorables aux hommes sans que toutes et tous les endossent personnellement (p. 71-72).", "body_en": "## In Ridgeway\n\nBecause they bear on what \"most people\" think, Ridgeway and others call status beliefs third-order beliefs (p. 71). One can hold them without endorsing them: men and women share gender stereotypes favouring men without all personally endorsing them (p. 71-72).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.328307}, {"id": "D11", "file": "definitions/D11.md", "type": "definition", "partie": "2", "titre": "Savoir commun", "enonce": "Un savoir commun est un savoir qu'on possède et dont on peut supposer que les autres le possèdent aussi ; il se distingue du simple savoir partagé, que plusieurs ont sans pouvoir le présumer des autres.", "titre_en": "Common knowledge", "enonce_en": "Common knowledge is knowledge one has and can assume others also have; it differs from merely shared knowledge, which several people have without being able to presume it of others.", "citation": "", "pages": [35, 74], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe terme vient des théoriciens des jeux (A07) : quelque chose qu'on sait et dont on peut supposer que les autres le savent (p. 35). Au chapitre 4, Ridgeway distingue le savoir partagé (la plupart le connaissent) du savoir commun (chacun peut raisonnablement présumer que les autres le connaissent), qui est ce qu'exige la coordination (p. 74).", "body_en": "## In Ridgeway\n\nThe term comes from game theorists (A07): something one knows and can assume others know (p. 35). In chapter 4, Ridgeway distinguishes shared knowledge (most people know it) from common knowledge (each can reasonably presume others know it), which is what coordination requires (p. 74).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["A07"], "corollaires": [], "mtime": 1794590968.328307}, {"id": "D12", "file": "definitions/D12.md", "type": "definition", "partie": "1", "titre": "Attentes de performance", "enonce": "Les attentes de performance sont des anticipations implicites, souvent inconscientes, de l'utilité probable des contributions de chacun à l'effort commun, comparées aux siennes et à celles des autres. Elles forment un ordre de rang.", "titre_en": "Performance expectations", "enonce_en": "Performance expectations are implicit, often unconscious anticipations of how useful each person's contributions to the shared effort are likely to be, compared with one's own and others'. They form a rank order.", "citation": "", "pages": [9, 101], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe concept vient de la théorie des états d'attente (A05) (p. 9). Au chapitre 5, ces attentes sont les termes dans lesquels la théorie exprime les jugements de valeur perçue sur lesquels tourne la norme fondamentale (D05) (p. 101).", "body_en": "## In Ridgeway\n\nThe concept comes from expectation states theory (A05) (p. 9). In chapter 5, these expectations are the terms in which the theory expresses the judgements of perceived value on which the basic norm (D05) turns (p. 101).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["A05", "D05"], "corollaires": [], "mtime": 1794590968.329308}, {"id": "D13", "file": "definitions/D13.md", "type": "definition", "partie": "4", "titre": "Avantage de statut", "enonce": "Il y a avantage de statut quand des acteurs désignés comme de haut statut par une croyance de statut sont traités comme plus estimables et compétents qu'ils ne le seraient sans cette étiquette, et ceux de bas statut comme moins.", "titre_en": "Status advantage", "enonce_en": "There is status advantage when actors labelled high status by a status belief are treated as more worthy and competent than they would be without that label, and those labelled low status as less so.", "citation": "", "pages": [72, 73, 93, 94], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDéfinition (p. 72-73), avec l'expérience de pensée du même diplômé, même savoir-faire, même personnalité, imaginé homme blanc de milieu aisé puis femme afro-américaine d'origine ouvrière (p. 73). Pour les acteurs collectifs comme pour les individus, l'avantage tient à être perçu plus compétent, plus précieux et préféré dans l'échange, au-delà de ce qu'on serait sans ce rang (p. 93-94).", "body_en": "## In Ridgeway\n\nDefinition (p. 72-73), with the thought experiment of the same graduate, same skills, same personality, imagined as a white man from an upper-middle-class background and then as an African American woman from a working-class background (p. 73). For corporate actors as for individuals, the advantage consists in being perceived as more competent, more valuable and favoured in exchange, beyond what one would be without that rank (p. 93-94).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.330308}, {"id": "D14", "file": "definitions/D14.md", "type": "definition", "partie": "4", "titre": "Caractéristique de statut diffuse", "enonce": "Une caractéristique de statut diffuse est une différence de groupe que les croyances de statut associent à une compétence générale : on présume les membres du groupe de haut statut « meilleurs » dans la plupart des choses. Genre, race, éducation et profession en sont.", "titre_en": "Diffuse status characteristic", "enonce_en": "A diffuse status characteristic is a group difference that status beliefs associate with general competence: members of the high-status group are presumed \"better\" at most things. Gender, race, education and occupation are such characteristics.", "citation": "", "pages": [77, 108], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe terme vient de la théorie des caractéristiques de statut (A05) : la compétence générale rend ces croyances pertinentes pour une grande variété de tâches (p. 77). On attend même du groupe favorisé qu'il excelle dans des tâches qui ne lui sont pas associées : les grands chefs seraient des hommes (p. 77). Ces caractéristiques portent aussi des savoir-faire spécifiques stéréotypés (cuisine, mathématiques) (p. 77). Une caractéristique diffuse saillante agit même sans rapport avec la tâche (p. 108).", "body_en": "## In Ridgeway\n\nThe term comes from status characteristics theory (A05): general competence makes these beliefs relevant to a wide variety of tasks (p. 77). The favoured group is even expected to excel at tasks not linked to it: great chefs would be men (p. 77). These characteristics also carry stereotyped specific skills (cooking, mathematics) (p. 77). A salient diffuse characteristic acts even when unrelated to the task (p. 108).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["A05"], "corollaires": [], "mtime": 1794590968.330308}, {"id": "D15", "file": "definitions/D15.md", "type": "definition", "partie": "4", "titre": "Caractéristique de statut spécifique", "enonce": "Une caractéristique de statut spécifique associe une différence à une compétence bornée, pertinente pour certaines tâches seulement : langue étrangère, programmation, plomberie.", "titre_en": "Specific status characteristic", "enonce_en": "A specific status characteristic associates a difference with a bounded competence, relevant only to some tasks: a foreign language, programming, plumbing.", "citation": "", "pages": [77, 78], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDans une société qui valorise la compétence instrumentale, une expertise spécialisée porte une part d'estime, mais elle ne pèse que là où elle sert le but du groupe : en voyage à l'étranger, celui qui parle la langue est écouté ; de retour, pour une autre tâche, son savoir compte peu (p. 77-78).", "body_en": "## In Ridgeway\n\nIn a society that values instrumental competence, specialised expertise carries a measure of esteem, but it weighs only where it serves the group's goal: travelling abroad, the one who speaks the language is listened to; back home, for another task, that knowledge counts for little (p. 77-78).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3313086}, {"id": "D16", "file": "definitions/D16.md", "type": "definition", "partie": "4", "titre": "Généralisation du statut", "enonce": "La généralisation du statut est le processus par lequel le statut des groupes sociaux auxquels on appartient façonne les attentes de compétence, donc l'estime et l'influence, dans un contexte local.", "titre_en": "Status generalization", "enonce_en": "Status generalization is the process by which the status of the social groups one belongs to shapes expectations of competence, and so esteem and influence, in a local context.", "citation": "", "pages": [80, 106, 107], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nObservé depuis des décennies : dans une étude des jurys des années 1950, le genre et le statut professionnel comptaient parmi les principaux déterminants de l'influence (p. 80). Une caractéristique de statut saillante déclenche ce processus, aux effets autoréalisateurs (p. 106-107).", "body_en": "## In Ridgeway\n\nObserved for decades: in a study of juries in the 1950s, gender and occupational status were among the main determinants of influence (p. 80). A salient status characteristic triggers this process, whose effects are self-fulfilling (p. 106-107).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3313086}, {"id": "D17", "file": "definitions/D17.md", "type": "definition", "partie": "5", "titre": "Indices de statut", "enonce": "Les indices de statut sont les informations sociales qui, saillantes dans une situation, façonnent les attentes de performance : caractéristiques de statut diffuses et spécifiques, récompenses sociales, style de comportement, évaluations explicites de la performance.", "titre_en": "Status cues", "enonce_en": "Status cues are the social information that, when salient in a situation, shape performance expectations: diffuse and specific status characteristics, social rewards, behavioural style, explicit performance evaluations.", "citation": "", "pages": [104], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLa recherche sur les états d'attente a identifié ces types d'indices ; les caractéristiques de statut sont parmi les plus puissants (p. 104).", "body_en": "## In Ridgeway\n\nExpectation states research has identified these kinds of cues; status characteristics are among the most powerful (p. 104).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3323064}, {"id": "D18", "file": "definitions/D18.md", "type": "definition", "partie": "5", "titre": "Légitimité d'une hiérarchie", "enonce": "Une hiérarchie de statut est légitime quand ses membres la tiennent non seulement pour ce qu'elle est, mais pour ce qu'elle doit être. La légitimité permet aux membres de haut statut de passer de l'influence à l'autorité.", "titre_en": "Legitimacy of a hierarchy", "enonce_en": "A status hierarchy is legitimate when its members take it to be not only as it is but as it should be. Legitimacy allows high-status members to move from influence to authority.", "citation": "", "pages": [116], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDéfinition et enjeu (p. 116) : la légitimité conditionne la capacité d'agir avec autorité en s'attendant à être obéi, donc le lien entre statut, direction et pouvoir.", "body_en": "## In Ridgeway\n\nDefinition and stakes (p. 116): legitimacy conditions the ability to act with authority and expect compliance, hence the link between status, leadership and power.", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3323064}, {"id": "D19", "file": "definitions/D19.md", "type": "definition", "partie": "5", "titre": "Biais de statut", "enonce": "Le biais de statut est l'ensemble des biais d'évaluation de la compétence et de la valeur que déclenchent les caractéristiques de statut diffuses saillantes : attentes initiales, évaluation de la performance, attribution d'aptitude, et enfin octroi d'influence et d'estime.", "titre_en": "Status bias", "enonce_en": "Status bias is the whole range of evaluative biases about competence and worth unleashed by salient diffuse status characteristics: initial expectations, evaluation of performance, attribution of ability, and finally the granting of influence and esteem.", "citation": "", "pages": [121], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nC'est le premier des trois biais ; il commence par les attentes initiales et leurs effets autoréalisateurs et culmine dans l'octroi inégal d'influence et d'estime (p. 121).", "body_en": "## In Ridgeway\n\nIt is the first of the three biases; it begins with initial expectations and their self-fulfilling effects and culminates in the unequal granting of influence and esteem (p. 121).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.333812}, {"id": "D20", "file": "definitions/D20.md", "type": "definition", "partie": "5", "titre": "Biais de légitimité", "enonce": "Le biais de légitimité est la tendance à tenir les acteurs avantagés par les caractéristiques de statut diffuses pour des titulaires plus légitimes des positions élevées, et à sanctionner les conduites qui contestent le classement des groupes.", "titre_en": "Legitimacy bias", "enonce_en": "Legitimacy bias is the tendency to treat actors advantaged by diffuse status characteristics as more legitimate occupants of high positions, and to sanction behaviour that challenges the ranking of groups.", "citation": "", "pages": [121, 122], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nIl produit les réactions de rejet (backlash) contre les membres de groupes désavantagés qui s'affirment, et limite l'autorité de ceux qui ont atteint une position élevée, comme le patron afro-américain (p. 121-122).", "body_en": "## In Ridgeway\n\nIt produces the backlash against members of disadvantaged groups who act assertively, and limits the authority of those who reach a high position, such as the African American boss (p. 121-122).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.333812}, {"id": "D21", "file": "definitions/D21.md", "type": "definition", "partie": "5", "titre": "Biais de préférence associative", "enonce": "Le biais de préférence associative est la préférence pour s'associer aux membres des groupes de haut statut, parce que le statut se propage par association. Il renforce l'entre-soi des groupes de haut statut et émousse celui des groupes de bas statut.", "titre_en": "Associational preference bias", "enonce_en": "Associational preference bias is the preference for associating with members of high-status groups, because status spreads through association. It reinforces in-group ties among high-status groups and blunts them among low-status groups.", "citation": "", "pages": [122], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nL'homophilie domine les associations, mais le statut de ceux qu'on fréquente rejaillit sur soi (p. 122). Les membres des groupes de haut statut ont toutes les raisons de préférer leurs semblables, y compris pour embaucher et promouvoir ; ceux des groupes de bas statut sont tiraillés entre leur groupe et des liens plus hauts (p. 122). Le biais mine la solidarité en bas et resserre en haut les réseaux, l'information et les occasions (p. 122).", "body_en": "## In Ridgeway\n\nHomophily dominates associations, but the status of those one associates with rubs off on oneself (p. 122). Members of high-status groups have every reason to prefer their own, including for hiring and promotion; those of low-status groups are torn between their group and higher ties (p. 122). The bias undermines solidarity below and tightens networks, information and opportunities above (p. 122).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3348181}, {"id": "D22", "file": "definitions/D22.md", "type": "definition", "partie": "4", "titre": "Inférence socialement endogène", "enonce": "L'inférence socialement endogène est le processus par lequel une croyance de statut biaise le jugement personnel (de premier ordre) qu'on porte sur la compétence d'autrui, parce qu'on la tient pour le résumé de l'évaluation d'une communauté.", "titre_en": "Socially endogenous inference", "enonce_en": "Socially endogenous inference is the process by which a status belief biases one's personal (first-order) judgement of another's competence, because one takes it as a summary of a community's evaluation.", "citation": "", "pages": [94], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes croyances sont perçues comme l'agrégat des jugements d'une communauté sur la compétence moyenne d'un type d'acteur ; mais elles accumulent des erreurs, et, en façonnant les attentes, elles biaisent jusqu'aux performances réelles, si bien que leurs erreurs se réalisent (p. 94).", "body_en": "## In Ridgeway\n\nBeliefs are perceived as the aggregate of a community's judgements about a type of actor's average competence; but they accumulate errors, and by shaping expectations they bias even actual performance, so that their errors become self-fulfilling (p. 94).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3359327}, {"id": "D23", "file": "definitions/D23.md", "type": "definition", "partie": "4", "titre": "Inférence de troisième ordre", "enonce": "L'inférence de troisième ordre est le processus par lequel, quand l'issue d'un choix dépend des réactions d'autrui, on s'appuie sur ce que « la plupart des gens » tiennent pour le meilleur, au-delà de son propre jugement.", "titre_en": "Third-order inference", "enonce_en": "Third-order inference is the process by which, when the outcome of a choice depends on others' reactions, one relies on what \"most people\" take to be best, beyond one's own judgement.", "citation": "", "pages": [95], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nPour anticiper le choix que les autres jugeront « le meilleur », on se sert des croyances de statut en tant que croyances sur ce que pense la plupart des gens, et l'on choisit ce qui sera le plus efficacement accepté (p. 95).", "body_en": "## In Ridgeway\n\nTo anticipate the choice that others will judge \"best\", one uses status beliefs as beliefs about what most people think, and chooses what will be most effectively accepted (p. 95).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3359327}, {"id": "D24", "file": "definitions/D24.md", "type": "definition", "partie": "3", "titre": "Contexte relationnel social", "enonce": "Un contexte relationnel social est toute situation où l'on se considère en relation avec un autre dont il faut tenir compte pour savoir comment agir : interaction directe, en personne ou en ligne, mais aussi relation indirecte ou imaginée.", "titre_en": "Social relational context", "enonce_en": "A social relational context is any situation in which one considers oneself in relation to another who must be taken into account to figure out how to act: direct interaction, in person or online, but also indirect or imagined relations.", "citation": "", "pages": [48], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExemple de relation imaginée : écouter un politicien parler des « gens comme nous » (p. 48). C'est dans ces contextes que l'on reçoit le statut, puisqu'il est donné par les autres, et qu'on y voit reflétée sa valeur pour le groupe (p. 48).", "body_en": "## In Ridgeway\n\nAn example of an imagined relation: listening to a politician speak about \"people like us\" (p. 48). It is in these contexts that one receives status, since it is given by others, and sees one's value to the group reflected (p. 48).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3370094}, {"id": "D25", "file": "definitions/D25.md", "type": "definition", "partie": "2", "titre": "Hiérarchie de dominance", "enonce": "Une hiérarchie de dominance est un ordre de rang fondé sur la peur et l'intimidation : la déférence y repose sur une menace implicite.", "titre_en": "Dominance hierarchy", "enonce_en": "A dominance hierarchy is a rank order based on fear and intimidation: deference in it rests on an implied threat.", "citation": "", "pages": [22, 23], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes relations de dominance reposent sur une menace implicite (p. 22). Les actes de dominance sont des démonstrations destinées à stresser l'autre ; celui qui supporte le moins la tension cède (p. 23). Ces hiérarchies répartissent les ressources existantes avec un minimum de combats : ce sont des « ordres de becquetage » (p. 23).", "body_en": "## In Ridgeway\n\nDominance relations rest on an implied threat (p. 22). Dominance acts are displays meant to stress the other; whoever bears the tension least backs down (p. 23). These hierarchies distribute existing resources with a minimum of fighting: they are \"pecking orders\" (p. 23).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3380156}, {"id": "D26", "file": "definitions/D26.md", "type": "definition", "partie": "2", "titre": "Prestige", "enonce": "Le prestige est une déférence fondée sur le respect et l'admiration librement accordés à quelqu'un pour sa capacité perçue à offrir des informations culturelles utiles.", "titre_en": "Prestige", "enonce_en": "Prestige is deference based on respect and admiration freely granted to someone for their perceived ability to offer useful cultural information.", "citation": "", "pages": [25], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe prestige est plus proche du statut que la dominance, puisqu'il est librement accordé (p. 25). En déférant à qui détient de meilleurs « biens informationnels », on se rapproche de lui et l'on apprend ses savoirs, ce qui serait un avantage évolutif (p. 25 ; R04).", "body_en": "## In Ridgeway\n\nPrestige is closer to status than dominance is, since it is freely granted (p. 25). By deferring to whoever holds better \"information goods\", one comes closer and learns their skills, which would be an evolutionary advantage (p. 25; R04).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["R04"], "corollaires": [], "mtime": 1794590968.3380156}, {"id": "D27", "file": "definitions/D27.md", "type": "definition", "partie": "5", "titre": "Double standard", "enonce": "Il y a double standard quand, pour une performance de même qualité, on exige davantage de preuves d'aptitude de la personne désavantagée par une caractéristique de statut que de la personne avantagée.", "titre_en": "Double standard", "enonce_en": "There is a double standard when, for a performance of the same quality, more proof of ability is demanded of the person disadvantaged by a status characteristic than of the advantaged one.", "citation": "", "pages": [111], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nFace à la bonne performance d'une personne désavantagée, les autres, et parfois elle-même, pensent : « Prouve-le encore » ; pour la personne avantagée, une bonne performance confirme simplement son aptitude (p. 111). Le double standard prend aussi la forme de critères mouvants (p. 111 ; E40).", "body_en": "## In Ridgeway\n\nFaced with a good performance by a disadvantaged person, others, and sometimes the person herself, think: \"Prove it again\"; for the advantaged person, a good performance simply confirms ability (p. 111). The double standard also takes the form of shifting criteria (p. 111; E40).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["E40"], "corollaires": [], "mtime": 1794590968.3390152}, {"id": "D28", "file": "definitions/D28.md", "type": "definition", "partie": "6", "titre": "Institutions-portails", "enonce": "Les institutions-portails sont les organisations dominantes (écoles, entreprises, administrations, institutions de santé) qui commandent l'accès aux biens valorisés : santé, argent, positions de pouvoir.", "titre_en": "Gateway institutions", "enonce_en": "Gateway institutions are the dominant organisations (schools, workplaces, government, health institutions) that control access to valued outcomes: health, money, positions of power.", "citation": "", "pages": [135], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLeurs procédures et leurs normes reflètent les acteurs dominants qui les contrôlent, de manière disproportionnée issus des groupes raciaux de haut statut et des classes moyennes ou supérieures (p. 135).", "body_en": "## In Ridgeway\n\nTheir procedures and norms reflect the dominant actors who control them, disproportionately from higher-status racial groups and middle- or upper-class groups (p. 135).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3400168}, {"id": "D29", "file": "definitions/D29.md", "type": "definition", "partie": "6", "titre": "Essentialisation", "enonce": "L'essentialisation est le degré auquel une différence de groupe est culturellement comprise comme enracinée dans la nature des personnes et leur corps, plutôt que dans des goûts ou des savoirs acquis. C'est un continuum, non une dichotomie.", "titre_en": "Essentialization", "enonce_en": "Essentialization is the degree to which a group difference is culturally understood as rooted in people's nature and bodies, rather than in acquired tastes or knowledge. It is a continuum, not a dichotomy.", "citation": "", "pages": [136, 137], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes croyances de statut localisent la différence dans des attributs simplifiés ; ceux-ci vont d'essences immuables à des différences culturelles acquises (p. 136). La distinction est voisine, mais non identique, de l'opposition classique entre statut assigné et statut acquis (p. 137). Ce qui compte n'est pas que la différence soit « réellement » essentielle, mais qu'elle soit culturellement comprise comme telle dans des croyances de troisième ordre (p. 136).", "body_en": "## In Ridgeway\n\nStatus beliefs locate difference in simplified attributes; these range from immutable essences to acquired cultural differences (p. 136). The distinction is related, but not identical, to the classic opposition between ascribed and achieved status (p. 137). What matters is not whether the difference \"actually is\" essential, but whether it is culturally understood as such in third-order beliefs (p. 136).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3410213}, {"id": "D30", "file": "definitions/D30.md", "type": "definition", "partie": "6", "titre": "Structure matérielle de l'inégalité", "enonce": "La structure matérielle de l'inégalité se définit par deux processus liés : le contrôle des ressources matérielles et l'accès aux positions de pouvoir dans les organisations qui produisent et distribuent ces ressources.", "titre_en": "Material structure of inequality", "enonce_en": "The material structure of inequality is defined by two related processes: control over material resources and access to positions of power in the organisations that produce and distribute those resources.", "citation": "", "pages": [125], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDéfinition reprise de Weber et de Tilly, et volontairement étroite : le statut fait partie de la structure de l'inégalité, mais l'en séparer permet d'isoler ses effets sur l'inégalité matérielle (p. 125).", "body_en": "## In Ridgeway\n\nA definition taken from Weber and Tilly, and deliberately narrow: status is part of the structure of inequality, but setting it apart makes it possible to isolate its effects on material inequality (p. 125).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3420153}, {"id": "D31", "file": "definitions/D31.md", "type": "definition", "partie": "6", "titre": "Classe comme culture", "enonce": "La classe comme culture est la classe entendue comme style de vie et pratiques culturelles, et non seulement comme richesse.", "titre_en": "Class-as-culture", "enonce_en": "Class-as-culture is class understood as lifestyle and cultural practices, not just as wealth.", "citation": "", "pages": [125], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nAvec le genre et la race, c'est l'une des trois distinctions de statut étudiées au chapitre 6 ; le statut permet à ces différences de devenir des systèmes d'inégalité à part entière (p. 125).", "body_en": "## In Ridgeway\n\nWith gender and race, it is one of the three status distinctions studied in chapter 6; status allows these differences to become systems of inequality in their own right (p. 125).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3420153}, {"id": "D32", "file": "definitions/D32.md", "type": "definition", "partie": "5", "titre": "Typifications de statut", "enonce": "Les typifications de statut sont des croyances de statut sur le style de comportement : les acteurs de haut statut seraient plus affirmés, agentiques et compétents, ceux de bas statut plus réactifs et tournés vers les autres.", "titre_en": "Status typifications", "enonce_en": "Status typifications are status beliefs about behavioural style: high-status actors would be more assertive, agentic and competent, low-status actors more reactive and communal.", "citation": "", "pages": [113, 114], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe terme est celui de la théorie des états d'attente pour les croyances partagées en Amérique du Nord sur le style de haut et de bas statut (p. 113-114).", "body_en": "## In Ridgeway\n\nThe term is expectation states theory's for the beliefs shared in North America about high- and low-status styles (p. 113-114).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.343015}, {"id": "A01", "file": "premisses/A01.md", "type": "auteur", "partie": "P", "titre": "Sewell : la dualité des structures", "enonce": "(Sewell, après Giddens.) Une structure sociale est double : un schème culturel, ensemble de règles implicites pour la mettre en œuvre, et la distribution matérielle de ressources et de conduites qui résulte de cette mise en œuvre. Une fois acquis, un schème s'applique largement, au-delà de son contexte d'origine.", "titre_en": "Sewell: the duality of structures", "enonce_en": "(Sewell, following Giddens.) A social structure is dual: a cultural schema, a set of implicit rules for enacting it, and the material distribution of resources and behaviours that results from that enactment. Once acquired, a schema is applied permissively, beyond its context of origin.", "citation": "", "pages": [3, 91], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe schème du statut est un schème structurel en ce sens (p. 3). Au chapitre 4, la seconde idée explique que le statut se répande partout : c'est comme une paire de ciseaux ; une fois qu'on l'a, on trouve de nouvelles choses à couper (p. 91).", "body_en": "## In Ridgeway\n\nThe status schema is a structural schema in this sense (p. 3). In chapter 4, the second idea explains why status spreads everywhere: it is like a pair of scissors; once you have them, you think of new things to cut (p. 91).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3440151}, {"id": "A02", "file": "premisses/A02.md", "type": "auteur", "partie": "P", "titre": "Weber : le pouvoir et l'influence", "enonce": "(Weber.) Le pouvoir est la capacité d'obtenir l'obéissance d'autrui malgré sa résistance, sans dépendre de son consentement. Il diffère du pouvoir « doux » que donne le statut, celui de l'influence.", "titre_en": "Weber: power and influence", "enonce_en": "(Weber.) Power is the ability to get the other to comply despite resistance, without depending on consent. It differs from the \"soft\" power that status brings, the power of influence.", "citation": "", "pages": [14], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLe statut, comme estime et attention, accroît la capacité de persuader les autres, surtout pour l'effort commun ; il ne donne pas, à lui seul, celle de les forcer (p. 14).", "body_en": "## In Ridgeway\n\nStatus, as esteem and attention, increases the ability to persuade others, especially regarding the shared effort; it does not by itself give the capacity to force them (p. 14).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3445213}, {"id": "A03", "file": "premisses/A03.md", "type": "auteur", "partie": "P", "titre": "La théorie de la dépendance-pouvoir", "enonce": "(Théorie de la dépendance-pouvoir.) Le pouvoir dans une relation vient du contrôle par l'un de ressources, matérielles ou culturelles, dont l'autre dépend : plus l'autre en dépend, plus on peut le contraindre en menaçant de les retenir.", "titre_en": "Power-dependence theory", "enonce_en": "(Power-dependence theory.) Power in a relationship comes from one actor's control over resources, material or cultural, on which the other depends: the more the other depends on them, the more one can force compliance by threatening to withhold them.", "citation": "", "pages": [15], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nIl en découle que pouvoir et richesse sont des formes d'inégalité étroitement liées : la richesse est un contrôle de ressources matérielles, et, dans bien des circonstances, l'inégalité de richesse se convertit en inégalité de pouvoir (p. 15).", "body_en": "## In Ridgeway\n\nIt follows that power and wealth are closely related forms of inequality: wealth is control over material resources, and in many circumstances inequality of wealth converts into inequality of power (p. 15).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3455293}, {"id": "A04", "file": "premisses/A04.md", "type": "auteur", "partie": "P", "titre": "Goffman : le statut ne se saisit pas", "enonce": "(Goffman.) Le statut ne peut être saisi ni possédé comme un bien matériel ; il ressemble à une réputation : on peut le revendiquer, mais il doit être accordé par les autres.", "titre_en": "Goffman: status cannot be seized", "enonce_en": "(Goffman.) Status cannot be seized or possessed like material goods; it resembles a reputation: one can claim it, but it must be granted by others.", "citation": "", "pages": [11], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDans les groupes de Bales, prendre la parole est une revendication d'attention ; il faut encore que les autres l'écoutent avec approbation. Que le statut soit donné et non pris est l'un de ses traits fondamentaux (p. 11).", "body_en": "## In Ridgeway\n\nIn Bales's groups, speaking up is a claim on attention; others must still listen with approval. That status is given, not taken, is one of its fundamental features (p. 11).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3455293}, {"id": "A05", "file": "premisses/A05.md", "type": "auteur", "partie": "P", "titre": "La théorie des caractéristiques de statut et des états d'attente", "enonce": "(Théorie des caractéristiques de statut et des états d'attente.) Dans une tâche coopérative, chacun forme, à partir des indices sociaux, des attentes de performance implicites pour soi et pour les autres ; ces attentes façonnent les conduites de manière autoréalisatrice et produisent la hiérarchie de participation, d'évaluation et d'influence. Les caractéristiques de statut liées à des croyances de statut orientent ces attentes.", "titre_en": "Status characteristics and expectation states theory", "enonce_en": "(Status characteristics and expectation states theory.) In a cooperative task, each person forms, from social cues, implicit performance expectations for self and others; these expectations shape behaviour in self-fulfilling ways and produce the hierarchy of participation, evaluation and influence. Status characteristics linked to status beliefs steer these expectations.", "citation": "", "pages": [9, 99, 100], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nC'est la théorie des hiérarchies interpersonnelles la plus développée et la mieux documentée (p. 9). Ridgeway ne la conteste pas : elle veut raconter une histoire plus profonde, celle des processus normatifs et culturels qui sous-tendent les jugements qu'elle décrit (p. 9). La théorie (une famille de théories) limite son champ aux groupes orientés vers un but commun ; dans ce champ, elle et la théorie du schème culturel concordent pleinement (p. 99-100).", "body_en": "## In Ridgeway\n\nIt is the most developed and best documented theory of interpersonal hierarchies (p. 9). Ridgeway does not challenge it: she wants to tell a deeper story, that of the normative and cultural processes underlying the judgements it describes (p. 9). The theory (a family of theories) limits its scope to groups oriented to a shared goal; within that scope, it and the cultural schema theory fully agree (p. 99-100).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794591916.390325}, {"id": "A06", "file": "premisses/A06.md", "type": "auteur", "partie": "P", "titre": "Emerson : la norme, voix de la coalition", "enonce": "(Emerson.) Une norme de groupe est la voix de la coalition qui se dresserait contre vous si vous la violiez.", "titre_en": "Emerson: the norm as the voice of the coalition", "enonce_en": "(Emerson.) A group norm is the voice of the coalition that would stand against you if you violated it.", "citation": "", "pages": [32], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes normes se révèlent par leur application ; dans cette perspective, les coalitions implicites contre le dominateur révèlent une norme émergente (p. 32).", "body_en": "## In Ridgeway\n\nNorms are revealed by their enforcement; from this perspective, the implicit coalitions against the dominator reveal an emergent norm (p. 32).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.347528}, {"id": "A07", "file": "premisses/A07.md", "type": "auteur", "partie": "P", "titre": "Le savoir commun résout la coordination", "enonce": "(Théoriciens des jeux ; Goffman.) Quand chacun doit tenir compte de la conduite probable des autres pour agir, les gens résolvent ce problème de coordination en s'appuyant sur le même savoir commun, une sorte de script social partagé.", "titre_en": "Common knowledge solves coordination", "enonce_en": "(Game theorists; Goffman.) When each must take others' likely behaviour into account in order to act, people solve this coordination problem by drawing on the same common knowledge, a kind of shared social script.", "citation": "", "pages": [35, 74], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nSi deux personnes partent des mêmes présupposés, elles anticipent leurs actions et se coordonnent sans heurt (p. 35). Exemple de la valse au mariage : on avance en comptant que le partenaire recule ; si la valse n'est pas un savoir commun, on se marche sur les pieds (p. 74).", "body_en": "## In Ridgeway\n\nIf two people start from the same assumptions, they anticipate each other's actions and coordinate smoothly (p. 35). The example of the wedding waltz: one steps forward counting on the partner to step back; if the waltz is not common knowledge, they step on each other's feet (p. 74).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.347528}, {"id": "A08", "file": "premisses/A08.md", "type": "auteur", "partie": "P", "titre": "La théorie de l'identité sociale", "enonce": "(Théorie de l'identité sociale.) La simple reconnaissance d'une différence de groupe suffit à susciter une évaluation : chacun tend à juger son propre groupe « meilleur ».", "titre_en": "Social identity theory", "enonce_en": "(Social identity theory.) The mere recognition of a group difference is enough to evoke an evaluation: each tends to judge their own group \"better\".", "citation": "", "pages": [71], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nSi ton groupe est les Rouges et le mien les Bleus, ma première pensée est que les Bleus valent mieux (p. 71). Ce favoritisme ne suffit pas à former une croyance de statut, car il produit des vues concurrentes (p. 71 ; T023).", "body_en": "## In Ridgeway\n\nIf your group is the Reds and mine the Blues, my first thought is that Blues are better (p. 71). This favouritism is not enough to form a status belief, for it produces competing views (p. 71; T023).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["T023"], "corollaires": [], "mtime": 1794590968.3485277}, {"id": "A09", "file": "premisses/A09.md", "type": "auteur", "partie": "P", "titre": "Weber : la richesse d'abord, le statut ensuite", "enonce": "(Weber.) Historiquement, les groupes sociaux acquièrent d'abord la richesse ou le pouvoir, puis, avec le temps, cherchent la distinction dans la culture et les manières pour acquérir aussi la supériorité de statut.", "titre_en": "Weber: wealth first, status later", "enonce_en": "(Weber.) Historically, social groups first acquire wealth or power, then over time seek distinction in culture and manners in order to acquire status superiority as well.", "citation": "", "pages": [59, 82], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nL'acquisition de richesse ou de pouvoir suffit rarement aux groupes (p. 59). L'observation, séduisante et connue, est reprise au chapitre 4 pour la genèse des croyances de statut (p. 82 ; R08).", "body_en": "## In Ridgeway\n\nAcquiring wealth or power is rarely enough for groups (p. 59). The observation, appealing and well known, is taken up in chapter 4 for the genesis of status beliefs (p. 82; R08).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["R08"], "corollaires": [], "mtime": 1794590968.3495271}, {"id": "A10", "file": "premisses/A10.md", "type": "auteur", "partie": "P", "titre": "Tilly : l'inégalité durable", "enonce": "(Tilly.) Une inégalité fondée sur les seules différences individuelles est instable. Pour durer, le contrôle des ressources et du pouvoir doit être consolidé avec une différence catégorielle (ethnie, genre, race, style de vie de classe), qui facilite l'exploitation et l'accaparement des opportunités.", "titre_en": "Tilly: durable inequality", "enonce_en": "(Tilly.) Inequality based on individual differences alone is unstable. To last, control over resources and power must be consolidated with a categorical difference (ethnicity, gender, race, class lifestyle), which facilitates exploitation and opportunity hoarding.", "citation": "", "pages": [126], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nSans catégorie, c'est la ruée permanente pour la préséance, comme les intrigues des prétendants au trône chez Shakespeare (p. 126). L'exploitation est l'appropriation de la valeur produite par d'autres ; l'accaparement, le fait de réserver les opportunités à soi ou à ses semblables ; la frontière entre « nous » et « eux » en fait un projet de groupe (p. 126).", "body_en": "## In Ridgeway\n\nWithout categories, there is a constant scramble for precedence, like the intrigues of pretenders to the throne in Shakespeare (p. 126). Exploitation is appropriating the value produced by others; hoarding, keeping opportunities for oneself or one's own; the boundary between \"us\" and \"them\" turns these into a group project (p. 126).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3495271}, {"id": "A11", "file": "premisses/A11.md", "type": "auteur", "partie": "P", "titre": "Blumer et Bobo : le sentiment de position de groupe", "enonce": "(Blumer, puis Bobo.) Les membres d'un groupe ont un « sentiment de position de groupe » ; l'anxiété de statut que suscite une menace perçue contre la position de leur groupe explique mieux le préjugé racial que l'animosité personnelle.", "titre_en": "Blumer and Bobo: the sense of group position", "enonce_en": "(Blumer, then Bobo.) Members of a group have a \"sense of group position\"; the status anxiety evoked by a perceived threat to their group's position explains racial prejudice better than personal animus.", "citation": "", "pages": [52, 53, 145, 146], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nBobo lit une grande part du préjugé racial hostile comme une réaction des groupes de haut statut aux menaces perçues contre l'ordre racial (p. 52-53). Au chapitre 6, le sentiment de position de groupe devient la façon dont les croyances de statut font vivre la structure de l'inégalité comme une affaire personnelle (p. 145-146).", "body_en": "## In Ridgeway\n\nBobo reads much hostile racial prejudice as a reaction of higher-status groups to perceived threats to the racial order (p. 52-53). In chapter 6, the sense of group position becomes the way status beliefs make the structure of inequality felt as a personal matter (p. 145-146).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3505278}, {"id": "A12", "file": "premisses/A12.md", "type": "auteur", "partie": "P", "titre": "Jackman : l'idéologie légitimante", "enonce": "(Jackman.) Sans idéologie légitimante, consolider l'inégalité matérielle avec une différence catégorielle ne ferait que déplacer la lutte pour les ressources de l'individu au groupe, au lieu de stabiliser l'inégalité.", "titre_en": "Jackman: legitimating ideology", "enonce_en": "(Jackman.) Without a legitimating ideology, consolidating material inequality with a categorical difference would merely move the scramble for resources from the individual to the group level, instead of stabilising inequality.", "citation": "", "pages": [143, 144], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRidgeway en tire que ce sont les croyances de statut qui jouent ce rôle d'idéologie légitimante (p. 143-144 ; T053).", "body_en": "## In Ridgeway\n\nRidgeway concludes that it is status beliefs that play this role of legitimating ideology (p. 143-144; T053).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["T053"], "corollaires": [], "mtime": 1794590968.3505278}, {"id": "A13", "file": "premisses/A13.md", "type": "auteur", "partie": "P", "titre": "Fiske : chaleur et capacité", "enonce": "(Fiske.) Nos perceptions d'autrui ont deux dimensions fondamentales, enracinées dans notre dépendance aux relations : la chaleur (ami ou ennemi ?) et la capacité de réaliser ses intentions, que l'on lit par le statut.", "titre_en": "Fiske: warmth and capability", "enonce_en": "(Fiske.) Our perceptions of others have two fundamental dimensions, rooted in our dependence on relationships: warmth (friend or foe?) and the capability to carry out one's intentions, which we read through status.", "citation": "", "pages": [50], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCes deux dimensions sont le miroir de celles qui nous importent dans notre propre position auprès des autres : l'appartenance et le statut (p. 50).", "body_en": "## In Ridgeway\n\nThese two dimensions mirror those that concern us in our own standing with others: belonging and status (p. 50).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3515275}, {"id": "A14", "file": "premisses/A14.md", "type": "auteur", "partie": "P", "titre": "L'interactionnisme symbolique : le soi naît des interactions", "enonce": "(Interactionnisme symbolique.) On acquiert le concept de soi, ses attributs, ses identités et les émotions qui s'y attachent, principalement dans les interactions avec les autres de son environnement local.", "titre_en": "Symbolic interaction: the self arises from interaction", "enonce_en": "(Symbolic interaction.) People acquire their self-concept, its attributes, identities and attached emotions, mainly in their interactions with others in their local environment.", "citation": "", "pages": [56], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nSi tant d'interactions quotidiennes sont organisées par le statut, leurs issues sont une source puissante de retour sur la valeur sociale de soi, qui pèse, en s'accumulant, sur l'estime de soi et le bien-être (p. 56).", "body_en": "## In Ridgeway\n\nIf so many everyday interactions are organised by status, their outcomes are a powerful source of feedback on the social value of the self, which, as it accumulates, weighs on self-esteem and well-being (p. 56).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3525288}, {"id": "A15", "file": "premisses/A15.md", "type": "auteur", "partie": "P", "titre": "Veblen : la consommation ostentatoire", "enonce": "(Veblen.) La valeur de statut des objets conduit à des conduites de consommation ostentatoire, par lesquelles on se dispute la position à travers ce qu'on montre.", "titre_en": "Veblen: conspicuous consumption", "enonce_en": "(Veblen.) The status value of objects leads to patterns of conspicuous consumption, by which people jockey for position through what they display.", "citation": "", "pages": [113], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRidgeway le cite pour les objets qui acquièrent une valeur de statut (p. 113 ; T039).", "body_en": "## In Ridgeway\n\nRidgeway cites him for objects that acquire status value (p. 113; T039).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["T039"], "corollaires": [], "mtime": 1794590968.3525288}, {"id": "A16", "file": "premisses/A16.md", "type": "auteur", "partie": "P", "titre": "La justification du système", "enonce": "(Psychologie de la justification du système.) Les gens tendent à justifier et à rendre sensée la structure d'inégalité dans laquelle ils se trouvent, y compris quand elle les désavantage.", "titre_en": "System justification", "enonce_en": "(System-justification psychology.) People tend to justify and make sense of the structure of inequality in which they find themselves, even when it disadvantages them.", "citation": "", "pages": [144, 145], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nAccepter les croyances de statut, même désavantageuses, donne un moyen de rendre sensée la structure de l'inégalité, comme l'a montré cette recherche (p. 144-145).", "body_en": "## In Ridgeway\n\nAccepting status beliefs, even disadvantaging ones, provides a means of making sense of the structure of inequality, as this research has shown (p. 144-145).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3525288}, {"id": "E01", "file": "premisses/E01.md", "type": "etude", "partie": "P", "titre": "Bales : les hiérarchies émergent en quelques minutes", "enonce": "(Bales, années 1950.) Dans des groupes d'étudiants homogènes et sans chef, travaillant à une décision commune, des inégalités d'interaction apparaissent vite, se stabilisent souvent en une dizaine de minutes et persistent aux séances suivantes ; participation, réactions positives, jugements et influence y sont corrélés. Des jurys simulés socialement mêlés montrent la même chose.", "titre_en": "Bales: hierarchies emerge within minutes", "enonce_en": "(Bales, 1950s.) In homogeneous, leaderless groups of students working on a shared decision, inequalities in interaction develop quickly, often stabilise within ten minutes or so, and persist in later sessions; participation, positive reactions, assessments and influence are correlated. Socially mixed mock juries show the same.", "citation": "", "pages": [7, 8], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCes études fondent l'étude moderne des hiérarchies de statut interpersonnelles (p. 7-8). Bales en conclut que de telles hiérarchies émergent dans tout groupe coopératif orienté vers un but (p. 8).", "body_en": "## In Ridgeway\n\nThese studies founded the modern study of interpersonal status hierarchies (p. 7-8). Bales concluded that such hierarchies emerge in any cooperative, goal-oriented group (p. 8).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.354553}, {"id": "E02", "file": "premisses/E02.md", "type": "etude", "partie": "P", "titre": "Le statut est accordé pour la valeur perçue", "enonce": "Il est massivement établi que, dans les situations d'interdépendance coopérative, les membres accordent estime et influence en échange de la valeur perçue de chacun pour l'effort commun.", "titre_en": "Status is granted for perceived value", "enonce_en": "There is overwhelming evidence that, in situations of cooperative interdependence, members grant esteem and influence in exchange for each person's perceived value to the shared effort.", "citation": "", "pages": [13, 25], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\n« Overwhelming evidence » (p. 13), rappelée au chapitre 2 (p. 25) : dans les groupes de Bales, ceux qui prenaient l'ascendant étaient ceux qu'on jugeait avoir les « meilleures idées » (p. 13).", "body_en": "## In Ridgeway\n\n\"Overwhelming evidence\" (p. 13), recalled in chapter 2 (p. 25): in Bales's groups, those who became prominent were those perceived as having the \"best ideas\" (p. 13).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3555586}, {"id": "E03", "file": "premisses/E03.md", "type": "etude", "partie": "P", "titre": "Chase : les différences individuelles ne suffisent pas", "enonce": "(Chase et coll.) Dans des groupes de trois ou plus, même chez des poissons ou des poules, les différences individuelles préalables prédisent le rang sans le déterminer entièrement ; la formation de la hiérarchie dépend de processus contingents entre plusieurs individus.", "titre_en": "Chase: individual differences are not enough", "enonce_en": "(Chase and colleagues.) In groups of three or more, even among fish or chickens, prior individual differences predict rank without fully determining it; hierarchy formation depends on contingent processes among several individuals.", "citation": "", "pages": [28, 29], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nChase a d'abord montré, en logique, que les corrélations devraient être très élevées pour que les différences individuelles déterminent des hiérarchies linéaires ; avec Seitz, il montre que la réponse est dans des processus contingents à trois ou plus (p. 28-29).", "body_en": "## In Ridgeway\n\nChase first showed, as a logical matter, that correlations would have to be very high for individual differences to determine linear hierarchies; with Seitz, he shows that the answer lies in contingent processes among three or more (p. 28-29).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3560686}, {"id": "E04", "file": "premisses/E04.md", "type": "etude", "partie": "P", "titre": "Horne : des intérêts d'échange interdépendants aux normes", "enonce": "(Horne.) Quand les membres d'un groupe ont des intérêts d'échange interdépendants, ils forment des normes qu'ils font respecter.", "titre_en": "Horne: from interdependent exchange interests to norms", "enonce_en": "(Horne.) When group members have interdependent exchange interests, they form norms that they enforce.", "citation": "", "pages": [30], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRidgeway s'appuie sur ces travaux pour passer de l'intérêt de chacun à la déférence des autres à la formation d'une norme (p. 30).", "body_en": "## In Ridgeway\n\nRidgeway relies on this work to move from each member's interest in others' deference to the formation of a norm (p. 30).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3570774}, {"id": "E05", "file": "premisses/E05.md", "type": "etude", "partie": "P", "titre": "Ridgeway et Diekema : les tiers contre le dominateur", "enonce": "(Ridgeway et Diekema.) Dans des groupes de quatre du même sexe, quand un complice attaque agressivement un autre, les deux participants témoins attaquent spontanément l'attaquant ; le dominateur n'obtient pas plus d'influence qu'un complice neutre aux mêmes arguments, et il est même jugé moins
