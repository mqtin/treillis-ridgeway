ends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExemple de croyances propres à une communauté (p. 76), repris pour l'avantage de statut en ligne (p. 92).", "body_en": "## In Ridgeway\n\nAn example of community-specific beliefs (p. 76), taken up for status advantage online (p. 92).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.281076}, {"id": "E27", "file": "premisses/E27.md", "type": "etude", "partie": "P", "titre": "Le savoir commun autorise la coordination risquée", "enonce": "Dans des jeux où travailler ensemble rapporte plus, mais seulement si les deux le font, les participants prennent plus volontiers ce risque quand les règles sont un savoir commun que quand elles sont seulement partagées ou privées.", "titre_en": "Common knowledge licenses risky coordination", "enonce_en": "In games where working together pays more, but only if both do, participants more readily take that risk when the rules are common knowledge than when they are merely shared or private.", "titre_de": "Gemeinsames Wissen ermöglicht riskante Koordination", "enonce_de": "In Spielen, in denen Zusammenarbeit mehr einbringt, aber nur wenn beide mitmachen, gehen die Teilnehmer dieses Risiko eher ein, wenn die Regeln gemeinsames Wissen sind, als wenn sie nur geteilt oder privat sind.", "body_de": "## Bei Ridgeway\n\nDie Forscher folgern, dass der Geist gemeinsames Wissen als eigene Kategorie darstellt, die zur Koordination zum gegenseitigen Nutzen berechtigt (S. 75).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [75], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes chercheurs en concluent que l'esprit traite le savoir commun comme une catégorie à part, qui autorise à se coordonner pour un gain mutuel (p. 75).", "body_en": "## In Ridgeway\n\nThe researchers conclude that the mind represents common knowledge as a distinct category that licenses coordination for mutual gain (p. 75).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.281076}, {"id": "E28", "file": "premisses/E28.md", "type": "etude", "partie": "P", "titre": "Les expériences de la construction du statut", "enonce": "Une différence artificielle (un « style de réponse »), associée à une petite différence de paie, suffit, après deux rencontres où la paie produit une différence d'influence, à faire naître chez tous des croyances de statut de troisième ordre favorables au groupe mieux payé, jugé aussi moins attentionné ; sans la hiérarchie d'influence, ou si un participant la conteste, aucune croyance ne se forme. Les croyances se transmettent ensuite par la manière dont on traite les autres.", "titre_en": "The status construction experiments", "enonce_en": "An artificial difference (a \"response style\"), tied to a small pay difference, is enough, after two encounters in which pay produces a difference in influence, to give everyone third-order status beliefs favouring the better-paid group, also seen as less considerate; without the influence hierarchy, or if a participant challenges it, no belief forms. Beliefs are then passed on through how others are treated.", "titre_de": "Die Experimente zur Statuskonstruktion", "enonce_de": "Ein künstlicher Unterschied (ein „Antwortstil“), verbunden mit einem kleinen Lohnunterschied, genügt nach zwei Begegnungen, in denen der Lohn einen Unterschied im Einfluss erzeugt, damit alle Statusüberzeugungen dritter Ordnung zugunsten der besser bezahlten Gruppe bilden, die zugleich als weniger rücksichtsvoll gilt; ohne die Einflusshierarchie oder wenn ein Teilnehmer sie anficht, bildet sich keine Überzeugung. Die Überzeugungen werden dann durch die Art weitergegeben, wie man andere behandelt.", "body_de": "## Bei Ridgeway\n\nEine Reihe von Experimenten (S. 84-85); Anfechtung (S. 85); jeder verzerrende Faktor, nicht nur der Lohn (S. 86); Weitergabe durch Behandlung, Diffusionssimulationen und die interkulturellen Daten von Brashears (S. 86).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [84, 85, 86], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nSérie d'expériences (p. 84-85) ; contestation (p. 85) ; tout facteur biaisant, pas seulement la paie (p. 86) ; transmission par le traitement, simulations de diffusion et données interculturelles de Brashears (p. 86).", "body_en": "## In Ridgeway\n\nA series of experiments (p. 84-85); challenge (p. 85); any biasing factor, not only pay (p. 86); transmission through treatment, diffusion simulations and Brashears's cross-cultural data (p. 86).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.282076}, {"id": "E29", "file": "premisses/E29.md", "type": "etude", "partie": "P", "titre": "Hamilton : on infère spontanément les traits d'un groupe", "enonce": "(Hamilton et coll.) Avec très peu d'indices qu'un individu appartient à un groupe dont les membres agissent de même, on infère spontanément les traits du membre typique de tout le groupe.", "titre_en": "Hamilton: people spontaneously infer group traits", "enonce_en": "(Hamilton and colleagues.) With very little evidence that an individual belongs to a group whose members act alike, people spontaneously infer the traits of the typical member of the whole group.", "titre_de": "Hamilton: man schließt spontan auf Gruppenmerkmale", "enonce_de": "(Hamilton und Mitarbeiter.) Schon bei sehr wenigen Hinweisen, dass ein Individuum einer Gruppe angehört, deren Mitglieder sich ähnlich verhalten, schließt man spontan auf die Merkmale des typischen Mitglieds der ganzen Gruppe.", "body_de": "## Bei Ridgeway\n\nDa Gruppen für das menschliche Leben grundlegend sind, ist das Denken, selbst auf automatischer Ebene, auf Gruppen ebenso eingestellt wie auf Individuen (S. 85).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [85], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes groupes étant fondamentaux dans la vie humaine, la pensée, même automatique, est accordée aux groupes autant qu'aux individus (p. 85).", "body_en": "## In Ridgeway\n\nGroups being fundamental to human life, thinking, even at an automatic level, is tuned to groups as well as individuals (p. 85).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.282076}, {"id": "E30", "file": "premisses/E30.md", "type": "etude", "partie": "P", "titre": "Wood, Eagly et Huber : division sexuelle du travail et ressources", "enonce": "(Wood et Eagly ; Huber.) Toutes les sociétés développent une division sexuelle du travail, enracinée dans l'interdépendance pour la reproduction ; la domination masculine s'associe aux circonstances où des contraintes biologiques (force du haut du corps, mobilité des mères allaitantes) donnent aux hommes le contrôle de la production des ressources valorisées.", "titre_en": "Wood, Eagly and Huber: gendered division of labour and resources", "enonce_en": "(Wood and Eagly; Huber.) All societies develop a gendered division of labour, rooted in interdependence for reproduction; male dominance is associated with circumstances in which biological constraints (upper-body strength, the mobility of nursing mothers) give men control over the production of valued resources.", "titre_de": "Wood, Eagly und Huber: geschlechtliche Arbeitsteilung und Ressourcen", "enonce_de": "(Wood und Eagly; Huber.) Alle Gesellschaften entwickeln eine geschlechtliche Arbeitsteilung, die in der Interdependenz bei der Fortpflanzung wurzelt; männliche Dominanz geht mit Umständen einher, in denen biologische Zwänge (Kraft des Oberkörpers, Beweglichkeit stillender Mütter) den Männern die Kontrolle über die Erzeugung begehrter Ressourcen geben.", "body_de": "## Bei Ridgeway\n\nDas sind mit den Befunden vereinbare Theorien; die historischen Ursprünge männlicher Dominanz bleiben unbekannt (S. 87-88).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [87, 88], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCe sont des théories compatibles avec les données ; les origines historiques de la domination masculine restent inconnues (p. 87-88).", "body_en": "## In Ridgeway\n\nThese are theories consistent with the evidence; the historical origins of male dominance remain unknown (p. 87-88).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.282076}, {"id": "E31", "file": "premisses/E31.md", "type": "etude", "partie": "P", "titre": "Une autorité légitime suffit à créer une croyance de statut", "enonce": "Quand une autorité légitime fournit une information d'apparence valide reliant une différence de groupe (entre universités) à des destins hiérarchisés (le succès économique des diplômés), les participants forment des croyances de statut sur cette différence.", "titre_en": "A legitimate authority suffices to create a status belief", "enonce_en": "When a legitimate authority provides apparently valid information linking a group difference (between colleges) to ranked life outcomes (graduates' economic success), participants form status beliefs about that difference.", "titre_de": "Eine legitime Autorität genügt, um eine Statusüberzeugung zu schaffen", "enonce_de": "Liefert eine legitime Autorität scheinbar gültige Informationen, die einen Gruppenunterschied (zwischen Colleges) mit abgestuften Lebenschancen (dem wirtschaftlichen Erfolg der Absolventen) verbinden, so bilden die Teilnehmer Statusüberzeugungen über diesen Unterschied.", "body_de": "## Bei Ridgeway\n\nWie in den Experimenten zur Statuskonstruktion (S. 89-90).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [89, 90], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nComme dans les expériences de construction du statut (p. 89-90).", "body_en": "## In Ridgeway\n\nAs in the status construction experiments (p. 89-90).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2830753}, {"id": "E32", "file": "premisses/E32.md", "type": "etude", "partie": "P", "titre": "Le statut des organisations", "enonce": "(Sauder et coll.) Le statut des organisations naît et se propage par association (s'allier à une organisation prestigieuse élève) et par des évaluateurs tiers : critiques, guides, classements ; ces classements biaisent les jugements de qualité et donnent un avantage sur le marché.", "titre_en": "The status of organisations", "enonce_en": "(Sauder and colleagues.) Organisational status arises and spreads through association (partnering with a prestigious organisation raises one's own) and through third-party evaluators: critics, guides, rankings; these rankings bias judgements of quality and give market advantage.", "titre_de": "Der Status von Organisationen", "enonce_de": "(Sauder und Mitarbeiter.) Der Status von Organisationen entsteht und verbreitet sich durch Verbindung (eine Partnerschaft mit einer angesehenen Organisation hebt die eigene) und durch dritte Bewerter: Kritiker, Führer, Ranglisten; diese Ranglisten verzerren Qualitätsurteile und verschaffen Marktvorteile.", "body_de": "## Bei Ridgeway\n\nDie Nachrichten-App, die mit Facebook kooperiert, der Guide Michelin, die Rangliste von *U.S. News & World Report*, die selbst für jene zählt, die an ihr zweifeln, weil ihre Bekanntheit sie zu gemeinsamem Wissen macht (S. 90-91); Marktvorteile (S. 91-92).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [90, 91, 92], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nL'application de messagerie qui s'associe à Facebook, le guide Michelin, le classement de *U.S. News & World Report*, qui pèse même pour ceux qui le jugent douteux, parce que sa publicité en fait un savoir commun (p. 90-91) ; avantages sur le marché (p. 91-92).", "body_en": "## In Ridgeway\n\nThe messaging app that partners with Facebook, the Michelin guide, the *U.S. News & World Report* ranking, which matters even to those who doubt it, because its publicity makes it common knowledge (p. 90-91); market advantages (p. 91-92).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2830753}, {"id": "E33", "file": "premisses/E33.md", "type": "etude", "partie": "P", "titre": "Les expériences sur l'inférence de troisième ordre", "enonce": "Des évaluateurs qui jugent une candidate au poste de chef de police un peu meilleure que le candidat peuvent préférer l'homme, plus facile à « vendre » ; on préfère le candidat aux diplômes prestigieux comme choix sûr, même si l'on sait les autres ouverts à un candidat hors norme, tant que cette ouverture n'est pas un savoir commun.", "titre_en": "The third-order inference experiments", "enonce_en": "Evaluators who judge a woman candidate for police chief slightly better than the man may still favour the man, easier to \"sell\"; people favour the candidate with high-status credentials as the safe choice, even knowing others may be open to an unconventional one, as long as that openness is not common knowledge.", "titre_de": "Die Experimente zur Inferenz dritter Ordnung", "enonce_de": "Bewertende, die eine Bewerberin für das Amt der Polizeichefin für etwas besser halten als den Bewerber, können dennoch den Mann bevorzugen, weil er leichter zu „verkaufen“ ist; man bevorzugt den Bewerber mit prestigeträchtigen Abschlüssen als sichere Wahl, selbst wenn man weiß, dass andere für einen unkonventionellen offen wären, solange diese Offenheit kein gemeinsames Wissen ist.", "body_de": "## Bei Ridgeway\n\nExperimente von Ridgeway und ihren Kollegen (S. 95).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [95], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExpériences de Ridgeway et de ses collègues (p. 95).", "body_en": "## In Ridgeway\n\nExperiments by Ridgeway and her colleagues (p. 95).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2841752}, {"id": "E34", "file": "premisses/E34.md", "type": "etude", "partie": "P", "titre": "Dilemmes sociaux : le statut récompense qui contribue", "enonce": "Dans les dilemmes sociaux, où contribuer coûte à l'individu alors que tous gagneraient à coopérer, les groupes accordent statut et influence à ceux qui contribuent malgré le coût, quelle que soit leur compétence perçue ; à l'inverse, quand la réussite est cruciale, ils défèrent à un membre très compétent même s'il est égoïste.", "titre_en": "Social dilemmas: status rewards contributors", "enonce_en": "In social dilemmas, where contributing is costly to the individual although all would gain from cooperating, groups award status and influence to those who contribute despite the cost, whatever their perceived competence; conversely, when success is crucial, they defer to a highly competent member even if selfish.", "titre_de": "Soziale Dilemmata: Status belohnt, wer beiträgt", "enonce_de": "In sozialen Dilemmata, in denen der Beitrag den Einzelnen etwas kostet, obwohl alle von Zusammenarbeit profitieren würden, gewähren Gruppen denen Status und Einfluss, die trotz der Kosten beitragen, unabhängig von ihrer wahrgenommenen Kompetenz; umgekehrt beugen sie sich, wenn der Erfolg entscheidend ist, einem sehr kompetenten Mitglied, selbst wenn es selbstsüchtig ist.", "body_de": "## Bei Ridgeway\n\nSoziale Dilemmata (S. 98-99); der arrogante, begabte Mannschaftskamerad im großen Spiel (S. 99).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [98, 99], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDilemmes sociaux (p. 98-99) ; le coéquipier arrogant et doué pendant le grand match (p. 99).", "body_en": "## In Ridgeway\n\nSocial dilemmas (p. 98-99); the arrogant, gifted teammate during the big game (p. 99).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2841752}, {"id": "E35", "file": "premisses/E35.md", "type": "etude", "partie": "P", "titre": "Kilduff et Galinsky : un état d'esprit suffit à fonder une hiérarchie", "enonce": "(Kilduff et Galinsky.) Dans des trios homogènes, le membre placé au hasard dans un état d'esprit d'« approche » agit plus proactivement et devient de plus haut statut que celui placé en « prévention » ; la différence persiste quand le groupe se retrouve un ou deux jours plus tard, indépendamment de la personnalité.", "titre_en": "Kilduff and Galinsky: a mind-set suffices to found a hierarchy", "enonce_en": "(Kilduff and Galinsky.) In homogeneous triads, the member randomly given an \"approach\" mind-set acts more proactively and gains higher status than the one given a \"prevention\" focus; the difference persists when the group meets again a day or two later, independently of personality.", "titre_de": "Kilduff und Galinsky: eine Einstellung genügt, um eine Hierarchie zu begründen", "enonce_de": "(Kilduff und Galinsky.) In homogenen Dreiergruppen handelt das Mitglied, das zufällig in eine „Annäherungs“-Einstellung versetzt wurde, proaktiver und erlangt höheren Status als das in eine „Vermeidungs“-Haltung versetzte; der Unterschied bleibt bestehen, wenn sich die Gruppe ein oder zwei Tage später wieder trifft, unabhängig von der Persönlichkeit.", "body_de": "## Bei Ridgeway\n\nVersuchsaufbau und Ergebnisse (S. 102-103).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [102, 103], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nProtocole et résultats (p. 102-103).", "body_en": "## In Ridgeway\n\nDesign and results (p. 102-103).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2851837}, {"id": "E36", "file": "premisses/E36.md", "type": "etude", "partie": "P", "titre": "Les indices se combinent selon leur pertinence", "enonce": "Les membres d'un groupe agissent comme s'ils pondéraient et combinaient les implications de tous les indices de statut saillants selon leur pertinence pour la tâche, avec un effet d'incohérence (un indice qui contredit ce qu'on sait pèse plus) et un effet d'atténuation (un indice qui confirme pèse de moins en moins).", "titre_en": "Cues combine by relevance", "enonce_en": "Group members act as if they weighted and combined the implications of all salient status cues by their relevance to the task, with an inconsistency effect (a cue that contradicts what is known weighs more) and an attenuation effect (a confirming cue weighs less and less).", "titre_de": "Hinweise werden nach ihrer Relevanz verrechnet", "enonce_de": "Gruppenmitglieder verhalten sich, als würden sie die Implikationen aller salienten Statushinweise nach ihrer Relevanz für die Aufgabe gewichten und verrechnen, mit einem Inkonsistenzeffekt (ein Hinweis, der dem Bekannten widerspricht, wiegt mehr) und einem Abschwächungseffekt (ein bestätigender Hinweis wiegt immer weniger).", "body_de": "## Bei Ridgeway\n\nDie Informatikerin in einer gemischtgeschlechtlichen Gruppe, die an einer Webprogrammierungsaufgabe arbeitet; der in Harvard ausgebildete Chirurg, der sich als Afroamerikaner erweist (S. 104-105).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [104, 105], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nL'informaticienne dans un groupe mixte travaillant sur une tâche de programmation ; le chirurgien formé à Harvard qui se révèle afro-américain (p. 104-105).", "body_en": "## In Ridgeway\n\nThe woman computer scientist in a mixed-sex group working on a web-programming task; the Harvard-trained surgeon who turns out to be African American (p. 104-105).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2857914}, {"id": "E37", "file": "premisses/E37.md", "type": "etude", "partie": "P", "titre": "Les effets des caractéristiques passent par les attentes", "enonce": "Une méta-analyse montre que l'effet des caractéristiques de statut (éducation, race, genre) sur la déférence et l'influence passe par les attentes de performance ; la simple connaissance des caractéristiques d'un partenaire suffit à modifier l'acceptation de son influence.", "titre_en": "The effects of characteristics run through expectations", "enonce_en": "A meta-analysis shows that the effect of status characteristics (education, race, gender) on deference and influence runs through performance expectations; merely knowing a partner's characteristics is enough to change the acceptance of their influence.", "titre_de": "Die Wirkungen der Merkmale laufen über die Erwartungen", "enonce_de": "Eine Metaanalyse zeigt, dass die Wirkung von Statusmerkmalen (Bildung, Rasse, Geschlecht) auf Ehrerbietung und Einfluss über die Leistungserwartungen läuft; schon das bloße Wissen um die Merkmale eines Partners verändert die Bereitschaft, seinen Einfluss anzunehmen.", "body_de": "## Bei Ridgeway\n\nDiese Wirkungen lassen sich nicht durch vorab bestehende Unterschiede in Persönlichkeit oder Verhalten zwischen Gruppen erklären (S. 108).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [108], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCes effets ne s'expliquent pas par des différences préalables de personnalité ou de conduite entre groupes (p. 108).", "body_en": "## In Ridgeway\n\nThese effects cannot be explained by preexisting differences in personality or behaviour between groups (p. 108).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2857914}, {"id": "E38", "file": "premisses/E38.md", "type": "etude", "partie": "P", "titre": "Dovidio : l'affirmation suit le genre de la tâche", "enonce": "(Dovidio et coll.) Dans des duos mixtes, les hommes sont un peu plus affirmés, en paroles et en gestes, sur une tâche neutre, nettement plus sur une tâche masculine ; sur une tâche féminine, la hiérarchie s'inverse.", "titre_en": "Dovidio: assertiveness follows the gender typing of the task", "enonce_en": "(Dovidio and colleagues.) In mixed-sex dyads, men are modestly more assertive, verbally and nonverbally, on a neutral task, clearly more on a masculine-typed task; on a feminine-typed task, the hierarchy reverses.", "titre_de": "Dovidio: die Durchsetzungsfähigkeit folgt der geschlechtlichen Prägung der Aufgabe", "enonce_de": "(Dovidio und Mitarbeiter.) In gemischtgeschlechtlichen Paaren treten Männer bei einer neutralen Aufgabe verbal und nonverbal etwas bestimmter auf, bei einer männlich geprägten Aufgabe deutlich bestimmter; bei einer weiblich geprägten Aufgabe kehrt sich die Hierarchie um.", "body_de": "## Bei Ridgeway\n\nDas oft unbewusste nonverbale Verhalten reagiert fein auf Erwartungsvorteile (S. 109-110).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [109, 110], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLa conduite non verbale, souvent inconsciente, réagit finement aux avantages d'attente (p. 109-110).", "body_en": "## In Ridgeway\n\nNonverbal behaviour, often unconscious, responds subtly to expectation advantages (p. 109-110).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2867987}, {"id": "E39", "file": "premisses/E39.md", "type": "etude", "partie": "P", "titre": "Shih : l'attente modifie la performance", "enonce": "(Shih et coll.) La performance en mathématiques de femmes asiatiques baisse quand on rend saillant leur genre et monte quand on rend saillante leur race.", "titre_en": "Shih: expectations change performance", "enonce_en": "(Shih and colleagues.) Asian women's performance on a math test goes down when their gender is made salient and up when their race is made salient.", "titre_de": "Shih: Erwartungen verändern die Leistung", "enonce_de": "(Shih und Mitarbeiter.) Die Leistung asiatischer Frauen in einem Mathematiktest sinkt, wenn ihr Geschlecht salient gemacht wird, und steigt, wenn ihre Rasse salient gemacht wird.", "body_de": "## Bei Ridgeway\n\nDie Wirkung, von der Erwartungszustandsforschung belegt, entspricht der „Stereotypenbedrohung“ (S. 110).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [110], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nL'effet, documenté par la recherche sur les états d'attente, équivaut à la « menace du stéréotype » (p. 110).", "body_en": "## In Ridgeway\n\nThe effect, documented by expectation states research, is equivalent to \"stereotype threat\" (p. 110).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2867987}, {"id": "E40", "file": "premisses/E40.md", "type": "etude", "partie": "P", "titre": "Doubles standards et critères mouvants", "enonce": "Les doubles standards biaisent l'auto-évaluation des femmes dans les tâches masculines et leur orientation professionnelle (Correll) ; des professionnels de l'investissement suivent moins les recommandations des femmes ; pour un poste de chef de police, on justifie la préférence pour les hommes par le critère, études ou expérience, qui les favorise (Uhlmann et Cohen).", "titre_en": "Double standards and shifting criteria", "enonce_en": "Double standards bias women's self-assessments at male-typed tasks and their career choices (Correll); investment professionals attend less to women's recommendations; for a police chief job, people justify preferring men by whichever criterion, education or experience, favours them (Uhlmann and Cohen).", "titre_de": "Doppelte Standards und wechselnde Kriterien", "enonce_de": "Doppelte Standards verzerren die Selbsteinschätzung von Frauen bei männlich geprägten Aufgaben und ihre Berufswahl (Correll); Anlageprofis beachten Empfehlungen von Frauen weniger; bei einer Stelle als Polizeichef rechtfertigt man die Bevorzugung von Männern mit demjenigen Kriterium, Ausbildung oder Erfahrung, das sie begünstigt (Uhlmann und Cohen).", "body_de": "## Bei Ridgeway\n\nDie drei Studien (S. 111).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [111], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes trois études (p. 111).", "body_en": "## In Ridgeway\n\nThe three studies (p. 111).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2879016}, {"id": "E41", "file": "premisses/E41.md", "type": "etude", "partie": "P", "titre": "Les récompenses créent des attentes", "enonce": "Un « honneur » sans valeur matérielle (être invité à une réception avec un dignitaire) donne plus d'influence dans la tâche suivante (Hysom et coll.) ; des jetons de même valeur mais de la couleur associée aux participants de haut statut se vendent plus cher (Thye).", "titre_en": "Rewards create expectations", "enonce_en": "An \"honour\" with no material value (being invited to a reception with a dignitary) brings more influence in the next task (Hysom and colleagues); chips of the same value but of the colour associated with high-status participants fetch higher prices (Thye).", "titre_de": "Belohnungen erzeugen Erwartungen", "enonce_de": "Eine „Ehrung“ ohne materiellen Wert (die Einladung zu einem Empfang mit einem Würdenträger) verschafft bei der nächsten Aufgabe mehr Einfluss (Hysom und Mitarbeiter); Spielmarken gleichen Werts, aber in der Farbe, die mit ranghohen Teilnehmern verbunden ist, erzielen höhere Preise (Thye).", "body_de": "## Bei Ridgeway\n\nDie beiden Experimente (S. 112-113).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [112, 113], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes deux expériences (p. 112-113).", "body_en": "## In Ridgeway\n\nThe two experiments (p. 112-113).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2879016}, {"id": "E42", "file": "premisses/E42.md", "type": "etude", "partie": "P", "titre": "Bendersky et Shah : le statut des extravertis décline", "enonce": "(Bendersky et Shah.) Dans des équipes de MBA notées, les extravertis gagnent d'abord du statut puis le perdent, les autres étant déçus de leur performance ; les membres plus névrotiques, d'abord bas, montent un peu.", "titre_en": "Bendersky and Shah: extraverts' status declines", "enonce_en": "(Bendersky and Shah.) In graded MBA teams, extraverts gain status at first and then lose it, as others are disappointed with their performance; more neurotic members, low at first, rise a little.", "titre_de": "Bendersky und Shah: der Status der Extravertierten sinkt", "enonce_de": "(Bendersky und Shah.) In benoteten MBA-Teams gewinnen Extravertierte zunächst Status und verlieren ihn dann, weil die anderen von ihrer Leistung enttäuscht sind; neurotischere Mitglieder, anfangs niedrig, steigen etwas auf.", "body_de": "## Bei Ridgeway\n\nWeder Extraversion noch Dominanz hängen besonders mit tatsächlicher Kompetenz zusammen (S. 115-116).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [115, 116], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nNi l'extraversion ni la dominance ne sont particulièrement corrélées à la compétence réelle (p. 115-116).", "body_en": "## In Ridgeway\n\nNeither extraversion nor dominance is particularly correlated with actual competence (p. 115-116).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2889006}, {"id": "E43", "file": "premisses/E43.md", "type": "etude", "partie": "P", "titre": "La générosité des membres de haut statut", "enonce": "Les membres de haut statut se montrent plus généreux et plus coopératifs que ceux de bas statut, surtout quand leur légitimité est menacée ; cette générosité peut disparaître quand la hiérarchie devient plus légitime.", "titre_en": "The generosity of high-status members", "enonce_en": "High-status members show more generosity and cooperation than low-status members, especially when their legitimacy is threatened; this generosity may disappear as the hierarchy becomes more legitimate.", "titre_de": "Die Großzügigkeit der Mitglieder mit hohem Status", "enonce_de": "Mitglieder mit hohem Status zeigen mehr Großzügigkeit und Kooperation als solche mit niedrigem Status, vor allem wenn ihre Legitimität bedroht ist; diese Großzügigkeit kann verschwinden, wenn die Hierarchie legitimer wird.", "body_de": "## Bei Ridgeway\n\nEin Spiegel der Unsicherheit des Status und der Notwendigkeit, Gruppenorientierung zu beweisen (S. 116).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [116], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nReflet de l'insécurité du statut et du besoin de prouver son orientation vers le groupe (p. 116).", "body_en": "## In Ridgeway\n\nA reflection of the insecurity of status and of the need to prove group orientation (p. 116).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2889006}, {"id": "E44", "file": "premisses/E44.md", "type": "etude", "partie": "P", "titre": "L'obéissance suit les caractéristiques diffuses", "enonce": "(Ridgeway et coll.) À influence égale, un membre de haut statut avantagé par des caractéristiques diffuses (plus âgé, titulaire d'un master) obtient plus d'obéissance à ses ordres qu'un membre devenu influent par un meilleur score à un test d'expertise malgré un moindre diplôme.", "titre_en": "Compliance follows diffuse characteristics", "enonce_en": "(Ridgeway and colleagues.) At equal influence, a high-status member advantaged by diffuse characteristics (older, holding an MA) obtains more compliance with directives than a member who became influential through a higher score on an expertise test despite less education.", "titre_de": "Gehorsam folgt den diffusen Merkmalen", "enonce_de": "(Ridgeway und Mitarbeiter.) Bei gleichem Einfluss erreicht ein ranghohes Mitglied, das durch diffuse Merkmale begünstigt ist (älter, mit Masterabschluss), mehr Gehorsam gegenüber seinen Anweisungen als ein Mitglied, das trotz geringerer Bildung durch ein besseres Ergebnis in einem Fachtest einflussreich wurde.", "body_de": "## Bei Ridgeway\n\nVersuchsaufbau und Ergebnis (S. 117-118).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [117, 118], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nProtocole et résultat (p. 117-118).", "body_en": "## In Ridgeway\n\nDesign and result (p. 117-118).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.289901}, {"id": "E45", "file": "premisses/E45.md", "type": "etude", "partie": "P", "titre": "Le rejet des subordonnés qui s'affirment", "enonce": "Une conduite dominante et autopromotionnelle d'une femme blanche ou d'un homme afro-américain en contexte professionnel suscite résistance et antipathie, et réduit leur employabilité ; chez les femmes, ce sont les conduites de dominance explicites (les ordres) qui la déclenchent ; les femmes de couleur échappent parfois au rejet par une « invisibilité intersectionnelle ».", "titre_en": "Backlash against assertive subordinates", "enonce_en": "Dominant, self-promoting behaviour from a white woman or an African American man in a professional context evokes resistance and dislike, and reduces their hireability; for women, it is explicit dominance (directives) that triggers it; women of color sometimes escape backlash through \"intersectional invisibility\".", "titre_de": "Abwehr gegen selbstbewusste Untergeordnete", "enonce_de": "Dominantes, selbstanpreisendes Verhalten einer weißen Frau oder eines afroamerikanischen Mannes im beruflichen Umfeld ruft Widerstand und Ablehnung hervor und verringert ihre Chancen, eingestellt zu werden; bei Frauen lösen ausdrückliche Dominanzhandlungen (Anweisungen) sie aus; Frauen of Color entgehen der Abwehr manchmal durch „intersektionale Unsichtbarkeit“.", "body_de": "## Bei Ridgeway\n\nArbeiten von Rudman und Mitarbeitern und die Reaktion auf afroamerikanische Männer (S. 52); Studien und eine Metaanalyse (S. 118); intersektionale Unsichtbarkeit (S. 118-119).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [52, 118, 119], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nTravaux de Rudman et coll. et réaction envers les hommes afro-américains (p. 52) ; études et méta-analyse (p. 118) ; invisibilité intersectionnelle (p. 118-119).", "body_en": "## In Ridgeway\n\nWork by Rudman and colleagues and the reaction to African American men (p. 52); studies and a meta-analysis (p. 118); intersectional invisibility (p. 118-119).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.290903}, {"id": "E46", "file": "premisses/E46.md", "type": "etude", "partie": "P", "titre": "Korver-Glenn : les biais raciaux dans l'immobilier", "enonce": "(Korver-Glenn.) Les biais de statut raciaux dans les transactions immobilières produisent une discrimination qui s'accumule au fil des étapes de l'achat ou de la vente d'un logement.", "titre_en": "Korver-Glenn: racial bias in real estate", "enonce_en": "(Korver-Glenn.) Racial status biases in real estate transactions produce discrimination that accumulates over the stages of buying or selling a home.", "titre_de": "Korver-Glenn: rassistische Verzerrungen im Immobilienmarkt", "enonce_de": "(Korver-Glenn.) Rassistische Statusverzerrungen bei Immobiliengeschäften erzeugen eine Diskriminierung, die sich über die Etappen des Kaufs oder Verkaufs einer Wohnung anhäuft.", "body_de": "## Bei Ridgeway\n\nEin deutliches Beispiel dafür, wie sich kleine Verzerrungen anhäufen (S. 131).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [131], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExemple clair de l'accumulation de petits biais (p. 131).", "body_en": "## In Ridgeway\n\nA clear example of small biases accumulating (p. 131).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2919023}, {"id": "E47", "file": "premisses/E47.md", "type": "etude", "partie": "P", "titre": "Des pratiques organisationnelles biaisées", "enonce": "Les présupposés sur les groupes dominants s'inscrivent dans les structures des organisations : la semaine de travail suppose un « travailleur idéal » sans charge d'enfants, le surtravail des postes bien payés pénalise les femmes, l'école valorise des styles de classe moyenne blanche, et des grilles de classification des emplois, construites en comité, paient mieux les emplois masculins (Nelson et Bridges).", "titre_en": "Biased organisational practices", "enonce_en": "Assumptions about dominant groups are embedded in organisational structures: the workweek implies an \"ideal worker\" with no childcare duties, overwork in well-paid jobs penalises women, schools value white middle-class styles, and job classification systems, built in committee, pay men's jobs better (Nelson and Bridges).", "titre_de": "Verzerrte Praktiken in Organisationen", "enonce_de": "Annahmen über vorherrschende Gruppen sind in die Strukturen von Organisationen eingeschrieben: Die Arbeitswoche unterstellt einen „idealen Arbeitnehmer“ ohne Kinderbetreuungspflichten, Mehrarbeit in gut bezahlten Stellen benachteiligt Frauen, Schulen schätzen Stile der weißen Mittelschicht, und im Ausschuss entworfene Stellenbewertungssysteme bezahlen Männerberufe besser (Nelson und Bridges).", "body_de": "## Bei Ridgeway\n\nBeispiele (S. 132); diese Praktiken bestehen aus Trägheit fort (S. 132); der Fall der Bewertungssysteme (S. 133).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [132, 133], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExemples (p. 132) ; ces pratiques persistent par inertie (p. 132) ; le cas des grilles de classification (p. 133).", "body_en": "## In Ridgeway\n\nExamples (p. 132); these practices persist through inertia (p. 132); the case of classification systems (p. 133).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2919023}, {"id": "E48", "file": "premisses/E48.md", "type": "etude", "partie": "P", "titre": "Zou et Cheryan : deux dimensions de la position raciale", "enonce": "(Zou et Cheryan.) La position des groupes raciaux aux États-Unis se lit sur deux dimensions : l'(in)compétence perçue et l'« étrangeté » culturelle. Les Blancs sont vus compétents et culturellement adaptés, les Asiatiques compétents mais très étrangers, les Latinos moins compétents et un peu étrangers, les Afro-Américains moins compétents mais peu étrangers.", "titre_en": "Zou and Cheryan: two dimensions of racial position", "enonce_en": "(Zou and Cheryan.) The position of racial groups in the United States reads on two dimensions: perceived (in)competence and cultural \"foreignness\". Whites are seen as competent and culturally adept, Asians as competent but very foreign, Latinx people as less competent and somewhat foreign, African Americans as lower in competence but only slightly foreign.", "titre_de": "Zou und Cheryan: zwei Dimensionen der rassischen Position", "enonce_de": "(Zou und Cheryan.) Die Position rassischer Gruppen in den Vereinigten Staaten lässt sich auf zwei Dimensionen ablesen: wahrgenommene (In-)Kompetenz und kulturelle „Fremdheit“. Weiße gelten als kompetent und kulturell gewandt, Asiaten als kompetent, aber sehr fremd, Latinos als weniger kompetent und etwas fremd, Afroamerikaner als weniger kompetent, aber kaum fremd.", "body_de": "## Bei Ridgeway\n\nRidgeway liest die erste Dimension als stärker essentialisiert, die zweite als erwerbbar (S. 138).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [138], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRidgeway lit la première dimension comme plus essentialisée, la seconde comme acquise (p. 138).", "body_en": "## In Ridgeway\n\nRidgeway reads the first dimension as more essentialised, the second as acquirable (p. 138).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2934077}, {"id": "E49", "file": "premisses/E49.md", "type": "etude", "partie": "P", "titre": "Turco : la culture sportive du capital-investissement", "enonce": "(Turco.) Dans le capital-investissement, culture masculine où le sport scelle les liens d'affaires, les rares investisseurs afro-américains pouvaient s'intégrer en montrant leur savoir sportif ; les femmes, même en cultivant le sport, restaient exclues des réunions où se nouaient les affaires.", "titre_en": "Turco: the sports culture of leveraged buyouts", "enonce_en": "(Turco.) In the leveraged buyout industry, a male culture where sport seals business ties, the few African American investors could fit in by displaying sports knowledge; women, even when cultivating sport, remained excluded from the gatherings where deals were made.", "titre_de": "Turco: die Sportkultur der Private-Equity-Branche", "enonce_de": "(Turco.) In der Branche der fremdfinanzierten Übernahmen, einer Männerkultur, in der Sport geschäftliche Bande festigt, konnten sich die wenigen afroamerikanischen Investoren einfügen, indem sie Sportwissen zeigten; Frauen blieben, selbst wenn sie sich für Sport interessierten, von den Treffen ausgeschlossen, auf denen die Geschäfte geschlossen wurden.", "body_de": "## Bei Ridgeway\n\nEine in Kapitel 6 angeführte Studie (S. 139).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [139], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nÉtude citée au chapitre 6 (p. 139).", "body_en": "## In Ridgeway\n\nA study cited in chapter 6 (p. 139).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2939136}, {"id": "E50", "file": "premisses/E50.md", "type": "etude", "partie": "P", "titre": "Les indices de classe forment un ensemble flou", "enonce": "Les Américains tiennent la classe pour acquise et changeante, moins essentielle que la race ou le genre ; on lit pourtant la classe sur les visages, par des signes d'émotion positive ; et les indices de classe (profession, éducation, accent, tenue, goûts, quartier, origine) forment un ensemble flou.", "titre_en": "Class cues form a fuzzy set", "enonce_en": "Americans hold class to be achieved and changeable, less essential than race or gender; yet people read class from faces, through cues of positive emotion; and class cues (occupation, education, accent, dress, tastes, residence, background) form a fuzzy set.", "titre_de": "Klassenhinweise bilden eine unscharfe Menge", "enonce_de": "Amerikaner halten Klasse für erworben und veränderlich, weniger wesenhaft als Rasse oder Geschlecht; dennoch liest man Klasse an Gesichtern ab, an Zeichen positiver Gefühle; und die Klassenhinweise (Beruf, Bildung, Akzent, Kleidung, Geschmack, Wohnort, Herkunft) bilden eine unscharfe Menge.", "body_de": "## Bei Ridgeway\n\nIn Kapitel 6 angeführte psychologische Forschung, mit einem Hinweis auf Bourdieus Habitus (S. 140).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [140], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRecherche psychologique citée au chapitre 6, avec le rappel de l'habitus chez Bourdieu (p. 140).", "body_en": "## In Ridgeway\n\nPsychological research cited in chapter 6, with a reminder of Bourdieu's habitus (p. 140).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.294652}, {"id": "E51", "file": "premisses/E51.md", "type": "etude", "partie": "P", "titre": "Les croyances de genre changent peu", "enonce": "Malgré l'entrée massive des femmes dans l'emploi, les croyances de genre n'ont changé que modestement : les femmes sont vues plus proches des hommes pour l'« indépendance » et l'« intelligence », mais en retrait pour l'« affirmation », la « compétitivité » et l'« audace », et toujours plus chaleureuses.", "titre_en": "Gender beliefs change little", "enonce_en": "Despite women's massive entry into paid work, gender beliefs have changed only modestly: women are seen as closer to men in \"independence\" and \"intelligence\", but behind in \"assertiveness\", \"competitiveness\" and \"boldness\", and still warmer.", "titre_de": "Geschlechterüberzeugungen ändern sich kaum", "enonce_de": "Trotz des massenhaften Eintritts von Frauen in die Erwerbsarbeit haben sich die Geschlechterüberzeugungen nur wenig verändert: Frauen gelten bei „Unabhängigkeit“ und „Intelligenz“ als den Männern näher, bleiben aber bei „Durchsetzungsfähigkeit“, „Wettbewerbsgeist“ und „Kühnheit“ zurück und gelten weiterhin als wärmer.", "body_de": "## Bei Ridgeway\n\nMangels einer entsprechenden Veränderung bei den familiären Verpflichtungen (S. 143).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [143], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nFaute de changement équivalent dans le partage des charges familiales (p. 143).", "body_en": "## In Ridgeway\n\nFor want of an equivalent change in family responsibilities (p. 143).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.294652}, {"id": "E52", "file": "premisses/E52.md", "type": "etude", "partie": "P", "titre": "Les groupes défavorisés partagent les croyances de troisième ordre", "enonce": "Les personnes de bas statut socio-économique ne diffèrent pas des autres dans les croyances qu'elles prêtent à « la plupart des gens » sur leurs groupes ; elles les endossent moins personnellement.", "titre_en": "Disadvantaged groups share the third-order beliefs", "enonce_en": "People of lower socioeconomic status do not differ from others in the beliefs they attribute to \"most people\" about their groups; they endorse them less personally.", "titre_de": "Benachteiligte Gruppen teilen die Überzeugungen dritter Ordnung", "enonce_de": "Menschen mit niedrigerem sozioökonomischem Status unterscheiden sich nicht von anderen in den Überzeugungen, die sie „den meisten Leuten“ über ihre Gruppen zuschreiben; sie billigen sie persönlich weniger.", "body_de": "## Bei Ridgeway\n\nIn Kapitel 6 angeführte Studien (S. 144).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [144], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nÉtudes citées au chapitre 6 (p. 144).", "body_en": "## In Ridgeway\n\nStudies cited in chapter 6 (p. 144).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.296204}, {"id": "E53", "file": "premisses/E53.md", "type": "etude", "partie": "P", "titre": "La diversité vécue comme menace", "enonce": "Des Blancs, mais non des membres de minorités, s'inquiètent davantage d'injustice en postulant dans une organisation affichant une politique de diversité ; des hommes blancs y montrent une réaction cardiovasculaire de menace.", "titre_en": "Diversity felt as a threat", "enonce_en": "Whites, but not racial minorities, express more concern about unfairness when applying to an organisation with pro-diversity policies; white men show cardiovascular threat responses.", "titre_de": "Vielfalt als Bedrohung erlebt", "enonce_de": "Weiße, nicht aber Angehörige von Minderheiten, äußern mehr Sorge um Ungerechtigkeit, wenn sie sich bei einer Organisation mit Diversitätspolitik bewerben; weiße Männer zeigen kardiovaskuläre Bedrohungsreaktionen.", "body_de": "## Bei Ridgeway\n\nIn Kapitel 6 angeführte sozialpsychologische Studien (S. 145).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [145], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nÉtudes de psychologie sociale citées au chapitre 6 (p. 145).", "body_en": "## In Ridgeway\n\nSocial psychological studies cited in chapter 6 (p. 145).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2972112}, {"id": "E54", "file": "premisses/E54.md", "type": "etude", "partie": "P", "titre": "Major : reconnaître le biais est désagréable", "enonce": "(Major et coll.) Reconnaître qu'on a été avantagé sans le mériter, ou discriminé plutôt que jugé sur son mérite, suscite des émotions désagréables.", "titre_en": "Major: recognising bias is unpleasant", "enonce_en": "(Major and colleagues.) Recognising that one was advantaged without deserving it, or discriminated against rather than judged on merit, evokes unpleasant emotions.", "titre_de": "Major: Verzerrung anzuerkennen ist unangenehm", "enonce_de": "(Major und Mitarbeiter.) Anzuerkennen, dass man unverdient begünstigt oder diskriminiert statt nach Verdienst beurteilt wurde, ruft unangenehme Gefühle hervor.", "body_de": "## Bei Ridgeway\n\nAngeführt zur Stützung der Verleugnung des Status (S. 148-149).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [148, 149], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCité à l'appui du déni du statut (p. 148-149).", "body_en": "## In Ridgeway\n\nCited in support of the denial of status (p. 148-149).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2982118}, {"id": "T001", "file": "theses/T001.md", "type": "these", "partie": "1", "titre": "Le statut, une invention culturelle", "enonce": "Les hiérarchies de statut sont une invention humaine pour gérer les situations d'interdépendance coopérative et compétitive. Elles résultent d'un schème culturel, appris et partagé, qui s'est peut-être posé sur des résidus évolutifs mais ne s'y réduit pas, comme le langage.", "titre_en": "Status as a cultural invention", "enonce_en": "Status hierarchies are a human invention for managing situations of cooperative and competitive interdependence. They result from a cultural schema, learned and shared, which may rest on evolutionary residues but is not reducible to them, like language.", "titre_de": "Status als kulturelle Erfindung", "enonce_de": "Statushierarchien sind eine menschliche Erfindung, um Situationen kooperativer und kompetitiver Interdependenz zu bewältigen. Sie entspringen einem erlernten und geteilten kulturellen Schema, das auf evolutionären Resten aufbauen mag, sich aber nicht auf sie zurückführen lässt, wie die Sprache.", "body_de": "## Argumentation\n\n1. Die menschliche Lage birgt eine Spannung: Man ist auf andere angewiesen, um zu leben und zu bekommen, was man will, und diese Zusammenarbeit erzeugt eine Rivalität um ihre Bedingungen und ihre Früchte (D03) (S. 2-3).\n2. Statushierarchien sind die Erfindung, die diese Spannung bewältigt: ein kulturelles Schema, ein Bündel erlernter und geteilter Regeln (D04), dessen Umsetzung die beobachtbare Hierarchie hervorbringt (S. 3).\n3. Die These ist umstritten, denn Hierarchie ist alt, universell, und manche führen sie auf Wurzeln bei den Primaten zurück; doch Status funktioniert offenkundig als soziokultureller Prozess geteilter Überzeugungen und Erwartungen (S. 4).\n4. Status ist also wie die Sprache: zutiefst kulturell und erlernt, aber etwas, zu dessen Erlernen wir vielleicht veranlagt sind (S. 4). ∎\n\n## Anmerkung\n\nRidgeway kündigt eine „tiefe Geschichte“ des Status an, weder einen beschreibenden Forschungsüberblick noch eine Anleitung zum Statuserwerb (S. 2). Ihr Gegenstand sind vor allem die heutigen Vereinigten Staaten (S. 10).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["D03", "D04"], "citation": "“Status hierarchies, I claim, are a human invention to manage social situations”", "pages": [2, 3, 4, 10], "depends_on": ["D03", "D04"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Argumentation\n\n1. La condition humaine est faite d'une tension : on dépend des autres pour vivre et obtenir ce qu'on veut, et cette coopération crée une rivalité sur ses termes et sur ses fruits (D03) (p. 2-3).\n2. Les hiérarchies de statut sont l'invention qui gère cette tension : un schème culturel, ensemble de règles apprises et partagées (D04), dont la mise en œuvre produit la hiérarchie observable (p. 3).\n3. La thèse est controversée, car la hiérarchie est ancienne, universelle, et certains lui donnent des racines primates ; mais le statut fonctionne à l'évidence comme un processus socioculturel de croyances et d'attentes partagées (p. 4).\n4. Le statut est donc comme le langage : profondément culturel et appris, mais quelque chose qu'on est peut-être prédisposé à apprendre (p. 4). ∎\n\n## Scolie\n\nRidgeway annonce une « histoire profonde » du statut, ni revue descriptive de la recherche ni guide pour obtenir du statut (p. 2). Son terrain est surtout les États-Unis contemporains (p. 10).", "body_en": "## Argument\n\n1. The human condition contains a tension: people depend on others to live and get what they want, and this cooperation creates a rivalry over its terms and its fruits (D03) (p. 2-3).\n2. Status hierarchies are the invention that manages this tension: a cultural schema, a set of learned and shared rules (D04), whose enactment produces the observable hierarchy (p. 3).\n3. The claim is controversial, since hierarchy is ancient, universal, and some give it primate roots; but status clearly functions as a sociocultural process of shared beliefs and expectations (p. 4).\n4. Status is therefore like language: deeply cultural and learned, but something we may be predisposed to learn (p. 4). ∎\n\n## Scholium\n\nRidgeway announces a \"deep story\" of status, neither a descriptive review of research nor a how-to guide for attaining status (p. 2). Her ground is mostly the contemporary United States (p. 10).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D03", "D04"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D03", "D04"], "mentions": ["D03", "D04"], "corollaires": [], "mtime": 1794593161.299211}, {"id": "T002", "file": "theses/T002.md", "type": "these", "partie": "1", "titre": "Le statut est relationnel, social, donné, consensuel et public", "enonce": "Le statut est une relation d'évaluation entre acteurs ; il suppose un critère de valeur partagé par un groupe, qui est le tiers implicite de toute relation de statut ; il est accordé par les autres, non pris ; il est consensuel, car le haut et le bas connaissent leur rang ; il est public, car il existe aux yeux d'un groupe.", "titre_en": "Status is relational, social, given, consensual, and public", "enonce_en": "Status is an evaluative relation between actors; it presupposes a standard of value shared by a group, the implicit third party of every status relation; it is granted by others, not taken; it is consensual, since high and low both know their rank; it is public, since it exists in the eyes of a group.", "titre_de": "Status ist relational, sozial, verliehen, konsensuell und öffentlich", "enonce_de": "Status ist eine bewertende Beziehung zwischen Akteuren; er setzt einen von einer Gruppe geteilten Wertmaßstab voraus, den stillen Dritten jeder Statusbeziehung; er wird von anderen verliehen, nicht genommen; er ist konsensuell, denn Hohe und Niedrige kennen ihren Rang; er ist öffentlich, denn er besteht in den Augen einer Gruppe.", "body_de": "## Beweis\n\n1. Nach D01 ist Status eine vergleichende Rangordnung: Niemand hat hohen oder niedrigen Status außer im Verhältnis zu anderen; der am wenigsten Geschätzte ist nicht ohne Wertschätzung, sondern weniger geschätzt (S. 10).\n2. Es ist eine *soziale* Rangordnung: Sie setzt einen geteilten Maßstab dessen voraus, was „zählt“, außerhalb der beiden Akteure, den der Gruppe, die der stille Dritte der Beziehung ist; da die Maßstäbe zwischen Gruppen variieren, ist Status eine mehrstufige Beziehung (S. 10-11).\n3. Status hängt also von den Bewertungen anderer ab: Nach A04 lässt er sich nicht an sich reißen, er gleicht einem Ruf und muss zuerkannt werden (S. 11).\n4. Da der Maßstab eine geteilte kulturelle Überzeugung ist, erkennen Hohe und Niedrige ihren Rang an: Die Ballkönigin und Suzie Glutz wissen, wo die andere steht; die Rangniedrige muss ihren Rang nicht für verdient halten, weiß aber, wie die Gruppe sie sieht (S. 11-12).\n5. Da die Gruppe als Beobachterin wirkt, ist die Rangordnung öffentlich: Zustimmung oder Missbilligung bestehen in den Augen eines Publikums, daher ein Großteil ihres emotionalen Gewichts (S. 12). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["A04", "D01"], "citation": "“That status is given, not taken, is one of its fundamental features.”", "pages": [10, 11, 12], "depends_on": ["D01", "A04"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D01, le statut est un classement comparatif : nul n'a un statut haut ou bas sinon par rapport à d'autres ; le moins estimé n'est pas sans estime, il l'est moins (p. 10).\n2. C'est un classement *social* : il suppose un critère partagé de ce qui « compte », extérieur aux deux acteurs, celui du groupe, qui est le tiers implicite de la relation ; les critères variant d'un groupe à l'autre, le statut est une relation à plusieurs niveaux (p. 10-11).\n3. Le statut dépend donc des évaluations des autres : par A04, il ne se saisit pas, il ressemble à une réputation et doit être accordé (p. 11).\n4. Le critère étant une croyance culturelle partagée, haut et bas reconnaissent leur rang : la reine du bal et Suzie Glutz savent où se tient l'autre ; le bas statut ne juge pas forcément son rang mérité, mais sait comment le groupe le voit (p. 11-12).\n5. Le groupe agissant comme observateur, le classement est public : l'approbation ou la désapprobation existent aux yeux d'un public, d'où une grande part de leur poids émotionnel (p. 12). ∎", "body_en": "## Demonstration\n\n1. By D01, status is a comparative ranking: no one has high or low status except in relation to others; the least esteemed is not without esteem, but less esteemed (p. 10).\n2. It is a *social* ranking: it presupposes a shared standard of what \"counts\", external to the two actors, that of the group, which is the implicit third party of the relation; since standards vary between groups, status is a multilevel relation (p. 10-11).\n3. Status therefore depends on others' evaluations: by A04, it cannot be seized, it resembles a reputation and must be granted (p. 11).\n4. Since the standard is a shared cultural belief, high and low both recognise their rank: the prom queen and Suzie Glutz know where each other stands; the low-status actor need not find her rank deserved, but knows how the group sees her (p. 11-12).\n5. Since the group acts as an observer, the ranking is public: approval or disapproval exist in the eyes of an audience, hence much of their emotional weight (p. 12). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A04", "D01"], "sections": ["Démonstration"], "demo_refs": ["A04", "D01"], "mentions": ["A04", "D01"], "corollaires": [], "mtime": 1794593161.299211}, {"id": "T003", "file": "theses/T003.md", "type": "these", "partie": "1", "titre": "La hiérarchie de statut, solution bornément fonctionnelle", "enonce": "En accordant estime et influence en proportion de la contribution perçue au but commun, la hiérarchie de statut motive les contributions, coordonne les avis divergents et canalise la rivalité vers l'effort commun. Elle est fonctionnelle, mais bornément, car le statut récompense une valeur *perçue* ; et sa fonctionnalité n'explique pas comment elle se forme.", "titre_en": "The status hierarchy as a boundedly functional solution", "enonce_en": "By granting esteem and influence in proportion to perceived contribution to the shared goal, the status hierarchy motivates contributions, coordinates diverging views, and channels rivalry into the shared effort. It is functional, but boundedly so, since status rewards *perceived* value; and its functionality does not explain how it forms.", "titre_de": "Die Statushierarchie als begrenzt funktionale Lösung", "enonce_de": "Indem sie Wertschätzung und Einfluss im Verhältnis zum wahrgenommenen Beitrag zum gemeinsamen Ziel gewährt, motiviert die Statushierarchie Beiträge, stimmt abweichende Ansichten ab und lenkt die Rivalität in die gemeinsame Anstrengung. Sie ist funktional, aber nur begrenzt, weil Status den *wahrgenommenen* Wert belohnt; und ihre Funktionalität erklärt nicht, wie sie entsteht.", "body_de": "## Beweis\n\n1. Nach E01 entsteht in zielorientierten Gruppen binnen Minuten eine Hierarchie der Wertschätzung und des Einflusses (D02), selbst unter Gleichen (S. 7-8).\n2. Die Interdependenz (D03) stellt zwei Probleme: die gemeinsame Anstrengung zu organisieren (zu motivieren und abzustimmen) und das Interesse jedes Mitglieds zu bändigen, die Anstrengung zum eigenen Vorteil zu lenken (S. 12-13).\n3. Nach E02 gewährt die Hierarchie Wertschätzung und Einfluss im Austausch für den wahrgenommenen Wert für die gemeinsame Anstrengung (S. 13).\n4. Status belohnt also den Beitrag (Motivation); Einfluss geht an die als beste wahrgenommenen Beiträge (Abstimmung); und die Rivalität wird zum Wettbewerb der Beiträge, was das Problem des Konkurrenzinteresses mildert, ohne es aufzuheben (S. 13).\n5. Da der Wert *wahrgenommen* ist und Wahrnehmungen verzerrt sein können, ist die Lösung nur „begrenzt“ funktional (S. 14).\n6. Doch die Funktionalität sagt weder, wie diese Hierarchien entstehen, noch, warum sie sich gegen andere, etwa reine Dominanz, durchsetzen: Es braucht eine tiefere Erklärung (S. 14). ∎\n\n## Anmerkung\n\nRidgeway übernimmt die Hauptpunkte dieser Lesart der „begrenzten Funktionalität“ (S. 14); was sie bestreitet, ist ihre Erklärungskraft, daher der Rest des Buches.", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["D02", "D03", "E01", "E02"], "citation": "“a “boundedly functional” organizational solution”", "pages": [7, 8, 12, 13, 14], "depends_on": ["D02", "D03", "E01", "E02"], "contre": ["R02"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par E01, une hiérarchie d'estime et d'influence (D02) émerge en quelques minutes dans les groupes orientés vers un but, même entre égaux (p. 7-8).\n2. L'interdépendance (D03) pose deux problèmes : organiser l'effort collectif (motiver et coordonner) et gérer l'intérêt de chacun à diriger l'effort à son profit (p. 12-13).\n3. Par E02, la hiérarchie accorde estime et influence en échange de la valeur perçue pour l'effort commun (p. 13).\n4. Le statut récompense donc la contribution (motivation) ; l'influence va aux meilleures contributions perçues (coordination) ; et la rivalité se convertit en concours de contributions, ce qui atténue sans l'abolir le problème de l'intérêt compétitif (p. 13).\n5. La valeur étant *perçue*, et les perceptions biaisables, la solution n'est que « bornément » fonctionnelle (p. 14).\n6. Mais la fonctionnalité ne dit ni comment ces hiérarchies apparaissent ni pourquoi elles l'emportent sur d'autres, comme la pure dominance : il faut une explication plus profonde (p. 14). ∎\n\n## Scolie\n\nRidgeway endosse l'essentiel de cette lecture « bornément fonctionnelle » (p. 14) ; c'est son pouvoir explicatif qu'elle conteste, d'où la suite du livre.", "body_en": "## Demonstration\n\n1. By E01, a hierarchy of esteem and influence (D02) emerges within minutes in goal-oriented groups, even among equals (p. 7-8).\n2. Interdependence (D03) poses two problems: organising the collective effort (motivating and coordinating) and managing each member's interest in running the effort to their own advantage (p. 12-13).\n3. By E02, the hierarchy grants esteem and influence in exchange for perceived value to the shared effort (p. 13).\n4. Status thus rewards contribution (motivation); influence goes to the best perceived contributions (coordination); and rivalry becomes a contest of contributions, which mitigates without abolishing the competitive interest problem (p. 13).\n5. Since value is *perceived*, and perceptions can be biased, the solution is only \"boundedly\" functional (p. 14).\n6. But functionality says neither how these hierarchies develop nor why they prevail over others, such as pure dominance: a deeper explanation is needed (p. 14). ∎\n\n## Scholium\n\nRidgeway endorses the main points of this \"boundedly functional\" reading (p. 14); it is its explanatory power that she disputes, hence the rest of the book.", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D02", "D03", "E01", "E02"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D02", "D03", "E01", "E02"], "mentions": ["D02", "D03", "E01", "E02"], "corollaires": [], "mtime": 1794593161.300212}, {"id": "T004", "file": "theses/T004.md", "type": "these", "partie": "1", "titre": "Statut, pouvoir et richesse sont distincts mais réciproques", "enonce": "Le statut diffère du pouvoir et de la richesse : il est donné, eux sont pris et possédés ; il est culturel, eux plus directement matériels. Mais une fois établi, il va de pair avec eux, et la relation est largement réciproque : le haut statut ouvre l'accès aux ressources et au pouvoir, et la richesse finit par produire des croyances de statut.", "titre_en": "Status, power and wealth are distinct but reciprocal", "enonce_en": "Status differs from power and wealth: it is given, they are taken and possessed; it is cultural, they are more directly material. But once established it co-occurs with them, and the relationship is largely reciprocal: high status opens access to resources and power, and wealth ends up producing status beliefs.", "titre_de": "Status, Macht und Reichtum sind verschieden, aber wechselseitig verbunden", "enonce_de": "Status unterscheidet sich von Macht und Reichtum: Er wird verliehen, sie werden genommen und besessen; er ist kulturell, sie sind unmittelbarer materiell. Doch einmal etabliert, geht er mit ihnen einher, und die Beziehung ist weitgehend wechselseitig: Hoher Status öffnet den Zugang zu Ressourcen und Macht, und Reichtum bringt schließlich Statusüberzeugungen hervor.", "body_de": "## Beweis\n\n1. Nach A02 erzwingt Macht Gehorsam ohne Zustimmung; Status verschafft nur Einfluss, die Fähigkeit zu überzeugen (S. 14).\n2. Nach A03 beruht Macht auf der Kontrolle von Ressourcen; Macht und Reichtum sind daher eng verwandte Formen der Ungleichheit (S. 15).\n3. Nach T002 wird Status durch die Bewertungen anderer verliehen, während Reichtum und Macht genommen und besessen werden; und er ist vollständig kulturell, gebildet aus Überzeugungen darüber, „was zählt“ und „wer mehr zählt“ (S. 15).\n4. Dennoch geht Status oft mit Macht und Ressourcen einher: Hoher Status verschafft einen größeren Anteil an den Ressourcen der Gruppe, deren Kontrolle sich in Macht verwandelt (S. 15-16).\n5. Statushierarchien vermitteln zwischen den Individuen und dem Zugang zu Ressourcen in den Institutionen, die Einkommen, Bildung, Arbeit und Gesundheitsversorgung verteilen; und umgekehrt bringen Reichtum und Macht schließlich Überzeugungen hervor, die die Reichen als „besser“ darstellen (S. 16). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["A02", "A03", "T002"], "citation": "", "pages": [14, 15, 16], "depends_on": ["T002", "A02", "A03"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par A02, le pouvoir force l'obéissance sans le consentement ; le statut ne donne que l'influence, la capacité de persuader (p. 14).\n2. Par A03, le pouvoir vient du contrôle des ressources ; pouvoir et richesse sont donc des formes d'inégalité étroitement liées (p. 15).\n3. Par T002, le statut est donné par les évaluations des autres, alors que richesse et pouvoir sont pris et possédés ; et il est pleinement culturel, fait de croyances sur « ce qui compte » et « qui compte plus » (p. 15).\n4. Pourtant le statut coïncide souvent avec le pouvoir et les ressources : le haut statut place pour recevoir une plus grande part des ressources du groupe, que le contrôle convertit en pouvoir (p. 15-16).\n5. Les hiérarchies de statut font l'intermédiaire entre les individus et l'accès aux ressources dans les institutions qui distribuent revenus, éducation, emploi, santé ; et, à l'inverse, la richesse et le pouvoir finissent par engendrer des croyances qui peignent les riches comme « meilleurs » (p. 16). ∎", "body_en": "## Demonstration\n\n1. By A02, power forces compliance without consent; status brings only influence, the capacity to persuade (p. 14).\n2. By A03, power comes from control of resources; power and wealth are therefore closely related forms of inequality (p. 15).\n3. By T002, status is given by others' evaluations, whereas wealth and power are taken and possessed; and it is fully cultural, made of beliefs about \"what counts\" and \"who counts more\" (p. 15).\n4. Yet status often co-occurs with power and resources: high status positions one to receive a larger share of the group's resources, which control converts into power (p. 15-16).\n5. Status hierarchies mediate between individuals and access to resources in the institutions that distribute income, education, jobs, health care; and conversely, wealth and power end up producing beliefs that portray the rich as \"better\" (p. 16). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A02", "A03", "T002"], "sections": ["Démonstration"], "demo_refs": ["A02", "A03", "T002"], "mentions": ["A02", "A03", "T002"], "corollaires": [], "mtime": 1794593161.300212}, {"id": "T005", "file": "theses/T005.md", "type": "these", "partie": "2", "titre": "La dominance n'est pas le fondement des hiérarchies de statut", "enonce": "Une hiérarchie de dominance peut organiser une production collective, mais mal : les dominants contrôlent au lieu de produire, et les dominés ont intérêt à fuir ou à renverser. La dominance existe, mais son exercice occasionnel n'en fait pas le fondement ordinaire des hiérarchies d'influence et de déférence.", "titre_en": "Dominance is not the foundation of status hierarchies", "enonce_en": "A dominance hierarchy can organise collective production, but poorly: the dominant control instead of producing, and the dominated have an interest in fleeing or overthrowing. Dominance exists, but its occasional exercise does not make it the ordinary foundation of hierarchies of influence and deference.", "titre_de": "Dominanz ist nicht die Grundlage von Statushierarchien", "enonce_de": "Eine Dominanzhierarchie kann gemeinsame Produktion organisieren, aber schlecht: Die Dominanten kontrollieren, statt zu produzieren, und die Beherrschten haben ein Interesse daran, zu fliehen oder umzustürzen. Dominanz gibt es, doch ihre gelegentliche Ausübung macht sie nicht zur gewöhnlichen Grundlage von Hierarchien des Einflusses und der Ehrerbietung.", "body_de": "## Argumentation\n\n1. Nach D25 verteilt eine Dominanzhierarchie vorhandene Ressourcen mit einem Minimum an Kämpfen und kann für diese Verteilung ebenso effizient sein wie eine Statushierarchie (S. 23).\n2. Doch der Kontext des Status ist die Erzeugung neuer Güter durch ein gemeinsames Ziel. Eine Dominanzhierarchie organisiert dort Ausbeutung: Die Dominanten zwingen die anderen zur Arbeit und nehmen den größten Anteil (S. 23-24).\n3. Sie ist ineffizient, weil sie die Dominanten nicht für die produktive Anstrengung einsetzt, und instabil, weil sie auf Angst beruht: Die Beherrschten haben ein Interesse daran, zu gehen oder sich gegen den Dominierenden zu organisieren (S. 24).\n4. Gewiss schüchtern aggressive Gesten manchmal ein, selbst bei der Arbeit, und es ist vernünftig, ein evolviertes Repertoire der Unterwerfung unter Dominanz anzunehmen (S. 24-25).\n5. Doch die gelegentliche Ausübung von Dominanz macht sie nicht zur typischen Grundlage von Statushierarchien; und selbst evolutionäre Argumente sehen in ihr nicht mehr die einzige oder hauptsächliche Grundlage (S. 25-26). ∎\n\n## Anmerkung\n\nRidgeway erwähnt die Szene aus den Präsidentschaftsdebatten von 2016, in der Donald Trump hinter Hillary Clinton trat und sich über ihr aufbaute, während sie sprach (S. 24).", "sections_de": ["Argumentation", "Anmerkung"], "demo_refs_de": ["D25"], "citation": "", "pages": [23, 24, 25, 26], "depends_on": ["D25"], "contre": ["R03"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Argumentation\n\n1. Par D25, une hiérarchie de dominance répartit des ressources existantes avec un minimum de combats, et peut être aussi efficace qu'une hiérarchie de statut pour cette répartition (p. 23).\n2. Mais le contexte du statut est la production de nouveaux biens par un but commun. Une hiérarchie de dominance y organise l'exploitation : les dominants forcent les autres à travailler et prennent la plus grosse part (p. 23-24).\n3. Elle est inefficace, car elle n'emploie pas les dominants à l'effort productif, et instable, car fondée sur la peur : les dominés ont intérêt à partir ou à s'organiser contre le dominateur (p. 24).\n4. Certes, des gestes agressifs intimident parfois, même au travail, et il est raisonnable de supposer un répertoire évolué de déférence à la dominance (p. 24-25).\n5. Mais l'exercice occasionnel de la dominance ne fait pas d'elle le fondement typique des hiérarchies de statut ; et même les arguments évolutionnistes ne la tiennent plus pour la base unique ou principale (p. 25-26). ∎\n\n## Scolie\n\nRidgeway cite la scène du débat présidentiel de 2016 où Donald Trump s'avance derrière Hillary Clinton et la surplombe pendant qu'elle parle (p. 24).", "body_en": "## Argument\n\n1. By D25, a dominance hierarchy distributes existing resources with a minimum of fighting, and may be as efficient as a status hierarchy for that distribution (p. 23).\n2. But the context of status is the production of new goods through a shared goal. A dominance hierarchy organises exploitation there: the dominant force the others to work and take the largest share (p. 23-24).\n3. It is inefficient, since it does not employ the dominant in the productive effort, and unstable, since it rests on fear: the dominated have an interest in leaving or organising against the dominator (p. 24).\n4. Admittedly, aggressive gestures sometimes intimidate, even at work, and it is reasonable to assume an evolved repertoire of deference to dominance (p. 24-25).\n5. But the occasional exercise of dominance does not make it the typical foundation of status hierarchies; and even evolutionary arguments no longer favour it as the sole or primary basis (p. 25-26). ∎\n\n## Scholium\n\nRidgeway cites the scene from the 2016 presidential debates in which Donald Trump walked up behind Hillary Clinton and loomed over her as she spoke (p. 24).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D25"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D25"], "mentions": ["D25"], "corollaires": [], "mtime": 1794593161.3012118}, {"id": "T006", "file": "theses/T006.md", "type": "these", "partie": "2", "titre": "Le statut va au-delà du prestige", "enonce": "Les hiérarchies de statut ressemblent davantage au prestige qu'à la dominance, mais le statut récompense la capacité de contribuer au but du groupe, non la seule information utile à l'individu qui défère : il y entre un élément d'affirmation (l'effort agentique) et une orientation collective que le modèle du prestige ignore.", "titre_en": "Status goes beyond prestige", "enonce_en": "Status hierarchies resemble prestige more than dominance, but status rewards the capacity to contribute to the group's goal, not merely information useful to the deferring individual: it involves an assertive element (agentic effort) and a collective orientation that the prestige model ignores.", "titre_de": "Status geht über Prestige hinaus", "enonce_de": "Statushierarchien gleichen eher dem Prestige als der Dominanz, doch Status belohnt die Fähigkeit, zum Ziel der Gruppe beizutragen, nicht bloß Informationen, die dem sich Fügenden nützen: Er enthält ein Element der Durchsetzung (agentische Anstrengung) und eine kollektive Ausrichtung, die das Prestigemodell übersieht.", "body_de": "## Argumentation\n\n1. Nach D26 wird Prestige freiwillig im Austausch für einen wahrgenommenen Wert gewährt, was es dem Status nahebringt (S. 25-26).\n2. Doch der Wert ist beim Prestige ein Informationswert für den sich Fügenden und trägt vielleicht nichts zum Ziel der Gruppe bei (S. 26).\n3. Nach E02 belohnen Gruppen aber die Fähigkeit, zum gemeinsamen Ziel beizutragen: nach D07 Fertigkeiten und agentische Anstrengung, nach D08 gruppenorientierte Motivation (S. 26-27).\n4. Die beobachteten Hierarchien stehen also dem Prestige näher als der Dominanz, enthalten aber e
