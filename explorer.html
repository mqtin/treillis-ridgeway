n anglais. Outillage commun aux treillis, adapté au livre (repères en pages, types A et E). Toutes les citations anglaises sont dans le livre mot pour mot (`outils/audit_citations.py`). Tous les éléments sont `brouillon` : l'audit de fidélité reste à faire (AGENT.md § 7).\n- **2026-11-13.** Audit d'indépendance et d'enchaînement. Retrait de toute mention du treillis Lordon et de SpinozaGraph (documents, code, explorateur) ; « positions réfutées » devient « positions écartées ». Enchaînement : 25 liens entre thèses ajoutés, tous faits par Ridgeway elle-même (« as we saw », « recall »), qui manquaient au graphe : de 23 thèses sans appui sur une autre thèse à 10 (points de départ : ouverture du livre, critique de la dominance et du prestige, tension meneurs-suiveurs, début des chapitres 3, 5 et 6), et de 30 thèses sans conséquence à 10 (conclusions et conseils pratiques). Deux renvois corrigés : T058 (la propagation aux objets est T039, non T031) et T053 (p. 144 ne parle que de la chaleur prêtée au bas statut).\n- **2026-11-13.** Second audit. Nouvel outil `outils/audit_pages.py` : chaque citation (y compris les passages anglais des corps français), chaque auteur nommé dans une prémisse et chaque chiffre sont vérifiés aux pages citées ; tout y est. Corrections : A05 attribuait la théorie des états d'attente à « Berger et coll. », que Ridgeway ne nomme pas à ces pages (il n'apparaît qu'en p. 86, pour autre chose) ; T054 attribuait à T053 la dignité offerte à la déférence, qui relève de T020 ; T007, phrase reprise. Concordance français-anglais des énoncés, des fiches de chapitre et du parcours vérifiée.\n- **2026-11-13.** Version allemande : les 175 éléments, les parties, le parcours (`PARCOURS.de.md`) et la notice (`NOTICE.de.md`) sont traduits, à partir de la reconstruction, sans traduction publiée du livre ; l'explorateur est trilingue (FR / EN / DE, `?lang=de`). `check.py` vérifie la concordance de l'allemand avec le français (mêmes étapes, renvois et repères ; AGENT.md § 5 ter).\n", "body_en": "", "body_de": ""}], "index_ids": ["A01", "A02", "A03", "A04", "A05", "A06", "A07", "A08", "A09", "A10", "A11", "A12", "A13", "A14", "A15", "A16", "E01", "E02", "E03", "E04", "E05", "E06", "E07", "E08", "E09", "E10", "E11", "E12", "E13", "E14", "E15", "E16", "E17", "E18", "E19", "E20", "E21", "E22", "E23", "E24", "E25", "E26", "E27", "E28", "E29", "E30", "E31", "E32", "E33", "E34", "E35", "E36", "E37", "E38", "E39", "E40", "E41", "E42", "E43", "E44", "E45", "E46", "E47", "E48", "E49", "E50", "E51", "E52", "E53", "E54", "D01", "D02", "D03", "D04", "D12", "T001", "T002", "T003", "T004", "R01", "R02", "D05", "D07", "D08", "D09", "D11", "D25", "D26", "T005", "T006", "T007", "T008", "T009", "T010", "T011", "T012", "T013", "T014", "R03", "R04", "R05", "R07", "D24", "T015", "T016", "T017", "T018", "T019", "T020", "T021", "R06", "R13", "D06", "D10", "D13", "D14", "D15", "D16", "D22", "D23", "T022", "T023", "T024", "T025", "T026", "T027", "T028", "T029", "T030", "T031", "T032", "R08", "D17", "D18", "D19", "D20", "D21", "D27", "D32", "T033", "T034", "T035", "T036", "T037", "T038", "T039", "T040", "T041", "T042", "T043", "T044", "R10", "R11", "D28", "D29", "D30", "D31", "T045", "T046", "T047", "T048", "T049", "T050", "T051", "T052", "T053", "T054", "T055", "R09", "R12", "T056", "T057", "T058", "T059", "T060"], "parties": {"P": "Prémisses", "1": "Qu'est-ce que le statut comme forme d'inégalité ?", "2": "Les fondements d'un schème culturel du statut", "3": "Pourquoi tenons-nous au statut ?", "4": "Les croyances de statut et l'organisation de l'inégalité", "5": "La microdynamique du statut", "6": "Statut, différence et durabilité de l'inégalité", "7": "Conclusion"}, "partie_docs": [{"id": "P", "titre": "Prémisses", "resume": "Ce que Ridgeway reprend à d'autres : des thèses d'auteurs (A) et des résultats d'études (E).", "titre_de": "Prämissen", "resume_de": "Was Ridgeway von anderen übernimmt: Thesen anderer Autoren (A) und Befunde von Studien (E).", "body_de": "**Zwei Arten von Prämissen.** Ridgeway baut ihre Theorie auf Arbeiten auf, die sie nicht selbst beweist. Die **A** sind Thesen anderer Autoren, Theoretiker oder Schulen: Sewell (A01), Weber (A02, A09), Goffman (A04), die Erwartungszustandstheorie (A05), Tilly (A10), Blumer (A11), Jackman (A12)… Die **E** sind empirische Befunde, die sie anführt, von den Studien von Bales (E01) bis zu denen über Statusbedrohung (E17, E53).\n\n**Wie man sie liest.** Jede Prämisse gibt an, was die Studie oder der Autor feststellt, so wie Ridgeway es wiedergibt, und dann unter „Bei Ridgeway“, welchen Gebrauch sie davon macht. Das Gitter prüft diese Arbeiten nicht: Es rekonstruiert Ridgeways Argumentation, die sich auf sie stützt.", "titre_en": "Premises", "resume_en": "What Ridgeway takes from others: theses of other authors (A) and findings of studies (E).", "loc": "—", "body": "**Deux sortes de prémisses.** Ridgeway construit sa théorie sur des travaux qu'elle ne démontre pas. Les **A** sont des thèses d'autres auteurs, théoriciens ou écoles : Sewell (A01), Weber (A02, A09), Goffman (A04), la théorie des états d'attente (A05), Tilly (A10), Blumer (A11), Jackman (A12)… Les **E** sont des résultats empiriques qu'elle cite, des études de Bales (E01) à celles sur la menace de statut (E17, E53).\n\n**Comment les lire.** Chaque prémisse dit ce que l'étude ou l'auteur établit, tel que Ridgeway le rapporte, puis, sous « Chez Ridgeway », l'usage qu'elle en fait. Le treillis ne vérifie pas ces travaux : il reconstruit l'argument de Ridgeway, qui s'appuie sur eux.", "body_en": "**Two kinds of premises.** Ridgeway builds her theory on work she does not demonstrate. The **A** are theses of other authors, theorists or schools: Sewell (A01), Weber (A02, A09), Goffman (A04), expectation states theory (A05), Tilly (A10), Blumer (A11), Jackman (A12)… The **E** are empirical findings she cites, from Bales's studies (E01) to those on status threat (E17, E53).\n\n**How to read them.** Each premise states what the study or author establishes, as Ridgeway reports it, then, under \"In Ridgeway\", the use she makes of it. The lattice does not check this work: it reconstructs Ridgeway's argument, which relies on it.", "file": "parties/P.md"}, {"id": "1", "titre": "Qu'est-ce que le statut comme forme d'inégalité ?", "resume": "La question du livre, la thèse du schème culturel, les propriétés du statut, sa fonction et sa différence avec le pouvoir et la richesse.", "titre_de": "Was ist Status als Form der Ungleichheit?", "resume_de": "Die Frage des Buches, die These vom kulturellen Schema, die Eigenschaften des Status, seine Funktion und sein Unterschied zu Macht und Reichtum.", "body_de": "**Die These.** Status ist eine Rangordnung der Wertschätzung (D01). Statushierarchien sind eine kulturelle Erfindung, um die Spannung zwischen Zusammenarbeit und Rivalität zu bewältigen (D03): ein zweifaches Schema aus Norm und Überzeugungen (D04, T001).\n\n**Was Status ist.** Eine Hierarchie zeigt sich in zusammenhängenden Ungleichheiten der Beteiligung, der Bewertung und des Einflusses (D02, E01). Status ist relational, sozial, verliehen und nicht genommen, konsensuell und öffentlich (T002). Er löst die Probleme der Zusammenarbeit, aber nur „begrenzt“, und seine Funktion erklärt seine Entstehung nicht (T003, gegen R02). Er unterscheidet sich von Macht und Reichtum und ist doch wechselseitig mit ihnen verbunden (T004).", "titre_en": "What Is Status as a Form of Inequality?", "resume_en": "The book's question, the cultural schema thesis, the properties of status, its function and its difference from power and wealth.", "loc": "p. 1–19", "body": "**La thèse.** Le statut est un classement d'estime (D01). Les hiérarchies de statut sont une invention culturelle pour gérer la tension entre coopération et rivalité (D03) : un schème double, norme et croyances (D04, T001).\n\n**Ce qu'est le statut.** Une hiérarchie se lit dans des inégalités corrélées de participation, d'évaluation et d'influence (D02, E01). Le statut est relationnel, social, donné et non pris, consensuel et public (T002). Il résout les problèmes de la coopération, mais seulement « bornément », et sa fonction n'explique pas sa genèse (T003, contre R02). Il diffère du pouvoir et de la richesse, tout en étant lié à eux réciproquement (T004).", "body_en": "**The thesis.** Status is a ranking of esteem (D01). Status hierarchies are a cultural invention for managing the tension between cooperation and rivalry (D03): a twofold schema, norm and beliefs (D04, T001).\n\n**What status is.** A hierarchy shows in correlated inequalities of participation, evaluation and influence (D02, E01). Status is relational, social, given not taken, consensual and public (T002). It solves the problems of cooperation, but only \"boundedly\", and its function does not explain its genesis (T003, against R02). It differs from power and wealth, while reciprocally linked to them (T004).", "file": "parties/1.md"}, {"id": "2", "titre": "Les fondements d'un schème culturel du statut", "resume": "De la dominance et du prestige au schème double : les tiers, la norme fondamentale, les croyances de statut et le consensus de second ordre.", "titre_de": "Grundlagen eines kulturellen Schemas des Status", "resume_de": "Von Dominanz und Prestige zum zweifachen Schema: die Dritten, die grundlegende Norm, die Statusüberzeugungen und der Konsens zweiter Ordnung.", "body_de": "**Gegen evolutionäre Erklärungen.** Dominanz organisiert Zusammenarbeit schlecht und ist nicht die Grundlage des Status (T005, gegen R03); das Prestige übersieht Anstrengung und Gruppenorientierung (T006, gegen R04).\n\n**Die Entstehung der Norm.** Ab drei Personen ist die Hierarchie kontingent (T007). Jeder hat ein Interesse daran, dass die anderen sich der Kompetenz fügen (T008); Dritte stellen sich gegen den Dominierenden, was eine Norm offenbart (T009). Sie beruht auf gemeinsamem Wissen (T010).\n\n**Das zweifache Schema und der Konsens.** Grundlegende Norm und Statusüberzeugungen bilden Grammatik und Vokabular des Status (T011). Der Konsens, der die Hierarchie regiert, ist von zweiter Ordnung (T012). Die Dominanz wird eingebunden oder eingedämmt (T013), und die Kompetenz ist durch die Absicht begrenzt (T014).", "titre_en": "Foundations for a Cultural Schema of Status", "resume_en": "From dominance and prestige to the twofold schema: third parties, the basic norm, status beliefs and the second-order consensus.", "loc": "p. 20–46", "body": "**Contre les explications évolutionnistes.** La dominance organise mal la coopération et n'est pas le fondement du statut (T005, contre R03) ; le prestige ignore l'effort et l'orientation vers le groupe (T006, contre R04).\n\n**La genèse de la norme.** À trois ou plus, la hiérarchie est contingente (T007). Chacun a intérêt à ce que les autres défèrent à la compétence (T008) ; les tiers se liguent contre le dominateur, ce qui révèle une norme (T009). Elle repose sur un savoir commun (T010).\n\n**Le schème double et le consensus.** Norme fondamentale et croyances de statut forment la grammaire et le vocabulaire du statut (T011). Le consensus qui gouverne la hiérarchie est de second ordre (T012). La dominance est incorporée ou contenue (T013), et la compétence est bornée par l'intention (T014).", "body_en": "**Against evolutionary explanations.** Dominance organises cooperation poorly and is not the foundation of status (T005, against R03); prestige ignores effort and group orientation (T006, against R04).\n\n**The genesis of the norm.** With three or more, the hierarchy is contingent (T007). Each has an interest in others deferring to competence (T008); third parties side against the dominator, which reveals a norm (T009). It rests on common knowledge (T010).\n\n**The twofold schema and the consensus.** The basic norm and status beliefs form the grammar and vocabulary of status (T011). The consensus governing the hierarchy is second-order (T012). Dominance is incorporated or contained (T013), and competence is bounded by intent (T014).", "file": "parties/2.md"}, {"id": "3", "titre": "Pourquoi tenons-nous au statut ?", "resume": "Le désir de statut comme motif fondamental, ses incitations, son insatiabilité, la récompense de la déférence et la stabilité des hiérarchies.", "titre_de": "Warum liegt uns am Status?", "resume_de": "Das Streben nach Status als grundlegendes Motiv, seine Anreize, seine Unersättlichkeit, die Belohnung der Ehrerbietung und die Stabilität der Hierarchien.", "body_de": "**Ein grundlegendes Motiv.** Status ist eine eigene Dimension der Stellung bei den anderen (T015, gegen R06). Das Streben nach ihm ist ein grundlegendes Motiv (T016, gegen R01), und Bedrohungen des Status einer Gruppe werden politisch (T017).\n\n**Die Anreize.** Das Schema schafft direkte und indirekte Anreize (T018). Status, nie gesichert, motiviert ohne Ende (T019, gegen R13).\n\n**Die Stabilität.** Das Schema belohnt die Hinnahme niedrigen Status mit dem Respekt, der vernünftiger Ehrerbietung gebührt (T020). Die Stabilität beruht auf dem Konsens der anderen und auf Statusüberzeugungen (T021).", "titre_en": "Why Do We Care About Status?", "resume_en": "The desire for status as a fundamental motive, its incentives, its insatiability, the reward for deference and the stability of hierarchies.", "loc": "p. 47–67", "body": "**Un motif fondamental.** Le statut est une dimension propre de la position parmi les autres (T015, contre R06). Son désir est un motif fondamental (T016, contre R01), et les menaces sur le statut d'un groupe deviennent politiques (T017).\n\n**Les incitations.** Le schème crée des incitations directes et indirectes (T018). Le statut, jamais acquis, motive sans fin (T019, contre R13).\n\n**La stabilité.** Le schème récompense l'acceptation du bas statut par le respect dû à la déférence raisonnable (T020). La stabilité tient au consensus des autres et aux croyances de statut (T021).", "body_en": "**A fundamental motive.** Status is a distinct dimension of standing with others (T015, against R06). Its desire is a fundamental motive (T016, against R01), and threats to a group's status become political (T017).\n\n**Incentives.** The schema creates direct and indirect incentives (T018). Status, never secured, motivates without end (T019, against R13).\n\n**Stability.** The schema rewards acceptance of low status with the respect due to reasonable deference (T020). Stability rests on others' consensus and on status beliefs (T021).", "file": "parties/3.md"}, {"id": "4", "titre": "Les croyances de statut et l'organisation de l'inégalité", "resume": "La nature, la force et le contenu des croyances de statut, leur genèse, leur extension aux organisations et l'avantage de statut.", "titre_de": "Statusüberzeugungen und die Organisation der Ungleichheit", "resume_de": "Wesen, Kraft und Inhalt der Statusüberzeugungen, ihre Entstehung, ihre Ausdehnung auf Organisationen und der Statusvorteil.", "body_de": "**Was die Überzeugungen sind.** Sie verbinden Gruppe und Interaktion (D06, T022), verlangen, dass die benachteiligte Gruppe nachgibt (T023), schöpfen ihre Kraft aus ihrer dritten Ordnung (T024) und müssen gemeinsames Wissen sein (T025). Ihr Inhalt ist Kompetenz, diffuse oder spezifische, und Statuswürdigkeit (T026). Über die Statusgeneralisierung verbinden sie Mikro- und Makroebene (T027).\n\n**Woher sie kommen.** Sie entstehen aus verzerrten Begegnungen (T028, gegen R08), wie beim Geschlecht (T029), und aus zwei allgemeineren Elementen, die auch für Organisationen gelten (T030).\n\n**Wie weit sie reichen.** Das Schema breitet sich überall aus, wo es ein Ziel und Interdependenz gibt (T031). Der Statusvorteil entsteht aus zwei Inferenzen und gilt als Verdienst (T032).", "titre_en": "Status Beliefs and the Organization of Inequality", "resume_en": "The nature, force and content of status beliefs, their genesis, their extension to organisations and status advantage.", "loc": "p. 68–96", "body": "**Ce que sont les croyances.** Elles relient le groupe et l'interaction (D06, T022), exigent que le groupe défavorisé concède (T023), tirent leur force de leur troisième ordre (T024) et doivent être un savoir commun (T025). Leur contenu est la compétence, diffuse ou spécifique, et la valeur sociale (T026). Par la généralisation du statut, elles relient le micro et le macro (T027).\n\n**D'où elles viennent.** Elles naissent des rencontres biaisées (T028, contre R08), comme pour le genre (T029), et de deux éléments plus généraux, qui valent aussi pour les organisations (T030).\n\n**Jusqu'où elles vont.** Le schème s'étend partout où il y a un but et une interdépendance (T031). L'avantage de statut naît de deux inférences et passe pour du mérite (T032).", "body_en": "**What beliefs are.** They link the group and the interaction (D06, T022), require the disfavoured group to concede (T023), draw their force from their third-order character (T024) and must be common knowledge (T025). Their content is competence, diffuse or specific, and status-worthiness (T026). Through status generalization, they link micro and macro (T027).\n\n**Where they come from.** They arise from biased encounters (T028, against R08), as for gender (T029), and from two more general elements, which also hold for organisations (T030).\n\n**How far they reach.** The schema spreads wherever there is a goal and interdependence (T031). Status advantage arises from two inferences and passes for merit (T032).", "file": "parties/4.md"}, {"id": "5", "titre": "La microdynamique du statut", "resume": "Comment les hiérarchies se forment, se stabilisent et changent ; les indices de statut, la légitimité, le rejet, et les trois biais.", "titre_de": "Die Mikrodynamik des Status", "resume_de": "Wie Hierarchien sich bilden, festigen und ändern; die Statushinweise, die Legitimität, die Abwehr und die drei Verzerrungen.", "body_de": "**Die Bildung.** Status hängt vom Kontext ab (T033). Sich selbst erfüllende Erwartungen begründen eine stabile Hierarchie (T034), durch Verrechnung von Hinweisen (T035).\n\n**Die Hinweise.** Diffuse Merkmale rahmen die Interaktion von Anfang an (T036, gegen R11) und verändern Verhalten und Leistung (T037); sie erzeugen doppelte Standards (T038). Belohnungen und Objekte tragen Status (T039); Stil und Bewertungen schaffen und lösen Ränge (T040).\n\n**Legitimität und Verzerrungen.** Legitimität entsteht aus Gültigkeit, die diffuse Merkmale verstärken (T041); die Abwehr trifft, wer die Rangordnung der Gruppen in Frage stellt (T042, gegen R10). Man kann die Statusgeneralisierung überwinden, aber nicht unter gleichen Bedingungen (T043). Drei Verzerrungen häufen sich über ein Leben an (T044).", "titre_en": "The Microdynamics of Status", "resume_en": "How hierarchies form, stabilise and change; status cues, legitimacy, backlash, and the three biases.", "loc": "p. 97–123", "body": "**La formation.** Le statut dépend du contexte (T033). Des attentes autoréalisatrices fondent une hiérarchie stable (T034), par combinaison d'indices (T035).\n\n**Les indices.** Les caractéristiques diffuses cadrent l'interaction dès le début (T036, contre R11) et changent conduite et performance (T037) ; elles créent des doubles standards (T038). Récompenses et objets portent du statut (T039) ; le style et les évaluations font et défont les rangs (T040).\n\n**Légitimité et biais.** La légitimité vient de la validité, que les caractéristiques diffuses renforcent (T041) ; le rejet frappe qui conteste la hiérarchie des groupes (T042, contre R10). On peut surmonter la généralisation du statut, mais pas à armes égales (T043). Trois biais s'accumulent sur une vie (T044).", "body_en": "**Formation.** Status depends on context (T033). Self-fulfilling expectations found a stable hierarchy (T034), by combining cues (T035).\n\n**Cues.** Diffuse characteristics frame interaction from the start (T036, against R11) and change behaviour and performance (T037); they create double standards (T038). Rewards and objects carry status (T039); style and evaluations make and unmake ranks (T040).\n\n**Legitimacy and bias.** Legitimacy comes from validity, which diffuse characteristics strengthen (T041); backlash strikes those who challenge the ranking of groups (T042, against R10). Status generalization can be overcome, but not on equal terms (T043). Three biases accumulate over a lifetime (T044).", "file": "parties/5.md"}, {"id": "6", "titre": "Statut, différence et durabilité de l'inégalité", "resume": "Comment le statut consolide, reproduit et légitime l'inégalité matérielle fondée sur le genre, la race et la classe.", "titre_de": "Status, Unterschied und die Dauerhaftigkeit der Ungleichheit", "resume_de": "Wie Status die auf Geschlecht, Rasse und Klasse beruhende materielle Ungleichheit verfestigt, reproduziert und legitimiert.", "body_de": "**Verfestigen.** Status ist eine Ursache dauerhafter Ungleichheit, kein Firnis (T045, gegen R09): Die Überzeugungen verfestigen materielle Ungleichheit mit dem Unterschied (T046).\n\n**Reproduzieren.** Status verleiht der Gruppenungleichheit die Kraft, sich selbst zu reproduzieren (T047), und schreibt sich in die Praktiken der Organisationen ein (T048). Begegnungen zwischen Kategorien sind die entscheidenden Orte (T049). Geschlecht und Rasse, essentialisiert, wirken immer (T050); Klasse erhält sich durch exklusives kulturelles Kapital (T051). Überzeugungen und Ungleichheit stützen einander und ändern sich, wenn der Konsens schwindet (T052).\n\n**Legitimieren.** Die Überzeugungen legitimieren Ungleichheit durch Verdienst (T053); das Gefühl der Gruppenposition verteidigt die Hierarchie und spaltet die Unteren (T054); und schließlich verleugnet man den Status selbst (T055, gegen R12).", "titre_en": "Status, Difference, and the Durability of Inequality", "resume_en": "How status consolidates, reproduces and legitimates material inequality based on gender, race and class.", "loc": "p. 124–149", "body": "**Consolider.** Le statut est une cause de l'inégalité durable, non un vernis (T045, contre R09) : les croyances consolident l'inégalité matérielle avec la différence (T046).\n\n**Reproduire.** Le statut donne à l'inégalité de groupe le pouvoir de se reproduire (T047), et s'inscrit dans les pratiques des organisations (T048). Les rencontres entre catégories sont les lieux décisifs (T049). Genre et race, essentialisés, sont toujours à l'œuvre (T050) ; la classe se maintient par un capital culturel exclusif (T051). Croyances et inégalité se soutiennent, et changent quand le consensus s'érode (T052).\n\n**Légitimer.** Les croyances légitiment l'inégalité par le mérite (T053) ; le sentiment de position de groupe défend la hiérarchie et divise le bas (T054) ; et l'on finit par nier le statut lui-même (T055, contre R12).", "body_en": "**Consolidating.** Status is a cause of durable inequality, not a gloss (T045, against R09): beliefs consolidate material inequality with difference (T046).\n\n**Reproducing.** Status gives group inequality the power to reproduce itself (T047), and is written into organisational practices (T048). Cross-category encounters are the decisive sites (T049). Gender and race, essentialised, are always at work (T050); class is maintained through exclusive cultural capital (T051). Beliefs and inequality sustain each other, and change when consensus erodes (T052).\n\n**Legitimating.** Beliefs legitimate inequality through merit (T053); the sense of group position defends the hierarchy and divides those below (T054); and people end up denying status itself (T055, against R12).", "file": "parties/6.md"}, {"id": "7", "titre": "Conclusion", "resume": "Le bilan de la théorie du schème culturel, le double tranchant du statut et la possibilité de réduire l'inégalité de groupe.", "titre_de": "Schluss", "resume_de": "Die Bilanz der Theorie des kulturellen Schemas, die zwei Seiten des Status und die Möglichkeit, Gruppenungleichheit zu verringern.", "body_de": "**Die Theorie.** Status ist ein normatives kulturelles Schema (T056, gegen R03 und R04). Die Theorie erklärt eigens den Konsens zweiter Ordnung, die Stabilität und die Reichweite des Status (T057) und beantwortet die beiden Fragen des Titels (T058).\n\n**Das Urteil.** Status ist ein zweischneidiges Schwert (T059). Er wird nicht verschwinden, doch Gruppenungleichheit ist nicht unvermeidlich (T060).", "titre_en": "Conclusion", "resume_en": "The balance of the cultural schema theory, the double edge of status and the possibility of reducing group inequality.", "loc": "p. 150–163", "body": "**La théorie.** Le statut est un schème culturel normatif (T056, contre R03 et R04). La théorie explique en propre le consensus de second ordre, la stabilité et l'étendue du statut (T057), et répond aux deux questions du titre (T058).\n\n**Le jugement.** Le statut est une épée à double tranchant (T059). Il ne disparaîtra pas, mais l'inégalité de groupe n'est pas inévitable (T060).", "body_en": "**The theory.** Status is a normative cultural schema (T056, against R03 and R04). The theory distinctively explains the second-order consensus, the stability and the reach of status (T057), and answers the two questions of the title (T058).\n\n**The judgement.** Status is a double-edged sword (T059). It will not disappear, but group inequality is not inevitable (T060).", "file": "parties/7.md"}], "problems": []};

  const q = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem("treillis-lang"); if (LANGS.includes(s)) return s; } catch {}
  const n = (navigator.language || "fr").toLowerCase(); return n.startsWith("fr") ? "fr" : n.startsWith("de") ? "de" : "en";
})();

function inline(s) {
  const keep = [];
  const hold = h => `\u0000${keep.push(h) - 1}\u0000`;
  s = s.replace(/`([^`]+)`/g, (_, c) => hold(`<code>${esc(c)}</code>`));
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`));
  s = s.replace(/https?:\/\/[^\s<>»)]+/g, u => hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`));
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^\w])_(?!\s)([^_]+?)_(?!\w)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
}
function markdown(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  let out = "", i = 0;
  const isBlockStart = l => /^(#{1,6}\s|```|>|\s*([-*+]|\d+\.)\s|\|)/.test(l) || /^(-{3,}|\*{3,})\s*$/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++; out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const n = m[1].length; out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(l)) { out += "<hr>"; i++; continue; }
    if (l.startsWith("|") && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const row = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      out += "<table><thead><tr>" + row(l).map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith("|")) out += "<tr>" + row(lines[i++]).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      out += "</tbody></table>"; continue;
    }
    if (l.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, ""));
      out += `<blockquote>${markdown(buf.join("\n"))}</blockquote>`; continue;
    }
    if (/^\s*([-*+]|\d+\.)\s/.test(l)) {
      const stack = [];
      while (i < lines.length && (/^\s*([-*+]|\d+\.)\s/.test(lines[i]) || (lines[i].trim() && /^\s{2,}/.test(lines[i]) && stack.length))) {
        const li = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if (!li) { out += " " + inline(lines[i].trim()); i++; continue; }
        const ind = li[1].length, tag = /\d/.test(li[2]) ? "ol" : "ul";
        while (stack.length && ind < stack[stack.length - 1].ind) out += `</li></${stack.pop().tag}>`;
        if (!stack.length || ind > stack[stack.length - 1].ind) { out += `<${tag}><li>`; stack.push({ ind, tag }); }
        else out += "</li><li>";
        out += inline(li[3]); i++;
      }
      while (stack.length) out += `</li></${stack.pop().tag}>`;
      continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out += `<p>${inline(buf.join(" "))}</p>`;
  }
  return out;
}
// Transforme les identifiants en liens, hors <a>, <code>, <pre>.
function linkify(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const targets = [];
  while (walker.nextNode()) {
    const n = walker.currentNode;
    if (n.parentElement.closest("a, code, pre")) continue;
    if (/\b[DAETR]\d{2,3}(?:-C\d+)?\b/.test(n.nodeValue)) targets.push(n);
  }
  for (const n of targets) {
    const frag = document.createDocumentFragment();
    let last = 0;
    n.nodeValue.replace(/\b([DAETR]\d{2,3}(?:-C\d+)?)\b/g, (m, id, off) => {
      frag.append(n.nodeValue.slice(last, off));
      const r = resolve(id);
      if (byId.has(r)) {
        const a = document.createElement("a");
        a.className = "ref"; a.href = "#" + r; a.textContent = id;
        a.style.setProperty("--c", color(r)); a.title = byId.get(r).titre + " — " + byId.get(r).enonce;
        frag.append(a);
      } else { const s = document.createElement("span"); s.className = "ref missing"; s.textContent = id; s.title = tr("Élément inexistant", "Missing element"); frag.append(s); }
      last = off + m.length;
    });
    frag.append(n.nodeValue.slice(last));
    n.replaceWith(frag);
  }
}

function matches(e) {

  if (fold(e.id + " " + e.titre + " " + e.enonce).includes(q)) return { snip: null };
  const b = fold(e.body), k = b.indexOf(q);

}
function hlText(text) {

const NW = 180, NH = 46, GX = 56, GY = 16;

function visibleSet() {

  ids = ids.filter(id => byId.has(id) ? passes(byId.get(id)) : state.types.has("manquant"));
  const s = state.sel && (byId.has(state.sel) || missing.has(state.sel)) ? state.sel : null;

    if (state.mode === "anc") closure(s, parents).forEach(x => keep.add(x));
    if (state.mode === "desc") closure(s, children).forEach(x => keep.add(x));
    if (state.mode === "near") [...parents.get(s), ...children.get(s)].forEach(x => keep.add(x));

const HKEY = "explorer-history";
let hist = { stack: [], i: -1 };
try { hist = JSON.parse(sessionStorage.getItem(HKEY)) || hist; } catch {}
function track(h) {
  const st = history.state;
  if (st && typeof st.i === "number" && hist.stack[st.i] === h) hist.i = st.i;      // précédent / suivant / rechargement
  else if (hist.stack[hist.i] !== h) {                                               // nouvelle visite
    hist.stack = hist.stack.slice(0, hist.i + 1); hist.stack.push(h); hist.i = hist.stack.length - 1;
    if (hist.stack.length > 200) { hist.stack.shift(); hist.i--; }
    history.replaceState({ i: hist.i }, "");
  } else history.replaceState({ i: hist.i }, "");
  try { sessionStorage.setItem(HKEY, JSON.stringify(hist)); } catch {}
  renderTrail();
}
function label(h) {
  if (h === "home") return { t: tr("Vue d'ensemble", "Overview") };
  if (h === "audit") return { t: "Audit" };

function renderTrail() {

    steps.push(`<button class="step ${cur ? "cur" : ""} ${k > hist.i ? "fwd" : ""}" data-k="${k}" ${L.c ? `style="--c:${L.c}"` : ""} title="${esc((L.id ? L.id + " — " : "") + L.t)}">${L.id ? esc(L.id) + (cur ? `<span class="tt">${esc(L.t)}</span>` : "") : esc(L.t)}</button>`);
