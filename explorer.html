ces de statut portent sur des différences de groupe ; or, par A08, reconnaître une différence suffit à préférer son propre groupe (p. 71).\n2. Ce favoritisme produit des vues concurrentes sur le groupe le meilleur ; il ne suffit pas à une croyance de statut (p. 71).\n3. Par D06, une croyance de statut ordonne les groupes, et cet ordre doit être reconnu par tous : c'est sa marque distinctive (p. 71).\n4. Il faut donc qu'un groupe surmonte sa tendance à se voir meilleur et concède que la communauté voit l'autre comme meilleur ; toute théorie de la genèse des croyances doit en rendre compte (p. 71). ∎", "body_en": "## Demonstration\n\n1. By T022, status beliefs bear on group differences; yet, by A08, recognising a difference is enough to prefer one's own group (p. 71).\n2. This favouritism produces competing views about which group is better; it is not enough for a status belief (p. 71).\n3. By D06, a status belief ranks groups, and that ranking must be acknowledged by all: this is its hallmark (p. 71).\n4. One group must therefore overcome its tendency to see itself as better and concede that the community sees the other as better; any theory of how beliefs develop must account for this (p. 71). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A08", "D06", "T022"], "sections": ["Démonstration"], "demo_refs": ["A08", "D06", "T022"], "mentions": ["A08", "D06", "T022"], "corollaires": [], "mtime": 1794593161.3101802}, {"id": "T024", "file": "theses/T024.md", "type": "these", "partie": "4", "titre": "Leur troisième ordre donne leur force aux croyances de statut", "enonce": "Parce qu'on tient une croyance de statut pour ce que pense « la plupart des gens », on s'attend à ce que les autres agissent et vous jugent selon elle, et l'on doit en tenir compte qu'on y adhère ou non. Ce caractère de troisième ordre donne leur force aux croyances et crée l'avantage de statut.", "titre_en": "Their third-order character gives status beliefs their force", "enonce_en": "Because one takes a status belief to be what \"most people\" think, one expects others to act and judge one according to it, and must take it into account whether or not one endorses it. This third-order character gives beliefs their force and creates status advantage.", "titre_de": "Ihre dritte Ordnung verleiht Statusüberzeugungen ihre Kraft", "enonce_de": "Weil man eine Statusüberzeugung für das hält, was „die meisten Leute“ denken, erwartet man, dass die anderen nach ihr handeln und einen nach ihr beurteilen, und muss sie berücksichtigen, ob man ihr zustimmt oder nicht. Diese dritte Ordnung verleiht den Überzeugungen ihre Kraft und erzeugt den Statusvorteil.", "body_de": "## Beweis\n\n1. Nach T023 ist eine Statusüberzeugung von allen anerkannt; nach D10 gilt sie als das, was die meisten Leute denken, nicht als persönliche Meinung (S. 71).\n2. Man kann sie als solche haben, ohne ihr zuzustimmen; der Abstand zwischen beiden Ebenen schafft eine fragile „pluralistische Ignoranz“, durch die Überzeugungen zusammenbrechen können (S. 71-72).\n3. Nimmt man an, dass die anderen eine Überzeugung teilen, erwartet man, dass sie nach ihr handeln und einen nach ihr beurteilen; man muss sie berücksichtigen, ob man sie billigt oder nicht: Das ist ihre Kraft (S. 72).\n4. Wer an einem staatlichen College studiert hat und sich bei einer Firma bewirbt, die gewöhnlich aus der Ivy League einstellt, muss damit rechnen, unterschätzt zu werden, und seine Antworten danach ausrichten (S. 72).\n5. Die Überzeugungen lösen so eine implizite Koordination aus, die Urteile und Verhalten prägt und den Statusvorteil (D13) erzeugt (S. 72-73). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D10", "D13", "T023"], "citation": "", "pages": [71, 72, 73], "depends_on": ["D10", "D13", "T023"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T023, une croyance de statut est reconnue par tous ; par D10, elle est tenue pour ce que pense la plupart des gens, non pour une opinion personnelle (p. 71).\n2. On peut la tenir à ce titre sans l'endosser ; l'écart entre les deux niveaux crée une « ignorance plurielle » fragile, par où les croyances peuvent s'effondrer (p. 71-72).\n3. Si l'on suppose les autres attachés à une croyance, on s'attend à ce qu'ils agissent et vous jugent selon elle ; on doit en tenir compte, qu'on l'approuve ou non : c'est sa force (p. 72).\n4. Le diplômé d'une université d'État qui postule dans une firme habituée à l'Ivy League doit anticiper d'être sous-estimé et coordonner ses réponses en conséquence (p. 72).\n5. Les croyances déclenchent ainsi une coordination implicite qui façonne jugements et conduites, et crée l'avantage de statut (D13) (p. 72-73). ∎", "body_en": "## Demonstration\n\n1. By T023, a status belief is acknowledged by all; by D10, it is taken as what most people think, not as a personal opinion (p. 71).\n2. One can hold it as such without endorsing it; the gap between the two levels creates a fragile \"pluralistic ignorance\", through which beliefs can collapse (p. 71-72).\n3. If one assumes others hold a belief, one expects them to act and judge one according to it; one must take it into account, approving or not: this is its force (p. 72).\n4. The state-college graduate applying to a firm used to hiring from the Ivy League must anticipate being underestimated and coordinate responses accordingly (p. 72).\n5. Beliefs thus trigger an implicit coordination that shapes judgements and behaviour, and creates status advantage (D13) (p. 72-73). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D10", "D13", "T023"], "sections": ["Démonstration"], "demo_refs": ["D10", "D13", "T023"], "mentions": ["D10", "D13", "T023"], "corollaires": [], "mtime": 1794593161.311184}, {"id": "T025", "file": "theses/T025.md", "type": "these", "partie": "4", "titre": "Il faut un savoir commun pour se coordonner", "enonce": "Pour former des jugements consensuels sur lesquels agir sans risque, il ne suffit pas que les croyances de statut soient partagées : il faut qu'elles soient un savoir commun. Les stéréotypes américains de tous les groupes qui structurent l'inégalité contiennent de telles croyances ; et chaque communauté peut avoir les siennes.", "titre_en": "Coordination requires common knowledge", "enonce_en": "To form consensual judgements on which to act without risk, it is not enough that status beliefs be shared: they must be common knowledge. American stereotypes of all the groups that pattern inequality contain such beliefs; and each community can have its own.", "titre_de": "Koordination verlangt gemeinsames Wissen", "enonce_de": "Um übereinstimmende Urteile zu bilden, nach denen man ohne Risiko handeln kann, genügt es nicht, dass Statusüberzeugungen geteilt werden: Sie müssen gemeinsames Wissen sein. Die amerikanischen Stereotype aller Gruppen, die die Ungleichheit strukturieren, enthalten solche Überzeugungen; und jede Gemeinschaft kann ihre eigenen haben.", "body_de": "## Beweis\n\n1. Die Überzeugungen liefern eine Abkürzung, um den Wert anderer schnell einzuschätzen; die Hierarchie verlangt aber *übereinstimmende* Urteile (S. 73-74).\n2. Nach D11 verlangt das gemeinsames Wissen: Sind die Überzeugungen nur geteilt, erfährt man erst hinterher, ob man unterstützt wird; sind sie gemeinsam, kann man es voraussetzen, bevor man das Risiko eingeht (S. 74-75).\n3. Nach E27 stimmt man sich bereitwilliger ab, wenn eine Information gemeinsames Wissen ist; kooperative Interdependenz ist eine solche Situation, und Statusüberzeugungen sind nach T024 ihr Werkzeug (S. 75).\n4. Nach E25 enthalten die Stereotype der Gruppen, die die Ungleichheit strukturieren, übereinstimmende Statusüberzeugungen, die als das gelten, was die meisten Amerikaner denken (S. 75-76).\n5. Nach E26 haben Gemeinschaften auch eigene Überzeugungen; da man mehreren angehört, reagiert man je nach Kontext auf verschiedene Überzeugungen (S. 76). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D11", "E25", "E26", "E27", "T024"], "citation": "", "pages": [73, 74, 75, 76], "depends_on": ["D11", "T024", "E27", "E25", "E26"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Les croyances donnent un raccourci pour juger vite la valeur d'autrui ; mais la hiérarchie exige des jugements *consensuels* (p. 73-74).\n2. Par D11, il faut pour cela un savoir commun : si les croyances sont seulement partagées, on ne sait qu'après coup si l'on sera soutenu ; si elles sont communes, on peut le présumer avant de prendre le risque (p. 74-75).\n3. Par E27, on se coordonne plus volontiers quand l'information est un savoir commun ; l'interdépendance coopérative est une telle situation, et les croyances de statut, par T024, en sont l'outil (p. 75).\n4. Par E25, les stéréotypes des groupes qui structurent l'inégalité contiennent des croyances de statut consensuelles, tenues pour ce que pensent la plupart des Américains (p. 75-76).\n5. Par E26, des communautés ont aussi leurs propres croyances ; comme on appartient à plusieurs, on répond à des croyances variées selon les contextes (p. 76). ∎", "body_en": "## Demonstration\n\n1. Beliefs provide a shorthand for quickly judging others' value; but the hierarchy requires *consensual* judgements (p. 73-74).\n2. By D11, this requires common knowledge: if beliefs are only shared, one learns only afterwards whether one will be supported; if they are common, one can presume it before taking the risk (p. 74-75).\n3. By E27, people coordinate more readily when information is common knowledge; cooperative interdependence is such a situation, and status beliefs, by T024, are its tool (p. 75).\n4. By E25, stereotypes of the groups that pattern inequality contain consensual status beliefs, taken as what most Americans think (p. 75-76).\n5. By E26, communities also have their own beliefs; since people belong to several, they respond to varied beliefs across contexts (p. 76). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D11", "E25", "E26", "E27", "T024"], "sections": ["Démonstration"], "demo_refs": ["D11", "E25", "E26", "E27", "T024"], "mentions": ["D11", "E25", "E26", "E27", "T024"], "corollaires": [], "mtime": 1794593161.311184}, {"id": "T026", "file": "theses/T026.md", "type": "these", "partie": "4", "titre": "Le contenu des croyances : compétence et valeur sociale", "enonce": "Les croyances de statut associent un groupe à une compétence générale (caractéristiques diffuses) ou bornée (caractéristiques spécifiques). Leur valeur sociale tient surtout à la compétence présumée ; la part morale est faible, et les groupes de haut statut sont même vus comme moins chaleureux.", "titre_en": "The content of beliefs: competence and status-worthiness", "enonce_en": "Status beliefs associate a group with general competence (diffuse characteristics) or bounded competence (specific characteristics). Their status-worthiness rests mainly on presumed competence; the moral element is weak, and high-status groups are even seen as less warm.", "titre_de": "Der Inhalt der Überzeugungen: Kompetenz und Statuswürdigkeit", "enonce_de": "Statusüberzeugungen verbinden eine Gruppe mit allgemeiner Kompetenz (diffuse Merkmale) oder begrenzter Kompetenz (spezifische Merkmale). Ihre Statuswürdigkeit beruht vor allem auf unterstellter Kompetenz; das moralische Element ist schwach, und hochrangige Gruppen gelten sogar als weniger warm.", "body_de": "## Beweis\n\n1. Nach D14 haben Überzeugungen, die einen Unterschied mit allgemeiner Kompetenz verbinden, die breitesten Wirkungen: Geschlecht, Rasse, Bildung und Beruf gehören dazu (S. 77).\n2. Nach D15 verbinden andere Überzeugungen einen Unterschied mit einer begrenzten Kompetenz, die nur dort zählt, wo sie einschlägig ist (S. 77-78).\n3. Die Statuswürdigkeit einer Gruppe ist am schwersten zu fassen; nach E25 verschmelzen Status und Kompetenz in den Stereotypen dennoch nahezu (S. 78).\n4. Ein moralisches Element gibt es, entsprungen der Spannung zwischen Führenden und Folgenden (T014): Man will, dass hoher Status der Gruppe dient (S. 78-79).\n5. Doch nach E25 gelten hochrangige Gruppen als weniger warm, und nach E13 weckt hoher Status einen leichten moralischen Verdacht (S. 79).\n6. Die Überzeugungen sichern also nicht die moralische Ausrichtung des hohen Status: Ihre Statuswürdigkeit beruht vor allem auf der unterstellten allgemeinen Kompetenz und dem anerkannten Respekt, den sie einbringt (S. 79-80). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D14", "D15", "E13", "E25", "T014"], "citation": "", "pages": [77, 78, 79, 80], "depends_on": ["D14", "D15", "E25", "E13", "T014"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D14, les croyances qui lient une différence à la compétence générale ont les effets les plus larges : genre, race, éducation et profession en sont (p. 77).\n2. Par D15, d'autres croyances lient une différence à une compétence bornée, qui ne compte que là où elle sert (p. 77-78).\n3. La valeur sociale associée à un groupe est la plus difficile à cerner ; par E25, statut et compétence sont pourtant presque confondus dans les stéréotypes (p. 78).\n4. Un élément moral existe, issu de la tension entre meneurs et suiveurs (T014) : on veut que le haut statut serve le groupe (p. 78-79).\n5. Mais, par E25, les groupes de haut statut sont vus comme moins chaleureux, et, par E13, le haut statut suscite un léger soupçon moral (p. 79).\n6. Les croyances n'assurent donc pas l'orientation morale du haut statut : leur valeur sociale tient surtout à la compétence générale présumée et au respect reconnu qu'elle vaut (p. 79-80). ∎", "body_en": "## Demonstration\n\n1. By D14, beliefs that link a difference with general competence have the broadest effects: gender, race, education and occupation are such (p. 77).\n2. By D15, other beliefs link a difference with a bounded competence, which counts only where it is relevant (p. 77-78).\n3. The status-worthiness associated with a group is the hardest to pin down; by E25, status and competence nonetheless nearly merge in stereotypes (p. 78).\n4. A moral element exists, arising from the tension between leaders and followers (T014): people want high status to serve the group (p. 78-79).\n5. But, by E25, high-status groups are seen as less warm, and, by E13, high status arouses a slight moral suspicion (p. 79).\n6. Beliefs therefore do not assure the moral orientation of high status: their status-worthiness rests mainly on presumed general competence and the acknowledged respect it earns (p. 79-80). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D14", "D15", "E13", "E25", "T014"], "sections": ["Démonstration"], "demo_refs": ["D14", "D15", "E13", "E25", "T014"], "mentions": ["D14", "D15", "E13", "E25", "T014"], "corollaires": [], "mtime": 1794593161.312699}, {"id": "T027", "file": "theses/T027.md", "type": "these", "partie": "4", "titre": "La généralisation du statut relie le micro et le macro", "enonce": "Parce que les croyances de statut biaisent les attentes dans chaque rencontre orientée vers un but, les hiérarchies interpersonnelles prennent, d'un contexte à l'autre, des formes semblables quant aux catégories avantagées. Elles cessent d'être un bruit aléatoire : elles médiatisent l'accès aux ressources et offrent une démonstration apparemment valide de la supériorité des groupes favorisés, qui renforce les croyances.", "titre_en": "Status generalization links micro and macro", "enonce_en": "Because status beliefs bias expectations in every goal-oriented encounter, interpersonal hierarchies take similar shapes across contexts as to which categories are advantaged. They cease to be random noise: they mediate access to resources and offer an apparently valid demonstration of the superiority of favoured groups, which reinforces the beliefs.", "titre_de": "Die Statusgeneralisierung verbindet Mikro- und Makroebene", "enonce_de": "Weil Statusüberzeugungen die Erwartungen in jeder zielorientierten Begegnung verzerren, nehmen interpersonale Hierarchien kontextübergreifend ähnliche Formen an, was die begünstigten Kategorien betrifft. Sie sind kein zufälliges Rauschen mehr: Sie vermitteln den Zugang zu Ressourcen und liefern einen scheinbar gültigen Beweis der Überlegenheit der begünstigten Gruppen, der die Überzeugungen verstärkt.", "body_de": "## Beweis\n\n1. Nach D16 prägt die Gruppenidentität die wahrgenommene Kompetenz und damit die lokale Wertschätzung und den Einfluss (S. 80).\n2. Nach A05 wird eine Überzeugung salient, wenn die Mitglieder sich im Merkmal unterscheiden oder wenn es für die Aufgabe einschlägig ist; sie verzerrt dann die Erwartungen, die sich selbst erfüllende Wirkungen haben (S. 80-81).\n3. Nach T026 hängt der so verliehene Vorteil von der Gruppenidentität ab, nicht von individuellen Eigenschaften: Die Frau mit gleicher Stelle und gleichem Gehalt ist bei einer Beförderung leicht benachteiligt (S. 81).\n4. Zielorientierte Begegnungen (Schule, Arbeit, Gesundheit) vermitteln den Zugang zu den Gütern, an denen man Ungleichheit misst; die Überzeugungen geben ihnen überall ähnliche Formen (S. 81).\n5. Die so entstandene Hierarchie beweist scheinbar die Überlegenheit der begünstigten Gruppen, was die Überzeugungen verstärkt; sie webt die Gruppenungleichheit in angeblich „meritokratische“ Organisationen ein (S. 81). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["A05", "D16", "T026"], "citation": "", "pages": [80, 81], "depends_on": ["D16", "A05", "T026"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D16, l'identité de groupe façonne la compétence perçue et donc l'estime et l'influence locales (p. 80).\n2. Par A05, une croyance devient saillante si les membres diffèrent sur la caractéristique ou si elle est pertinente pour la tâche ; elle biaise alors les attentes, qui ont des effets autoréalisateurs (p. 80-81).\n3. Par T026, l'avantage ainsi donné tient à l'identité de groupe, non aux attributs individuels : la femme, à poste et salaire égaux, est un peu désavantagée pour une promotion (p. 81).\n4. Les rencontres orientées vers un but (école, travail, santé) médiatisent l'accès aux biens qui mesurent l'inégalité ; les croyances leur donnent des formes semblables partout (p. 81).\n5. La hiérarchie ainsi produite démontre en apparence la supériorité des groupes favorisés, ce qui renforce les croyances ; elle tisse l'inégalité de groupe dans des organisations dites « méritocratiques » (p. 81). ∎", "body_en": "## Demonstration\n\n1. By D16, group identity shapes perceived competence and hence local esteem and influence (p. 80).\n2. By A05, a belief becomes salient if members differ on the characteristic or if it is relevant to the task; it then biases expectations, which have self-fulfilling effects (p. 80-81).\n3. By T026, the advantage thus conferred depends on group identity, not individual attributes: the woman, with the same position and pay, is slightly disadvantaged for a promotion (p. 81).\n4. Goal-oriented encounters (school, work, health) mediate access to the outcomes by which inequality is measured; beliefs give them similar shapes everywhere (p. 81).\n5. The hierarchy thus produced seemingly demonstrates the superiority of favoured groups, which reinforces the beliefs; it weaves group inequality into ostensibly \"meritocratic\" organisations (p. 81). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A05", "D16", "T026"], "sections": ["Démonstration"], "demo_refs": ["A05", "D16", "T026"], "mentions": ["A05", "D16", "T026"], "corollaires": [], "mtime": 1794593161.3137796}, {"id": "T028", "file": "theses/T028.md", "type": "these", "partie": "4", "titre": "Les croyances de statut naissent des rencontres biaisées", "enonce": "Si un facteur extérieur (ressources, savoir, technique) avantage systématiquement les membres d'un groupe dans leurs rencontres avec ceux d'un autre, la hiérarchie d'influence qui y émerge, consensuelle en apparence, est attribuée à la différence de groupe ; répétée, elle fait naître chez tous une croyance de statut, que chacun transmet ensuite en traitant les autres selon elle.", "titre_en": "Status beliefs arise from biased encounters", "enonce_en": "If an outside factor (resources, knowledge, technology) systematically advantages members of one group in their encounters with members of another, the influence hierarchy that emerges, apparently consensual, is attributed to the group difference; repeated, it gives everyone a status belief, which each then passes on by treating others according to it.", "titre_de": "Statusüberzeugungen entstehen aus verzerrten Begegnungen", "enonce_de": "Begünstigt ein äußerer Faktor (Ressourcen, Wissen, Technik) die Mitglieder einer Gruppe in ihren Begegnungen mit denen einer anderen systematisch, so wird die entstehende, scheinbar einvernehmliche Einflusshierarchie dem Gruppenunterschied zugeschrieben; wiederholt, gibt sie allen eine Statusüberzeugung, die jeder dann weitergibt, indem er andere nach ihr behandelt.", "body_de": "## Beweis\n\n1. Nach A09 erwerben Gruppen Reichtum vor Status; doch das sagt nicht, durch welche Prozesse eine Überzeugung entsteht, die nach T023 selbst die benachteiligte Gruppe annehmen muss (S. 82).\n2. Die Theorie der Statuskonstruktion geht von kooperativen Begegnungen zwischen Mitgliedern verschiedener Gruppen aus, in denen fast immer Einflusshierarchien entstehen (S. 82-83).\n3. Begünstigt ein verzerrender Faktor systematisch eine Gruppe, so scheint der Einfluss, den sie gewinnt, Überlegenheit zu offenbaren; da die Quelle der Hierarchie im Dunkeln bleibt und der Unterschied salient ist, verbindet man das eine mit dem anderen (S. 83).\n4. Wiederholt, bringen diese Begegnungen selbst die benachteiligte Gruppe zu der Annahme, „die meisten Leute“ hielten die andere für würdiger (S. 83-84).\n5. Nach E28 beobachtet man genau das: Zwei Begegnungen genügen, wenn die Hierarchie einvernehmlich erscheint; nach E29 ist der Schluss auf Gruppenmerkmale spontan (S. 84-85).\n6. Einmal erworben, wird die Überzeugung durch die Art gelehrt, wie man andere behandelt, und kann sich weit verbreiten, umso mehr, je stärker der Unterschied mit dem verzerrenden Faktor verbunden ist und je häufiger die Begegnungen sind (S. 86). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["A09", "E28", "E29", "T023"], "citation": "", "pages": [82, 83, 84, 85, 86], "depends_on": ["A09", "E28", "E29", "T023"], "contre": ["R08"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par A09, les groupes acquièrent la richesse avant le statut ; mais cela ne dit pas par quels processus naît une croyance que, par T023, même le groupe défavorisé doit accepter (p. 82).\n2. La théorie de la construction du statut part des rencontres coopératives entre membres de groupes différents, où des hiérarchies d'influence apparaissent presque toujours (p. 82-83).\n3. Si un facteur biaisant avantage systématiquement un groupe, l'influence obtenue paraît révéler une supériorité ; la source de la hiérarchie restant obscure et la différence saillante, on associe l'une à l'autre (p. 83).\n4. Répétées, ces rencontres poussent même le groupe défavorisé à croire que « la plupart des gens » jugeraient l'autre plus estimable (p. 83-84).\n5. Par E28, c'est ce qu'on observe : deux rencontres suffisent, si la hiérarchie paraît consensuelle ; par E29, inférer les traits d'un groupe est spontané (p. 84-85).\n6. Une fois acquise, la croyance s'enseigne par la manière de traiter les autres, et peut se diffuser largement, d'autant plus que l'association entre différence et facteur biaisant est forte et les rencontres fréquentes (p. 86). ∎", "body_en": "## Demonstration\n\n1. By A09, groups acquire wealth before status; but this does not say through what processes a belief arises that, by T023, even the disfavoured group must accept (p. 82).\n2. Status construction theory starts from cooperative encounters between members of different groups, in which influence hierarchies nearly always emerge (p. 82-83).\n3. If a biasing factor systematically advantages one group, the influence it gains seems to reveal superiority; since the source of the hierarchy is obscure and the difference salient, people associate the one with the other (p. 83).\n4. Repeated, these encounters lead even the disfavoured group to believe that \"most people\" would see the other as more worthy (p. 83-84).\n5. By E28, this is what is observed: two encounters suffice, if the hierarchy appears consensual; by E29, inferring a group's traits is spontaneous (p. 84-85).\n6. Once acquired, the belief is taught through how others are treated, and can spread widely, the more so as the association between difference and biasing factor is strong and encounters frequent (p. 86). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A09", "E28", "E29", "T023"], "sections": ["Démonstration"], "demo_refs": ["A09", "E28", "E29", "T023"], "mentions": ["A09", "E28", "E29", "T023"], "corollaires": [], "mtime": 1794593161.3137796}, {"id": "T029", "file": "theses/T029.md", "type": "these", "partie": "4", "titre": "Le genre comme différence de statut", "enonce": "Le genre réunit les conditions de la construction du statut : une différence saillante partout et une interdépendance coopérative fréquente et intime. Il suffit qu'une division du travail donne aux hommes le contrôle des ressources pour que des croyances de statut diffuses les favorisent ; elles ancrent alors la supériorité masculine dans l'identité d'homme, au-delà de la force ou des ressources de chacun.", "titre_en": "Gender as a status difference", "enonce_en": "Gender combines the conditions for status construction: a difference salient everywhere and frequent, intimate cooperative interdependence. It is enough that a division of labour give men control of resources for diffuse status beliefs to favour them; these then root male superiority in the identity of being a man, beyond each man's strength or resources.", "titre_de": "Geschlecht als Statusunterschied", "enonce_de": "Das Geschlecht vereint die Bedingungen der Statuskonstruktion: einen überall salienten Unterschied und eine häufige, intime kooperative Interdependenz. Es genügt, dass eine Arbeitsteilung Männern die Kontrolle über Ressourcen gibt, damit diffuse Statusüberzeugungen sie begünstigen; diese verankern die männliche Überlegenheit dann in der Identität, ein Mann zu sein, über Kraft oder Ressourcen des Einzelnen hinaus.", "body_de": "## Beweis\n\n1. Die historischen Ursprünge der Überzeugungen von männlicher Überlegenheit sind verloren; doch das Geschlecht hat Merkmale, die das Wirken der Prozesse von T028 sehr wahrscheinlich machen (S. 86-87).\n2. An die Fortpflanzung gebunden, ist Geschlecht ein in allen Kontexten salienter Unterschied, fast augenblicklich wahrgenommen, und schafft häufige, intime kooperative Interdependenz (S. 87).\n3. Es fehlt nur ein *beständiger* Vorteil; nach E30 liefert ihn unter bestimmten Umständen eine Arbeitsteilung, die Männern die Kontrolle über Ressourcen gibt (S. 87-88).\n4. Nach T028 verzerrt diese Kontrolle die Einflusshierarchien zugunsten der Männer und nährt weit verbreitete diffuse Überzeugungen (S. 88).\n5. Diese Überzeugungen begünstigen Männer dann selbst gegenüber Frauen, die ebenso stark sind wie sie und keine stillenden Mütter sind: Sie festigen die Dominanz, indem sie sie in der Gruppenidentität verankern (S. 88). ∎\n\n## Anmerkung\n\nDas Geschlecht ist durch seine Verbindung zur Fortpflanzung einzigartig; die Geschichte der Überzeugungen über Rasse oder Klasse ist eine andere, doch auch dort wirkten verzerrende Faktoren: Reichtum, Waffen, Technik, Sklaverei (S. 88-89).", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["E30", "T028"], "citation": "", "pages": [86, 87, 88, 89], "depends_on": ["T028", "E30"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Les origines historiques des croyances sur la supériorité masculine sont perdues ; mais le genre a des traits qui rendent très probable l'action des processus de T028 (p. 86-87).\n2. Lié à la reproduction, le sexe/genre est une différence saillante dans tous les contextes, catégorisée presque instantanément, et qui crée une interdépendance coopérative fréquente et intime (p. 87).\n3. Il ne manque qu'un avantage *constant* ; par E30, une division du travail qui donne aux hommes le contrôle des ressources, dans certaines circonstances, le fournit (p. 87-88).\n4. Par T028, ce contrôle biaise les hiérarchies d'influence en faveur des hommes et nourrit des croyances diffuses largement répandues (p. 88).\n5. Ces croyances avantagent alors les hommes même face à des femmes aussi fortes qu'eux et qui ne sont pas mères allaitantes : elles consolident la domination en l'enracinant dans l'identité de groupe (p. 88). ∎\n\n## Scolie\n\nLe genre est unique par son lien à la reproduction ; l'histoire des croyances sur la race ou la classe est autre, mais des facteurs biaisants y ont aussi joué : richesse, armes, techniques, esclavage (p. 88-89).", "body_en": "## Demonstration\n\n1. The historical origins of beliefs in male superiority are lost; but gender has features that make the processes of T028 highly likely to operate (p. 86-87).\n2. Tied to reproduction, sex/gender is a difference salient in all contexts, categorised almost instantly, and creates frequent, intimate cooperative interdependence (p. 87).\n3. Only a *consistent* advantage is missing; by E30, a division of labour giving men control of resources, under some circumstances, provides it (p. 87-88).\n4. By T028, this control biases influence hierarchies in men's favour and feeds widely held diffuse beliefs (p. 88).\n5. These beliefs then advantage men even over women who are as strong as they are and are not nursing mothers: they consolidate dominance by rooting it in group identity (p. 88). ∎\n\n## Scholium\n\nGender is unique in its link to reproduction; the history of beliefs about race or class is different, but biasing factors operated there too: wealth, guns, technology, slavery (p. 88-89).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["E30", "T028"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["E30", "T028"], "mentions": ["E30", "T028"], "corollaires": [], "mtime": 1794593161.3147862}, {"id": "T030", "file": "theses/T030.md", "type": "these", "partie": "4", "titre": "Deux éléments font naître une croyance de statut", "enonce": "Au-delà de la construction du statut, deux éléments semblent nécessaires : un contexte qui associe une différence reconnue à un ordre de rang d'apparence valide, et une validation de cette association par un public plus large qui l'accepte ou ne la conteste pas. On les retrouve dans la formation du statut des organisations, par association et par évaluateurs tiers.", "titre_en": "Two elements give rise to a status belief", "enonce_en": "Beyond status construction, two elements seem necessary: a context that associates a recognised difference with an apparently valid rank order, and validation of that association by a wider audience that accepts it or does not challenge it. They are found in the formation of organisational status, through association and third-party evaluators.", "titre_de": "Zwei Elemente lassen eine Statusüberzeugung entstehen", "enonce_de": "Über die Statuskonstruktion hinaus scheinen zwei Elemente nötig: ein Kontext, der einen anerkannten Unterschied mit einer scheinbar gültigen Rangordnung verbindet, und die Bestätigung dieser Verbindung durch ein breiteres Publikum, das sie annimmt oder nicht anficht. Man findet sie in der Entstehung des Status von Organisationen wieder, durch Verbindung und dritte Bewerter.", "body_de": "## Beweis\n\n1. Nach T028 erzeugen Begegnungen Überzeugungen; die Theorie sagt selbst, dass dies nicht der einzige Weg ist, doch sie lässt zwei allgemeinere Elemente erkennen (S. 89).\n2. Erstes Element: ein Kontext, der die Verbindung zwischen einem anerkannten Unterschied und einer scheinbar gültigen Rangordnung salient macht (S. 89).\n3. Zweites Element: die Bestätigung im Verhalten eines breiteren Publikums; sie lässt den Rang auf den Gruppenunterschied übergehen (S. 89).\n4. Nach E31 genügt jeder Kontext, der eine solche gültige Verbindung schafft, etwa die Information einer legitimen Autorität (S. 89-90).\n5. Nach E32 entsteht der Status von Organisationen auf dieselbe Weise, durch Verbindung (der Status geht vom etablierten Partner auf den Neuling über) und durch dritte Bewerter, deren Legitimität oder Bekanntheit ihre Rangliste zu gemeinsamem Wissen macht (S. 90-91). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["E31", "E32", "T028"], "citation": "", "pages": [89, 90, 91], "depends_on": ["T028", "E31", "E32"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T028, les rencontres créent des croyances ; la théorie elle-même dit que ce n'est pas la seule voie, mais elle dégage deux éléments plus généraux (p. 89).\n2. Premier élément : un contexte qui rend saillante l'association entre une différence reconnue et un ordre de rang d'apparence valide (p. 89).\n3. Second élément : une validation comportementale par un public plus large ; elle permet au rang de se propager à la différence de groupe (p. 89).\n4. Par E31, tout contexte qui crée une telle association valide suffit, comme l'information d'une autorité légitime (p. 89-90).\n5. Par E32, le statut des organisations naît de même, par association (le statut s'étend du partenaire établi au nouveau venu) et par des évaluateurs tiers dont la légitimité ou la publicité fait de leur classement un savoir commun (p. 90-91). ∎", "body_en": "## Demonstration\n\n1. By T028, encounters create beliefs; the theory itself says this is not the only route, but it brings out two more general elements (p. 89).\n2. First element: a context that makes salient the association between a recognised difference and an apparently valid rank order (p. 89).\n3. Second element: behavioural validation by a wider audience; it allows the rank to spread to the group difference (p. 89).\n4. By E31, any context creating such a valid association suffices, like information from a legitimate authority (p. 89-90).\n5. By E32, organisational status arises the same way, through association (status spreads from the established partner to the newcomer) and through third-party evaluators whose legitimacy or publicity makes their ranking common knowledge (p. 90-91). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E31", "E32", "T028"], "sections": ["Démonstration"], "demo_refs": ["E31", "E32", "T028"], "mentions": ["E31", "E32", "T028"], "corollaires": [], "mtime": 1794593161.3147862}, {"id": "T031", "file": "theses/T031.md", "type": "these", "partie": "4", "titre": "Le schème s'étend partout où il y a un but et une interdépendance", "enonce": "Parce que le statut est un schème culturel, on l'applique bien au-delà de la hiérarchie interpersonnelle : aux écoles, aux quartiers, aux entreprises, aux objets. Deux conditions semblent nécessaires : une orientation vers un but et une interdépendance. À la limite, entre organisations rivales, la coopération ne porte plus que sur le classement lui-même.", "titre_en": "The schema spreads wherever there is a goal and interdependence", "enonce_en": "Because status is a cultural schema, it is applied well beyond the interpersonal hierarchy: to schools, neighbourhoods, firms, objects. Two conditions seem necessary: goal orientation and interdependence. At the limit, between rival organisations, cooperation bears only on the ranking itself.", "titre_de": "Das Schema breitet sich überall aus, wo es ein Ziel und Interdependenz gibt", "enonce_de": "Weil Status ein kulturelles Schema ist, wendet man es weit über die interpersonale Hierarchie hinaus an: auf Schulen, Wohnviertel, Unternehmen, Objekte. Zwei Bedingungen scheinen nötig: Zielorientierung und Interdependenz. Im Grenzfall, zwischen rivalisierenden Organisationen, betrifft die Zusammenarbeit nur noch die Rangliste selbst.", "body_de": "## Beweis\n\n1. Nach T030 bilden sich Überzeugungen für Organisationen und für Typen von Individuen auf ähnliche Weise: Status ordnet Beziehungen weit über das Interpersonale hinaus (S. 91).\n2. Nach A01 wendet man ein Schema, das man einmal hat, großzügig an: Es ist die Schere, mit der man neue Dinge zum Schneiden findet (S. 91).\n3. Ranglisten von Organisationen verzerren Qualitätsurteile wie Überzeugungen über Individuen, und nach E26 haben Online-Programmiergemeinschaften eigene Überzeugungen mit den üblichen Wirkungen (S. 91-92).\n4. Erste Bedingung: ein Ziel, dessen Ergebnis mehr oder weniger gelingen kann, was die Bewertung von Kompetenz motiviert; zweite: Interdependenz, die zwingt, die Urteile abzustimmen (S. 92-93).\n5. Zwischen rivalisierenden Organisationen auf einem Markt (juristische Fakultäten, Restaurants) betrifft die kooperative Interdependenz nicht mehr das Ziel, sondern das gemeinsame Bedürfnis nach einer Rangliste: Das ist die äußerste Reichweite des Schemas (S. 93). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["A01", "E26", "T030"], "citation": "“It is like acquiring a pair of scissors.”", "pages": [91, 92, 93], "depends_on": ["A01", "T030", "E26"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T030, les croyances se forment de manière semblable pour les organisations et pour les types d'individus : le statut organise des relations bien au-delà de l'interpersonnel (p. 91).\n2. Par A01, une fois qu'on a un schème, on l'applique largement : ce sont les ciseaux avec lesquels on trouve de nouvelles choses à couper (p. 91).\n3. Les classements d'organisations biaisent les jugements de qualité comme les croyances sur les individus, et, par E26, les communautés de programmeurs en ligne ont leurs propres croyances aux effets classiques (p. 91-92).\n4. Première condition : un but dont l'issue peut être plus ou moins réussie, qui motive l'évaluation de la compétence ; seconde : une interdépendance, qui oblige à coordonner les jugements (p. 92-93).\n5. Entre organisations rivales sur un marché (facultés de droit, restaurants), l'interdépendance coopérative ne porte plus sur le but, mais sur le besoin commun d'un classement : c'est l'extension maximale du schème (p. 93). ∎", "body_en": "## Demonstration\n\n1. By T030, beliefs form in similar ways for organisations and for types of individuals: status organises relations well beyond the interpersonal (p. 91).\n2. By A01, once one has a schema, one applies it permissively: it is the scissors with which one finds new things to cut (p. 91).\n3. Organisational rankings bias judgements of quality like beliefs about individuals, and, by E26, online programming communities have their own beliefs with the classic effects (p. 91-92).\n4. First condition: a goal whose outcome can be more or less successful, which motivates the evaluation of competence; second: interdependence, which forces judgements to be coordinated (p. 92-93).\n5. Between rival organisations in a market (law schools, restaurants), cooperative interdependence no longer bears on the goal but on the shared need for a ranking: this is the full stretch of the schema (p. 93). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A01", "E26", "T030"], "sections": ["Démonstration"], "demo_refs": ["A01", "E26", "T030"], "mentions": ["A01", "E26", "T030"], "corollaires": [], "mtime": 1794593161.315786}, {"id": "T032", "file": "theses/T032.md", "type": "these", "partie": "4", "titre": "L'avantage de statut naît de deux inférences et passe pour du mérite", "enonce": "Les croyances de statut créent l'avantage par deux processus : elles biaisent le jugement personnel sur la compétence d'autrui (inférence socialement endogène) et, quand l'issue dépend des autres, font préférer le choix que « la plupart » jugeront le meilleur (inférence de troisième ordre). Ensemble, ils créent des avantages indus, justifiés au nom du « mérite ».", "titre_en": "Status advantage arises from two inferences and passes for merit", "enonce_en": "Status beliefs create advantage through two processes: they bias personal judgements of others' competence (socially endogenous inference) and, when the outcome depends on others, lead people to favour the choice \"most\" will judge best (third-order inference). Together they create unwarranted advantages, justified in the name of \"merit\".", "titre_de": "Der Statusvorteil entsteht aus zwei Inferenzen und gilt als Verdienst", "enonce_de": "Statusüberzeugungen erzeugen Vorteile durch zwei Prozesse: Sie verzerren das persönliche Urteil über die Kompetenz anderer (sozial endogene Inferenz) und lassen, wenn das Ergebnis von anderen abhängt, die Wahl bevorzugen, die „die meisten“ für die beste halten werden (Inferenz dritter Ordnung). Zusammen erzeugen sie ungerechtfertigte Vorteile, die im Namen des „Verdienstes“ gerechtfertigt werden.", "body_de": "## Beweis\n\n1. Nach T024 erzeugen die Überzeugungen Vorteile; nach D22 verzerren sie zunächst das persönliche Urteil, und ihre Fehler erfüllen sich selbst, indem sie die Leistung prägen (S. 94).\n2. Diese Abkürzung wirkt sogar außerhalb der Bedingungen des Schemas, wenn man über die Qualität einer Sache unsicher ist: eine Schokolade nach dem Status der Marke wählen; die Wirkung schwindet, sobald man probiert hat (S. 94).\n3. Hängt das Ergebnis von den Reaktionen anderer ab, wie bei der Schokolade für die Büroparty oder bei einer Einstellung, stützt man sich nach D23 auf das, was die meisten Leute denken (S. 94-95).\n4. Nach E33 bevorzugt man dann den hohen Status, auch ohne ihn für besser zu halten, solange die Offenheit der anderen für eine andere Wahl kein gemeinsames Wissen ist (S. 95).\n5. Nach E10 erklärt die Inferenz dritter Ordnung, warum Erwartungen zweiter Ordnung über die eigenen siegen (S. 95-96).\n6. Beide Prozesse treten zusammen auf und verschmelzen; sie erzeugen ungerechtfertigte Vor- und Nachteile nach Gruppenidentität, gerechtfertigt durch „Verdienst“: Durch sie gelangt die Gruppenungleichheit in angeblich meritokratische Institutionen (S. 96). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D22", "D23", "E10", "E33", "T024"], "citation": "", "pages": [94, 95, 96], "depends_on": ["D22", "D23", "T024", "E33", "E10"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T024, les croyances créent l'avantage ; par D22, elles biaisent d'abord le jugement personnel, et leurs erreurs, en façonnant les performances, se réalisent (p. 94).\n2. Ce raccourci joue même hors des conditions du schème, quand on doute de la qualité d'une chose : choisir un chocolat d'après le statut de la marque ; l'effet faiblit quand on a goûté (p. 94).\n3. Quand l'issue dépend des réactions des autres, comme le chocolat pour la fête du bureau ou l'embauche, par D23 on s'appuie sur ce que pense la plupart des gens (p. 94-95).\n4. Par E33, on favorise alors le haut statut même sans le juger meilleur, tant que l'ouverture des autres à un autre choix n'est pas un savoir commun (p. 95).\n5. Par E10, c'est l'inférence de troisième ordre qui explique que les attentes de second ordre l'emportent sur les siennes propres (p. 95-96).\n6. Les deux processus coexistent et se confondent ; ils créent des avantages et des désavantages indus selon l'identité de groupe, justifiés par le « mérite » : c'est par eux que l'inégalité de groupe entre dans des institutions dites méritocratiques (p. 96). ∎", "body_en": "## Demonstration\n\n1. By T024, beliefs create advantage; by D22, they first bias personal judgement, and their errors, by shaping performance, become self-fulfilling (p. 94).\n2. This shortcut works even outside the schema's conditions, when one is uncertain about a thing's quality: choosing a chocolate by the status of the brand; the effect weakens once one has tasted (p. 94).\n3. When the outcome depends on others' reactions, like chocolate for the office party or hiring, by D23 people rely on what most people think (p. 94-95).\n4. By E33, people then favour high status even without judging it better, as long as others' openness to another choice is not common knowledge (p. 95).\n5. By E10, it is third-order inference that explains why second-order expectations prevail over one's own (p. 95-96).\n6. The two processes co-occur and merge; they create unwarranted advantages and disadvantages by group identity, justified by \"merit\": it is through them that group inequality enters ostensibly meritocratic institutions (p. 96). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D22", "D23", "E10", "E33", "T024"], "sections": ["Démonstration"], "demo_refs": ["D22", "D23", "E10", "E33", "T024"], "mentions": ["D22", "D23", "E10", "E33", "T024"], "corollaires": [], "mtime": 1794593161.315786}, {"id": "T033", "file": "theses/T033.md", "type": "these", "partie": "5", "titre": "Le statut dépend du contexte", "enonce": "Ce qui vaut le statut dépend du but du groupe : nul n'est haut partout ni bas partout. Le poids de l'orientation vers le groupe varie lui aussi : il l'emporte quand contribuer est coûteux, s'efface quand la réussite est cruciale ; dans la plupart des contextes occidentaux, la compétence domine.", "titre_en": "Status depends on context", "enonce_en": "What earns status depends on the group's goal: no one is high everywhere or low everywhere. The weight of group orientation also varies: it prevails when contributing is costly, recedes when success is crucial; in most Western contexts, competence dominates.", "titre_de": "Status hängt vom Kontext ab", "enonce_de": "Was Status einbringt, hängt vom Ziel der Gruppe ab: Niemand steht überall oben oder überall unten. Auch das Gewicht der Gruppenorientierung schwankt: Es überwiegt, wenn Beitragen kostspielig ist, und tritt zurück, wenn der Erfolg entscheidend ist; in den meisten westlichen Kontexten dominiert die Kompetenz.", "body_de": "## Beweis\n\n1. Nach D05 geht Status an die wahrgenommene Kompetenz für das Ziel; doch was als Kompetenz zählt, hängt vom Ziel ab: Lustige Geschichten zu erzählen hebt einen unter Freunden, schadet in einer ernsthaften Arbeitsgruppe (S. 97-98).\n2. Trotz der diffusen Merkmale steht niemand in jedem Kontext oben: Der weiße Geschäftsmann fügt sich seinem CEO und dem Kinderarzt; der lateinamerikanische Gartenarbeiter wird in der Kirche und für sein Gitarrenspiel geachtet (S. 98).\n3. Nach T014 sind die Motive dessen, der Status sucht, zweideutig, daher die Gruppenorientierung (D08); auch ihr Gewicht schwankt; nach E34 belohnt man in sozialen Dilemmata die, die trotz der Kosten beitragen, und beugt sich, wenn der Erfolg entscheidend ist, dem selbstsüchtigen Könner (S. 98-99).\n4. In den meisten, zumindest westlichen Kontexten ist Kompetenz die Hauptkomponente; die Gruppenorientierung ist zweitrangig (S. 99). ∎\n\n## Anmerkung\n\nDie für die Ungleichheit folgenreichsten Kontexte (Schule, Arbeit, Gesundheit) sind auf instrumentelle Aufgaben ausgerichtet, bei denen die wahrgenommene Kompetenz dominiert; sie untersucht das Kapitel (S. 99).", "sections_de": ["Beweis", "Anmerkung"], "demo_refs_de": ["D05", "D08", "E34", "T014"], "citation": "", "pages": [97, 98, 99], "depends_on": ["D05", "D08", "E34", "T014"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D05, le statut va à la compétence perçue au but ; mais ce qui est compétence dépend du but : raconter des histoires drôles élève dans un groupe d'amis, nuit dans un groupe de travail sérieux (p. 97-98).\n2. Malgré les caractéristiques diffuses, nul n'est haut dans tous les contextes : l'homme d'affaires blanc défère à son PDG et au pédiatre ; le jardinier latino est respecté à l'église et pour sa guitare (p. 98).\n3. Par T014, les motifs de qui recherche le statut sont ambigus, d'où l'orientation vers le groupe (D08) ; son poids varie aussi ; par E34, dans les dilemmes sociaux, on récompense qui contribue malgré le coût, et, quand la réussite est cruciale, on défère au compétent égoïste (p. 98-99).\n4. Dans la plupart des contextes, du moins occidentaux, la compétence est la composante principale ; l'orientation vers le groupe est secondaire (p. 99). ∎\n\n## Scolie\n\nLes contextes les plus lourds de conséquences pour l'inégalité (école, travail, santé) sont centrés sur des tâches instrumentales, où la compétence perçue domine ; ce sont eux que le chapitre étudie (p. 99).", "body_en": "## Demonstration\n\n1. By D05, status goes to perceived competence at the goal; but what counts as competence depends on the goal: telling funny stories raises one among friends, hurts in a serious work group (p. 97-98).\n2. Despite diffuse characteristics, no one is high in every context: the white businessman defers to his CEO and to the paediatrician; the Latino yard worker is respected at church and for his guitar (p. 98).\n3. By T014, the motives of whoever seeks status are ambiguous, hence group orientation (D08); its weight also varies; by E34, in social dilemmas, those who contribute despite the cost are rewarded, and when success is crucial, groups defer to the selfish expert (p. 98-99).\n4. In most contexts, at least Western ones, competence is the primary component; group orientation is secondary (p. 99). ∎\n\n## Scholium\n\nThe contexts most consequential for inequality (school, work, health) centre on instrumental tasks, where perceived competence dominates; these are the ones the chapter studies (p. 99).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D05", "D08", "E34", "T014"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D05", "D08", "E34", "T014"], "mentions": ["D05", "D08", "E34", "T014"], "corollaires": [], "mtime": 1794593161.3167858}, {"id": "T034", "file": "theses/T034.md", "type": "these", "partie": "5", "titre": "Des attentes autoréalisatrices fondent une hiérarchie stable", "enonce": "Dans les premiers moments, chacun forme des attentes de performance pour soi et les autres ; elles rendent plus affirmé ou plus déférent, ce qui produit la hiérarchie, qui confirme les attentes et se stabilise. Des différences fortuites peuvent suffire à l'enclencher, sans aucune différence réelle de capacité.", "titre_en": "Self-fulfilling expectations found a stable hierarchy", "enonce_en": "In the first moments, each person forms performance expectations for self and others; these make one more assertive or more deferential, which produces the hierarchy, which confirms the expectations and stabilises. Chance differences can suffice to set it off, without any real difference in ability.", "titre_de": "Sich selbst erfüllende Erwartungen begründen eine stabile Hierarchie", "enonce_de": "In den ersten Augenblicken bildet jeder Leistungserwartungen für sich und die anderen; sie machen bestimmter oder nachgiebiger, was die Hierarchie hervorbringt, die die Erwartungen bestätigt und sich festigt. Zufällige Unterschiede können genügen, sie in Gang zu setzen, ohne jeden wirklichen Unterschied der Fähigkeit.", "body_de": "## Beweis\n\n1. Tritt man einer Gruppe bei, durchläuft man eine Phase der Ungewissheit, in der man sich einzuordnen sucht; nach D12 und A05 bildet man implizite Leistungserwartungen, die die Werturteile ausdrücken, um die sich die Norm von T011 dreht (S. 100-101).\n2. Diese Erwartungen prägen das Verhalten auf sich selbst erfüllende Weise: Wer mehr erwartet, spricht mit Zuversicht und bleibt bei seiner Meinung; wer weniger erwartet, zögert, stimmt zu und ändert seine Meinung (S. 101).\n3. Die daraus entstehende Verhaltenshierarchie scheint die Erwartungen zu bestätigen; sie festigt sich, bis neue Informationen sie ändern (S. 101).\n4. Nach E35 genügt eine zufällig zugewiesene Einstellung, um eine Hierarchie hervorzubringen, die in den folgenden Tagen fortbesteht (S. 102).\n5. Statusunterschiede können also kontingent entstehen, ohne vorherige Unterschiede der Fähigkeit (S. 102-103). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["A05", "D12", "E35", "T011"], "citation": "", "pages": [100, 101, 102, 103], "depends_on": ["D12", "A05", "E35", "T011"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. En rejoignant un groupe, on traverse une phase d'incertitude où l'on cherche à se situer ; par D12 et A05, on forme des attentes de performance implicites, qui traduisent les jugements de valeur sur lesquels tourne la norme de T011 (p. 100-101).\n2. Ces attentes façonnent les conduites de façon autoréalisatrice : qui s'attend à plus parle avec assurance et maintient son avis ; qui s'attend à moins hésite, approuve et se range (p. 101).\n3. La hiérarchie comportementale qui en résulte semble confirmer les attentes ; elle se stabilise jusqu'à ce qu'une information nouvelle les change (p. 101).\n4. Par E35, un état d'esprit assigné au hasard suffit à produire une hiérarchie qui persiste les jours suivants (p. 102).\n5. Des différences de statut peuvent donc naître de manière contingente, sans différence préalable de capacité (p. 102-103). ∎", "body_en": "## Demonstration\n\n1. On joining a group, one goes through a period of uncertainty, trying to place oneself; by D12 and A05, one forms implicit performance expectations, which express the judgements of value on which the norm of T011 turns (p. 100-101).\n2. These expectations shape behaviour in self-fulfilling ways: whoever expects more speaks confidently and holds to their view; whoever expects less hesitates, approves and changes to agree (p. 101).\n3. The resulting behavioural hierarchy seems to confirm the expectations; it stabilises until new information changes them (p. 101).\n4. By E35, a randomly assigned mind-set suffices to produce a hierarchy that persists in the following days (p. 102).\n5. Status differences can therefore arise contingently, without prior differences in ability (p. 102-103). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A05", "D12", "E35", "T011"], "sections": ["Démonstration"], "demo_refs": ["A05", "D12", "E35", "T011"], "mentions": ["A05", "D12", "E35", "T011"], "corollaires": [], "mtime": 1794593161.3167858}, {"id": "T035", "file": "theses/T035.md", "type": "these", "partie": "5", "titre": "L'ordre des attentes se forme par combinaison d'indices", "enonce": "Les membres forment un ordre d'attentes à peu près partagé en remarquant les mêmes indices et en puisant dans les mêmes croyances. Un indice devient saillant par différence entre membres ou par lien culturel avec la tâche ; tous les indices saillants se combinent, pondérés par leur pertinence. Changer l'ordre ensuite est possible mais difficile.", "titre_en": "The order of expectations forms by combining cues", "enonce_en": "Members form a roughly shared order of expectations by noticing the same cues and drawing on the same beliefs. A cue becomes salient through a difference among members or a cultural link to the task; all salient cues combine, weighted by relevance. Changing the order afterwards is possible but difficult.", "titre_de": "Die Ordnung der Erwartungen bildet sich durch Verrechnung von Hinweisen", "enonce_de": "Die Mitglieder bilden eine ungefähr geteilte Ordnung der Erwartungen, indem sie dieselben Hinweise bemerken und auf dieselben Überzeugungen zurückgreifen. Ein Hinweis wird salient durch einen Unterschied zwischen den Mitgliedern oder durch eine kulturelle Verbindung zur Aufgabe; alle salienten Hinweise werden, nach Relevanz gewichtet, verrechnet. Die Ordnung danach zu ändern ist möglich, aber schwierig.", "body_de": "## Beweis\n\n1. Nach T034 ist die Hierarchie eine Ordnung von Erwartungen, die das Verhalten leitet; um zu koordinieren, muss sie geteilt sein: Sie bildet sich, indem die Mitglieder dieselben Hinweise bemerken und sie durch dieselben Überzeugungen lesen (S. 103).\n2. Nach D17 sind diese Hinweise Statusmerkmale, Belohnungen, Verhaltensstil und Bewertungen (S. 104).\n3. Ein Hinweis ist salient, wenn die Mitglieder sich in ihm unterscheiden oder wenn er kulturell mit dem Kontext verbunden ist: Das Geschlecht wirkt bei der Kinderbetreuung selbst unter Menschen desselben Geschlechts (S. 104).\n4. Nach E36 werden alle salienten Hinweise, nach Relevanz gewichtet, verrechnet, mit Inkonsistenz- und Abschwächungseffekten (S. 104-105).\n5. Die Hierarchie hält sich auch, weil die Mitglieder mit hohem Status ihren Einfluss nutzen, um sie zu bewahren; sie ändert sich durch neue Informationen, die die *anderen* annehmen müssen, die feste Erwartungen und Positionen zu verteidigen haben (S. 106). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D17", "E36", "T034"], "citation": "", "pages": [103, 104, 105, 106], "depends_on": ["T034", "D17", "E36"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T034, la hiérarchie est un ordre d'attentes qui guide les conduites ; pour coordonner, il doit être partagé : on le forme en remarquant les mêmes indices et en les lisant par les mêmes croyances (p. 103).\n2. Par D17, ces indices sont les caractéristiques de statut, les récompenses, le style de comportement et les évaluations (p. 104).\n3. Un indice est saillant si les membres diffèrent sur lui ou s'il est culturellement lié au contexte : le genre agit dans la garde d'enfants même entre personnes du même sexe (p. 104).\n4. Par E36, on combine tous les indices saillants, pondérés par leur pertinence, avec effets d'incohérence et d'atténuation (p. 104-105).\n5. La hiérarchie se maintient aussi parce que les membres de haut statut usent de leur influence pour la conserver ; elle change par une information nouvelle que les *autres* doivent accepter, eux qui ont des attentes établies et des positions à défendre (p. 106). ∎", "body_en": "## Demonstration\n\n1. By T034, the hierarchy is an order of expectations guiding behaviour; to coordinate, it must be shared: it forms through members noticing the same cues and reading them through the same beliefs (p. 103).\n2. By D17, these cues are status characteristics, rewards, behavioural style and evaluations (p. 104).\n3. A cue is salient if members differ on it or if it is culturally linked to the context: gender acts in child care even among people of the same sex (p. 104).\n4. By E36, all salient cues are combined, weighted by relevance, with inconsistency and attenuation effects (p. 104-105).\n5. The hierarchy is also maintained because high-status members use their influence to preserve it; it changes through new information that *others* must accept, others who have established expectations and positions to defend (p. 106). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D17", "E36", "T034"], "sections": ["Démonstration"], "demo_refs": ["D17", "E36", "T034"], "mentions": ["D17", "E36", "T034"], "corollaires": [], "mtime": 1794593161.3177855}, {"id": "T036", "file": "theses/T036.md", "type": "these", "partie": "5", "titre": "Les caractéristiques diffuses cadrent l'interaction dès le début", "enonce": "Genre, race, âge, classe, éducation et profession deviennent saillants presque aussitôt et cadrent les attentes, dont dépendent tous les indices ultérieurs. Diffuses, ces caractéristiques agissent même sans rapport avec la tâche ; d'autres indices peuvent les contrebalancer, mais jamais les effacer : le désavantagé doit être meilleur pour être vu égal.", "titre_en": "Diffuse characteristics frame interaction from the start", "enonce_en": "Gender, race, age, class, education and occupation become salient almost immediately and frame expectations, within which all later cues are nested. Being diffuse, these characteristics act even when unrelated to the task; other cues can outweigh them, but never erase them: the disadvantaged must be better to be seen as equal.", "titre_de": "Diffuse Merkmale rahmen die Interaktion von Anfang an", "enonce_de": "Geschlecht, Rasse, Alter, Klasse, Bildung und Beruf werden fast sofort salient und rahmen die Erwartungen, in die alle späteren Hinweise eingebettet werden. Als diffuse Merkmale wirken sie auch dann, wenn sie mit der Aufgabe nichts zu tun haben; andere Hinweise können sie aufwiegen, aber nie auslöschen: Der Benachteiligte muss besser sein, um als gleich zu gelten.", "body_de": "## Beweis\n\n1. Nach T035 sind Statusmerkmale die wirkmächtigsten Hinweise; nach D16 löst ein salientes Merkmal die Statusgeneralisierung aus; es erzeugt den Vorteil von T032, indem es die wahrgenommene Kompetenz verzerrt und die Urteile abstimmt: Derselbe Lebenslauf wird unter dem Namen eines Mannes oder eines Weißen besser bewertet (S. 106-107).\n2. Alle großen Unterschiede, die die Ungleichheit in den Vereinigten Staaten strukturieren, wirken so; Geschlecht, Rasse und Alter liest man am Äußeren ab, die Klasse binnen weniger Augenblicke (S. 107).\n3. Von Anfang an salient, rahmen sie die Erwartungen, und spätere Hinweise werden in sie eingebettet; diese anfängliche Rahmung wirkt dauerhaft (S. 107-108).\n4. Nach E37 laufen ihre Wirkungen über die Erwartungen und lassen sich nicht durch vorherige Unterschiede zwischen Gruppen erklären (S. 108).\n5. Nach D14 wirkt ein diffuses Merkmal auch dann, wenn es mit der Aufgabe nichts zu tun hat, etwa bei der Analyse eines biochemischen Prozesses; spezifische Hinweise können es aufwiegen, aber seine Wirkungen verschwinden nie (S. 108-109).\n6. Dennoch ist nach T033 kein Merkmal überall von Vorteil: Ein Bachelorabschluss begünstigt unter denen ohne Studienabschluss und benachteiligt unter Promovierten (S. 109). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D14", "D16", "E37", "T032", "T033", "T035"], "citation": "", "pages": [106, 107, 108, 109], "depends_on": ["D14", "D16", "E37", "T035", "T032", "T033"], "contre": ["R11"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T035, les caractéristiques de statut sont, parmi les indices, les plus puissantes ; par D16, une caractéristique saillante déclenche la généralisation du statut ; elle crée l'avantage de T032 en biaisant la compétence perçue et en coordonnant les jugements : même CV, mieux noté sous un nom d'homme ou de Blanc (p. 106-107).\n2. Toutes les grandes différences qui structurent l'inégalité aux États-Unis agissent ainsi ; genre, race et âge se lisent à vue, la classe en quelques instants (p. 107).\n3. Saillantes d'emblée, elles cadrent les attentes, et les indices ultérieurs s'y emboîtent ; ce cadrage initial a des effets durables (p. 107-108).\n4. Par E37, leurs effets passent par les attentes et ne s'expliquent pas par des différences préalables entre groupes (p. 108).\n5. Par D14, une caractéristique diffuse agit même sans rapport avec la tâche, comme l'analyse d'un processus biochimique ; des indices spécifiques peuvent la contrebalancer, mais ses effets ne disparaissent jamais (p. 108-109).\n6. Par T033, aucune caractéristique n'est pourtant universellement avantageuse : une licence avantage parmi les non-diplômés, désavantage parmi les docteurs (p. 109). ∎", "body_en": "## Demonstration\n\n1. By T035, status characteristics are the most powerful of the cues; by D16, a salient characteristic triggers status generalization; it creates the advantage of T032 by biasing perceived competence and coordinating judgements: the same résumé, rated better under a man's or a white person's name (p. 106-107).\n2. All the major differences that pattern inequality in the United States act this way; gender, race and age are read visually, class within moments (p. 107).\n3. Salient from the start, they frame expectations, and later cues are nested within them; this initial framing has lasting effects (p. 107-108).\n4. By E37, their effects run through expectations and cannot be explained by prior differences between groups (p. 108).\n5. By D14, a diffuse characteristic acts even when unrelated to the task, like analysing a biochemical process; specific cues can outweigh it, but its effects never go away (p. 108-109).\n6. Yet, by T033, no characteristic is universally advantaging: a bachelor's degree advantages among those who did not finish college, disadvantages among PhDs (p. 109). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D14", "D16", "E37", "T032", "T033", "T035"], "sections": ["Démonstration"], "demo_refs": ["D14", "D16", "E37", "T032", "T033", "T035"], "mentions": ["D14", "D16", "E37", "T032", "T033", "T035"], "corollaires": [], "mtime": 1794593161.3177855}, {"id": "T037", "file": "theses/T037.md", "type": "these", "partie": "5", "titre": "Les attentes changent la conduite et la performance même", "enonce": "Les caractéristiques diffuses saillantes enhardissent les avantagés et font hésiter les désavantagés ; elles modifient aussi la qualité réelle de la performance, comme un avantage à domicile. Le statut crée ainsi l'avantage sous couvert de mérite de deux façons : la même idée « sonne mieux » chez le haut statut, et il peut réellement mieux réussir.", "titre_en": "Expectations change behaviour and performance itself", "enonce_en": "Salient diffuse characteristics embolden the advantaged and make the disadvantaged hesitate; they also change the actual quality of performance, like a home-team advantage. Status thus creates advantage under the guise of merit in two ways: the same idea \"sounds better\" from high status, and high status can actually perform better.", "titre_de": "Erwartungen verändern das Verhalten und die Leistung selbst", "enonce_de": "Saliente diffuse Merkmale ermutigen die Begünstigten und lassen die Benachteiligten zögern; sie verändern auch die tatsächliche Qualität der Leistung, wie ein Heimvorteil. Status erzeugt so auf zwei Weisen Vorteile unter dem Anschein des Verdienstes: Dieselbe Idee „klingt besser“ aus dem Mund des Ranghohen, und der Ranghohe kann tatsächlich besser abschneiden.", "body_de": "## Beweis\n\n1. Nach T036 rahmen diffuse Merkmale die Erwartungen; sie ermutigen daher die Begünstigten und lassen die Benachteiligten zögern (S. 109).\n2. Nach E38 folgt die Durchsetzungsfähigkeit bis ins Nonverbale genau dem Erwartungsvorteil, den das Geschlecht je nach Aufgabe verleiht (S. 109-110).\n3. Über die Interaktion hinaus, etwa in einer Prüfung wie dem SAT, verändert ein salientes Merkmal die Leistung selbst; nach E39 entspricht das der Stereotypenbedrohung (S. 110).\n4. Status erzeugt also auf zwei Weisen Vorteile unter dem Anschein des Verdienstes: durch die Verzerrung der Bewertung und durch eine bei gleichem Können tatsächlich bessere Leistung (S. 110-111). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["E38", "E39", "T036"], "citation": "", "pages": [109, 110, 111], "depends_on": ["T036", "E38", "E39"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T036, les caractéristiques diffuses cadrent les attentes ; elles enhardissent donc les avantagés et font hésiter les désavantagés (p. 109).\n2. Par E38, l'affirmation, jusque dans le non-verbal, suit finement l'avantage d'attente que donne le genre selon la tâche (p. 109-110).\n3. Au-delà de l'interaction, dans une épreuve comme le SAT, une caractéristique saillante modifie la performance elle-même ; par E39, c'est l'équivalent de la menace du stéréotype (p. 110).\n4. Le statut crée donc l'avantage sous couvert de mérite de deux façons : le biais d'évaluation, et une meilleure performance réelle à capacité égale (p. 110-111). ∎", "body_en": "## Demonstration\n\n1. By T036, diffuse characteristics frame expectations; they therefore embolden the advantaged and make the disadvantaged hesitate (p. 109).\n2. By E38, assertiveness, down to the nonverbal, closely follows the expectation advantage that gender gives according to the task (p. 109-110).\n3. Beyond interaction, in a test like the SAT, a salient characteristic changes performance itself; by E39, this is equivalent to stereotype threat (p. 110).\n4. Status therefore creates advantage under the guise of merit in two ways: evaluative bias, and actually better performance at equal skill (p. 110-111). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E38", "E39", "T036"], "sections": ["Démonstration"], "demo_refs": ["E38", "E39", "T036"], "mentions": ["E38", "E39", "T036"], "corollaires": [], "mtime": 1794593161.3187873}, {"id": "T038", "file": "theses/T038.md", "type": "these", "partie": "5", "titre": "Les doubles standards", "enonce": "Les caractéristiques diffuses créent des doubles standards : à performance égale, on exige plus de preuves d'aptitude des désavantagés, ou l'on déplace les critères vers ce qui favorise les avantagés. Au moment d'embaucher ou de promouvoir, cela crée encore l'avantage sous couvert de mérite.", "titre_en": "Double standards", "enonce_en": "Diffuse characteristics create double standards: at equal performance, more proof of ability is demanded of the disadvantaged, or criteria shift to whatever favours the advantaged. At the moment of hiring or promotion, this again creates advantage under the guise of merit.", "titre_de": "Doppelte Standards", "enonce_de": "Diffuse Merkmale erzeugen doppelte Standards: Bei gleicher Leistung verlangt man von den Benachteiligten mehr Beweise ihrer Fähigkeit, oder die Kriterien verschieben sich zu dem hin, was die Begünstigten bevorzugt. Bei Einstellung oder Beförderung erzeugt das wiederum Vorteile unter dem Anschein des Verdienstes.", "body_de": "## Beweis\n\n1. Nach T036 rahmen saliente diffuse Merkmale die Beurteilung der Leistung; nach D27 muss die benachteiligte Person „es noch einmal beweisen“; bei der begünstigten bestätigt eine gute Leistung die Fähigkeit (S. 111).\n2. Nach E40 wirkt sich das auf die Selbsteinschätzung und Berufswahl von Frauen aus, auf die Beachtung ihrer Empfehlungen, und nimmt die Form wechselnder Kriterien an (S. 111).\n3. In einem Vorstellungsgespräch oder bei einer Beförderungsentscheidung geben diese Urteile über die Fähigkeit den Ausschlag; der Vorteil gilt wiederum als „Verdienst“ (S. 111-112). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D27", "E40", "T036"], "citation": "", "pages": [111, 112], "depends_on": ["D27", "E40", "T036"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T036, les caractéristiques diffuses saillantes cadrent le jugement de la performance ; par D27, la personne désavantagée doit « prouver encore » ; l'avantagée voit sa bonne performance confirmer son aptitude (p. 111).\n2. Par E40, cela pèse sur l'auto-évaluation des femmes et leur orientation, sur l'attention prêtée à leurs recommandations, et prend la forme de critères mouvants (p. 111).\n3. Dans un entretien d'embauche ou une évaluation pour une promotion, ces jugements d'aptitude font la différence ; l'avantage passe là encore pour du « mérite » (p. 111-112). ∎", "body_en": "## Demonstration\n\n1. By T036, salient diffuse characteristics frame the judgement of performance; by D27, the disadvantaged person must \"prove it again\"; the advantaged person's good performance confirms ability (p. 111).\n2. By E40, this weighs on women's self-assessment and career choices, on the attention paid to their recommendations, and takes the form of shifting criteria (p. 111).\n3. In a job interview or a promotion review, these judgements of ability make the difference; the advantage again passes for \"merit\" (p. 111-112). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D27", "E40", "T036"], "sections": ["Démonstration"], "demo_refs": ["D27", "E40", "T036"], "mentions": ["D27", "E40", "T036"], "corollaires": [], "mtime": 1794593161.3187873}, {"id": "T039", "file": "theses/T039.md", "type": "these", "partie": "5", "titre": "Les récompenses et les objets portent du statut", "enonce": "Comme statut et récompenses sont liés dans les attentes, recevoir une récompense plus élevée fait présumer une compétence plus grande. Le statut se propage aussi par association, aux réseaux (citer des noms) et aux objets, qui deviennent des indices de statut : d'où la consommation ostentatoire.", "titre_en": "Rewards and objects carry status", "enonce_en": "Since status and rewards are linked in expectations, receiving a higher reward leads people to presume greater competence. Status also spreads by association, to networks (name-dropping) and to objects, which become status cues: hence conspicuous consumption.", "titre_de": "Belohnungen und Objekte tragen Status", "enonce_de": "Da Status und Belohnungen in den Erwartungen verbunden sind, lässt eine höhere Belohnung auf größere Kompetenz schließen. Status überträgt sich auch durch Verbindung, auf Netzwerke (Namen fallen lassen) und auf Objekte, die zu Statushinweisen werden: daher der demonstrative Konsum.", "body_de": "## Beweis\n\n1. Belohnungen sind ein weiterer Hinweis im Sinne von T035: Hierarchien verteilen Belohnungen nach Rang; die Theorie schließt daraus, dass umgekehrt eine höhere Belohnung höhere Kompetenzerwartungen erzeugt (S. 112).\n2. Nach E41 verschafft selbst eine rein ehrenhalber verliehene Belohnung mehr Einfluss (S. 112).\n3. Diese Belohnung war das Privileg, mit ranghohen Menschen zu verkehren: Da Status sich durch Verbindung überträgt, ist es ein Statushinweis, Namen fallen lassen zu können (S. 113).\n4. Nach E41 geht Status zudem von Akteuren auf Objekte über; ein Objekt mit hohem Status zu besitzen, wirkt als soziale Belohnung, die auf Kompetenz schließen lässt; nach A15 daher der demonstrative Konsum (S. 113). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["A15", "E41", "T035"], "citation": "", "pages": [112, 113], "depends_on": ["E41", "A15", "T035"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Les récompenses sont un autre indice de T035 : les hiérarchies distribuent les récompenses selon le rang ; la théorie en déduit qu'inversement une récompense plus élevée crée des attentes de compétence plus élevées (p. 112).\n2. Par E41, même une récompense purement honorifique donne plus d'influence (p. 112).\n3. Cette récompense était le privilège de fréquenter des personnes de haut statut : le statut se propageant par association, pouvoir citer des noms est un indice de statut (p. 113).\n4. Par E41 encore, le statut passe des acteurs aux objets ; posséder un objet de haut statut fonctionne comme une récompense sociale qui fait présumer de la compétence ; par A15, d'où la consommation ostentatoire (p. 113). ∎", "body_en": "## Demonstration\n\n1. Rewards are another cue of T035: hierarchies distribute rewards by rank; the theory infers that, conversely, a higher reward creates higher expectations of competence (p. 112).\n2. By E41, even a purely honorific reward brings more influence (p. 112).\n3. That reward was the privilege of associating with high-status people: status spreading by association, being able to name-drop is a status cue (p. 113).\n4. By E41 again, status passes from actors to objects; owning a high-status object functions as a social reward that leads people to presume competence; by A15, hence conspicuous consumption (p. 113). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A15", "E41", "T035"], "sections": ["Démonstration"], "demo_refs": ["A15", "E41", "T035"], "mentions": ["A15", "E41", "T035"], "corollaires": [], "mtime": 1794593161.3197863}, {"id": "T040", "file": "theses/T040.md", "type": "these", "partie": "5", "titre": "Le style et les évaluations : des indices qui font et défont", "enonce": "Le style affirmé est un indice de statut : entre pairs, toute différence de style crée une hiérarchie. Mais pour un désavantagé, s'affirmer paraît illégitime, sauf à montrer une orientation coopérative. Les évaluations explicites de la performance, rares, peuvent changer la hiérarchie : elles démasquent avec le temps les compétences surestimées.", "titre_en": "Style and evaluations: cues that make and unmake", "enonce_en": "Assertive style is a status cue: among peers, any difference in style creates a hierarchy. But for someone disadvantaged, assertiveness looks illegitimate, unless they show a cooperative orientation. Explicit performance evaluations, which are rare, can change the hierarchy: over time they unmask overestimated competence.", "titre_de": "Stil und Bewertungen: Hinweise, die Ränge schaffen und auflösen", "enonce_de": "Ein selbstsicherer Stil ist ein Statushinweis: Unter Gleichrangigen erzeugt jeder Stilunterschied eine Hierarchie. Doch bei einem Benachteiligten wirkt Selbstbehauptung unrechtmäßig, es sei denn, er zeigt eine kooperative Ausrichtung. Ausdrückliche Leistungsbewertungen, die selten sind, können die Hierarchie verändern: Mit der Zeit entlarven sie überschätzte Kompetenz.", "body_de": "## Beweis\n\n1. Der Stil ist ein weiterer Hinweis im Sinne von T035; nach D32 glaubt man in Nordamerika, hoher Status sei selbstsicher und agentisch; ein Austausch, in dem einer sich behauptet und der andere nachgibt, löst diese Überzeugungen aus, und nach E08 gilt Zuversicht als Kompetenz (S. 113-114).\n2. Unter homogenen Gleichrangigen erzeugt jeder Stilunterschied, selbst einer der Stimmung, eine Hierarchie, wie bei E35 (S. 114).\n3. In heterogenen Gruppen steuern die Merkmale bereits den Stil, der kaum etwas hinzufügt; und nach T014 wirkt ein selbstsicherer Stil bei einem Benachteiligten wie ein eigennütziger Zugriff, es sei denn, er hält maßvolle Selbstbehauptung und kooperative Absicht im Gleichgewicht (S. 114-115).\n4. Ausdrückliche Bewertungen sind selten, da die Aufgaben mehrdeutig sind; ranghohe Mitglieder meiden zudem Gebiete, auf denen sie scheitern würden; doch wenn es sie gibt, verändern sie die Erwartungen (S. 115).\n5. Nach E42 sinkt bei klaren Bewertungen der Status der Extravertierten, und der der Unterschätzten steigt (S. 115-116). ∎", "sections_de": ["Beweis"], "demo_refs_de": ["D32", "E08", "E35", "E42", "T014", "T035"], "citation": "", "pages": [113, 114, 115, 116], "depends_on": ["D32", "E08", "E35", "E42", "T035", "T014"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Le style est un autre indice de T035 ; par D32, on croit en Amérique du Nord que le haut statut est affirmé et agentique ; un échange où l'un s'affirme et l'autre défère déclenche ces croyances, et, par E08, l'assurance passe pour de la compétence (p. 113-114).\n2. Entre pairs homogènes, toute différence de style, même d'humeur, crée une hiérarchie, comme par E35 (p. 114).\n3. Dans les groupes hétérogènes, les caractéristiques pilotent déjà le style, qui n'ajoute guère ; et, par T014, un style affirmé chez un désavantagé paraît une prise intéressée, sauf s'il équilibre affirmation modérée et intention coopérative (p. 114-115).\n4. Les évaluations explicites sont rares, car les tâches sont ambiguës ; le haut statut évite d'ailleurs les terrains où il échouerait ; mais quand elles surviennent, elles changent les attentes (p. 115).\n5. Par E42, sous des évaluations claires, le statut des extravertis décline et celui des membres sous-estimés monte (p. 115-116). ∎", "body_en": "## Demonstration\n\n1. Style is another cue of T035; by D32, North Americans believe high status is assertive and agentic; an exchange in which one asserts and the other defers triggers these beliefs, and, by E08, confidence passes for competence (p. 113-114).\n2. Among homogeneous peers, any difference in style, even of mood, creates a hierarchy, as by E35 (p. 114).\n3. In heterogeneous groups, characteristics already drive style, which adds little; and, by T014, an assertive style from someone disadvantaged looks like a self-interested grab, unless balanced between moderate assertiveness and cooperative intent (p. 114-115).\n4. Explicit evaluations are rare, since tasks are a
