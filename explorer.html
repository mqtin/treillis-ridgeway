, "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2601986}, {"id": "A03", "file": "premisses/A03.md", "type": "auteur", "partie": "P", "titre": "La théorie de la dépendance-pouvoir", "enonce": "(Théorie de la dépendance-pouvoir.) Le pouvoir dans une relation vient du contrôle par l'un de ressources, matérielles ou culturelles, dont l'autre dépend : plus l'autre en dépend, plus on peut le contraindre en menaçant de les retenir.", "titre_en": "Power-dependence theory", "enonce_en": "(Power-dependence theory.) Power in a relationship comes from one actor's control over resources, material or cultural, on which the other depends: the more the other depends on them, the more one can force compliance by threatening to withhold them.", "titre_de": "Die Theorie der Macht-Abhängigkeit", "enonce_de": "(Theorie der Macht-Abhängigkeit.) Macht in einer Beziehung beruht darauf, dass ein Akteur Ressourcen kontrolliert, materielle oder kulturelle, von denen der andere abhängt: Je mehr der andere von ihnen abhängt, desto eher kann man ihn zum Gehorsam zwingen, indem man droht, sie ihm vorzuenthalten.", "body_de": "## Bei Ridgeway\n\nDaraus folgt, dass Macht und Reichtum eng verwandte Formen der Ungleichheit sind: Reichtum ist Kontrolle über materielle Ressourcen, und unter vielen Umständen verwandelt sich Ungleichheit des Reichtums in Ungleichheit der Macht (S. 15).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [15], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nIl en découle que pouvoir et richesse sont des formes d'inégalité étroitement liées : la richesse est un contrôle de ressources matérielles, et, dans bien des circonstances, l'inégalité de richesse se convertit en inégalité de pouvoir (p. 15).", "body_en": "## In Ridgeway\n\nIt follows that power and wealth are closely related forms of inequality: wealth is control over material resources, and in many circumstances inequality of wealth converts into inequality of power (p. 15).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2601986}, {"id": "A04", "file": "premisses/A04.md", "type": "auteur", "partie": "P", "titre": "Goffman : le statut ne se saisit pas", "enonce": "(Goffman.) Le statut ne peut être saisi ni possédé comme un bien matériel ; il ressemble à une réputation : on peut le revendiquer, mais il doit être accordé par les autres.", "titre_en": "Goffman: status cannot be seized", "enonce_en": "(Goffman.) Status cannot be seized or possessed like material goods; it resembles a reputation: one can claim it, but it must be granted by others.", "titre_de": "Goffman: Status lässt sich nicht an sich reißen", "enonce_de": "(Goffman.) Status lässt sich nicht an sich reißen oder besitzen wie materielle Güter; er gleicht einem Ruf: Man kann ihn beanspruchen, aber er muss von anderen zuerkannt werden.", "body_de": "## Bei Ridgeway\n\nIn den Gruppen von Bales ist das Ergreifen des Wortes ein Anspruch auf Aufmerksamkeit; die anderen müssen noch zustimmend zuhören. Dass Status verliehen und nicht genommen wird, ist eines seiner grundlegenden Merkmale (S. 11).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [11], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDans les groupes de Bales, prendre la parole est une revendication d'attention ; il faut encore que les autres l'écoutent avec approbation. Que le statut soit donné et non pris est l'un de ses traits fondamentaux (p. 11).", "body_en": "## In Ridgeway\n\nIn Bales's groups, speaking up is a claim on attention; others must still listen with approval. That status is given, not taken, is one of its fundamental features (p. 11).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2617037}, {"id": "A05", "file": "premisses/A05.md", "type": "auteur", "partie": "P", "titre": "La théorie des caractéristiques de statut et des états d'attente", "enonce": "(Théorie des caractéristiques de statut et des états d'attente.) Dans une tâche coopérative, chacun forme, à partir des indices sociaux, des attentes de performance implicites pour soi et pour les autres ; ces attentes façonnent les conduites de manière autoréalisatrice et produisent la hiérarchie de participation, d'évaluation et d'influence. Les caractéristiques de statut liées à des croyances de statut orientent ces attentes.", "titre_en": "Status characteristics and expectation states theory", "enonce_en": "(Status characteristics and expectation states theory.) In a cooperative task, each person forms, from social cues, implicit performance expectations for self and others; these expectations shape behaviour in self-fulfilling ways and produce the hierarchy of participation, evaluation and influence. Status characteristics linked to status beliefs steer these expectations.", "titre_de": "Die Theorie der Statusmerkmale und Erwartungszustände", "enonce_de": "(Theorie der Statusmerkmale und Erwartungszustände.) Bei einer kooperativen Aufgabe bildet jeder aus sozialen Hinweisen implizite Leistungserwartungen für sich und die anderen; diese Erwartungen prägen das Verhalten auf sich selbst erfüllende Weise und bringen die Hierarchie von Beteiligung, Bewertung und Einfluss hervor. Statusmerkmale, die an Statusüberzeugungen geknüpft sind, steuern diese Erwartungen.", "body_de": "## Bei Ridgeway\n\nSie ist die am weitesten entwickelte und am besten belegte Theorie interpersonaler Hierarchien (S. 9). Ridgeway stellt sie nicht in Frage: Sie will eine tiefere Geschichte erzählen, die der normativen und kulturellen Prozesse, die den von ihr beschriebenen Urteilen zugrunde liegen (S. 9). Die Theorie (eine Familie von Theorien) beschränkt ihren Geltungsbereich auf Gruppen, die ein gemeinsames Ziel verfolgen; innerhalb dieses Bereichs stimmen sie und die Theorie des kulturellen Schemas vollständig überein (S. 99-100).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [9, 99, 100], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nC'est la théorie des hiérarchies interpersonnelles la plus développée et la mieux documentée (p. 9). Ridgeway ne la conteste pas : elle veut raconter une histoire plus profonde, celle des processus normatifs et culturels qui sous-tendent les jugements qu'elle décrit (p. 9). La théorie (une famille de théories) limite son champ aux groupes orientés vers un but commun ; dans ce champ, elle et la théorie du schème culturel concordent pleinement (p. 99-100).", "body_en": "## In Ridgeway\n\nIt is the most developed and best documented theory of interpersonal hierarchies (p. 9). Ridgeway does not challenge it: she wants to tell a deeper story, that of the normative and cultural processes underlying the judgements it describes (p. 9). The theory (a family of theories) limits its scope to groups oriented to a shared goal; within that scope, it and the cultural schema theory fully agree (p. 99-100).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2617037}, {"id": "A06", "file": "premisses/A06.md", "type": "auteur", "partie": "P", "titre": "Emerson : la norme, voix de la coalition", "enonce": "(Emerson.) Une norme de groupe est la voix de la coalition qui se dresserait contre vous si vous la violiez.", "titre_en": "Emerson: the norm as the voice of the coalition", "enonce_en": "(Emerson.) A group norm is the voice of the coalition that would stand against you if you violated it.", "titre_de": "Emerson: die Norm als Stimme der Koalition", "enonce_de": "(Emerson.) Eine Gruppennorm ist die Stimme der Koalition, die sich gegen einen stellen würde, wenn man sie verletzte.", "body_de": "## Bei Ridgeway\n\nNormen zeigen sich in ihrer Durchsetzung; aus dieser Sicht offenbaren die impliziten Koalitionen gegen den Dominierenden eine entstehende Norm (S. 32).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [32], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes normes se révèlent par leur application ; dans cette perspective, les coalitions implicites contre le dominateur révèlent une norme émergente (p. 32).", "body_en": "## In Ridgeway\n\nNorms are revealed by their enforcement; from this perspective, the implicit coalitions against the dominator reveal an emergent norm (p. 32).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2617037}, {"id": "A07", "file": "premisses/A07.md", "type": "auteur", "partie": "P", "titre": "Le savoir commun résout la coordination", "enonce": "(Théoriciens des jeux ; Goffman.) Quand chacun doit tenir compte de la conduite probable des autres pour agir, les gens résolvent ce problème de coordination en s'appuyant sur le même savoir commun, une sorte de script social partagé.", "titre_en": "Common knowledge solves coordination", "enonce_en": "(Game theorists; Goffman.) When each must take others' likely behaviour into account in order to act, people solve this coordination problem by drawing on the same common knowledge, a kind of shared social script.", "titre_de": "Gemeinsames Wissen löst Koordinationsprobleme", "enonce_de": "(Spieltheoretiker; Goffman.) Wenn jeder das wahrscheinliche Verhalten der anderen berücksichtigen muss, um zu handeln, lösen die Menschen dieses Koordinationsproblem, indem sie auf dasselbe gemeinsame Wissen zurückgreifen, eine Art geteiltes soziales Skript.", "body_de": "## Bei Ridgeway\n\nGehen zwei Menschen von denselben Annahmen aus, sehen sie die Handlungen des anderen voraus und stimmen sich reibungslos ab (S. 35). Das Beispiel des Hochzeitswalzers: Man tritt vor in der Erwartung, dass der Partner zurücktritt; ist der Walzer kein gemeinsames Wissen, tritt man einander auf die Füße (S. 74).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [35, 74], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nSi deux personnes partent des mêmes présupposés, elles anticipent leurs actions et se coordonnent sans heurt (p. 35). Exemple de la valse au mariage : on avance en comptant que le partenaire recule ; si la valse n'est pas un savoir commun, on se marche sur les pieds (p. 74).", "body_en": "## In Ridgeway\n\nIf two people start from the same assumptions, they anticipate each other's actions and coordinate smoothly (p. 35). The example of the wedding waltz: one steps forward counting on the partner to step back; if the waltz is not common knowledge, they step on each other's feet (p. 74).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2633123}, {"id": "A08", "file": "premisses/A08.md", "type": "auteur", "partie": "P", "titre": "La théorie de l'identité sociale", "enonce": "(Théorie de l'identité sociale.) La simple reconnaissance d'une différence de groupe suffit à susciter une évaluation : chacun tend à juger son propre groupe « meilleur ».", "titre_en": "Social identity theory", "enonce_en": "(Social identity theory.) The mere recognition of a group difference is enough to evoke an evaluation: each tends to judge their own group \"better\".", "titre_de": "Die Theorie der sozialen Identität", "enonce_de": "(Theorie der sozialen Identität.) Die bloße Wahrnehmung eines Gruppenunterschieds genügt, um eine Bewertung auszulösen: Jeder neigt dazu, die eigene Gruppe für „besser“ zu halten.", "body_de": "## Bei Ridgeway\n\nIst deine Gruppe die Roten und meine die Blauen, so ist mein erster Gedanke, dass die Blauen besser sind (S. 71). Diese Bevorzugung genügt nicht, um eine Statusüberzeugung zu bilden, denn sie erzeugt konkurrierende Sichtweisen (S. 71; T023).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [71], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nSi ton groupe est les Rouges et le mien les Bleus, ma première pensée est que les Bleus valent mieux (p. 71). Ce favoritisme ne suffit pas à former une croyance de statut, car il produit des vues concurrentes (p. 71 ; T023).", "body_en": "## In Ridgeway\n\nIf your group is the Reds and mine the Blues, my first thought is that Blues are better (p. 71). This favouritism is not enough to form a status belief, for it produces competing views (p. 71; T023).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["T023"], "corollaires": [], "mtime": 1794593161.2638292}, {"id": "A09", "file": "premisses/A09.md", "type": "auteur", "partie": "P", "titre": "Weber : la richesse d'abord, le statut ensuite", "enonce": "(Weber.) Historiquement, les groupes sociaux acquièrent d'abord la richesse ou le pouvoir, puis, avec le temps, cherchent la distinction dans la culture et les manières pour acquérir aussi la supériorité de statut.", "titre_en": "Weber: wealth first, status later", "enonce_en": "(Weber.) Historically, social groups first acquire wealth or power, then over time seek distinction in culture and manners in order to acquire status superiority as well.", "titre_de": "Weber: erst der Reichtum, dann der Status", "enonce_de": "(Weber.) Historisch erwerben soziale Gruppen zuerst Reichtum oder Macht und suchen dann mit der Zeit Distinktion in Kultur und Umgangsformen, um auch Statusüberlegenheit zu erlangen.", "body_de": "## Bei Ridgeway\n\nReichtum oder Macht zu erwerben genügt Gruppen selten (S. 59). Die Beobachtung, eingängig und bekannt, wird in Kapitel 4 für die Entstehung von Statusüberzeugungen wieder aufgenommen (S. 82; R08).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [59, 82], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nL'acquisition de richesse ou de pouvoir suffit rarement aux groupes (p. 59). L'observation, séduisante et connue, est reprise au chapitre 4 pour la genèse des croyances de statut (p. 82 ; R08).", "body_en": "## In Ridgeway\n\nAcquiring wealth or power is rarely enough for groups (p. 59). The observation, appealing and well known, is taken up in chapter 4 for the genesis of status beliefs (p. 82; R08).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["R08"], "corollaires": [], "mtime": 1794593161.2648356}, {"id": "A10", "file": "premisses/A10.md", "type": "auteur", "partie": "P", "titre": "Tilly : l'inégalité durable", "enonce": "(Tilly.) Une inégalité fondée sur les seules différences individuelles est instable. Pour durer, le contrôle des ressources et du pouvoir doit être consolidé avec une différence catégorielle (ethnie, genre, race, style de vie de classe), qui facilite l'exploitation et l'accaparement des opportunités.", "titre_en": "Tilly: durable inequality", "enonce_en": "(Tilly.) Inequality based on individual differences alone is unstable. To last, control over resources and power must be consolidated with a categorical difference (ethnicity, gender, race, class lifestyle), which facilitates exploitation and opportunity hoarding.", "titre_de": "Tilly: dauerhafte Ungleichheit", "enonce_de": "(Tilly.) Eine Ungleichheit, die nur auf individuellen Unterschieden beruht, ist instabil. Um Bestand zu haben, muss die Kontrolle über Ressourcen und Macht mit einem kategorialen Unterschied verfestigt werden (Ethnie, Geschlecht, Rasse, Lebensstil einer Klasse), der Ausbeutung und das Horten von Chancen erleichtert.", "body_de": "## Bei Ridgeway\n\nOhne Kategorien herrscht ein ständiges Gerangel um den Vorrang, wie die Intrigen der Thronanwärter bei Shakespeare (S. 126). Ausbeutung ist die Aneignung des von anderen geschaffenen Werts; Horten heißt, Chancen sich selbst oder seinesgleichen vorzubehalten; die Grenze zwischen „uns“ und „ihnen“ macht daraus ein Gruppenvorhaben (S. 126).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [126], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nSans catégorie, c'est la ruée permanente pour la préséance, comme les intrigues des prétendants au trône chez Shakespeare (p. 126). L'exploitation est l'appropriation de la valeur produite par d'autres ; l'accaparement, le fait de réserver les opportunités à soi ou à ses semblables ; la frontière entre « nous » et « eux » en fait un projet de groupe (p. 126).", "body_en": "## In Ridgeway\n\nWithout categories, there is a constant scramble for precedence, like the intrigues of pretenders to the throne in Shakespeare (p. 126). Exploitation is appropriating the value produced by others; hoarding, keeping opportunities for oneself or one's own; the boundary between \"us\" and \"them\" turns these into a group project (p. 126).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2648356}, {"id": "A11", "file": "premisses/A11.md", "type": "auteur", "partie": "P", "titre": "Blumer et Bobo : le sentiment de position de groupe", "enonce": "(Blumer, puis Bobo.) Les membres d'un groupe ont un « sentiment de position de groupe » ; l'anxiété de statut que suscite une menace perçue contre la position de leur groupe explique mieux le préjugé racial que l'animosité personnelle.", "titre_en": "Blumer and Bobo: the sense of group position", "enonce_en": "(Blumer, then Bobo.) Members of a group have a \"sense of group position\"; the status anxiety evoked by a perceived threat to their group's position explains racial prejudice better than personal animus.", "titre_de": "Blumer und Bobo: das Gefühl der Gruppenposition", "enonce_de": "(Blumer, dann Bobo.) Die Mitglieder einer Gruppe haben ein „Gefühl der Gruppenposition“; die Statusangst, die eine wahrgenommene Bedrohung der Position ihrer Gruppe hervorruft, erklärt rassistische Vorurteile besser als persönliche Feindseligkeit.", "body_de": "## Bei Ridgeway\n\nBobo deutet einen Großteil feindseliger rassistischer Vorurteile als Reaktion ranghöherer Gruppen auf wahrgenommene Bedrohungen der rassischen Ordnung (S. 52-53). In Kapitel 6 wird das Gefühl der Gruppenposition zu der Weise, in der Statusüberzeugungen die Struktur der Ungleichheit als persönliche Angelegenheit erleben lassen (S. 145-146).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [52, 53, 145, 146], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nBobo lit une grande part du préjugé racial hostile comme une réaction des groupes de haut statut aux menaces perçues contre l'ordre racial (p. 52-53). Au chapitre 6, le sentiment de position de groupe devient la façon dont les croyances de statut font vivre la structure de l'inégalité comme une affaire personnelle (p. 145-146).", "body_en": "## In Ridgeway\n\nBobo reads much hostile racial prejudice as a reaction of higher-status groups to perceived threats to the racial order (p. 52-53). In chapter 6, the sense of group position becomes the way status beliefs make the structure of inequality felt as a personal matter (p. 145-146).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2653992}, {"id": "A12", "file": "premisses/A12.md", "type": "auteur", "partie": "P", "titre": "Jackman : l'idéologie légitimante", "enonce": "(Jackman.) Sans idéologie légitimante, consolider l'inégalité matérielle avec une différence catégorielle ne ferait que déplacer la lutte pour les ressources de l'individu au groupe, au lieu de stabiliser l'inégalité.", "titre_en": "Jackman: legitimating ideology", "enonce_en": "(Jackman.) Without a legitimating ideology, consolidating material inequality with a categorical difference would merely move the scramble for resources from the individual to the group level, instead of stabilising inequality.", "titre_de": "Jackman: legitimierende Ideologie", "enonce_de": "(Jackman.) Ohne legitimierende Ideologie würde die Verfestigung materieller Ungleichheit mit einem kategorialen Unterschied den Kampf um Ressourcen nur von der individuellen auf die Gruppenebene verlagern, statt die Ungleichheit zu stabilisieren.", "body_de": "## Bei Ridgeway\n\nRidgeway schließt daraus, dass die Statusüberzeugungen diese Rolle der legitimierenden Ideologie spielen (S. 143-144; T053).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [143, 144], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRidgeway en tire que ce sont les croyances de statut qui jouent ce rôle d'idéologie légitimante (p. 143-144 ; T053).", "body_en": "## In Ridgeway\n\nRidgeway concludes that it is status beliefs that play this role of legitimating ideology (p. 143-144; T053).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["T053"], "corollaires": [], "mtime": 1794593161.2653992}, {"id": "A13", "file": "premisses/A13.md", "type": "auteur", "partie": "P", "titre": "Fiske : chaleur et capacité", "enonce": "(Fiske.) Nos perceptions d'autrui ont deux dimensions fondamentales, enracinées dans notre dépendance aux relations : la chaleur (ami ou ennemi ?) et la capacité de réaliser ses intentions, que l'on lit par le statut.", "titre_en": "Fiske: warmth and capability", "enonce_en": "(Fiske.) Our perceptions of others have two fundamental dimensions, rooted in our dependence on relationships: warmth (friend or foe?) and the capability to carry out one's intentions, which we read through status.", "titre_de": "Fiske: Wärme und Fähigkeit", "enonce_de": "(Fiske.) Unsere Wahrnehmung anderer hat zwei grundlegende Dimensionen, die in unserer Abhängigkeit von Beziehungen wurzeln: Wärme (Freund oder Feind?) und die Fähigkeit, seine Absichten umzusetzen, die wir am Status ablesen.", "body_de": "## Bei Ridgeway\n\nDiese beiden Dimensionen spiegeln die, die uns an unserer eigenen Stellung bei den anderen beschäftigen: Zugehörigkeit und Status (S. 50).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [50], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCes deux dimensions sont le miroir de celles qui nous importent dans notre propre position auprès des autres : l'appartenance et le statut (p. 50).", "body_en": "## In Ridgeway\n\nThese two dimensions mirror those that concern us in our own standing with others: belonging and status (p. 50).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.266405}, {"id": "A14", "file": "premisses/A14.md", "type": "auteur", "partie": "P", "titre": "L'interactionnisme symbolique : le soi naît des interactions", "enonce": "(Interactionnisme symbolique.) On acquiert le concept de soi, ses attributs, ses identités et les émotions qui s'y attachent, principalement dans les interactions avec les autres de son environnement local.", "titre_en": "Symbolic interaction: the self arises from interaction", "enonce_en": "(Symbolic interaction.) People acquire their self-concept, its attributes, identities and attached emotions, mainly in their interactions with others in their local environment.", "titre_de": "Symbolischer Interaktionismus: das Selbst entsteht in der Interaktion", "enonce_de": "(Symbolischer Interaktionismus.) Die Menschen erwerben ihr Selbstbild, seine Eigenschaften, Identitäten und die damit verbundenen Gefühle vor allem in den Interaktionen mit anderen in ihrer lokalen Umgebung.", "body_de": "## Bei Ridgeway\n\nWenn so viele alltägliche Interaktionen durch Status geordnet sind, sind ihre Ergebnisse eine starke Quelle der Rückmeldung über den sozialen Wert des Selbst, die, wenn sie sich anhäuft, auf Selbstwertgefühl und Wohlbefinden wirkt (S. 56).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [56], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nSi tant d'interactions quotidiennes sont organisées par le statut, leurs issues sont une source puissante de retour sur la valeur sociale de soi, qui pèse, en s'accumulant, sur l'estime de soi et le bien-être (p. 56).", "body_en": "## In Ridgeway\n\nIf so many everyday interactions are organised by status, their outcomes are a powerful source of feedback on the social value of the self, which, as it accumulates, weighs on self-esteem and well-being (p. 56).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.266405}, {"id": "A15", "file": "premisses/A15.md", "type": "auteur", "partie": "P", "titre": "Veblen : la consommation ostentatoire", "enonce": "(Veblen.) La valeur de statut des objets conduit à des conduites de consommation ostentatoire, par lesquelles on se dispute la position à travers ce qu'on montre.", "titre_en": "Veblen: conspicuous consumption", "enonce_en": "(Veblen.) The status value of objects leads to patterns of conspicuous consumption, by which people jockey for position through what they display.", "titre_de": "Veblen: demonstrativer Konsum", "enonce_de": "(Veblen.) Der Statuswert von Objekten führt zu Mustern demonstrativen Konsums, durch die man über das, was man zur Schau stellt, um Position ringt.", "body_de": "## Bei Ridgeway\n\nRidgeway zitiert ihn für Objekte, die einen Statuswert erlangen (S. 113; T039).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [113], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRidgeway le cite pour les objets qui acquièrent une valeur de statut (p. 113 ; T039).", "body_en": "## In Ridgeway\n\nRidgeway cites him for objects that acquire status value (p. 113; T039).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": ["T039"], "corollaires": [], "mtime": 1794593161.2674057}, {"id": "A16", "file": "premisses/A16.md", "type": "auteur", "partie": "P", "titre": "La justification du système", "enonce": "(Psychologie de la justification du système.) Les gens tendent à justifier et à rendre sensée la structure d'inégalité dans laquelle ils se trouvent, y compris quand elle les désavantage.", "titre_en": "System justification", "enonce_en": "(System-justification psychology.) People tend to justify and make sense of the structure of inequality in which they find themselves, even when it disadvantages them.", "titre_de": "Systemrechtfertigung", "enonce_de": "(Psychologie der Systemrechtfertigung.) Menschen neigen dazu, die Ungleichheitsstruktur, in der sie sich befinden, zu rechtfertigen und ihr Sinn zu geben, selbst wenn sie sie benachteiligt.", "body_de": "## Bei Ridgeway\n\nStatusüberzeugungen zu akzeptieren, auch benachteiligende, bietet ein Mittel, der Struktur der Ungleichheit Sinn zu geben, wie diese Forschung gezeigt hat (S. 144-145).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [144, 145], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nAccepter les croyances de statut, même désavantageuses, donne un moyen de rendre sensée la structure de l'inégalité, comme l'a montré cette recherche (p. 144-145).", "body_en": "## In Ridgeway\n\nAccepting status beliefs, even disadvantaging ones, provides a means of making sense of the structure of inequality, as this research has shown (p. 144-145).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2674057}, {"id": "E01", "file": "premisses/E01.md", "type": "etude", "partie": "P", "titre": "Bales : les hiérarchies émergent en quelques minutes", "enonce": "(Bales, années 1950.) Dans des groupes d'étudiants homogènes et sans chef, travaillant à une décision commune, des inégalités d'interaction apparaissent vite, se stabilisent souvent en une dizaine de minutes et persistent aux séances suivantes ; participation, réactions positives, jugements et influence y sont corrélés. Des jurys simulés socialement mêlés montrent la même chose.", "titre_en": "Bales: hierarchies emerge within minutes", "enonce_en": "(Bales, 1950s.) In homogeneous, leaderless groups of students working on a shared decision, inequalities in interaction develop quickly, often stabilise within ten minutes or so, and persist in later sessions; participation, positive reactions, assessments and influence are correlated. Socially mixed mock juries show the same.", "titre_de": "Bales: Hierarchien entstehen in wenigen Minuten", "enonce_de": "(Bales, 1950er-Jahre.) In homogenen Studentengruppen ohne Leitung, die an einer gemeinsamen Entscheidung arbeiten, entstehen schnell Ungleichheiten der Interaktion, die sich oft binnen etwa zehn Minuten festigen und in späteren Sitzungen fortbestehen; Beteiligung, positive Reaktionen, Urteile und Einfluss hängen zusammen. Sozial gemischte Scheingeschworenengerichte zeigen dasselbe.", "body_de": "## Bei Ridgeway\n\nDiese Studien begründeten die moderne Erforschung interpersonaler Statushierarchien (S. 7-8). Bales schloss daraus, dass solche Hierarchien in jeder kooperativen, zielorientierten Gruppe entstehen (S. 8).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [7, 8], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCes études fondent l'étude moderne des hiérarchies de statut interpersonnelles (p. 7-8). Bales en conclut que de telles hiérarchies émergent dans tout groupe coopératif orienté vers un but (p. 8).", "body_en": "## In Ridgeway\n\nThese studies founded the modern study of interpersonal status hierarchies (p. 7-8). Bales concluded that such hierarchies emerge in any cooperative, goal-oriented group (p. 8).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2684052}, {"id": "E02", "file": "premisses/E02.md", "type": "etude", "partie": "P", "titre": "Le statut est accordé pour la valeur perçue", "enonce": "Il est massivement établi que, dans les situations d'interdépendance coopérative, les membres accordent estime et influence en échange de la valeur perçue de chacun pour l'effort commun.", "titre_en": "Status is granted for perceived value", "enonce_en": "There is overwhelming evidence that, in situations of cooperative interdependence, members grant esteem and influence in exchange for each person's perceived value to the shared effort.", "titre_de": "Status wird für den wahrgenommenen Wert verliehen", "enonce_de": "Es ist überwältigend belegt, dass Mitglieder in Situationen kooperativer Interdependenz Wertschätzung und Einfluss im Austausch für den wahrgenommenen Wert jedes Einzelnen für die gemeinsame Anstrengung gewähren.", "body_de": "## Bei Ridgeway\n\n„Überwältigende Belege“ (S. 13), in Kapitel 2 in Erinnerung gerufen (S. 25): In den Gruppen von Bales traten diejenigen hervor, denen man die „besten Ideen“ zuschrieb (S. 13).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [13, 25], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\n« Overwhelming evidence » (p. 13), rappelée au chapitre 2 (p. 25) : dans les groupes de Bales, ceux qui prenaient l'ascendant étaient ceux qu'on jugeait avoir les « meilleures idées » (p. 13).", "body_en": "## In Ridgeway\n\n\"Overwhelming evidence\" (p. 13), recalled in chapter 2 (p. 25): in Bales's groups, those who became prominent were those perceived as having the \"best ideas\" (p. 13).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2684052}, {"id": "E03", "file": "premisses/E03.md", "type": "etude", "partie": "P", "titre": "Chase : les différences individuelles ne suffisent pas", "enonce": "(Chase et coll.) Dans des groupes de trois ou plus, même chez des poissons ou des poules, les différences individuelles préalables prédisent le rang sans le déterminer entièrement ; la formation de la hiérarchie dépend de processus contingents entre plusieurs individus.", "titre_en": "Chase: individual differences are not enough", "enonce_en": "(Chase and colleagues.) In groups of three or more, even among fish or chickens, prior individual differences predict rank without fully determining it; hierarchy formation depends on contingent processes among several individuals.", "titre_de": "Chase: individuelle Unterschiede genügen nicht", "enonce_de": "(Chase und Mitarbeiter.) In Gruppen von drei oder mehr, sogar bei Fischen oder Hühnern, sagen vorherige individuelle Unterschiede den Rang voraus, ohne ihn vollständig zu bestimmen; die Bildung der Hierarchie hängt von kontingenten Prozessen zwischen mehreren Individuen ab.", "body_de": "## Bei Ridgeway\n\nChase zeigte zunächst rein logisch, dass die Korrelationen sehr hoch sein müssten, damit individuelle Unterschiede lineare Hierarchien bestimmen; mit Seitz zeigt er, dass die Antwort in kontingenten Prozessen zwischen drei oder mehr liegt (S. 28-29).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [28, 29], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nChase a d'abord montré, en logique, que les corrélations devraient être très élevées pour que les différences individuelles déterminent des hiérarchies linéaires ; avec Seitz, il montre que la réponse est dans des processus contingents à trois ou plus (p. 28-29).", "body_en": "## In Ridgeway\n\nChase first showed, as a logical matter, that correlations would have to be very high for individual differences to determine linear hierarchies; with Seitz, he shows that the answer lies in contingent processes among three or more (p. 28-29).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.269406}, {"id": "E04", "file": "premisses/E04.md", "type": "etude", "partie": "P", "titre": "Horne : des intérêts d'échange interdépendants aux normes", "enonce": "(Horne.) Quand les membres d'un groupe ont des intérêts d'échange interdépendants, ils forment des normes qu'ils font respecter.", "titre_en": "Horne: from interdependent exchange interests to norms", "enonce_en": "(Horne.) When group members have interdependent exchange interests, they form norms that they enforce.", "titre_de": "Horne: von wechselseitigen Tauschinteressen zu Normen", "enonce_de": "(Horne.) Haben die Mitglieder einer Gruppe wechselseitig abhängige Tauschinteressen, bilden sie Normen, die sie durchsetzen.", "body_de": "## Bei Ridgeway\n\nRidgeway stützt sich auf diese Arbeiten, um vom Interesse jedes Mitglieds an der Ehrerbietung der anderen zur Bildung einer Norm überzugehen (S. 30).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [30], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRidgeway s'appuie sur ces travaux pour passer de l'intérêt de chacun à la déférence des autres à la formation d'une norme (p. 30).", "body_en": "## In Ridgeway\n\nRidgeway relies on this work to move from each member's interest in others' deference to the formation of a norm (p. 30).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2697551}, {"id": "E05", "file": "premisses/E05.md", "type": "etude", "partie": "P", "titre": "Ridgeway et Diekema : les tiers contre le dominateur", "enonce": "(Ridgeway et Diekema.) Dans des groupes de quatre du même sexe, quand un complice attaque agressivement un autre, les deux participants témoins attaquent spontanément l'attaquant ; le dominateur n'obtient pas plus d'influence qu'un complice neutre aux mêmes arguments, et il est même jugé moins influent et moins compétent.", "titre_en": "Ridgeway and Diekema: third parties against the dominator", "enonce_en": "(Ridgeway and Diekema.) In four-person same-sex groups, when a confederate aggressively attacks another, the two witnessing participants spontaneously attack the attacker; the dominator gains no more influence than a neutral confederate with the same arguments, and is even perceived as less influential and less competent.", "titre_de": "Ridgeway und Diekema: Dritte gegen den Dominierenden", "enonce_de": "(Ridgeway und Diekema.) In gleichgeschlechtlichen Vierergruppen greifen die beiden zuschauenden Teilnehmer, wenn ein Eingeweihter einen anderen aggressiv angreift, von sich aus den Angreifer an; der Dominierende gewinnt nicht mehr Einfluss als ein neutraler Eingeweihter mit denselben Argumenten und wird sogar als weniger einflussreich und weniger kompetent wahrgenommen.", "body_de": "## Bei Ridgeway\n\nVersuchsaufbau und Ergebnisse (S. 31-32); die Dominierenden werden als weniger kompetent wahrgenommen als die neutralen Eingeweihten (S. 33). Der Aufbau erlaubte nicht zu zeigen, dass wahrgenommene Kompetenz die Grundlage des Einflusses war (S. 32).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [31, 32, 33], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nProtocole et résultats (p. 31-32) ; les dominateurs sont jugés moins compétents que les complices neutres (p. 33). Le dispositif ne permettait pas de montrer que la compétence perçue était la base de l'influence (p. 32).", "body_en": "## In Ridgeway\n\nDesign and results (p. 31-32); dominators are perceived as less competent than neutral confederates (p. 33). The design did not allow showing that perceived competence was the basis of influence (p. 32).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2697551}, {"id": "E06", "file": "premisses/E06.md", "type": "etude", "partie": "P", "titre": "Boehm : les sociétés humaines bornent la domination", "enonce": "(Boehm et coll.) Une vaste documentation anthropologique montre des contraintes contre les conduites dominatrices dans une grande variété de sociétés humaines.", "titre_en": "Boehm: human societies constrain domineering", "enonce_en": "(Boehm and colleagues.) Wide anthropological evidence shows constraints on domineering behaviour across a large variety of human societies.", "titre_de": "Boehm: menschliche Gesellschaften begrenzen Herrschsucht", "enonce_de": "(Boehm und Mitarbeiter.) Umfangreiche anthropologische Befunde zeigen Beschränkungen herrschsüchtigen Verhaltens in einer großen Vielfalt menschlicher Gesellschaften.", "body_de": "## Bei Ridgeway\n\nAngeführt zur Stützung des Systems sozialer Kontrolle, das das Experiment mit Diekema offenbart (S. 32).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [32], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCité à l'appui du système de contrôle social révélé par l'expérience avec Diekema (p. 32).", "body_en": "## In Ridgeway\n\nCited in support of the social control system revealed by the experiment with Diekema (p. 32).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.270756}, {"id": "E07", "file": "premisses/E07.md", "type": "etude", "partie": "P", "titre": "Anderson et Kilduff : la dominance passe par la compétence perçue", "enonce": "(Anderson et Kilduff.) Dans des groupes d'étudiants en MBA, les personnalités dominantes obtiennent statut et influence, mais en persuadant leurs coéquipiers de leur compétence supérieure : la compétence perçue médiatise leur ascension.", "titre_en": "Anderson and Kilduff: dominance works through perceived competence", "enonce_en": "(Anderson and Kilduff.) In groups of MBA students, dominant personalities attain status and influence, but by convincing their teammates of their superior competence: perceived competence mediates their rise.", "titre_de": "Anderson und Kilduff: Dominanz wirkt über wahrgenommene Kompetenz", "enonce_de": "(Anderson und Kilduff.) In Gruppen von MBA-Studierenden erlangen dominante Persönlichkeiten Status und Einfluss, aber indem sie ihre Teamkollegen von ihrer überlegenen Kompetenz überzeugen: Die wahrgenommene Kompetenz vermittelt ihren Aufstieg.", "body_de": "## Bei Ridgeway\n\nSie konnten Status nicht allein durch Dominanz beanspruchen, unabhängig von der wahrgenommenen Kompetenz (S. 33).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [33], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nIls ne pouvaient pas revendiquer le statut par la seule dominance, indépendamment de la compétence perçue (p. 33).", "body_en": "## In Ridgeway\n\nThey could not claim status through take-charge dominance alone, independently of perceived competence (p. 33).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.270756}, {"id": "E08", "file": "premisses/E08.md", "type": "etude", "partie": "P", "titre": "Le style affirmé donne une impression de compétence", "enonce": "Une conduite proactive, tournée vers la tâche, dans un style verbal et non verbal affirmé et confiant mais non menaçant, donne une impression de compétence indépendamment de la compétence réelle, et mène au statut ; une dominance menaçante, elle, ne passe pas pour de la compétence.", "titre_en": "Assertive style conveys competence", "enonce_en": "Proactive, task-directed behaviour in an assertive, confident but non-threatening verbal and nonverbal style gives an impression of competence independent of actual competence, and leads to status; threatening dominance is not taken as competence.", "titre_de": "Ein selbstsicherer Stil vermittelt Kompetenz", "enonce_de": "Proaktives, aufgabenbezogenes Verhalten in einem selbstsicheren, zuversichtlichen, aber nicht bedrohlichen verbalen und nonverbalen Stil vermittelt einen Eindruck von Kompetenz unabhängig von der tatsächlichen Kompetenz und führt zu Status; bedrohliche Dominanz gilt nicht als Kompetenz.", "body_de": "## Bei Ridgeway\n\nBefunde, die in Kapitel 2 zusammengetragen (S. 33) und in Kapitel 5 wieder aufgenommen werden: Verhalten, das Zuversicht und Handlungsmacht ausdrückt, erzeugt einen Eindruck von Kompetenz, zumindest bei Nordamerikanern; man nimmt an, solche Selbstsicherheit komme von echter Kompetenz (S. 114). Kleine Abweichungen vom Üblichen (rote Turnschuhe), die Aufmerksamkeit erregen, haben dieselbe Wirkung (S. 114).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [33, 114], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRésultats rassemblés au chapitre 2 (p. 33) et repris au chapitre 5 : les conduites qui expriment confiance et agentivité créent une impression de compétence, au moins chez les Nord-Américains ; on suppose qu'une telle assurance vient d'une compétence réelle (p. 114). Des écarts mineurs aux usages (des baskets rouges) qui attirent l'attention produisent le même effet (p. 114).", "body_en": "## In Ridgeway\n\nFindings gathered in chapter 2 (p. 33) and taken up in chapter 5: behaviour conveying confidence and agency creates an impression of competence, at least among North Americans; people assume such confidence comes from real competence (p. 114). Minor nonconformity (red sneakers) that attracts attention has the same effect (p. 114).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.271755}, {"id": "E09", "file": "premisses/E09.md", "type": "etude", "partie": "P", "titre": "Anderson et coll. : un consensus de second ordre", "enonce": "(Anderson et coll.) Dans des groupes orientés vers une tâche, les évaluations du statut des autres concordent fortement ; chacun estime avec justesse la vue des autres sur son propre rang, et ceux qui se placent plus haut que les autres ne les placent sont moins aimés et moins acceptés.", "titre_en": "Anderson and colleagues: a second-order consensus", "enonce_en": "(Anderson and colleagues.) In task-oriented groups, ratings of others' status agree strongly; each accurately estimates others' view of their own standing, and those who rate themselves higher than others rate them are less liked and less accepted.", "titre_de": "Anderson und Mitarbeiter: ein Konsens zweiter Ordnung", "enonce_de": "(Anderson und Mitarbeiter.) In aufgabenorientierten Gruppen stimmen die Einschätzungen des Status anderer stark überein; jeder schätzt die Sicht der anderen auf seinen eigenen Rang zutreffend ein, und wer sich höher einstuft, als die anderen ihn einstufen, ist weniger beliebt und weniger akzeptiert.", "body_de": "## Bei Ridgeway\n\n„Seinen Platz kennen“ wird so durch impliziten Gruppendruck durchgesetzt (S. 40). Die Selbsteinschätzung des Status ist so genau wie die Einschätzung jedes einzelnen anderen Mitglieds (S. 51).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [40, 51], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\n« Connaître sa place » est ainsi imposé par une pression implicite du groupe (p. 40). L'estimation de son propre statut y est aussi juste que celle de n'importe quel autre membre (p. 51).", "body_en": "## In Ridgeway\n\n\"Knowing your place\" is thus enforced by implicit group pressure (p. 40). Self-estimates of status are as accurate as any other single member's estimate (p. 51).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.271755}, {"id": "E10", "file": "premisses/E10.md", "type": "etude", "partie": "P", "titre": "Troyer et Younts : les attentes d'autrui l'emportent", "enonce": "(Troyer et Younts.) Quand on apprend que ses coéquipiers attendent de soi plus ou moins de compétence qu'on n'en attend soi-même, ce sont les attentes des autres qui prédisent le mieux la conduite et l'influence.", "titre_en": "Troyer and Younts: others' expectations prevail", "enonce_en": "(Troyer and Younts.) When people learn that their teammates expect more or less competence of them than they expect of themselves, it is the others' expectations that best predict behaviour and influence.", "titre_de": "Troyer und Younts: die Erwartungen der anderen setzen sich durch", "enonce_de": "(Troyer und Younts.) Erfährt man, dass die Teamkollegen mehr oder weniger Kompetenz von einem erwarten, als man selbst erwartet, so sagen die Erwartungen der anderen Verhalten und Einfluss am besten voraus.", "body_de": "## Bei Ridgeway\n\nEine im Rahmen der Erwartungszustandstheorie durchgeführte Studie (S. 40).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [40], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nÉtude conduite dans le cadre de la théorie des états d'attente (p. 40).", "body_en": "## In Ridgeway\n\nA study conducted within expectation states theory (p. 40).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.271755}, {"id": "E11", "file": "premisses/E11.md", "type": "etude", "partie": "P", "titre": "Anderson, Willer et coll. : on défère quand les autres savent", "enonce": "(Anderson, Willer et coll.) Des participants qui se croient peu doués pour la tâche à venir veulent pourtant un statut élevé si leurs scores restent anonymes ; ils préfèrent un statut bas quand les autres connaissent leur score.", "titre_en": "Anderson, Willer and colleagues: deferring when others know", "enonce_en": "(Anderson, Willer and colleagues.) Participants who believe they have low ability at an upcoming task still want high status if their scores stay anonymous; they prefer low status when the others know their score.", "titre_de": "Anderson, Willer und Mitarbeiter: sich fügen, wenn die anderen es wissen", "enonce_de": "(Anderson, Willer und Mitarbeiter.) Teilnehmer, die sich für eine bevorstehende Aufgabe wenig begabt halten, wollen dennoch hohen Status, wenn ihre Ergebnisse anonym bleiben; sie ziehen niedrigen Status vor, wenn die anderen ihr Ergebnis kennen.", "body_de": "## Bei Ridgeway\n\nDie Ehrerbietung gegenüber überlegener Kompetenz entspringt dem Druck der Erwartungen anderer, nicht persönlichen Zweifeln an der eigenen Fähigkeit (S. 41).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [41], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLa déférence à la compétence supérieure vient de la pression des attentes des autres, non d'un doute personnel sur ses capacités (p. 41).", "body_en": "## In Ridgeway\n\nDeference to superior competence results from the pressure of others' expectations, not from personal doubts about one's ability (p. 41).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2735531}, {"id": "E12", "file": "premisses/E12.md", "type": "etude", "partie": "P", "titre": "Van Vugt : on quitte les groupes autocratiques", "enonce": "(Van Vugt et coll.) Les membres de groupes dirigés de façon autocratique sont quatre fois plus susceptibles de quitter le groupe que ceux de groupes dirigés démocratiquement.", "titre_en": "Van Vugt: people leave autocratic groups", "enonce_en": "(Van Vugt and colleagues.) Members of autocratically run groups are four times more likely to leave the group than members of democratically led groups.", "titre_de": "Van Vugt: autokratische Gruppen verlässt man", "enonce_de": "(Van Vugt und Mitarbeiter.) Mitglieder autokratisch geführter Gruppen verlassen die Gruppe viermal häufiger als Mitglieder demokratisch geführter Gruppen.", "body_de": "## Bei Ridgeway\n\nEine Veranschaulichung der Instabilität von Dominanzhierarchien (S. 43).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [43], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nIllustration de l'instabilité des hiérarchies de dominance (p. 43).", "body_en": "## In Ridgeway\n\nAn illustration of the instability of dominance hierarchies (p. 43).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2735531}, {"id": "E13", "file": "premisses/E13.md", "type": "etude", "partie": "P", "titre": "Hahl et Zuckerman : le soupçon qui entoure le haut statut", "enonce": "(Hahl et Zuckerman.) Parce que la revendication d'un statut élevé a un motif ambigu, les membres de haut statut sont jugés moins attentionnés et moins authentiques que ceux de bas statut, sauf preuve crédible de leurs intentions prosociales.", "titre_en": "Hahl and Zuckerman: the suspicion around high status", "enonce_en": "(Hahl and Zuckerman.) Because a claim to high status has an ambiguous motive, higher-status members are seen as more inconsiderate and inauthentic than lower-status members unless they give credible evidence of prosocial intent.", "titre_de": "Hahl und Zuckerman: der Verdacht, der hohen Status umgibt", "enonce_de": "(Hahl und Zuckerman.) Weil der Anspruch auf hohen Status ein zweideutiges Motiv hat, gelten Mitglieder mit höherem Status als rücksichtsloser und weniger authentisch als Mitglieder mit niedrigerem Status, es sei denn, sie belegen glaubhaft ihre prosoziale Absicht.", "body_de": "## Bei Ridgeway\n\nAngeführt für die Spannung zwischen Führenden und Folgenden (S. 44), dann für den moralischen Gehalt von Statusüberzeugungen (S. 79).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [44, 79], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCité pour la tension entre meneurs et suiveurs (p. 44), puis pour le contenu moral des croyances de statut (p. 79).", "body_en": "## In Ridgeway\n\nCited for the tension between leaders and followers (p. 44), then for the moral content of status beliefs (p. 79).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2740707}, {"id": "E14", "file": "premisses/E14.md", "type": "etude", "partie": "P", "titre": "Anderson, Hildreth et Howland : un motif fondamental", "enonce": "(Anderson, Hildreth et Howland.) Le désir de statut remplit quatre critères d'un motif humain fondamental : effets durables sur le bien-être et la santé, large éventail de conduites motivées, fin en soi irréductible à l'appartenance, présence dans toutes les cultures.", "titre_en": "Anderson, Hildreth and Howland: a fundamental motive", "enonce_en": "(Anderson, Hildreth and Howland.) The desire for status meets four criteria of a fundamental human motive: lasting effects on well-being and health, a wide range of motivated behaviour, an end in itself not reducible to belonging, presence across cultures.", "titre_de": "Anderson, Hildreth und Howland: ein grundlegendes Motiv", "enonce_de": "(Anderson, Hildreth und Howland.) Das Streben nach Status erfüllt vier Kriterien eines grundlegenden menschlichen Motivs: dauerhafte Wirkungen auf Wohlbefinden und Gesundheit, eine breite Palette motivierten Verhaltens, ein Selbstzweck, der sich nicht auf Zugehörigkeit zurückführen lässt, Vorkommen in allen Kulturen.", "body_de": "## Bei Ridgeway\n\nEin Überblick über sozialwissenschaftliche Forschung, der zu dem Schluss kommt, dass das Streben nach Status ein grundlegendes Motiv ist (S. 50).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [50], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRevue de la recherche en sciences sociales qui conclut que le désir de statut est un motif fondamental (p. 50).", "body_en": "## In Ridgeway\n\nA review of social scientific research concluding that the desire for status is a fundamental motive (p. 50).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2750773}, {"id": "E15", "file": "premisses/E15.md", "type": "etude", "partie": "P", "titre": "On surveille le statut et on le perçoit juste", "enonce": "On guette les moindres signes de statut, les siens et ceux des autres (le bureau d'angle, les émotions de fierté ou de honte, le ton, le regard), et l'on perçoit avec justesse le statut des autres comme le sien.", "titre_en": "People monitor status and perceive it accurately", "enonce_en": "People vigilantly watch the smallest signs of status, their own and others' (the corner office, displays of pride or shame, voice tone, eye contact), and accurately perceive others' status as well as their own.", "titre_de": "Man beobachtet Status und nimmt ihn zutreffend wahr", "enonce_de": "Man achtet wachsam auf die kleinsten Statuszeichen, die eigenen und die der anderen (das Eckbüro, Anzeichen von Stolz oder Scham, Tonfall, Blickkontakt), und nimmt den Status der anderen wie den eigenen zutreffend wahr.", "body_de": "## Bei Ridgeway\n\nBeispiele (S. 50-51); wie ein Mitglied den Status jedes Einzelnen wahrnimmt, liegt sehr nahe an der durchschnittlichen Rangfolge der Gruppe, und ebenso die Einschätzung des eigenen Status (S. 51).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [50, 51], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExemples (p. 50-51) ; la perception qu'un membre a du statut de chacun est très proche du classement moyen du groupe, et l'estimation de son propre statut l'est autant (p. 51).", "body_en": "## In Ridgeway\n\nExamples (p. 50-51); a member's perception of each person's status is very close to the group's average ranking, and so is the estimate of one's own status (p. 51).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2750773}, {"id": "E16", "file": "premisses/E16.md", "type": "etude", "partie": "P", "titre": "Le manque de respect suscite colère et agression", "enonce": "Se sentir manquer de respect provoque typiquement la colère, l'une des sources de colère les plus communes ; préparés à penser au statut, des participants disent qu'ils agresseraient plus fortement quelqu'un qui les a tachés sans s'excuser.", "titre_en": "Disrespect provokes anger and aggression", "enonce_en": "Feeling disrespected typically provokes anger, one of the more common sources of anger; primed to think about status, participants say they would aggress more strongly against someone who spilled something on them without apologising.", "titre_de": "Respektlosigkeit ruft Wut und Aggression hervor", "enonce_de": "Sich respektlos behandelt zu fühlen, ruft typischerweise Wut hervor und gehört zu den häufigsten Anlässen von Wut; auf Status eingestimmte Teilnehmer geben an, sie würden jemanden, der etwas über sie verschüttet, ohne sich zu entschuldigen, heftiger angreifen.", "body_de": "## Bei Ridgeway\n\nEin Überblick über Wut (S. 51-52) und das Experiment von Griskevicius und Mitarbeitern (S. 52).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [51, 52], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRevue sur la colère (p. 51-52) et expérience de Griskevicius et coll. (p. 52).", "body_en": "## In Ridgeway\n\nA review on anger (p. 51-52) and the experiment by Griskevicius and colleagues (p. 52).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2760785}, {"id": "E17", "file": "premisses/E17.md", "type": "etude", "partie": "P", "titre": "Menace de statut et choix politiques", "enonce": "Rendre saillant le changement démographique qui fera des Blancs une minorité accroît chez des participants blancs l'adhésion aux idéologies conservatrices et l'opposition aux aides sociales (Craig et Richeson ; Wetts et Willer). Le sentiment d'être méprisé par les élites pèse autant que le déclin économique dans le vote d'électeurs blancs ruraux (Hochschild, Cramer, Mutz) ; la menace sur le statut subjectif nourrit le populisme de droite (Gidron et Hall ; Williams).", "titre_en": "Status threat and political choices", "enonce_en": "Making salient the demographic change that will make whites a minority increases white participants' endorsement of conservative ideologies and opposition to welfare (Craig and Richeson; Wetts and Willer). Feeling looked down on by elites weighs as much as economic decline in the votes of rural white voters (Hochschild, Cramer, Mutz); threat to subjective status fuels right-wing populism (Gidron and Hall; Williams).", "titre_de": "Statusbedrohung und politische Entscheidungen", "enonce_de": "Macht man den demografischen Wandel salient, durch den Weiße zur Minderheit werden, so stimmen weiße Teilnehmer konservativen Ideologien stärker zu und lehnen Sozialleistungen stärker ab (Craig und Richeson; Wetts und Willer). Das Gefühl, von den Eliten verachtet zu werden, wiegt bei der Wahlentscheidung weißer Wähler auf dem Land ebenso schwer wie der wirtschaftliche Niedergang (Hochschild, Cramer, Mutz); die Bedrohung des subjektiven Status nährt den Rechtspopulismus (Gidron und Hall; Williams).", "body_de": "## Bei Ridgeway\n\nIn Kapitel 3 dargelegt (S. 52-53) und in Kapitel 6 mit den Arbeiten von Gidron und Hall sowie von Williams wieder aufgenommen (S. 146).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [52, 53, 146], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExposé au chapitre 3 (p. 52-53) et repris au chapitre 6, avec les travaux de Gidron et Hall et de Williams (p. 146).", "body_en": "## In Ridgeway\n\nSet out in chapter 3 (p. 52-53) and taken up in chapter 6, with the work of Gidron and Hall and of Williams (p. 146).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2760785}, {"id": "E18", "file": "premisses/E18.md", "type": "etude", "partie": "P", "titre": "Ce que rapporte le haut statut", "enonce": "Les membres de haut statut reçoivent davantage d'attention et de parole, plus de réponses positives et moins de désaccords, plus d'influence et une plus grande part des récompenses extérieures ; ceux de bas statut, jugés moins compétents, sont jugés plus chaleureux.", "titre_en": "What high status brings", "enonce_en": "High-status members receive more attention and floor time, more positive responses and fewer disagreements, more influence and a greater share of external rewards; low-status members, seen as less competent, are seen as warmer.", "titre_de": "Was hoher Status einbringt", "enonce_de": "Mitglieder mit hohem Status erhalten mehr Aufmerksamkeit und Redezeit, mehr positive Reaktionen und weniger Widerspruch, mehr Einfluss und einen größeren Anteil an äußeren Belohnungen; Mitglieder mit niedrigem Status gelten als weniger kompetent, aber als wärmer.", "body_de": "## Bei Ridgeway\n\nEin Muster, das die Forschung zu Erwartungszuständen immer wieder belegt hat (S. 55).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [55], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nSchéma documenté à maintes reprises par la recherche sur les états d'attente (p. 55).", "body_en": "## In Ridgeway\n\nA pattern repeatedly documented by expectation states research (p. 55).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2760785}, {"id": "E19", "file": "premisses/E19.md", "type": "etude", "partie": "P", "titre": "Les émotions du statut", "enonce": "Le haut statut suscite des émotions positives et la fierté ; le bas statut, la tristesse et, en cas d'échec, la culpabilité ou la honte. Ces liens sont des stéréotypes culturels partagés (Tiedens et coll.).", "titre_en": "The emotions of status", "enonce_en": "High status evokes positive emotions and pride; low status, sadness and, when things go wrong, guilt or shame. These links are shared cultural stereotypes (Tiedens and colleagues).", "titre_de": "Die Gefühle des Status", "enonce_de": "Hoher Status ruft positive Gefühle und Stolz hervor; niedriger Status Traurigkeit und, wenn etwas schiefgeht, Schuld oder Scham. Diese Verbindungen sind geteilte kulturelle Stereotype (Tiedens und Mitarbeiter).", "body_de": "## Bei Ridgeway\n\nSelbst wenn die Gruppe Erfolg hat, geht das Verdienst an die Mitglieder mit hohem Status, denen gegenüber die mit niedrigem Status Dankbarkeit empfinden (S. 57). In den Fallbeschreibungen von Tiedens hält man das stolze Mitglied für ranghoch, das schuldbewusste oder traurige für rangniedrig (S. 57).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [57], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nMême quand le groupe réussit, le mérite va aux membres de haut statut, envers qui ceux de bas statut éprouvent de la reconnaissance (p. 57). Dans les vignettes de Tiedens, le membre fier est supposé de haut statut, le coupable ou le triste de bas statut (p. 57).", "body_en": "## In Ridgeway\n\nEven when the group succeeds, credit goes to high-status members, towards whom low-status members feel appreciation (p. 57). In Tiedens's vignettes, the proud member is assumed high status, the guilty or sad one low status (p. 57).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.277079}, {"id": "E20", "file": "premisses/E20.md", "type": "etude", "partie": "P", "titre": "Le statut local prédit le bien-être", "enonce": "(Anderson, Kraus et coll. ; Smith, Tyler et Huo.) Le statut dans les groupes locaux (amis, travail, voisinage) prédit fortement les émotions positives et la satisfaction de vivre, indépendamment du sentiment d'être aimé ; les changements de statut entraînent des changements de bien-être, et le respect dans les groupes en face à face est lié à l'estime de soi.", "titre_en": "Local status predicts well-being", "enonce_en": "(Anderson, Kraus and colleagues; Smith, Tyler and Huo.) Status in local groups (friends, work, neighbourhood) strongly predicts positive feelings and life satisfaction, independently of feeling liked; changes in status bring changes in well-being, and respect in face-to-face groups is linked to self-esteem.", "titre_de": "Lokaler Status sagt das Wohlbefinden voraus", "enonce_de": "(Anderson, Kraus und Mitarbeiter; Smith, Tyler und Huo.) Der Status in lokalen Gruppen (Freunde, Arbeit, Nachbarschaft) sagt positive Gefühle und Lebenszufriedenheit stark voraus, unabhängig davon, ob man sich gemocht fühlt; Statusveränderungen ziehen Veränderungen des Wohlbefindens nach sich, und Respekt in Gruppen von Angesicht zu Angesicht hängt mit dem Selbstwertgefühl zusammen.", "body_de": "## Bei Ridgeway\n\nDie von ihren Berufskollegen respektierte Klempnerin kann sich wohler fühlen als die Ärztin, die unter ihren Kollegen niedrigen Status hat (S. 58).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [58], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLa plombière respectée de ses pairs peut être plus heureuse que le médecin de bas statut parmi ses collègues (p. 58).", "body_en": "## In Ridgeway\n\nThe plumber respected among her fellow plumbers may feel more well-being than the physician who is low status among her colleagues (p. 58).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.277079}, {"id": "E21", "file": "premisses/E21.md", "type": "etude", "partie": "P", "titre": "Hays et Greer : le désir de statut ne se rassasie pas", "enonce": "(Hays et Greer.) La préférence pour une position croît sans plafond avec le statut qu'elle confère, alors que la préférence pour le pouvoir plafonne ; en bas de la hiérarchie on cherche plutôt du pouvoir, plus haut plutôt du statut, y compris chez les golfeurs professionnels.", "titre_en": "Hays and Greer: the desire for status is not satiated", "enonce_en": "(Hays and Greer.) Preference for a position rises without ceiling with the status it confers, while preference for power levels off; at the bottom of the hierarchy people seek power, higher up status, including among professional golfers.", "titre_de": "Hays und Greer: das Streben nach Status wird nicht gestillt", "enonce_de": "(Hays und Greer.) Die Vorliebe für eine Position steigt ohne Obergrenze mit dem Status, den sie verleiht, während die Vorliebe für Macht abflacht; unten in der Hierarchie sucht man eher Macht, weiter oben eher Status, auch bei Profigolfern.", "body_de": "## Bei Ridgeway\n\nExperimente und eine Archivstudie (S. 59). Ihre Deutung: Hat man genug Macht, um seine Lage zu kontrollieren, bringt zusätzliche Macht wenig; Status dagegen besitzt man nie ein für alle Mal (S. 59-60).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [59, 60], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExpériences et étude d'archives (p. 59). Leur interprétation : une fois assez de pouvoir pour contrôler sa situation, le pouvoir ajouté rapporte peu ; le statut, lui, ne se possède jamais une fois pour toutes (p. 59-60).", "body_en": "## In Ridgeway\n\nExperiments and an archival study (p. 59). Their interpretation: once there is enough power to control one's circumstances, added power brings little; status, by contrast, is never possessed once and for all (p. 59-60).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2780802}, {"id": "E22", "file": "premisses/E22.md", "type": "etude", "partie": "P", "titre": "Le statut tourne vers les autres, le pouvoir vers soi", "enonce": "(Blader et coll.) Les personnes de haut statut dans un contexte interpersonnel cherchent davantage à adopter le point de vue d'autrui que celles de bas statut ; les positions de pouvoir rendent au contraire plus égocentrique.", "titre_en": "Status orients towards others, power towards self", "enonce_en": "(Blader and colleagues.) People of high status in an interpersonal context engage in more perspective-taking than low-status people; positions of power, by contrast, make people more egocentric.", "titre_de": "Status lenkt den Blick auf andere, Macht auf sich selbst", "enonce_de": "(Blader und Mitarbeiter.) Menschen mit hohem Status in einem interpersonalen Kontext versetzen sich stärker in andere hinein als Menschen mit niedrigem Status; Machtpositionen machen dagegen egozentrischer.", "body_de": "## Bei Ridgeway\n\nDiese Aufmerksamkeit ist eigennützig (was denkst du von mir?); Menschen mit niedrigem Status sagen das Verhalten anderer tatsächlich besser voraus, und die Wirkung verschwindet, wenn lokaler Status zur Machtposition wird (S. 60).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [60], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCette attention est intéressée (que pensez-vous de moi ?) ; les personnes de bas statut prédisent en fait mieux la conduite des autres, et l'effet disparaît quand le statut local devient position de pouvoir (p. 60).", "body_en": "## In Ridgeway\n\nThis attention is self-interested (what do you think of me?); low-status people actually predict others' behaviour better, and the effect disappears when local status becomes a position of power (p. 60).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2790778}, {"id": "E23", "file": "premisses/E23.md", "type": "etude", "partie": "P", "titre": "Ridgeway et Nakagawa : le respect pour la déférence raisonnable", "enonce": "(Ridgeway et Nakagawa, trois études.) Le membre de bas statut qui défère dans un désaccord est respecté comme raisonnable, qu'il défère à l'évaluateur ou à un autre ; 70 % des participants choisiraient de déférer en anticipant ce respect ; et le respect reçu accroît l'engagement envers le groupe et réduit l'envie de le quitter.", "titre_en": "Ridgeway and Nakagawa: respect for reasonable deference", "enonce_en": "(Ridgeway and Nakagawa, three studies.) The low-status member who defers in a disagreement is respected as reasonable, whether deferring to the evaluator or to another; 70 percent of participants would choose deference, anticipating that respect; and the respect received increases commitment to the group and reduces the wish to leave.", "titre_de": "Ridgeway und Nakagawa: Respekt für vernünftige Ehrerbietung", "enonce_de": "(Ridgeway und Nakagawa, drei Studien.) Das rangniedrige Mitglied, das in einer Meinungsverschiedenheit nachgibt, wird als vernünftig respektiert, ob es dem Bewertenden oder einem anderen nachgibt; 70 Prozent der Teilnehmer würden in Erwartung dieses Respekts nachgeben; und der erhaltene Respekt stärkt die Bindung an die Gruppe und verringert den Wunsch, sie zu verlassen.", "body_de": "## Bei Ridgeway\n\nDie drei Studien (S. 62-63). Dass Ehrerbietung gegenüber einem anderen ebenso belohnt wird wie gegenüber einem selbst, zeigt einen normativen Prozess (S. 63).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [62, 63], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes trois études (p. 62-63). Que l'on récompense autant la déférence envers un autre qu'envers soi montre un processus normatif (p. 63).", "body_en": "## In Ridgeway\n\nThe three studies (p. 62-63). That deference to another is rewarded as much as deference to self shows a normative process (p. 63).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2790778}, {"id": "E24", "file": "premisses/E24.md", "type": "etude", "partie": "P", "titre": "Les hiérarchies interpersonnelles sont stables", "enonce": "Les hiérarchies de statut interpersonnelles se forment vite et, une fois formées, se maintiennent d'une réunion du groupe à l'autre : elles ont une « adhérence » qui résiste au changement.", "titre_en": "Interpersonal hierarchies are stable", "enonce_en": "Interpersonal status hierarchies form quickly and, once formed, are maintained across repeated meetings of the group: they have a \"stickiness\" that resists change.", "titre_de": "Interpersonale Hierarchien sind stabil", "enonce_de": "Interpersonale Statushierarchien bilden sich schnell und bleiben, einmal entstanden, über wiederholte Treffen der Gruppe hinweg erhalten: Sie haben eine „Zähigkeit“, die Veränderungen widersteht.", "body_de": "## Bei Ridgeway\n\nEine der häufigsten empirischen Beobachtungen (S. 64-65), seit den frühesten Studien (S. 156).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [64, 65, 156], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nL'une des observations empiriques les plus communes (p. 64-65), depuis les premières études (p. 156).", "body_en": "## In Ridgeway\n\nOne of the most common empirical observations (p. 64-65), since the earliest studies (p. 156).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2800772}, {"id": "E25", "file": "premisses/E25.md", "type": "etude", "partie": "P", "titre": "Fiske : les stéréotypes de groupe contiennent des croyances de statut", "enonce": "(Fiske et coll.) Les stéréotypes américains de tous les groupes qui structurent l'inégalité (race, âge, genre, classe, profession, éducation) comportent des croyances de statut ; ils sont consensuels et tenus pour ce que pense « la plupart des Américains » ; statut et compétence y sont presque confondus (r ≈ 0,90), et les groupes de haut statut y sont jugés moins chaleureux.", "titre_en": "Fiske: group stereotypes contain status beliefs", "enonce_en": "(Fiske and colleagues.) American stereotypes of all the groups that pattern inequality (race, age, gender, class, occupation, education) contain status beliefs; they are consensual and taken as what \"most Americans\" think; status and competence nearly define each other (r ≈ .90), and high-status groups are seen as less warm.", "titre_de": "Fiske: Gruppenstereotype enthalten Statusüberzeugungen", "enonce_de": "(Fiske und Mitarbeiter.) Die amerikanischen Stereotype aller Gruppen, die die Ungleichheit strukturieren (Rasse, Alter, Geschlecht, Klasse, Beruf, Bildung), enthalten Statusüberzeugungen; sie sind konsensuell und gelten als das, was „die meisten Amerikaner“ denken; Status und Kompetenz definieren einander nahezu (r ≈ .90), und hochrangige Gruppen gelten als weniger warm.", "body_de": "## Bei Ridgeway\n\nBelege zum Charakter dritter Ordnung (S. 75-76), zur Korrelation von Status und Kompetenz (S. 78) und zur geringeren Wärme, die hochrangigen Gruppen zugeschrieben wird (S. 79).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [75, 76, 78, 79], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDonnées sur le caractère de troisième ordre (p. 75-76), sur la corrélation statut-compétence (p. 78) et sur la moindre chaleur prêtée aux groupes de haut statut (p. 79).", "body_en": "## In Ridgeway\n\nEvidence on the third-order character (p. 75-76), on the status-competence correlation (p. 78) and on the lower warmth attributed to high-status groups (p. 79).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794593161.2800772}, {"id": "E26", "file": "premisses/E26.md", "type": "etude", "partie": "P", "titre": "Bianchi : les croyances de statut des programmeurs libres", "enonce": "(Bianchi et coll.) Les programmeurs du logiciel libre forment leurs propres croyances de statut sur les signes de valeur, et des normes pour ignorer certaines croyances de la société (éducation, âge) ; une proposition signée d'un programmeur de haut statut est plus souvent acceptée.", "titre_en": "Bianchi: the status beliefs of open-source programmers", "enonce_en": "(Bianchi and colleagues.) Open-source programmers form their own status beliefs about the signs of worth, and norms for ignoring some wider beliefs (education, age); a suggestion bearing the name of a high-status programmer is more likely to be accepted.", "titre_de": "Bianchi: die Statusüberzeugungen von Open-Source-Programmierern", "enonce_de": "(Bianchi und Mitarbeiter.) Open-Source-Programmierer bilden eigene Statusüberzeugungen über die Zeichen von Wert und Normen, um manche Überzeugungen der Gesellschaft (Bildung, Alter) außer Acht zu lassen; ein Vorschlag mit dem Namen eines hochrangigen Programmierers wird eher angenommen.", "body_de": "## Bei Ridgeway\n\nEin Beispiel gemeinschaftsspezifischer Überzeugungen (S. 76), wieder aufgenommen für den Statusvorteil im Netz (S. 92).", "sections_de": ["Bei Ridgeway"], "demo_refs_de": [], "citation": "", "pages": [76, 92], "dep
