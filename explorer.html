royances ; la théorie elle-même dit que ce n'est pas la seule voie, mais elle dégage deux éléments plus généraux (p. 89).\n2. Premier élément : un contexte qui rend saillante l'association entre une différence reconnue et un ordre de rang d'apparence valide (p. 89).\n3. Second élément : une validation comportementale par un public plus large ; elle permet au rang de se propager à la différence de groupe (p. 89).\n4. Par E31, tout contexte qui crée une telle association valide suffit, comme l'information d'une autorité légitime (p. 89-90).\n5. Par E32, le statut des organisations naît de même, par association (le statut s'étend du partenaire établi au nouveau venu) et par des évaluateurs tiers dont la légitimité ou la publicité fait de leur classement un savoir commun (p. 90-91). ∎", "body_en": "## Demonstration\n\n1. By T028, encounters create beliefs; the theory itself says this is not the only route, but it brings out two more general elements (p. 89).\n2. First element: a context that makes salient the association between a recognised difference and an apparently valid rank order (p. 89).\n3. Second element: behavioural validation by a wider audience; it allows the rank to spread to the group difference (p. 89).\n4. By E31, any context creating such a valid association suffices, like information from a legitimate authority (p. 89-90).\n5. By E32, organisational status arises the same way, through association (status spreads from the established partner to the newcomer) and through third-party evaluators whose legitimacy or publicity makes their ranking common knowledge (p. 90-91). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E31", "E32", "T028"], "sections": ["Démonstration"], "demo_refs": ["E31", "E32", "T028"], "mentions": ["E31", "E32", "T028"], "corollaires": [], "mtime": 1794590968.4201417}, {"id": "T031", "file": "theses/T031.md", "type": "these", "partie": "4", "titre": "Le schème s'étend partout où il y a un but et une interdépendance", "enonce": "Parce que le statut est un schème culturel, on l'applique bien au-delà de la hiérarchie interpersonnelle : aux écoles, aux quartiers, aux entreprises, aux objets. Deux conditions semblent nécessaires : une orientation vers un but et une interdépendance. À la limite, entre organisations rivales, la coopération ne porte plus que sur le classement lui-même.", "titre_en": "The schema spreads wherever there is a goal and interdependence", "enonce_en": "Because status is a cultural schema, it is applied well beyond the interpersonal hierarchy: to schools, neighbourhoods, firms, objects. Two conditions seem necessary: goal orientation and interdependence. At the limit, between rival organisations, cooperation bears only on the ranking itself.", "citation": "“It is like acquiring a pair of scissors.”", "pages": [91, 92, 93], "depends_on": ["A01", "T030", "E26"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T030, les croyances se forment de manière semblable pour les organisations et pour les types d'individus : le statut organise des relations bien au-delà de l'interpersonnel (p. 91).\n2. Par A01, une fois qu'on a un schème, on l'applique largement : ce sont les ciseaux avec lesquels on trouve de nouvelles choses à couper (p. 91).\n3. Les classements d'organisations biaisent les jugements de qualité comme les croyances sur les individus, et, par E26, les communautés de programmeurs en ligne ont leurs propres croyances aux effets classiques (p. 91-92).\n4. Première condition : un but dont l'issue peut être plus ou moins réussie, qui motive l'évaluation de la compétence ; seconde : une interdépendance, qui oblige à coordonner les jugements (p. 92-93).\n5. Entre organisations rivales sur un marché (facultés de droit, restaurants), l'interdépendance coopérative ne porte plus sur le but, mais sur le besoin commun d'un classement : c'est l'extension maximale du schème (p. 93). ∎", "body_en": "## Demonstration\n\n1. By T030, beliefs form in similar ways for organisations and for types of individuals: status organises relations well beyond the interpersonal (p. 91).\n2. By A01, once one has a schema, one applies it permissively: it is the scissors with which one finds new things to cut (p. 91).\n3. Organisational rankings bias judgements of quality like beliefs about individuals, and, by E26, online programming communities have their own beliefs with the classic effects (p. 91-92).\n4. First condition: a goal whose outcome can be more or less successful, which motivates the evaluation of competence; second: interdependence, which forces judgements to be coordinated (p. 92-93).\n5. Between rival organisations in a market (law schools, restaurants), cooperative interdependence no longer bears on the goal but on the shared need for a ranking: this is the full stretch of the schema (p. 93). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A01", "E26", "T030"], "sections": ["Démonstration"], "demo_refs": ["A01", "E26", "T030"], "mentions": ["A01", "E26", "T030"], "corollaires": [], "mtime": 1794590968.4201417}, {"id": "T032", "file": "theses/T032.md", "type": "these", "partie": "4", "titre": "L'avantage de statut naît de deux inférences et passe pour du mérite", "enonce": "Les croyances de statut créent l'avantage par deux processus : elles biaisent le jugement personnel sur la compétence d'autrui (inférence socialement endogène) et, quand l'issue dépend des autres, font préférer le choix que « la plupart » jugeront le meilleur (inférence de troisième ordre). Ensemble, ils créent des avantages indus, justifiés au nom du « mérite ».", "titre_en": "Status advantage arises from two inferences and passes for merit", "enonce_en": "Status beliefs create advantage through two processes: they bias personal judgements of others' competence (socially endogenous inference) and, when the outcome depends on others, lead people to favour the choice \"most\" will judge best (third-order inference). Together they create unwarranted advantages, justified in the name of \"merit\".", "citation": "", "pages": [94, 95, 96], "depends_on": ["D22", "D23", "T024", "E33", "E10"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T024, les croyances créent l'avantage ; par D22, elles biaisent d'abord le jugement personnel, et leurs erreurs, en façonnant les performances, se réalisent (p. 94).\n2. Ce raccourci joue même hors des conditions du schème, quand on doute de la qualité d'une chose : choisir un chocolat d'après le statut de la marque ; l'effet faiblit quand on a goûté (p. 94).\n3. Quand l'issue dépend des réactions des autres, comme le chocolat pour la fête du bureau ou l'embauche, par D23 on s'appuie sur ce que pense la plupart des gens (p. 94-95).\n4. Par E33, on favorise alors le haut statut même sans le juger meilleur, tant que l'ouverture des autres à un autre choix n'est pas un savoir commun (p. 95).\n5. Par E10, c'est l'inférence de troisième ordre qui explique que les attentes de second ordre l'emportent sur les siennes propres (p. 95-96).\n6. Les deux processus coexistent et se confondent ; ils créent des avantages et des désavantages indus selon l'identité de groupe, justifiés par le « mérite » : c'est par eux que l'inégalité de groupe entre dans des institutions dites méritocratiques (p. 96). ∎", "body_en": "## Demonstration\n\n1. By T024, beliefs create advantage; by D22, they first bias personal judgement, and their errors, by shaping performance, become self-fulfilling (p. 94).\n2. This shortcut works even outside the schema's conditions, when one is uncertain about a thing's quality: choosing a chocolate by the status of the brand; the effect weakens once one has tasted (p. 94).\n3. When the outcome depends on others' reactions, like chocolate for the office party or hiring, by D23 people rely on what most people think (p. 94-95).\n4. By E33, people then favour high status even without judging it better, as long as others' openness to another choice is not common knowledge (p. 95).\n5. By E10, it is third-order inference that explains why second-order expectations prevail over one's own (p. 95-96).\n6. The two processes co-occur and merge; they create unwarranted advantages and disadvantages by group identity, justified by \"merit\": it is through them that group inequality enters ostensibly meritocratic institutions (p. 96). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D22", "D23", "E10", "E33", "T024"], "sections": ["Démonstration"], "demo_refs": ["D22", "D23", "E10", "E33", "T024"], "mentions": ["D22", "D23", "E10", "E33", "T024"], "corollaires": [], "mtime": 1794590968.4211419}, {"id": "T033", "file": "theses/T033.md", "type": "these", "partie": "5", "titre": "Le statut dépend du contexte", "enonce": "Ce qui vaut le statut dépend du but du groupe : nul n'est haut partout ni bas partout. Le poids de l'orientation vers le groupe varie lui aussi : il l'emporte quand contribuer est coûteux, s'efface quand la réussite est cruciale ; dans la plupart des contextes occidentaux, la compétence domine.", "titre_en": "Status depends on context", "enonce_en": "What earns status depends on the group's goal: no one is high everywhere or low everywhere. The weight of group orientation also varies: it prevails when contributing is costly, recedes when success is crucial; in most Western contexts, competence dominates.", "citation": "", "pages": [97, 98, 99], "depends_on": ["D05", "D08", "E34", "T014"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D05, le statut va à la compétence perçue au but ; mais ce qui est compétence dépend du but : raconter des histoires drôles élève dans un groupe d'amis, nuit dans un groupe de travail sérieux (p. 97-98).\n2. Malgré les caractéristiques diffuses, nul n'est haut dans tous les contextes : l'homme d'affaires blanc défère à son PDG et au pédiatre ; le jardinier latino est respecté à l'église et pour sa guitare (p. 98).\n3. Par T014, les motifs de qui recherche le statut sont ambigus, d'où l'orientation vers le groupe (D08) ; son poids varie aussi ; par E34, dans les dilemmes sociaux, on récompense qui contribue malgré le coût, et, quand la réussite est cruciale, on défère au compétent égoïste (p. 98-99).\n4. Dans la plupart des contextes, du moins occidentaux, la compétence est la composante principale ; l'orientation vers le groupe est secondaire (p. 99). ∎\n\n## Scolie\n\nLes contextes les plus lourds de conséquences pour l'inégalité (école, travail, santé) sont centrés sur des tâches instrumentales, où la compétence perçue domine ; ce sont eux que le chapitre étudie (p. 99).", "body_en": "## Demonstration\n\n1. By D05, status goes to perceived competence at the goal; but what counts as competence depends on the goal: telling funny stories raises one among friends, hurts in a serious work group (p. 97-98).\n2. Despite diffuse characteristics, no one is high in every context: the white businessman defers to his CEO and to the paediatrician; the Latino yard worker is respected at church and for his guitar (p. 98).\n3. By T014, the motives of whoever seeks status are ambiguous, hence group orientation (D08); its weight also varies; by E34, in social dilemmas, those who contribute despite the cost are rewarded, and when success is crucial, groups defer to the selfish expert (p. 98-99).\n4. In most contexts, at least Western ones, competence is the primary component; group orientation is secondary (p. 99). ∎\n\n## Scholium\n\nThe contexts most consequential for inequality (school, work, health) centre on instrumental tasks, where perceived competence dominates; these are the ones the chapter studies (p. 99).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D05", "D08", "E34", "T014"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D05", "D08", "E34", "T014"], "mentions": ["D05", "D08", "E34", "T014"], "corollaires": [], "mtime": 1794591716.0761044}, {"id": "T034", "file": "theses/T034.md", "type": "these", "partie": "5", "titre": "Des attentes autoréalisatrices fondent une hiérarchie stable", "enonce": "Dans les premiers moments, chacun forme des attentes de performance pour soi et les autres ; elles rendent plus affirmé ou plus déférent, ce qui produit la hiérarchie, qui confirme les attentes et se stabilise. Des différences fortuites peuvent suffire à l'enclencher, sans aucune différence réelle de capacité.", "titre_en": "Self-fulfilling expectations found a stable hierarchy", "enonce_en": "In the first moments, each person forms performance expectations for self and others; these make one more assertive or more deferential, which produces the hierarchy, which confirms the expectations and stabilises. Chance differences can suffice to set it off, without any real difference in ability.", "citation": "", "pages": [100, 101, 102, 103], "depends_on": ["D12", "A05", "E35", "T011"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. En rejoignant un groupe, on traverse une phase d'incertitude où l'on cherche à se situer ; par D12 et A05, on forme des attentes de performance implicites, qui traduisent les jugements de valeur sur lesquels tourne la norme de T011 (p. 100-101).\n2. Ces attentes façonnent les conduites de façon autoréalisatrice : qui s'attend à plus parle avec assurance et maintient son avis ; qui s'attend à moins hésite, approuve et se range (p. 101).\n3. La hiérarchie comportementale qui en résulte semble confirmer les attentes ; elle se stabilise jusqu'à ce qu'une information nouvelle les change (p. 101).\n4. Par E35, un état d'esprit assigné au hasard suffit à produire une hiérarchie qui persiste les jours suivants (p. 102).\n5. Des différences de statut peuvent donc naître de manière contingente, sans différence préalable de capacité (p. 102-103). ∎", "body_en": "## Demonstration\n\n1. On joining a group, one goes through a period of uncertainty, trying to place oneself; by D12 and A05, one forms implicit performance expectations, which express the judgements of value on which the norm of T011 turns (p. 100-101).\n2. These expectations shape behaviour in self-fulfilling ways: whoever expects more speaks confidently and holds to their view; whoever expects less hesitates, approves and changes to agree (p. 101).\n3. The resulting behavioural hierarchy seems to confirm the expectations; it stabilises until new information changes them (p. 101).\n4. By E35, a randomly assigned mind-set suffices to produce a hierarchy that persists in the following days (p. 102).\n5. Status differences can therefore arise contingently, without prior differences in ability (p. 102-103). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A05", "D12", "E35", "T011"], "sections": ["Démonstration"], "demo_refs": ["A05", "D12", "E35", "T011"], "mentions": ["A05", "D12", "E35", "T011"], "corollaires": [], "mtime": 1794591743.5753365}, {"id": "T035", "file": "theses/T035.md", "type": "these", "partie": "5", "titre": "L'ordre des attentes se forme par combinaison d'indices", "enonce": "Les membres forment un ordre d'attentes à peu près partagé en remarquant les mêmes indices et en puisant dans les mêmes croyances. Un indice devient saillant par différence entre membres ou par lien culturel avec la tâche ; tous les indices saillants se combinent, pondérés par leur pertinence. Changer l'ordre ensuite est possible mais difficile.", "titre_en": "The order of expectations forms by combining cues", "enonce_en": "Members form a roughly shared order of expectations by noticing the same cues and drawing on the same beliefs. A cue becomes salient through a difference among members or a cultural link to the task; all salient cues combine, weighted by relevance. Changing the order afterwards is possible but difficult.", "citation": "", "pages": [103, 104, 105, 106], "depends_on": ["T034", "D17", "E36"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T034, la hiérarchie est un ordre d'attentes qui guide les conduites ; pour coordonner, il doit être partagé : on le forme en remarquant les mêmes indices et en les lisant par les mêmes croyances (p. 103).\n2. Par D17, ces indices sont les caractéristiques de statut, les récompenses, le style de comportement et les évaluations (p. 104).\n3. Un indice est saillant si les membres diffèrent sur lui ou s'il est culturellement lié au contexte : le genre agit dans la garde d'enfants même entre personnes du même sexe (p. 104).\n4. Par E36, on combine tous les indices saillants, pondérés par leur pertinence, avec effets d'incohérence et d'atténuation (p. 104-105).\n5. La hiérarchie se maintient aussi parce que les membres de haut statut usent de leur influence pour la conserver ; elle change par une information nouvelle que les *autres* doivent accepter, eux qui ont des attentes établies et des positions à défendre (p. 106). ∎", "body_en": "## Demonstration\n\n1. By T034, the hierarchy is an order of expectations guiding behaviour; to coordinate, it must be shared: it forms through members noticing the same cues and reading them through the same beliefs (p. 103).\n2. By D17, these cues are status characteristics, rewards, behavioural style and evaluations (p. 104).\n3. A cue is salient if members differ on it or if it is culturally linked to the context: gender acts in child care even among people of the same sex (p. 104).\n4. By E36, all salient cues are combined, weighted by relevance, with inconsistency and attenuation effects (p. 104-105).\n5. The hierarchy is also maintained because high-status members use their influence to preserve it; it changes through new information that *others* must accept, others who have established expectations and positions to defend (p. 106). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D17", "E36", "T034"], "sections": ["Démonstration"], "demo_refs": ["D17", "E36", "T034"], "mentions": ["D17", "E36", "T034"], "corollaires": [], "mtime": 1794590968.4231422}, {"id": "T036", "file": "theses/T036.md", "type": "these", "partie": "5", "titre": "Les caractéristiques diffuses cadrent l'interaction dès le début", "enonce": "Genre, race, âge, classe, éducation et profession deviennent saillants presque aussitôt et cadrent les attentes, dont dépendent tous les indices ultérieurs. Diffuses, ces caractéristiques agissent même sans rapport avec la tâche ; d'autres indices peuvent les contrebalancer, mais jamais les effacer : le désavantagé doit être meilleur pour être vu égal.", "titre_en": "Diffuse characteristics frame interaction from the start", "enonce_en": "Gender, race, age, class, education and occupation become salient almost immediately and frame expectations, within which all later cues are nested. Being diffuse, these characteristics act even when unrelated to the task; other cues can outweigh them, but never erase them: the disadvantaged must be better to be seen as equal.", "citation": "", "pages": [106, 107, 108, 109], "depends_on": ["D14", "D16", "E37", "T035", "T032", "T033"], "contre": ["R11"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T035, les caractéristiques de statut sont, parmi les indices, les plus puissantes ; par D16, une caractéristique saillante déclenche la généralisation du statut ; elle crée l'avantage de T032 en biaisant la compétence perçue et en coordonnant les jugements : même CV, mieux noté sous un nom d'homme ou de Blanc (p. 106-107).\n2. Toutes les grandes différences qui structurent l'inégalité aux États-Unis agissent ainsi ; genre, race et âge se lisent à vue, la classe en quelques instants (p. 107).\n3. Saillantes d'emblée, elles cadrent les attentes, et les indices ultérieurs s'y emboîtent ; ce cadrage initial a des effets durables (p. 107-108).\n4. Par E37, leurs effets passent par les attentes et ne s'expliquent pas par des différences préalables entre groupes (p. 108).\n5. Par D14, une caractéristique diffuse agit même sans rapport avec la tâche, comme l'analyse d'un processus biochimique ; des indices spécifiques peuvent la contrebalancer, mais ses effets ne disparaissent jamais (p. 108-109).\n6. Par T033, aucune caractéristique n'est pourtant universellement avantageuse : une licence avantage parmi les non-diplômés, désavantage parmi les docteurs (p. 109). ∎", "body_en": "## Demonstration\n\n1. By T035, status characteristics are the most powerful of the cues; by D16, a salient characteristic triggers status generalization; it creates the advantage of T032 by biasing perceived competence and coordinating judgements: the same résumé, rated better under a man's or a white person's name (p. 106-107).\n2. All the major differences that pattern inequality in the United States act this way; gender, race and age are read visually, class within moments (p. 107).\n3. Salient from the start, they frame expectations, and later cues are nested within them; this initial framing has lasting effects (p. 107-108).\n4. By E37, their effects run through expectations and cannot be explained by prior differences between groups (p. 108).\n5. By D14, a diffuse characteristic acts even when unrelated to the task, like analysing a biochemical process; specific cues can outweigh it, but its effects never go away (p. 108-109).\n6. Yet, by T033, no characteristic is universally advantaging: a bachelor's degree advantages among those who did not finish college, disadvantages among PhDs (p. 109). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D14", "D16", "E37", "T032", "T033", "T035"], "sections": ["Démonstration"], "demo_refs": ["D14", "D16", "E37", "T032", "T033", "T035"], "mentions": ["D14", "D16", "E37", "T032", "T033", "T035"], "corollaires": [], "mtime": 1794591716.0761044}, {"id": "T037", "file": "theses/T037.md", "type": "these", "partie": "5", "titre": "Les attentes changent la conduite et la performance même", "enonce": "Les caractéristiques diffuses saillantes enhardissent les avantagés et font hésiter les désavantagés ; elles modifient aussi la qualité réelle de la performance, comme un avantage à domicile. Le statut crée ainsi l'avantage sous couvert de mérite de deux façons : la même idée « sonne mieux » chez le haut statut, et il peut réellement mieux réussir.", "titre_en": "Expectations change behaviour and performance itself", "enonce_en": "Salient diffuse characteristics embolden the advantaged and make the disadvantaged hesitate; they also change the actual quality of performance, like a home-team advantage. Status thus creates advantage under the guise of merit in two ways: the same idea \"sounds better\" from high status, and high status can actually perform better.", "citation": "", "pages": [109, 110, 111], "depends_on": ["T036", "E38", "E39"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T036, les caractéristiques diffuses cadrent les attentes ; elles enhardissent donc les avantagés et font hésiter les désavantagés (p. 109).\n2. Par E38, l'affirmation, jusque dans le non-verbal, suit finement l'avantage d'attente que donne le genre selon la tâche (p. 109-110).\n3. Au-delà de l'interaction, dans une épreuve comme le SAT, une caractéristique saillante modifie la performance elle-même ; par E39, c'est l'équivalent de la menace du stéréotype (p. 110).\n4. Le statut crée donc l'avantage sous couvert de mérite de deux façons : le biais d'évaluation, et une meilleure performance réelle à capacité égale (p. 110-111). ∎", "body_en": "## Demonstration\n\n1. By T036, diffuse characteristics frame expectations; they therefore embolden the advantaged and make the disadvantaged hesitate (p. 109).\n2. By E38, assertiveness, down to the nonverbal, closely follows the expectation advantage that gender gives according to the task (p. 109-110).\n3. Beyond interaction, in a test like the SAT, a salient characteristic changes performance itself; by E39, this is equivalent to stereotype threat (p. 110).\n4. Status therefore creates advantage under the guise of merit in two ways: evaluative bias, and actually better performance at equal skill (p. 110-111). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E38", "E39", "T036"], "sections": ["Démonstration"], "demo_refs": ["E38", "E39", "T036"], "mentions": ["E38", "E39", "T036"], "corollaires": [], "mtime": 1794590968.4246523}, {"id": "T038", "file": "theses/T038.md", "type": "these", "partie": "5", "titre": "Les doubles standards", "enonce": "Les caractéristiques diffuses créent des doubles standards : à performance égale, on exige plus de preuves d'aptitude des désavantagés, ou l'on déplace les critères vers ce qui favorise les avantagés. Au moment d'embaucher ou de promouvoir, cela crée encore l'avantage sous couvert de mérite.", "titre_en": "Double standards", "enonce_en": "Diffuse characteristics create double standards: at equal performance, more proof of ability is demanded of the disadvantaged, or criteria shift to whatever favours the advantaged. At the moment of hiring or promotion, this again creates advantage under the guise of merit.", "citation": "", "pages": [111, 112], "depends_on": ["D27", "E40", "T036"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T036, les caractéristiques diffuses saillantes cadrent le jugement de la performance ; par D27, la personne désavantagée doit « prouver encore » ; l'avantagée voit sa bonne performance confirmer son aptitude (p. 111).\n2. Par E40, cela pèse sur l'auto-évaluation des femmes et leur orientation, sur l'attention prêtée à leurs recommandations, et prend la forme de critères mouvants (p. 111).\n3. Dans un entretien d'embauche ou une évaluation pour une promotion, ces jugements d'aptitude font la différence ; l'avantage passe là encore pour du « mérite » (p. 111-112). ∎", "body_en": "## Demonstration\n\n1. By T036, salient diffuse characteristics frame the judgement of performance; by D27, the disadvantaged person must \"prove it again\"; the advantaged person's good performance confirms ability (p. 111).\n2. By E40, this weighs on women's self-assessment and career choices, on the attention paid to their recommendations, and takes the form of shifting criteria (p. 111).\n3. In a job interview or a promotion review, these judgements of ability make the difference; the advantage again passes for \"merit\" (p. 111-112). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D27", "E40", "T036"], "sections": ["Démonstration"], "demo_refs": ["D27", "E40", "T036"], "mentions": ["D27", "E40", "T036"], "corollaires": [], "mtime": 1794591716.077108}, {"id": "T039", "file": "theses/T039.md", "type": "these", "partie": "5", "titre": "Les récompenses et les objets portent du statut", "enonce": "Comme statut et récompenses sont liés dans les attentes, recevoir une récompense plus élevée fait présumer une compétence plus grande. Le statut se propage aussi par association, aux réseaux (citer des noms) et aux objets, qui deviennent des indices de statut : d'où la consommation ostentatoire.", "titre_en": "Rewards and objects carry status", "enonce_en": "Since status and rewards are linked in expectations, receiving a higher reward leads people to presume greater competence. Status also spreads by association, to networks (name-dropping) and to objects, which become status cues: hence conspicuous consumption.", "citation": "", "pages": [112, 113], "depends_on": ["E41", "A15", "T035"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Les récompenses sont un autre indice de T035 : les hiérarchies distribuent les récompenses selon le rang ; la théorie en déduit qu'inversement une récompense plus élevée crée des attentes de compétence plus élevées (p. 112).\n2. Par E41, même une récompense purement honorifique donne plus d'influence (p. 112).\n3. Cette récompense était le privilège de fréquenter des personnes de haut statut : le statut se propageant par association, pouvoir citer des noms est un indice de statut (p. 113).\n4. Par E41 encore, le statut passe des acteurs aux objets ; posséder un objet de haut statut fonctionne comme une récompense sociale qui fait présumer de la compétence ; par A15, d'où la consommation ostentatoire (p. 113). ∎", "body_en": "## Demonstration\n\n1. Rewards are another cue of T035: hierarchies distribute rewards by rank; the theory infers that, conversely, a higher reward creates higher expectations of competence (p. 112).\n2. By E41, even a purely honorific reward brings more influence (p. 112).\n3. That reward was the privilege of associating with high-status people: status spreading by association, being able to name-drop is a status cue (p. 113).\n4. By E41 again, status passes from actors to objects; owning a high-status object functions as a social reward that leads people to presume competence; by A15, hence conspicuous consumption (p. 113). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A15", "E41", "T035"], "sections": ["Démonstration"], "demo_refs": ["A15", "E41", "T035"], "mentions": ["A15", "E41", "T035"], "corollaires": [], "mtime": 1794591716.0781057}, {"id": "T040", "file": "theses/T040.md", "type": "these", "partie": "5", "titre": "Le style et les évaluations : des indices qui font et défont", "enonce": "Le style affirmé est un indice de statut : entre pairs, toute différence de style crée une hiérarchie. Mais pour un désavantagé, s'affirmer paraît illégitime, sauf à montrer une orientation coopérative. Les évaluations explicites de la performance, rares, peuvent changer la hiérarchie : elles démasquent avec le temps les compétences surestimées.", "titre_en": "Style and evaluations: cues that make and unmake", "enonce_en": "Assertive style is a status cue: among peers, any difference in style creates a hierarchy. But for someone disadvantaged, assertiveness looks illegitimate, unless they show a cooperative orientation. Explicit performance evaluations, which are rare, can change the hierarchy: over time they unmask overestimated competence.", "citation": "", "pages": [113, 114, 115, 116], "depends_on": ["D32", "E08", "E35", "E42", "T035", "T014"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Le style est un autre indice de T035 ; par D32, on croit en Amérique du Nord que le haut statut est affirmé et agentique ; un échange où l'un s'affirme et l'autre défère déclenche ces croyances, et, par E08, l'assurance passe pour de la compétence (p. 113-114).\n2. Entre pairs homogènes, toute différence de style, même d'humeur, crée une hiérarchie, comme par E35 (p. 114).\n3. Dans les groupes hétérogènes, les caractéristiques pilotent déjà le style, qui n'ajoute guère ; et, par T014, un style affirmé chez un désavantagé paraît une prise intéressée, sauf s'il équilibre affirmation modérée et intention coopérative (p. 114-115).\n4. Les évaluations explicites sont rares, car les tâches sont ambiguës ; le haut statut évite d'ailleurs les terrains où il échouerait ; mais quand elles surviennent, elles changent les attentes (p. 115).\n5. Par E42, sous des évaluations claires, le statut des extravertis décline et celui des membres sous-estimés monte (p. 115-116). ∎", "body_en": "## Demonstration\n\n1. Style is another cue of T035; by D32, North Americans believe high status is assertive and agentic; an exchange in which one asserts and the other defers triggers these beliefs, and, by E08, confidence passes for competence (p. 113-114).\n2. Among homogeneous peers, any difference in style, even of mood, creates a hierarchy, as by E35 (p. 114).\n3. In heterogeneous groups, characteristics already drive style, which adds little; and, by T014, an assertive style from someone disadvantaged looks like a self-interested grab, unless balanced between moderate assertiveness and cooperative intent (p. 114-115).\n4. Explicit evaluations are rare, since tasks are ambiguous; high-status members also steer away from ground where they would fail; but when they occur, they change expectations (p. 115).\n5. By E42, under clear evaluations, extraverts' status declines and that of underestimated members rises (p. 115-116). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D32", "E08", "E35", "E42", "T014", "T035"], "sections": ["Démonstration"], "demo_refs": ["D32", "E08", "E35", "E42", "T014", "T035"], "mentions": ["D32", "E08", "E35", "E42", "T014", "T035"], "corollaires": [], "mtime": 1794591716.0781057}, {"id": "T041", "file": "theses/T041.md", "type": "these", "partie": "5", "titre": "La légitimité vient de la validité, et les caractéristiques diffuses la renforcent", "enonce": "Toute hiérarchie conforme à l'ordre des attentes a une légitimité de base ; au-delà, elle est légitime dans la mesure où elle paraît socialement valide, traitée comme telle par les autres et conforme aux croyances sur qui doit être en haut. Le haut statut qui « a le physique de l'emploi » obtient plus d'obéissance ; une hiérarchie plus « méritocratique » est paradoxalement moins légitime.", "titre_en": "Legitimacy comes from validity, and diffuse characteristics strengthen it", "enonce_en": "Any hierarchy that matches the order of expectations has a baseline legitimacy; beyond that, it is legitimate to the extent that it seems socially valid, treated as such by others and consistent with beliefs about who should be on top. The high-status member who \"looks the part\" obtains more compliance; a more \"meritocratic\" hierarchy is paradoxically less legitimate.", "citation": "", "pages": [116, 117, 118], "depends_on": ["D18", "T012", "E43", "E44"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D18, la légitimité permet l'autorité ; par E43, tant qu'elle manque, le haut statut se montre généreux, et cette générosité peut disparaître quand elle s'affermit (p. 116).\n2. Une hiérarchie conforme à l'ordre des attentes respecte la norme fondamentale et a une légitimité de base (p. 116-117).\n3. Comme le consensus de T012, la légitimité repose moins sur l'adhésion personnelle que sur la validité sociale : le traitement par les autres, et l'accord avec les croyances sur les types de personnes en haut (p. 117).\n4. Le haut statut appuyé sur des caractéristiques diffuses paraît donc « juste » ; l'homme blanc distingué à la tête d'une commission a « le physique de l'emploi » (p. 117).\n5. Par E44, à influence égale, il obtient plus d'obéissance que celui qui doit son rang à une expertise prouvée : la hiérarchie « méritocratique » est moins légitime (p. 117-118). ∎", "body_en": "## Demonstration\n\n1. By D18, legitimacy enables authority; by E43, while it is lacking, high-status members show generosity, which may disappear as it firms up (p. 116).\n2. A hierarchy that matches the order of expectations respects the basic norm and has a baseline legitimacy (p. 116-117).\n3. Like the consensus of T012, legitimacy rests less on personal endorsement than on social validity: treatment by others, and agreement with beliefs about the types of people on top (p. 117).\n4. High status backed by diffuse characteristics therefore looks \"right\"; the distinguished-looking white man leading a task force \"looks the part\" (p. 117).\n5. By E44, at equal influence, he obtains more compliance than someone whose rank comes from proven expertise: the \"meritocratic\" hierarchy is less legitimate (p. 117-118). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D18", "E43", "E44", "T012"], "sections": ["Démonstration"], "demo_refs": ["D18", "E43", "E44", "T012"], "mentions": ["D18", "E43", "E44", "T012"], "corollaires": [], "mtime": 1794590968.4271843}, {"id": "T042", "file": "theses/T042.md", "type": "these", "partie": "5", "titre": "Le rejet frappe qui conteste la hiérarchie des groupes", "enonce": "Parce que les croyances de statut légitiment certaines hiérarchies, elles suscitent une résistance contre ceux qui semblent les contester : les membres de groupes désavantagés qui s'affirment trop sont rejetés, non pour manque de douceur, mais parce qu'ils paraissent « trop dominants » pour leur rang.", "titre_en": "Backlash strikes those who challenge the ranking of groups", "enonce_en": "Because status beliefs legitimate some hierarchies, they evoke resistance against those who seem to challenge them: members of disadvantaged groups who are too assertive are rejected, not for lack of niceness, but because they appear \"too dominant\" for their rank.", "citation": "", "pages": [118, 119], "depends_on": ["T041", "E45"], "contre": ["R10"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T041, les croyances sur qui doit être en haut légitiment les hiérarchies ; elles créent donc une résistance contre ce qui les conteste (p. 118).\n2. Par E45, la conduite dominante d'une femme blanche ou d'un homme afro-américain suscite antipathie et résistance, et réduit son employabilité (p. 118).\n3. Le problème n'est pas un manque de chaleur, mais une dominance qui conteste la hiérarchie de genre ; ce sont les ordres explicites, non le regard affirmé, qui déclenchent le rejet (p. 118).\n4. Les femmes de couleur, moins prototypiques, échappent parfois au rejet ; mais cette invisibilité limite aussi leur légitimité aux postes élevés (p. 118-119).\n5. Race et genre créent ainsi des biais contre la légitimité des efforts des désavantagés pour monter ou exercer l'autorité (p. 119). ∎", "body_en": "## Demonstration\n\n1. By T041, beliefs about who should be on top legitimate hierarchies; they therefore create resistance against what challenges them (p. 118).\n2. By E45, dominant behaviour from a white woman or an African American man evokes dislike and resistance, and reduces their hireability (p. 118).\n3. The problem is not a lack of warmth, but a dominance that challenges the gender hierarchy; explicit directives, not an assertive gaze, trigger the backlash (p. 118).\n4. Women of color, less prototypical, sometimes escape backlash; but this invisibility also limits their legitimacy in high positions (p. 118-119).\n5. Race and gender thus create biases against the legitimacy of disadvantaged people's efforts to rise or to exercise authority (p. 119). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E45", "T041"], "sections": ["Démonstration"], "demo_refs": ["E45", "T041"], "mentions": ["E45", "T041"], "corollaires": [], "mtime": 1794590968.428185}, {"id": "T043", "file": "theses/T043.md", "type": "these", "partie": "5", "titre": "Surmonter la généralisation du statut : possible, mais pas juste", "enonce": "On peut surmonter un désavantage diffus en changeant les attentes des *autres* : en apportant une information valide et pertinente (scores, formation, appui d'une autorité) et en joignant l'affirmation de sa compétence à une orientation coopérative manifeste. Ces techniques marchent, mais ne sont pas justes : il faut travailler plus, être plus aimable et prouver davantage pour être traité en égal.", "titre_en": "Overcoming status generalization: possible, but not fair", "enonce_en": "A diffuse disadvantage can be overcome by changing *others'* expectations: by bringing valid, relevant information (scores, training, an authority's backing) and by combining assertion of competence with a clear cooperative orientation. These techniques work, but they are not fair: one must work harder, be nicer and prove more to be treated as an equal.", "citation": "", "pages": [119, 120], "depends_on": ["T036", "T041"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T036, un désavantage diffus cadre aussi ses propres attentes ; il faut d'abord les étayer par des compétences sûres, mais cela ne suffit pas, car la hiérarchie tient aux attentes des autres, qui résistent (p. 119).\n2. Par T041, ce changement leur paraît illégitime ; deux techniques apaisent ce souci (p. 119).\n3. Première : introduire une information de statut légitime, sans ambiguïté et pertinente, comme des scores publics ou une formation attestée ; affirmer ne suffit pas, il faut une « preuve », parfois l'appui d'une autorité établie (p. 119-120).\n4. Seconde : allier une conduite affirmée à des signes clairs d'intention coopérative ; elle ne marche que si l'on est réellement compétent, et c'est une corde raide (p. 120).\n5. Aucune n'est juste : il faut travailler plus, être plus aimable et prouver davantage pour être traité en égal ; mais elles ouvrent l'accès au pouvoir et à l'influence (p. 120). ∎", "body_en": "## Demonstration\n\n1. By T036, a diffuse disadvantage also frames one's own expectations; they must first be shored up with solid skills, but that is not enough, since the hierarchy rests on others' expectations, which resist (p. 119).\n2. By T041, the change seems illegitimate to them; two techniques assuage this concern (p. 119).\n3. First: introducing legitimate, unambiguous and relevant status information, such as public test scores or documented training; claiming is not enough, \"proof\" is needed, sometimes an established authority's backing (p. 119-120).\n4. Second: combining assertive behaviour with clear signs of cooperative intent; it works only if one is really competent, and it is a tightrope (p. 120).\n5. Neither is fair: one must work harder, be nicer and prove more to be treated as an equal; but they open access to power and influence (p. 120). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["T036", "T041"], "sections": ["Démonstration"], "demo_refs": ["T036", "T041"], "mentions": ["T036", "T041"], "corollaires": [], "mtime": 1794590968.429181}, {"id": "T044", "file": "theses/T044.md", "type": "these", "partie": "5", "titre": "Trois biais s'accumulent sur une vie", "enonce": "Les caractéristiques diffuses déclenchent dans les contextes décisifs trois biais : biais de statut, biais de légitimité, biais de préférence associative. Petits dans chaque situation, variables selon le contexte, ils s'accumulent sur les situations et les vies, et créent un avantage systématique d'accès à l'emploi, à la promotion, à la reconnaissance et au pouvoir.", "titre_en": "Three biases accumulate over a lifetime", "enonce_en": "Diffuse characteristics trigger three biases in consequential contexts: status bias, legitimacy bias, associational preference bias. Small in each situation, varying with context, they accumulate over situations and lifetimes, and create a systematic advantage in access to jobs, promotion, recognition and power.", "citation": "", "pages": [121, 122, 123], "depends_on": ["D19", "D20", "D21", "T037", "T038", "T042"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Les caractéristiques diffuses correspondent aux axes de l'inégalité ; les croyances qui s'y attachent façonnent l'évaluation de chacun dans une rencontre décisive après l'autre (p. 121).\n2. Par D19, elles biaisent les attentes et la performance (T037), l'évaluation et l'attribution d'aptitude (T038), et l'octroi d'influence (p. 121).\n3. Par D20, elles font tenir les avantagés pour plus légitimes en haut et sanctionnent la contestation, d'où le rejet de T042 (p. 121-122).\n4. Par D21, elles biaisent les associations, au profit des réseaux des groupes de haut statut, surtout dans les contextes instrumentaux, qui sont aussi ceux qui commandent l'accès aux biens valorisés (p. 122).\n5. Variables en force et même en direction, ces biais s'accumulent sur les situations et les vies, et créent un avantage systématique pour les groupes de haut statut (p. 123). ∎", "body_en": "## Demonstration\n\n1. Diffuse characteristics correspond to the axes of inequality; the beliefs attached to them shape how each person is evaluated in one consequential encounter after another (p. 121).\n2. By D19, they bias expectations and performance (T037), evaluation and attribution of ability (T038), and the granting of influence (p. 121).\n3. By D20, they make the advantaged seem more legitimate at the top and sanction challenges, hence the backlash of T042 (p. 121-122).\n4. By D21, they bias associations, in favour of the networks of high-status groups, especially in instrumental contexts, which are also those that control access to valued outcomes (p. 122).\n5. Varying in strength and even direction, these biases accumulate over situations and lifetimes, and create a systematic advantage for high-status groups (p. 123). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D19", "D20", "D21", "T037", "T038", "T042"], "sections": ["Démonstration"], "demo_refs": ["D19", "D20", "D21", "T037", "T038", "T042"], "mentions": ["D19", "D20", "D21", "T037", "T038", "T042"], "corollaires": [], "mtime": 1794591716.0796123}, {"id": "T045", "file": "theses/T045.md", "type": "these", "partie": "6", "titre": "Le statut est une cause de l'inégalité durable, non un vernis", "enonce": "Pour durer, l'inégalité matérielle doit être consolidée avec une différence catégorielle (Tilly). Mais l'exploitation et l'accaparement disent les buts plus que les processus : ce sont les processus de statut qui consolident la différence avec l'inégalité, accomplissent au quotidien exploitation et accaparement, et stabilisent l'ensemble en le légitimant.", "titre_en": "Status is a cause of durable inequality, not a gloss", "enonce_en": "To last, material inequality must be consolidated with a categorical difference (Tilly). But exploitation and hoarding describe goals more than processes: it is status processes that consolidate difference with inequality, accomplish exploitation and hoarding day to day, and stabilise the whole by legitimating it.", "citation": "", "pages": [126, 127], "depends_on": ["A10"], "contre": ["R09"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Argumentation\n\n1. Par A10, une inégalité fondée sur les seules différences individuelles est instable ; pour devenir durable, le contrôle des ressources doit être associé à des « types » de personnes, ce que précisément les croyances de statut ordonnent (p. 126).\n2. La thèse de Tilly convainc, mais ses mécanismes, exploitation et accaparement, disent les buts ou les effets de l'action des dominants plutôt que les processus par lesquels ils s'accomplissent (p. 126-127).\n3. Tilly voit dans l'idéologie un vernis après coup ; Ridgeway y voit une erreur (p. 127).\n4. Les processus de statut, par des croyances sur les groupes agissant dans les relations, consolident la différence avec l'inégalité, accomplissent au quotidien exploitation et accaparement, et, en légitimant, stabilisent l'inégalité et affaiblissent la résistance d'en bas (p. 127). ∎", "body_en": "## Argument\n\n1. By A10, inequality based on individual differences alone is unstable; to become durable, control over resources must be associated with \"types\" of people, which is precisely what status beliefs rank (p. 126).\n2. Tilly's thesis is persuasive, but its mechanisms, exploitation and hoarding, describe the goals or effects of dominant group actions rather than the processes through which they are accomplished (p. 126-127).\n3. Tilly sees ideology as an after-the-fact gloss; Ridgeway sees this as a mistake (p. 127).\n4. Status processes, through beliefs about groups acting in relations, consolidate difference with inequality, accomplish exploitation and hoarding day to day, and, by legitimating, stabilise inequality and undercut resistance from below (p. 127). ∎", "sections_en": ["Argument"], "demo_refs_en": ["A10"], "sections": ["Argumentation"], "demo_refs": ["A10"], "mentions": ["A10"], "corollaires": [], "mtime": 1794590968.431181}, {"id": "T046", "file": "theses/T046.md", "type": "these", "partie": "6", "titre": "Les croyances de statut consolident l'inégalité matérielle avec la différence", "enonce": "Quand une différence de groupe est corrélée à une inégalité de ressources, les rencontres entre groupes créent ou renforcent des croyances de statut partagées des deux côtés. Elles transforment l'avantage individuel en droit supérieur fondé sur l'identité de groupe : ce sont elles qui consolident la différence avec l'inégalité, et qui la stabilisent.", "titre_en": "Status beliefs consolidate material inequality with difference", "enonce_en": "When a group difference is correlated with inequality of resources, encounters between groups create or reinforce status beliefs shared on both sides. They transform individual advantage into a superior right based on group identity: it is they that consolidate difference with inequality, and stabilise it.", "citation": "“It is status beliefs, in other words, that really do the work of consolidating categorical group difference with inequality.”", "pages": [127, 128, 129], "depends_on": ["T045", "T028", "D30", "T004", "T029"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T045, un groupe qui veut stabiliser son contrôle des ressources (D30) s'appuie sur une frontière de différence, recrutée (genre, ethnie) ou créée (pratiques, styles de vie) ; elle n'agit qu'en créant ou en exploitant des croyances de statut ; c'est la face de T004 où la richesse produit le statut (p. 127).\n2. Par T028, quand une différence est corrélée aux ressources, les rencontres créent vite des croyances : le groupe riche paraît plus estimable et compétent, quoique moins chaleureux, aux yeux des deux groupes (p. 127-128).\n3. Ce processus a plausiblement joué pour le genre (T029), pour la race (techniques, esclavage) et pour la classe, fondée directement sur les ressources (p. 128).\n4. Le groupe riche paraissant meilleur, il semble mériter ses avantages ; l'avantage *individuel* devient droit fondé sur l'identité de *groupe* (p. 128-129).\n5. Ce sont donc les croyances de statut qui consolident la différence avec l'inégalité, et elles fournissent le moyen de la stabiliser (p. 129). ∎", "body_en": "## Demonstration\n\n1. By T045, a group seeking to stabilise its control of resources (D30) relies on a boundary of difference, recruited (gender, ethnicity) or created (practices, lifestyles); it works only by creating or exploiting status beliefs; this is the side of T004 where wealth produces status (p. 127).\n2. By T028, when a difference is correlated with resources, encounters quickly create beliefs: the richer group seems more worthy and competent, if less warm, in the eyes of both groups (p. 127-128).\n3. This process plausibly operated for gender (T029), for race (technology, slavery) and for class, based directly on resources (p. 128).\n4. Since the richer group seems better, it seems to deserve its advantages; *individual* advantage becomes a right based on *group* identity (p. 128-129).\n5. It is therefore status beliefs that consolidate difference with inequality, and they provide the means to stabilise it (p. 129). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D30", "T004", "T028", "T029", "T045"], "sections": ["Démonstration"], "demo_refs": ["D30", "T004", "T028", "T029", "T045"], "mentions": ["D30", "T004", "T028", "T029", "T045"], "corollaires": [], "mtime": 1794591716.0796123}, {"id": "T047", "file": "theses/T047.md", "type": "these", "partie": "6", "titre": "Le statut donne à l'inégalité de groupe le pouvoir de se reproduire", "enonce": "Quand une différence devient caractéristique de statut diffuse, elle donne à chacun, à ressources et pouvoir égaux, un avantage ou un désavantage propre dans l'accès aux ressources et au pouvoir futurs. Par les trois biais, accumulés et le plus souvent inaperçus, le statut est le moyen quotidien de l'exploitation et de l'accaparement, et donne à l'inégalité fondée sur la différence une capacité autonome de se reproduire.", "titre_en": "Status gives group inequality the power to reproduce itself", "enonce_en": "When a difference becomes a diffuse status characteristic, it gives each person, at equal resources and power, an advantage or disadvantage of its own in access to future resources and power. Through the three biases, accumulated and mostly unnoticed, status is the everyday means of exploitation and hoarding, and gives difference-based inequality an autonomous capacity to reproduce itself.", "citation": "", "pages": [129, 130, 131], "depends_on": ["T046", "T044", "E46"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T046, la croyance de statut consolide la différence avec l'inégalité ; ses effets quotidiens sont donc un élément essentiel de la durabilité de cette inégalité (p. 129).\n2. La différence devenue caractéristique diffuse donne, à ressources et pouvoir égaux, un avantage propre : l'homme ou le Blanc présumé un peu plus compétent obtient la plus forte augmentation ou le poste plus puissant (p. 129).\n3. Par T044, les trois biais orientent les avantagés vers les ressources et les postes de pouvoir ; c'est à la fois une extraction de valeur (exploitation) et un accaparement des opportunités (p. 130-131).\n4. Petits à chaque fois, ils s'accumulent : par E46, la discrimination raciale s'accumule au fil des étapes d'une transaction immobilière, et donne l'apparence du mérite (p. 131).\n5. Ces biais implicites passent sous le radar ; ils n'excluent pas l'action intentionnelle des dominants, mais lui donnent une base diffuse et puissante (p. 131). ∎", "body_en": "## Demonstration\n\n1. By T046, the status belief consolidates difference with inequality; its everyday effects are therefore an essential element of that inequality's durability (p. 129).\n2. The difference, become a diffuse characteristic, gives at equal resources and power an advantage of its own: the man or white person presumed slightly more competent gets the bigger raise or the more powerful position (p. 129).\n3. By T044, the three biases steer the advantaged towards resources and positions of power; this is at once an extraction of value (exploitation) and the hoarding of opportunity (p. 130-131).\n4. Small each time, they accumulate: by E46, racial discrimination accumulates over the stages of a real estate transaction, and gives the appearance of merit (p. 131).\n5. These implicit biases fly below the radar; they do not exclude dominant groups' intentional action, but give it a diffuse and powerful base (p. 131). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E46", "T044", "T046"], "sections": ["Démonstration"], "demo_refs": ["E46", "T044", "T046"], "mentions": ["E46", "T044", "T046"], "corollaires": [], "mtime": 1794590968.4326863}, {"id": "T048", "file": "theses/T048.md", "type": "these", "partie": "6", "titre": "Le statut s'inscrit dans les pratiques des organisations", "enonce": "Les procédures et les pratiques des organisations naissent dans des comités, des équipes et des interactions répétées, où les croyances de statut décident de qui est entendu et de qui est absent ; même entre semblables, on y inscrit les pratiques distinctives de son groupe. Les présupposés sur la supériorité de certains groupes s'inscrivent ainsi dans la structure même du travail, et y persistent par inertie.", "titre_en": "Status is written into organisational practices", "enonce_en": "Organisational procedures and practices arise in committees, teams and repeated interactions, where status beliefs decide who is heard and who is absent; even among similar people, members write in the distinctive practices of their group. Assumptions about some groups' superiority are thus written into the very structure of work, and persist there through inertia.", "citation": "", "pages": [131, 132, 133], "depends_on": ["T047", "E47"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T047, les croyances reproduisent l'inégalité par les interactions ; elles agissent aussi indirectement, au niveau des organisations (p. 131-132).\n2. Par E47, des présupposés sur les groupes dominants sont inscrits dans les structures, et ces pratiques persistent par inertie (p. 132).\n3. Ces structures naissent dans des comités et des équipes, ou par interactions répétées ; les croyances de statut y décident des voix entendues et des intérêts pris en compte, y compris de qui est absent (p. 132-133).\n4. Dans les groupes mêlés, la différence rend les croyances saillantes, comme dans la construction des grilles de classification des emplois (p. 133).\n5. Dans les groupes homogènes, l'identité partagée fait puiser dans les pratiques de son « type » de personnes (l'individualité dans une école d'élite, la « culture de mecs » dans un atelier masculin), qui portent le statut du groupe (p. 133). ∎", "body_en": "## Demonstration\n\n1. By T047, beliefs reproduce inequality through interactions; they also act indirectly, at the level of organisations (p. 131-132).\n2. By E47, assumptions about dominant groups are embedded in structures, and these practices persist through inertia (p. 132).\n3. These structures arise in committees and teams, or through repeated interactions; status beliefs there decide whose voices are heard and whose interests count, including who is absent (p. 132-133).\n4. In mixed groups, the difference makes beliefs salient, as in the construction of job classification systems (p. 133).\n5. In homogeneous groups, shared identity leads members to draw on the practices of their \"type\" of people (individuality at an elite school, an aggressive \"guy culture\" in a male workplace), which carry the group's status (p. 133). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E47", "T047"], "sections": ["Démonstration"], "demo_refs": ["E47", "T047"], "mentions": ["E47", "T047"], "corollaires": [], "mtime": 1794590968.4326863}, {"id": "T049", "file": "theses/T049.md", "type": "these", "partie": "6", "titre": "Les rencontres entre catégories sont les lieux décisifs", "enonce": "C'est dans les rencontres entre catégories que la différence de statut devient avantage matériel. Elles sont quotidiennes et intimes pour le genre, ce qui fait des processus de statut le premier moteur de l'inégalité entre hommes et femmes ; plus rares pour la race et la classe, elles ont lieu dans les institutions-portails, où elles décident de l'accès aux ressources.", "titre_en": "Cross-category encounters are the decisive sites", "enonce_en": "It is in cross-category encounters that status difference becomes material advantage. They are daily and intimate for gender, which makes status processes the main engine of inequality between men and women; rarer for race and class, they take place in gateway institutions, where they decide access to resources.", "citation": "", "pages": [133, 134, 135], "depends_on": ["T047", "D28"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T047, les biais traduisent la différence en avantage ; ils jouent surtout dans les rencontres entre catégories, où les caractéristiques sont saillantes (p. 133-134).\n2. Le genre est unique : interactions quotidiennes et intimes dans les ménages, deux groupes de taille égale, différence qui traverse toutes les autres ; les processus de statut y sont plausiblement le facteur le plus puissant de reproduction de l'inégalité, jusque dans la famille (p. 134).\n3. Les rencontres entre classes sont rares et instrumentales, la ségrégation résidentielle les limite ; la race se situe entre les deux, plus près de la classe (p. 134-135).\n4. Mais, par D28, les rencontres avec les institutions-portails sont, pour les membres des groupes de bas statut, des rencontres entre catégories ; ils y affrontent des présomptions d'incompétence aux moments qui décident de leur accès aux ressources (p. 135). ∎", "body_en": "## Demonstration\n\n1. By T047, the biases translate difference into advantage; they operate above all in cross-category encounters, where characteristics are salient (p. 133-134).\n2. Gender is unique: daily and intimate interactions in households, two groups of equal size, a difference that cuts across all others; status processes are plausibly the most powerful factor in reproducing inequality there, even within the family (p. 134).\n3. Cross-class encounters are rare and instrumental, limited by residential segregation; race lies in between, closer to class (p. 134-135).\n4. But, by D28, encounters with gateway institutions are cross-category for members of low-status groups; there they face presumptions of incompetence at the moments that decide their access to resources (p. 135). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D28", "T047"], "sections": ["Démonstration"], "demo_refs": ["D28", "T047"], "mentions": ["D28", "T047"], "corollaires": [], "mtime": 1794590968.4342024}, {"id": "T050", "file": "theses/T050.md", "type": "these", "partie": "6", "titre": "Genre et race, essentialisés, sont toujours à l'œuvre", "enonce": "Le genre et la race sont culturellement essentialisés : une fois catégorisé, on le reste dans toute la relation, si bien que leurs processus de statut sont toujours en cours. Acquérir la culture du groupe dominant ne suffit donc pas à y être admis.", "titre_en": "Gender and race, essentialised, are always at work", "enonce_en": "Gender and race are culturally essentialised: once categorised, one remains so throughout the relationship, so that their status processes are always going on. Acquiring the culture of the dominant group is therefore not enough to be accepted in it.", "citation": "", "pages": [136, 137, 138, 139, 140], "depends_on": ["D29", "E48", "E49", "T036"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D29, les différences vont d'essences supposées à des cultures acquises ; ce qui compte est la croyance culturelle de troisième ordre (p. 136).\n2. Le genre, différence interne à la famille, est le plus essentialisé, rattaché au corps, même si la visibilité des identités trans et queer ouvre d'autres possibilités ; des savoir-faire acquis s'y ajoutent, sans entamer les présupposés sur l'agentivité masculine (p. 137).\n3. La race est aussi essentialisée ; étant une différence entre groupes, elle s'accompagne en plus de marqueurs culturels ; par E48, compétence et étrangeté culturelle hiérarchisent les groupes raciaux (p. 137-138).\n4. Une différence essentialisée ne quitte jamais la relation ; par T036, elle cadre donc toujours les attentes : genre et race sont des catégories primaires, et leurs processus de statut toujours en cours, ce qui contribue à la durabilité de l'inégalité (p. 138-139).\n5. On ne peut donc s'intégrer en apprenant la culture dominante : par E49, les femmes restaient exclues même en cultivant le sport ; les Afro-Américains sont jugés plus sévèrement pour leurs erreurs ; les Asiatiques américains restent traités en « étrangers » (p. 139-140). ∎", "body_en": "## Demonstration\n\n1. By D29, differences range from supposed essences to acquired cultures; what matters is the third-order cultural belief (p. 136).\n2. Gender, a difference within the family, is the most essentialised, tied to the body, even if the visibility of trans and gender-queer identities opens other possibilities; acquired skills are added, without touching presumptions of male agency (p. 137).\n3. Race is also essentialised; being a difference between groups, it is further accompanied by cultural markers; by E48, competence and cultural foreignness rank racial groups (p. 137-138).\n4. An essentialised difference never leaves the relationship; by T036, it therefore always frames expectations: gender and race are primary categories, and their status processes always going on, which contributes to the durability of inequality (p. 138-139).\n5. One therefore cannot fit in by learning the dominant culture: by E49, women remained excluded even when cultivating sport; African Americans are judged more harshly for mistakes; Asian Americans are still treated as \"foreign\" (p. 139-140). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D29", "E48", "E49", "T036"], "sections": ["Démonstration"], "demo_refs": ["D29", "E48", "E49", "T036"], "mentions": ["D29", "E48", "E49", "T036"], "corollaires": [], "mtime": 1794591716.0806198}, {"id": "T051", "file": "theses/T051.md", "type": "these", "partie": "6", "titre": "La classe se maintient par un capital culturel exclusif", "enonce": "Les Américains croient la classe acquise plutôt qu'essentielle, et ses indices forment un ensemble flou, variable selon les contextes. La frontière de classe repose donc sur la possession par le haut d'un capital culturel exclusif, qui doit sans cesse changer à mesure que le bas en acquiert les formes anciennes.", "titre_en": "Class is maintained through exclusive cultural capital", "enonce_en": "Americans believe class to be achieved rather than essential, and its cues form a fuzzy set, varying across contexts. The class boundary therefore rests on the upper group's possession of exclusive cultural capital, which must keep changing as lower groups acquire its earlier forms.", "citation": "", "pages": [140], "depends_on": ["D29", "D31", "E50", "T050"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par E50, la classe passe pour acquise et changeante, quoique l'habitus l'inscrive aussi dans les corps, et ses indices forment un ensemble flou (p. 140).\n2. Par D29, et à la différence du genre et de la race (T050), une différence moins essentialisée offre une frontière moins ferme ; ses effets varient davantage d'un contexte à l'autre et se combinent à ceux de la race et du genre (p. 140).\n3. Par D31, la frontière de classe tient donc à un capital culturel *exclusif* ; pour rester élitaire, il doit changer à mesure qu'on l'acquiert en bas : ainsi le savoir d'initié sur ce qu'attendent les jurys d'admission des universités d'élite (p. 140). ∎", "body_en": "## Demonstration\n\n1. By E50, class passes for achieved and changeable, although habitus also writes it on bodies, and its cues form a fuzzy set (p. 140).\n2. By D29, and unlike gender and race (T050), a less essentialised difference offers a less firm boundary; its effects vary more across contexts and interact with those of race and gender (p. 140).\n3. By D31, the class boundary therefore depends on *exclusive* cultural capital; to remain elite, it must change as lower groups acquire it: thus the inside knowledge of what impresses admissions committees at elite colleges (p. 140). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D29", "D31", "E50", "T050"], "sections": ["Démonstration"], "demo_refs": ["D29", "D31", "E50", "T050"], "mentions": ["D29", "D31", "E50", "T050"], "corollaires": [], "mtime": 1794591743.573761}, {"id": "T052", "file": "theses/T052.md", "type": "these", "partie": "6", "titre": "Croyances et inégalité se soutiennent ; on les change en sapant leur consensus", "enonce": "L'inégalité matérielle fournit aux croyances de statut les preuves dont elles ont besoin pour durer : la relation est réciproque. Les croyances changent quand leur apparence de consensus s'érode : des changements matériels et des mouvements sociaux multiplient les rencontres qui les démentent, jusqu'à une ignorance plurielle fragile. Souvent, elles ne changent que lentement et partiellement.", "titre_en": "Beliefs and inequality sustain each other; they change by eroding consensus", "enonce_en": "Material inequality supplies status beliefs with the evidence they need to last: the relationship is reciprocal. Beliefs change when their appearance of consensus erodes: material changes and social movements multiply disconfirming encounters, up to a fragile pluralistic ignorance. Often they change only slowly and partially.", "citation": "", "pages": [141, 142, 143], "depends_on": ["T046", "D10", "E51", "T027"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T046, la consolidation offre la preuve quotidienne que certains types de personnes sont plus riches et « meilleurs » (p. 141).\n2. Par T027, les croyances se valident déjà par les hiérarchies qu'elles produisent ; mais elles durent mal sans preuve *matérielle* : « si tu es si malin, pourquoi n'es-tu pas riche ? » ; la relation est donc réciproque (p. 141-142).\n3. On ne change donc pas durablement l'inégalité sans changer les croyances ; or elles ont changé : les Irlandais et les Italiens, jadis de bas statut, ne le sont plus (p. 142).\n4. Par D10, une croyance agit tant qu'elle paraît partagée par « la plupart » ; ceux qui agissent selon elle en donnent l'apparence, si bien que les croyances retardent sur les changements matériels (p. 142).\n5. Changements économiques ou techniques et mouvements sociaux multiplient les rencontres qui démentent la croyance ; l'adhésion personnelle recule, jusqu'à une ignorance plurielle fragile qui peut s'effondrer (p. 142-143).\n6. Plus souvent, le changement est modeste : par E51, les croyances de genre ont peu bougé, faute de changement dans les charges familiales (p. 143). ∎", "body_en": "## Demonstration\n\n1. By T046, consolidation offers everyday evidence that some types of people are richer and \"better\" (p. 141).\n2. By T027, beliefs already validate themselves through the hierarchies they produce; but they last poorly without *material* evidence: \"if you are so smart, why aren't you rich?\"; the relationship is therefore reciprocal (p. 141-142).\n3. Inequality therefore cannot be durably changed without changing beliefs; and beliefs have changed: the Irish and Italians, once low status, no longer are (p. 142).\n4. By D10, a belief acts as long as it seems held by \"most people\"; those who act on it give that appearance, so that beliefs lag behind material changes (p. 142).\n5. Economic or technological changes and social movements multiply encounters that disconfirm the belief; personal endorsement declines, up to a fragile pluralistic ignorance that may collapse (p. 142-143).\n6. More often, change is modest: by E51, gender beliefs have moved little, for want of change in family responsibilities (p. 143). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D10", "E51", "T027", "T046"], "sections": ["Démonstration"], "demo_refs": ["D10", "E51", "T027", "T046"], "mentions": ["D10", "E51", "T027", "T046"], "corollaires": [], "mtime": 1794591716.0811305}, {"id": "T053", "file": "theses/T053.md", "type": "these", "partie": "6", "titre": "Les croyances de statut légitiment l'inégalité par le mérite", "enonce": "Les rencontres quotidiennes où les membres des groupes de haut statut paraissent plus compétents donnent à tous la leçon de leur supériorité : ils semblent avoir mérité leurs avantages. Les croyances de statut sont l'idéologie légitimante qui stabilise l'inégalité ; même ceux qu'elles désavantagent ont intérêt à les accepter pour se coordonner, et elles émoussent leur résistance.", "titre_en": "Status beliefs legitimate inequality through merit", "enonce_en": "Everyday encounters in which members of high-status groups seem more competent teach everyone the lesson of their superiority: they seem to have earned their advantages. Status beliefs are the legitimating ideology that stabilises inequality; even those they disadvantage have an interest in accepting them in order to coordinate, and they blunt their resistance.", "citation": "", "pages": [143, 144, 145], "depends_on": ["A12", "E52", "A16", "T020", "T046"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Les rencontres répétées où hommes, Blancs et classes moyennes ou supérieures paraissent plus compétents donnent à tous la leçon de leur supériorité, d'où l'idée qu'ils ont mérité leurs avantages (p. 143).\n2. Par A12, sans idéologie légitimante la consolidation de T046 déplacerait la lutte au niveau des groupes ; les croyances de statut jouent ce rôle, justifient l'action des dominants et surtout émoussent la résistance des dominés (p. 143-144).\n3. Par E52, les groupes défavorisés tiennent les mêmes croyances de troisième ordre, même s'ils les endossent moins ; dans un monde où la plupart les tiennent, ils ont un intérêt, morne mais inévitable, à les accepter pour se coordonner (p. 144).\n4. Par T020, les compensations offertes au bas statut, comme la chaleur qu'on lui prête, apaisent encore la résistance (p. 144).\n5. On résiste parfois, du serveur glacial aux mouvements comme Black Lives Matter ; mais le plus souvent on « suit pour avancer », ce qui réduit l'incertitude ; par A16, accepter les croyances rend la structure intelligible (p. 144-145). ∎", "body_en": "## Demonstration\n\n1. Repeated encounters in which men, whites and middle- or upper-class people seem more competent teach everyone the lesson of their superiority, hence the idea that they have earned their advantages (p. 143).\n2. By A12, without a legitimating ideology the consolidation of T046 would move the scramble to the group level; status beliefs play that role, justify the actions of the dominant and above all blunt the resistance of the dominated (p. 143-144).\n3. By E52, disadvantaged groups hold the same third-order beliefs, even if they endorse them less; in a world where most hold them, they have an interest, dreary but unavoidable, in accepting them in order to coordinate (p. 144).\n4. By T020, the compensations offered to low status, such as the warmth attributed to it, further placate resistance (p. 144).\n5. People sometimes resist, from the frosty waiter to movements like Black Lives Matter; but most often they find themselves \"going along to get along\", which reduces uncertainty; by A16, accepting the beliefs makes the structure intelligible (p. 144-145). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A12", "A16", "E52", "T020", "T046"], "sections": ["Démonstration"], "demo_refs": ["A12", "A16", "E52", "T020", "T046"], "mentions": ["A12", "A16", "E52", "T020", "T046"], "corollaires": [], "mtime": 1794591730.7545483}, {"id": "T054", "file": "theses/T054.md", "type": "these", "partie": "6", "titre": "Le sentiment de position de groupe défend la hiérarchie et divise le bas", "enonce": "Les croyances de statut donnent à chacun un sentiment de la position de son groupe, vécue comme personnelle. Les groupes intermédiaires, avantagés sur un plan et désavantagés sur un autre, défendent avec force leur rang menacé ; les groupes de bas statut, tentés par la dignité offerte à la déférence, sont détournés de l'action collective. Ainsi le statut protège la structure de l'inégalité.", "titre_en": "The sense of group position defends the hierarchy and divides those below", "enonce_en": "Status beliefs give each person a sense of their group's position, felt as personal. Intermediate groups, advantaged on one dimension and disadvantaged on another, strongly defend their threatened rank; low-status groups, tempted by the dignity offered for deference, are diverted from collective action. Thus status protects the structure of inequality.", "citation": "", "pages": [145, 146, 147], "depends_on": ["A11", "E53", "E17", "T053", "T017", "T042", "T020"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par A11, les croyances largement acceptées créent un « sentiment de position de groupe », qui affecte l'estime de soi et la dignité reconnue ; on vit comme personnel le traitement de son groupe (p. 145).\n2. Comme pour les menaces de T017, ce sentiment fait réagir aux changements qui menacent l'avantage du groupe : par E53, des Blancs s'inquiètent devant les politiques de diversité ; par E17, la menace nourrit l'opposition aux aides sociales et le populisme de droite (p. 145-146).\n3. Ce ne sont pas les groupes les plus hauts qui réagissent ainsi, protégés par de multiples avantages et par le contrôle des institutions, mais ceux qui sont avantagés sur un plan et non sur un autre, comme les Louisianais de Hochschild (p. 146-147).\n4. Cette défense est l'effet collectif de la même réaction qui produit le biais de légitimité et le rejet (T042). Les groupes de bas statut savent où ils se tiennent ; mais la chaleur prêtée et la dignité offerte à la déférence (T020) les tentent et sapent l'action collective, ce qui prolonge la légitimation de T053 : on « suit pour avancer » (p. 147).\n5. Le statut motive donc la défense de la structure par les groupes moyens et hauts et dilue les motifs de changement en bas (p. 147). ∎", "body_en": "## Demonstration\n\n1. By A11, widely accepted beliefs create a \"sense of group position\", which affects self-esteem and acknowledged dignity; people experience their group's treatment as personal (p. 145).\n2. As with the threats of T017, this sense makes people react to changes that threaten their group's advantage: by E53, whites worry about diversity policies; by E17, the threat fuels opposition to welfare and right-wing populism (p. 145-146).\n3. It is not the highest groups that react this way, protected by multiple advantages and control of institutions, but those advantaged on one dimension and not another, like Hochschild's Louisianans (p. 146-147).\n4. This defence is the collective effect of the same response that produces legitimacy bias and backlash (T042). Low-status groups know where they stand; but the warmth attributed and the dignity offered for deference (T020) tempt them and undercut collective action, which extends the legitimation of T053: they \"go along in order to get ahead\" (p. 147).\n5. Status therefore motivates defence of the structure by middle and higher groups and dilutes the motives for change below (p. 147). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A11", "E17", "E53", "T017", "T020", "T042", "T053"], "sections": ["Démonstration"], "demo_refs": ["A11", "E17", "E53", "T017", "T020", "T042", "T053"], "mentions": ["A11", "E17", "E53", "T017", "T020", "T042", "T053"], "corollaires": [], "mtime": 1794591952.7551334}, {"id": "T055", "file": "theses/T055.md", "type": "these", "partie": "6", "titre": "Le déni du statut", "enonce": "Les croyances de statut créent un avantage de groupe tout en le logeant dans les attributs personnels des membres. L'idéologie américaine de l'accomplissement rend donc à la fois très attentif aux signes de statut et rétif à reconnaître ses effets : les reconnaître, ce serait admettre que le système n'est pas juste. Le statut joue ainsi un rôle puissant et invisible.", "titre_en": "The denial of status", "enonce_en": "Status beliefs create a group advantage while locating it in members' personal attributes. The American ideology of achievement therefore makes people both highly attentive to signs of status and resistant to acknowledging its effects: acknowledging them would mean admitting the system is not fair. Status thus plays a powerful and invisible role.", "citation": "", "pages": [147, 148, 149], "depends_on": ["T053", "E54"], "contre": ["R12"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T053, les croyances légitiment par le mérite ; or elles logent la différence non dans le groupe mais dans les attributs personnels de ses membres, et masquent ainsi l'avantage de groupe qu'elles créent (p. 147).\n2. L'idéologie de l'accomplissement individuel est fondatrice aux États-Unis ; elle rend attentif aux signes de capacité, qui sont ceux des croyances de statut, et fait accepter même une croyance désavantageuse, qui situe l'échec dans ses propres capacités (p. 147-148).\n3. Reconnaître les biais, c'est voir le système injuste : pour le haut statut, qu'on n'a pas mérité ; pour le bas, qu'on a été discriminé ; par E54, les deux sont d
