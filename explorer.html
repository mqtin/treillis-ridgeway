l : les dominants contrôlent au lieu de produire, et les dominés ont intérêt à fuir ou à renverser. La dominance existe, mais son exercice occasionnel n'en fait pas le fondement ordinaire des hiérarchies d'influence et de déférence.", "titre_en": "Dominance is not the foundation of status hierarchies", "enonce_en": "A dominance hierarchy can organise collective production, but poorly: the dominant control instead of producing, and the dominated have an interest in fleeing or overthrowing. Dominance exists, but its occasional exercise does not make it the ordinary foundation of hierarchies of influence and deference.", "citation": "", "pages": [23, 24, 25, 26], "depends_on": ["D25"], "contre": ["R03"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Argumentation\n\n1. Par D25, une hiérarchie de dominance répartit des ressources existantes avec un minimum de combats, et peut être aussi efficace qu'une hiérarchie de statut pour cette répartition (p. 23).\n2. Mais le contexte du statut est la production de nouveaux biens par un but commun. Une hiérarchie de dominance y organise l'exploitation : les dominants forcent les autres à travailler et prennent la plus grosse part (p. 23-24).\n3. Elle est inefficace, car elle n'emploie pas les dominants à l'effort productif, et instable, car fondée sur la peur : les dominés ont intérêt à partir ou à s'organiser contre le dominateur (p. 24).\n4. Certes, des gestes agressifs intimident parfois, même au travail, et il est raisonnable de supposer un répertoire évolué de déférence à la dominance (p. 24-25).\n5. Mais l'exercice occasionnel de la dominance ne fait pas d'elle le fondement typique des hiérarchies de statut ; et même les arguments évolutionnistes ne la tiennent plus pour la base unique ou principale (p. 25-26). ∎\n\n## Scolie\n\nRidgeway cite la scène du débat présidentiel de 2016 où Donald Trump s'avance derrière Hillary Clinton et la surplombe pendant qu'elle parle (p. 24).", "body_en": "## Argument\n\n1. By D25, a dominance hierarchy distributes existing resources with a minimum of fighting, and may be as efficient as a status hierarchy for that distribution (p. 23).\n2. But the context of status is the production of new goods through a shared goal. A dominance hierarchy organises exploitation there: the dominant force the others to work and take the largest share (p. 23-24).\n3. It is inefficient, since it does not employ the dominant in the productive effort, and unstable, since it rests on fear: the dominated have an interest in leaving or organising against the dominator (p. 24).\n4. Admittedly, aggressive gestures sometimes intimidate, even at work, and it is reasonable to assume an evolved repertoire of deference to dominance (p. 24-25).\n5. But the occasional exercise of dominance does not make it the typical foundation of status hierarchies; and even evolutionary arguments no longer favour it as the sole or primary basis (p. 25-26). ∎\n\n## Scholium\n\nRidgeway cites the scene from the 2016 presidential debates in which Donald Trump walked up behind Hillary Clinton and loomed over her as she spoke (p. 24).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D25"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D25"], "mentions": ["D25"], "corollaires": [], "mtime": 1794590968.4029908}, {"id": "T006", "file": "theses/T006.md", "type": "these", "partie": "2", "titre": "Le statut va au-delà du prestige", "enonce": "Les hiérarchies de statut ressemblent davantage au prestige qu'à la dominance, mais le statut récompense la capacité de contribuer au but du groupe, non la seule information utile à l'individu qui défère : il y entre un élément d'affirmation (l'effort agentique) et une orientation collective que le modèle du prestige ignore.", "titre_en": "Status goes beyond prestige", "enonce_en": "Status hierarchies resemble prestige more than dominance, but status rewards the capacity to contribute to the group's goal, not merely information useful to the deferring individual: it involves an assertive element (agentic effort) and a collective orientation that the prestige model ignores.", "citation": "", "pages": [25, 26, 27], "depends_on": ["D26", "D07", "D08", "E02"], "contre": ["R04"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Argumentation\n\n1. Par D26, le prestige est accordé librement en échange d'une valeur perçue, ce qui le rapproche du statut (p. 25-26).\n2. Mais la valeur, dans le prestige, est informationnelle pour l'individu qui défère, et peut ne rien apporter au but du groupe (p. 26).\n3. Or, par E02, ce que les groupes récompensent est la capacité de contribuer au but commun : par D07, savoir-faire et effort agentique, et par D08, motivation tournée vers le groupe (p. 26-27).\n4. Les hiérarchies observées sont donc plus proches du prestige que de la dominance, mais comportent un élément d'affirmation et une orientation collective absents du pur prestige (p. 27).\n5. L'importance de l'agentivité suggère comment des règles culturelles peuvent gérer les tendances à la dominance : en incitant à rediriger l'énergie vers des efforts proactifs au service de la tâche (p. 27). ∎", "body_en": "## Argument\n\n1. By D26, prestige is freely granted in exchange for perceived value, which brings it close to status (p. 25-26).\n2. But value, in prestige, is informational value to the deferring individual, and may contribute nothing to the group's goal (p. 26).\n3. Yet, by E02, what groups reward is the capacity to contribute to the shared goal: by D07, skills and agentic effort, and by D08, group-oriented motivation (p. 26-27).\n4. Observed hierarchies are therefore closer to prestige than to dominance, but they involve an assertive element and a collective orientation missing from pure prestige (p. 27).\n5. The importance of agency suggests how cultural rules can manage dominance tendencies: by incentivising people to redirect their energy into proactive efforts in service of the task (p. 27). ∎", "sections_en": ["Argument"], "demo_refs_en": ["D07", "D08", "D26", "E02"], "sections": ["Argumentation"], "demo_refs": ["D07", "D08", "D26", "E02"], "mentions": ["D07", "D08", "D26", "E02"], "corollaires": [], "mtime": 1794590968.4029908}, {"id": "T007", "file": "theses/T007.md", "type": "these", "partie": "2", "titre": "À trois ou plus, la hiérarchie est contingente", "enonce": "Dans un groupe de trois ou plus, la hiérarchie n'est pas la somme des relations deux à deux : sa formation comporte une incertitude contingente qui dépend des réactions des tiers. Cette incertitude ouvre un espace où des normes culturelles de formation de la hiérarchie peuvent naître.", "titre_en": "With three or more, hierarchy is contingent", "enonce_en": "In a group of three or more, the hierarchy is not the sum of pairwise relations: its formation involves a contingent uncertainty that depends on third parties' reactions. This uncertainty opens a space in which cultural norms of hierarchy formation can emerge.", "citation": "“a critical organizational space”", "pages": [27, 28, 29], "depends_on": ["E03", "T005", "T006"], "contre": ["R05"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T005 et T006, ni la dominance ni le prestige n'expliquent les hiérarchies de statut, car ces théories portent sur le rang entre deux individus ; or les situations de statut réunissent le plus souvent trois personnes ou plus (p. 27-28).\n2. Par E03, même chez des animaux simples, les différences individuelles prédisent le rang sans le déterminer : la formation de la hiérarchie dépend de processus contingents à plusieurs (p. 28-29).\n3. Dans un groupe, la déférence réflexe d'une personne à une autre peut changer, et ses conséquences dépendre des réactions des autres membres (p. 29).\n4. Cette sensibilité aux dynamiques du groupe crée un « espace organisationnel » où des normes peuvent émerger, que les humains aient ou non des réflexes évolués de déférence ; la clé est la réaction des tiers témoins (p. 29). ∎", "body_en": "## Demonstration\n\n1. By T005 and T006, neither dominance nor prestige explains status hierarchies, since these theories deal with rank between two individuals; yet status situations most often involve three or more people (p. 27-28).\n2. By E03, even among simple animals, individual differences predict rank without determining it: hierarchy formation depends on contingent processes among several individuals (p. 28-29).\n3. In a group, one person's reflexive deference to another may change, and its consequences depend on the reactions of other members (p. 29).\n4. This sensitivity to group dynamics creates an \"organizational space\" in which norms can emerge, whether or not humans have evolved deference reflexes; the key is the reaction of bystanding third parties (p. 29). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E03", "T005", "T006"], "sections": ["Démonstration"], "demo_refs": ["E03", "T005", "T006"], "mentions": ["E03", "T005", "T006"], "corollaires": [], "mtime": 1794591952.7540708}, {"id": "T008", "file": "theses/T008.md", "type": "these", "partie": "2", "titre": "Chacun a intérêt à ce que les autres défèrent à la compétence", "enonce": "L'interdépendance pour un but donne à chacun des intérêts contradictoires pour son propre statut, mais un intérêt clair et non disputé à ce que les *autres* accordent le statut selon la capacité perçue. Chacun pousse donc les autres à déférer à la compétence perçue, ce qui crée une pression collective et, comme les intérêts d'échange interdépendants, une norme.", "titre_en": "Each has an interest in others deferring to competence", "enonce_en": "Interdependence for a goal gives each member conflicting interests regarding their own status, but a clear and uncontested interest in *others* granting status according to perceived capacity. Each therefore pressures the others to defer to perceived competence, which creates collective pressure and, as with interdependent exchange interests, a norm.", "citation": "", "pages": [29, 30], "depends_on": ["D03", "T007", "E04"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D03, chacun a un intérêt rationnel à déférer à la compétence, qui augmente le gain commun, et un intérêt compétitif à diriger quoi qu'il vaille (p. 29-30).\n2. Mais l'interdépendance donne aussi à chacun un intérêt à la déférence des *autres* : que le statut des autres suive la capacité perçue augmente le gain qu'il partagera, quoi qu'il veuille pour lui-même (p. 30).\n3. S'il juge un membre plus compétent qu'un autre, il pressera le second de déférer au premier ; et tous les autres ont le même intérêt envers lui (p. 30).\n4. Par E04, de tels intérêts d'échange interdépendants conduisent les membres à former des normes qu'ils font respecter (p. 30).\n5. Il en résulte une pression collective sur chacun de déférer à la capacité perçue : une force sociale qui, dans l'espace ouvert par T007, fait pencher la dynamique vers un système normatif (p. 30). ∎\n\n## Scolie\n\nSi je pense qu'un autre membre a de bien meilleures idées que toi, « je veux que tu te taises et que tu laisses parler celui qui a les bonnes idées » : l'exemple est de Ridgeway (p. 30).", "body_en": "## Demonstration\n\n1. By D03, each has a rational interest in deferring to competence, which increases the common gain, and a competitive interest in being in charge regardless of competence (p. 29-30).\n2. But interdependence also gives each an interest in *others'* deference: that others' status follow perceived capacity increases the gain they will share, whatever they want for themselves (p. 30).\n3. If one judges a member more competent than another, one will press the second to defer to the first; and all the others have the same interest towards oneself (p. 30).\n4. By E04, such interdependent exchange interests lead members to form norms that they enforce (p. 30).\n5. The result is collective pressure on each to defer to perceived capacity: a social force which, in the space opened by T007, tips the dynamics towards a normative system (p. 30). ∎\n\n## Scholium\n\nIf I think another member has much better ideas than you, \"then I want you to be quiet and let the person with the good ideas talk\": the example is Ridgeway's (p. 30).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D03", "E04", "T007"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D03", "E04", "T007"], "mentions": ["D03", "E04", "T007"], "corollaires": [], "mtime": 1794591047.051649}, {"id": "T009", "file": "theses/T009.md", "type": "these", "partie": "2", "titre": "Les tiers bornent la dominance ; une norme se révèle", "enonce": "Les témoins d'une attaque de dominance qu'aucune compétence ne justifie se liguent avec la victime contre le dominateur, qui n'obtient pas d'influence. Même les personnalités dominantes n'obtiennent le statut qu'en paraissant compétentes. Ces coalitions révèlent une norme qui fait de la capacité perçue, non de la dominance, la base légitime du rang.", "titre_en": "Third parties constrain dominance; a norm is revealed", "enonce_en": "Witnesses of a dominance attack that no competence justifies side with the victim against the dominator, who gains no influence. Even dominant personalities gain status only by appearing competent. These coalitions reveal a norm that makes perceived capacity, not dominance, the legitimate basis of rank.", "citation": "", "pages": [30, 31, 32, 33, 34], "depends_on": ["T008", "E05", "E06", "E07", "E08", "A06"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T008, chaque membre a intérêt à ce que nul ne prenne le contrôle sans compétence ; les tiers, moins menacés que la victime, ont intérêt à intervenir (p. 30-31).\n2. Ils forment donc une coalition avec la victime ; un dominateur, même imposant, est seul face au nombre, et sa menace perd en crédibilité (p. 31).\n3. Par E05, c'est ce qu'on observe : les témoins attaquent l'attaquant, qui finit moins influent qu'un membre neutre ; par E06, de telles contraintes se retrouvent dans de nombreuses sociétés (p. 31-32).\n4. Par A06, une norme est la voix de la coalition qui se dresserait contre qui la viole : ces coalitions révèlent une norme émergente qui fait de la capacité perçue la base du rang (p. 32).\n5. Par E07, même les personnalités dominantes n'obtiennent le statut qu'en convainquant de leur compétence ; par E08, l'affirmation non menaçante passe pour de la compétence, la menace non (p. 33).\n6. Le désir de dominer peut ainsi être incorporé à un système normatif qui échange le statut contre la capacité perçue (p. 33-34). ∎", "body_en": "## Demonstration\n\n1. By T008, each member has an interest in no one taking control without competence; third parties, less threatened than the victim, have an interest in intervening (p. 30-31).\n2. They therefore form a coalition with the victim; a dominator, however imposing, is alone against the many, and the threat loses credibility (p. 31).\n3. By E05, this is what is observed: witnesses attack the attacker, who ends up less influential than a neutral member; by E06, such constraints are found in many societies (p. 31-32).\n4. By A06, a norm is the voice of the coalition that would stand against whoever violates it: these coalitions reveal an emergent norm making perceived capacity the basis of rank (p. 32).\n5. By E07, even dominant personalities gain status only by convincing others of their competence; by E08, non-threatening assertiveness passes for competence, threat does not (p. 33).\n6. The desire for dominance can thus be incorporated into a normative system that exchanges status for perceived capacity (p. 33-34). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A06", "E05", "E06", "E07", "E08", "T008"], "sections": ["Démonstration"], "demo_refs": ["A06", "E05", "E06", "E07", "E08", "T008"], "mentions": ["A06", "E05", "E06", "E07", "E08", "T008"], "corollaires": [], "mtime": 1794590968.405068}, {"id": "T010", "file": "theses/T010.md", "type": "these", "partie": "2", "titre": "La norme repose sur un savoir commun", "enonce": "Défier un dominateur est risqué sans l'assurance d'être soutenu ; on ne le fait que parce qu'on tient pour un savoir commun que le statut doit se gagner par la compétence. Une telle norme a pu naître spontanément, par co-orientation et validation sociale, puis se répandre, sans que personne en voie la fonction.", "titre_en": "The norm rests on common knowledge", "enonce_en": "Challenging a dominator is risky without assurance of support; people do it only because they take it as common knowledge that status should be earned through competence. Such a norm could arise spontaneously, through co-orientation and social validation, then spread, without anyone seeing its function.", "citation": "", "pages": [34, 35, 36, 37], "depends_on": ["T009", "D11", "A07"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Dans l'expérience de T009, attaquer le dominateur comportait un risque ; il fallait supposer qu'on ne serait pas seul (p. 34-35).\n2. Les participants tenaient sans doute pour acquis une norme implicite, supposée partagée : le statut se gagne par la compétence perçue (p. 35).\n3. Par D11 et A07, un tel savoir commun résout le problème de coordination : chacun anticipe la réaction des autres et agit avec assurance (p. 35).\n4. Sans norme préalable, la co-orientation vers un même but fait présumer que les autres voient leur intérêt de la même façon ; une pression publique que nul ne conteste paraît alors socialement valide, donc implicitement normative (p. 36).\n5. Par un tel processus, des normes peuvent être inventées spontanément, apprises par la manière dont on est traité et se répandre, d'autant qu'elles aident à se coordonner ; la norme est un sous-produit non voulu (p. 36-37). ∎", "body_en": "## Demonstration\n\n1. In the experiment of T009, attacking the dominator carried a risk; one had to assume one would not stand alone (p. 34-35).\n2. Participants probably took for granted an implicit norm, assumed to be shared: status is earned through perceived competence (p. 35).\n3. By D11 and A07, such common knowledge solves the coordination problem: each anticipates the others' reactions and acts with assurance (p. 35).\n4. Without a prior norm, co-orientation to the same goal makes members presume that others see their interest the same way; public pressure that no one challenges then seems socially valid, hence implicitly normative (p. 36).\n5. Through such a process, norms can be spontaneously invented, learned by being treated according to them, and spread, all the more since they help coordination; the norm is an unintended by-product (p. 36-37). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A07", "D11", "T009"], "sections": ["Démonstration"], "demo_refs": ["A07", "D11", "T009"], "mentions": ["A07", "D11", "T009"], "corollaires": [], "mtime": 1794590968.4060748}, {"id": "T011", "file": "theses/T011.md", "type": "these", "partie": "2", "titre": "Le schème du statut est double", "enonce": "La norme fondamentale (déférer à la compétence perçue) pose un second problème de coordination : savoir ce que les *autres* tiendront pour signe de compétence. On le résout par des croyances de statut partagées. Norme et croyances forment un schème double, grammaire et vocabulaire, qui permet de former des hiérarchies en temps réel, au prix de leur exactitude.", "titre_en": "The status schema is twofold", "enonce_en": "The basic norm (defer to perceived competence) poses a second coordination problem: knowing what *others* will take as a sign of competence. It is solved by shared status beliefs. Norm and beliefs form a twofold schema, grammar and vocabulary, which allows hierarchies to form in real time, at the cost of their accuracy.", "citation": "“Status beliefs are the changing social vocabulary through which people enact the grammar of the basic status norm”", "pages": [37, 38, 39], "depends_on": ["T010", "D05", "D06"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T010, une norme naît de la coordination ; par D05, c'est la norme fondamentale : déférence et statut en proportion de la compétence perçue (p. 37).\n2. Elle place chacun dans une toile d'attentes : les autres attendent de lui qu'il défère à une compétence supérieure ; il lui importe donc plus de savoir ce que les *autres* tiennent pour compétence que d'en juger seul (p. 37-38).\n3. C'est un second problème de coordination, que l'on résout par des croyances de statut partagées (D06) sur les attributs et conduites qui signalent la compétence ; elles sont plus descriptives que normatives et répandues aux États-Unis (p. 38).\n4. Le schème est donc double : une norme implicite et profonde, grammaire des relations de statut, et des croyances explicites et changeantes, leur vocabulaire (p. 38).\n5. Cette combinaison permet de former des hiérarchies dans le temps réel de l'interaction ; mais leur exactitude dépend de la validité des croyances, et les apparences de compétence se manipulent (p. 38-39). ∎", "body_en": "## Demonstration\n\n1. By T010, a norm arises from coordination; by D05, it is the basic norm: deference and status in proportion to perceived competence (p. 37).\n2. It places each member in a web of expectations: others expect them to defer to greater competence; it therefore matters more to them to know what *others* take as competence than to judge alone (p. 37-38).\n3. This is a second coordination problem, solved through shared status beliefs (D06) about the attributes and behaviours that signal competence; they are more descriptive than normative and widespread in the United States (p. 38).\n4. The schema is therefore twofold: an implicit, deep norm, the grammar of status relations, and explicit, changing beliefs, their vocabulary (p. 38).\n5. This combination allows hierarchies to form in the real time of interaction; but their accuracy depends on the validity of the beliefs, and appearances of competence can be manipulated (p. 38-39). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D05", "D06", "T010"], "sections": ["Démonstration"], "demo_refs": ["D05", "D06", "T010"], "mentions": ["D05", "D06", "T010"], "corollaires": [], "mtime": 1794590968.4070752}, {"id": "T012", "file": "theses/T012.md", "type": "these", "partie": "2", "titre": "Le consensus qui gouverne la hiérarchie est de second ordre", "enonce": "Le consensus qui crée et gouverne la hiérarchie porte sur ce que les autres attendent de chacun (second ordre), non sur ce que chacun pense mériter (premier ordre). Il suffit à former une toile d'attentes qui impose la hiérarchie, sans que chacun y adhère.", "titre_en": "The consensus governing the hierarchy is second-order", "enonce_en": "The consensus that creates and governs the hierarchy bears on what others expect of each (second order), not on what each thinks they deserve (first order). It suffices to form a web of expectations that enforces the hierarchy, without each member endorsing it.", "citation": "“It is a consensus among group members about what others can be expected to expect.”", "pages": [39, 40, 41, 42], "depends_on": ["T011", "D09", "E09", "E10", "E11"], "contre": ["R07"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Une hiérarchie demande un accord au moins approximatif sur les rangs ; par D09, il peut être de premier ou de second ordre (p. 39).\n2. Par T011, on se coordonne au moyen de croyances qui disent ce que les autres attendront ; le consensus porte donc sur des attentes de second ordre : chacun peut douter d'être moins compétent, mais sait que les autres le supposeront et attendront qu'il défère (p. 39-40).\n3. Par E09, les évaluations du statut d'autrui concordent, chacun estime juste la vue des autres sur lui, et qui se surestime est moins aimé (p. 40).\n4. Par E10, quand attentes propres et attentes d'autrui divergent, ce sont celles d'autrui qui guident la conduite ; par E11, on accepte un statut bas quand les autres connaissent son score faible, non quand on doute seul (p. 40-41).\n5. Ce « consensus de travail » coordonne sans exiger l'adhésion : les désaccords au niveau de l'ego sont fréquents, et c'est parce qu'il n'exige pas d'accord sur « ce que je veux pour moi » qu'il peut se former (p. 41-42). ∎", "body_en": "## Demonstration\n\n1. A hierarchy requires at least rough agreement on ranks; by D09, it may be first-order or second-order (p. 39).\n2. By T011, people coordinate through beliefs that say what others will expect; the consensus therefore bears on second-order expectations: each may doubt being less competent, but knows the others will assume it and expect deference (p. 39-40).\n3. By E09, ratings of others' status agree, each accurately estimates others' view of them, and whoever overrates themselves is less liked (p. 40).\n4. By E10, when one's own expectations and others' diverge, it is others' that guide behaviour; by E11, people accept low status when others know their low score, not when they doubt alone (p. 40-41).\n5. This \"working consensus\" coordinates without requiring endorsement: disagreements at the ego level are common, and it is because it does not require agreement on \"what I want for me\" that it can form (p. 41-42). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D09", "E09", "E10", "E11", "T011"], "sections": ["Démonstration"], "demo_refs": ["D09", "E09", "E10", "E11", "T011"], "mentions": ["D09", "E09", "E10", "E11", "T011"], "corollaires": [], "mtime": 1794590968.4080756}, {"id": "T013", "file": "theses/T013.md", "type": "these", "partie": "2", "titre": "La dominance revisitée : incorporée, rarement victorieuse", "enonce": "Le système normatif gère le désir de dominer par la carotte autant que par le bâton : il lui offre l'affirmation au service de la tâche. Mais il peut céder dans les groupes qui valorisent l'agression contre l'extérieur, ou devant un dominateur stratégique qui isole et intimide chacun ; les hiérarchies de dominance qui en résultent restent instables.", "titre_en": "Dominance revisited: incorporated, rarely victorious", "enonce_en": "The normative system manages the desire to dominate with carrots as well as sticks: it offers it assertiveness in service of the task. But it can give way in groups that value aggression towards outsiders, or before a strategic dominator who isolates and intimidates each member; the resulting dominance hierarchies remain unstable.", "citation": "", "pages": [42, 43, 44], "depends_on": ["T009", "E12"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Argumentation\n\n1. Le désir de statut sans compétence et le recours périodique à l'intimidation ne disparaissent pas (p. 42).\n2. Les hiérarchies de statut demandent de l'agentivité, et les meneurs doivent mener : le désir de dominer peut s'exprimer en efforts affirmés mais non menaçants, et il est ainsi incorporé au système, par la carotte autant que par le bâton de T009 (p. 42).\n3. Quand le but du groupe est l'affrontement avec d'autres (équipe sportive, unité militaire), la dominance fait partie de la compétence ; la toile d'attentes peut alors céder, et les gangs violents basculent vers une pure structure de peur (p. 42-43).\n4. Un dominateur stratégique peut aussi empêcher les coalitions en menaçant chacun en privé : il obtient une relation de dominance (p. 43).\n5. Mais les hiérarchies de dominance donnent aux dominés intérêt à partir ou à renverser le chef : par E12, on quitte quatre fois plus les groupes autocratiques (p. 43). Le système de statut prévaut donc dans la grande majorité des groupes (p. 43-44). ∎", "body_en": "## Argument\n\n1. The desire for status without competence and periodic recourse to intimidation do not go away (p. 42).\n2. Status hierarchies require agency, and leaders must lead: the desire to dominate can be expressed in assertive but non-threatening efforts, and is thus incorporated into the system, by carrots as well as by the sticks of T009 (p. 42).\n3. When the group's goal is confrontation with others (sports team, military unit), dominance is part of competence; the web of expectations can then break down, and violent gangs tip into a pure structure of fear (p. 42-43).\n4. A strategic dominator can also prevent coalitions by threatening each member privately: he obtains a dominance relation (p. 43).\n5. But dominance hierarchies give the dominated an interest in leaving or subverting the leader: by E12, people leave autocratic groups four times as often (p. 43). The status system therefore prevails in the vast majority of groups (p. 43-44). ∎", "sections_en": ["Argument"], "demo_refs_en": ["E12", "T009"], "sections": ["Argumentation"], "demo_refs": ["E12", "T009"], "mentions": ["E12", "T009"], "corollaires": [], "mtime": 1794590968.4080756}, {"id": "T014", "file": "theses/T014.md", "type": "these", "partie": "2", "titre": "Meneurs et suiveurs : une compétence bornée par l'intention", "enonce": "Parce que la revendication d'un haut statut peut être intéressée, les membres veulent un bon marché pour leur déférence : de la compétence, mais aussi la garantie qu'elle servira le groupe. L'échange statut-compétence porte sur une compétence bornée par l'intention, ce qui fait de l'ascension une « micropolitique ».", "titre_en": "Leaders and followers: competence bounded by intent", "enonce_en": "Because a claim to high status may be self-interested, members want a good deal for their deference: competence, but also assurance that it will serve the group. The status-for-competence exchange bears on a competence bounded by intent, which turns status attainment into \"micropolitics\".", "citation": "", "pages": [44, 45], "depends_on": ["D08", "E13"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Le haut statut rapporte beaucoup ; les autres se demandent donc si une revendication n'est pas une prise intéressée ; par E13, les membres de haut statut sont vus comme moins attentionnés et moins authentiques sauf preuve de leurs intentions (p. 44).\n2. Les membres veulent un bon marché pour leur déférence : un candidat compétent, plus que les autres, et dont l'affirmation soit tournée vers le groupe (D08) (p. 44).\n3. Ils valorisent donc l'agentivité instrumentale *et* les signes de fiabilité ; l'échange de la norme fondamentale porte sur une compétence bornée, dont la valeur est cadrée par l'intention coopérative ou intéressée (p. 44).\n4. D'où le caractère propre de la quête du statut, du moins dans la culture occidentale : une « micropolitique » où chacun, tel un candidat, cherche à convaincre qu'il est plus compétent et plus digne de confiance pour obtenir le « vote » des autres (p. 44-45). ∎", "body_en": "## Demonstration\n\n1. High status brings many benefits; others therefore wonder whether a claim is a self-interested grab; by E13, high-status members are seen as less considerate and less authentic unless they prove their intent (p. 44).\n2. Members want a good deal for their deference: a candidate who is competent, more so than others, and whose assertiveness is group-motivated (D08) (p. 44).\n3. They therefore value instrumental agency *and* signs of trustworthiness; the exchange of the basic norm bears on a bounded competence, whose value is framed by cooperative or self-interested intent (p. 44).\n4. Hence the distinctive character of the pursuit of status, at least in Western culture: \"micropolitics\" in which each, like a politician, tries to convince the others of being more competent and trustworthy to win their \"vote\" (p. 44-45). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D08", "E13"], "sections": ["Démonstration"], "demo_refs": ["D08", "E13"], "mentions": ["D08", "E13"], "corollaires": [], "mtime": 1794590968.4090755}, {"id": "T015", "file": "theses/T015.md", "type": "these", "partie": "3", "titre": "Le statut est une dimension propre de la position parmi les autres", "enonce": "Dépendants des autres pour vivre, on ne peut rien avoir de plus important que sa position auprès d'eux. Elle a deux dimensions : l'appartenance (être aimé, accepté) et le statut (la valeur perçue de ce qu'on apporte). Le statut ne se réduit pas à l'appartenance, et c'est dans les contextes relationnels qu'on le reçoit.", "titre_en": "Status is a distinct dimension of standing with others", "enonce_en": "Dependent on others to live, nothing can matter more than one's standing with them. It has two dimensions: belonging (being liked, accepted) and status (the perceived value of what one offers). Status does not reduce to belonging, and it is in relational contexts that one receives it.", "citation": "", "pages": [48, 49, 50], "depends_on": ["D24", "A13"], "contre": ["R06"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Le statut étant donné par les autres, on le reçoit dans les contextes relationnels (D24), où l'on voit reflétée sa valeur pour le groupe ; les autres soucis de statut (marques, métier, quartier) pèsent surtout par la manière dont on y est traité (p. 48).\n2. On dépend des relations pour survivre ; sa position auprès des autres règle donc qui vous accepte et à quelles conditions (p. 48-49).\n3. Cette position a deux dimensions centrales : être aimé et accepté, et le statut, perception de sa valeur pour les activités du groupe ; le statut ne se réduit pas à l'appartenance et a ses effets propres (p. 49).\n4. Par A13, nos perceptions d'autrui ont les deux mêmes dimensions, chaleur et capacité : elles sont le miroir de notre souci pour notre propre position (p. 50). ∎", "body_en": "## Demonstration\n\n1. Since status is given by others, it is received in relational contexts (D24), where one sees one's value to the group reflected; other status concerns (brands, occupation, neighbourhood) matter mostly through how one is treated there (p. 48).\n2. People depend on relationships to survive; their standing with others therefore governs who accepts them and on what terms (p. 48-49).\n3. This standing has two central dimensions: being liked and accepted, and status, the perception of one's value to the group's activities; status does not reduce to belonging and has its own effects (p. 49).\n4. By A13, our perceptions of others have the same two dimensions, warmth and capability: they mirror our concern for our own standing (p. 50). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A13", "D24"], "sections": ["Démonstration"], "demo_refs": ["A13", "D24"], "mentions": ["A13", "D24"], "corollaires": [], "mtime": 1794590968.410074}, {"id": "T016", "file": "theses/T016.md", "type": "these", "partie": "3", "titre": "Le désir de statut est un motif fondamental", "enonce": "On tient au statut autant qu'à l'argent et au pouvoir. Le désir de statut remplit les critères d'un motif humain fondamental : on guette les moindres signes de rang, on perçoit juste le sien et celui des autres, et l'on réagit avec colère, voire agressivité, à ce qu'on vit comme un manque de respect.", "titre_en": "The desire for status is a fundamental motive", "enonce_en": "People care about status as much as about money and power. The desire for status meets the criteria of a fundamental human motive: people watch the smallest signs of rank, perceive their own and others' accurately, and react with anger, even aggression, to what they feel as disrespect.", "citation": "", "pages": [50, 51, 52], "depends_on": ["E14", "E15", "E16", "T015"], "contre": ["R01"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par E14, le désir de statut a des effets durables sur le bien-être, motive de nombreuses conduites, est une fin en soi et se retrouve dans toutes les cultures : c'est un motif fondamental (p. 50).\n2. Par E15, on surveille les signes de statut et l'on perçoit avec justesse le statut des autres et le sien, en partie parce qu'on suit les mêmes croyances sur ses signes (p. 50-51).\n3. Par T015, on dépend des autres pour survivre et le statut est une dimension centrale de sa position ; dès lors, il n'est pas surprenant d'apprendre à lire son rang aux yeux des autres, qu'il plaise ou non (p. 51).\n4. Par E16, le manque de respect provoque la colère et, quand le statut est saillant, l'agression (p. 51-52). ∎", "body_en": "## Demonstration\n\n1. By E14, the desire for status has lasting effects on well-being, motivates many behaviours, is an end in itself and is found across cultures: it is a fundamental motive (p. 50).\n2. By E15, people monitor signs of status and accurately perceive others' status and their own, partly because they follow the same beliefs about its signs (p. 50-51).\n3. By T015, we depend on others to survive and status is a central dimension of our standing; so it is not surprising that we learn to read our rank in others' eyes, whether we like it or not (p. 51).\n4. By E16, disrespect provokes anger and, when status is salient, aggression (p. 51-52). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E14", "E15", "E16", "T015"], "sections": ["Démonstration"], "demo_refs": ["E14", "E15", "E16", "T015"], "mentions": ["E14", "E15", "E16", "T015"], "corollaires": [], "mtime": 1794591716.0731022}, {"id": "T017", "file": "theses/T017.md", "type": "these", "partie": "3", "titre": "Les menaces sur le statut d'un groupe deviennent politiques", "enonce": "La réaction aux menaces de statut vaut aussi pour les identités de groupe : les groupes subordonnés qui s'affirment suscitent un rejet, et des changements sociaux qui semblent abaisser un groupe jadis respecté nourrissent la colère et le soutien à des mouvements qui veulent restaurer son rang.", "titre_en": "Threats to a group's status become political", "enonce_en": "The reaction to status threats also holds for group identities: subordinate groups who assert themselves evoke backlash, and social changes that seem to lower a once-respected group fuel anger and support for movements seeking to restore its rank.", "citation": "", "pages": [52, 53], "depends_on": ["T016", "A11", "E17", "E45"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Argumentation\n\n1. Par T016, on réagit fortement aux menaces de statut ; par E45, la même réaction frappe les femmes et les hommes afro-américains qui s'affirment devant des supérieurs de statut (p. 52).\n2. La menace peut venir non d'une rencontre, mais de changements sociaux plus larges rendus saillants par les médias ou le débat public ; par A11, une grande part du préjugé racial est une réaction à ces menaces contre l'ordre racial (p. 52-53).\n3. Par E17, rendre saillant le changement démographique accroît chez des Blancs l'adhésion conservatrice et l'opposition aux aides sociales (p. 53).\n4. L'identité menacée n'est pas seulement raciale : chez Hochschild, Cramer et Mutz, le sentiment d'être méprisé par les élites pèse autant que le déclin économique dans le vote (p. 53). ∎", "body_en": "## Argument\n\n1. By T016, people react strongly to status threats; by E45, the same reaction hits women and African American men who act assertively towards higher-status others (p. 52).\n2. The threat can come not from an encounter but from broader social changes made salient by the media or public commentary; by A11, much racial prejudice is a reaction to such threats to the racial order (p. 52-53).\n3. By E17, making demographic change salient increases whites' conservative endorsement and opposition to welfare (p. 53).\n4. The threatened identity is not only racial: in Hochschild, Cramer and Mutz, feeling looked down on by elites weighs as much as economic decline in voting (p. 53). ∎", "sections_en": ["Argument"], "demo_refs_en": ["A11", "E17", "E45", "T016"], "sections": ["Argumentation"], "demo_refs": ["A11", "E17", "E45", "T016"], "mentions": ["A11", "E17", "E45", "T016"], "corollaires": [], "mtime": 1794590968.411074}, {"id": "T018", "file": "theses/T018.md", "type": "these", "partie": "3", "titre": "Le schème crée des incitations directes et indirectes", "enonce": "Le statut incite à le rechercher directement, par les récompenses qu'il distribue (estime, attention, influence, part des gains), et indirectement, par ses effets sur le soi : les expériences locales de statut, répétées, façonnent les émotions, l'estime de soi et le bien-être.", "titre_en": "The schema creates direct and indirect incentives", "enonce_en": "Status incentivises its pursuit directly, through the rewards it distributes (esteem, attention, influence, a share of gains), and indirectly, through its effects on the self: repeated local experiences of status shape emotions, self-esteem and well-being.", "citation": "", "pages": [54, 55, 56, 57, 58], "depends_on": ["D05", "E18", "A14", "E19", "E20", "T016"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D05, la norme distribue des récompenses selon la contribution perçue ; on peut se demander quelles incitations ces règles créent pour l'individu (p. 54).\n2. Incitations directes : le statut est en lui-même une récompense puissante, puisque, par T016, on y tient profondément ; de plus, par E18, le haut statut rapporte estime, attention, réponses positives, influence et une plus grande part des gains ; le bas statut en reçoit moins, avec quelques compensations (p. 55).\n3. D'où l'effort pour projeter une image de valeur dans le langage des croyances de statut ; cette micropolitique est bornée par des attributs qu'on ne choisit pas, comme le genre, la race ou la classe (p. 56).\n4. Incitations indirectes : par A14, le soi se forme dans les interactions locales, qui sont pénétrées de statut et renvoient à chacun sa valeur (p. 56).\n5. Par E19, le haut statut suscite fierté et émotions positives, le bas statut tristesse, culpabilité ou honte ; on préfère donc, toutes choses égales, les groupes où l'on serait haut (p. 57).\n6. Par E20, le statut local prédit le bien-être et l'estime de soi, indépendamment de l'acceptation (p. 58). ∎\n\n## Scolie\n\nLes choses ne sont pas toujours égales : on rejoint volontiers un groupe prestigieux même pour y être bas, et l'on ne choisit pas toujours ses groupes, comme le quartier où l'on grandit ou, sous contrainte, l'école et le travail (p. 57-58).", "body_en": "## Demonstration\n\n1. By D05, the norm distributes rewards according to perceived contribution; one may ask what incentives these rules create for the individual (p. 54).\n2. Direct incentives: status is itself a potent reward, since, by T016, people care deeply about it; moreover, by E18, high status brings esteem, attention, positive responses, influence and a larger share of gains; low status receives fewer, with some compensations (p. 55).\n3. Hence the effort to project an image of value in the language of status beliefs; this micropolitics is bounded by attributes one does not choose, like gender, race or class (p. 56).\n4. Indirect incentives: by A14, the self forms in local interactions, which are pervaded by status and reflect back one's value (p. 56).\n5. By E19, high status evokes pride and positive emotions, low status sadness, guilt or shame; other things equal, people therefore prefer groups where they would be high (p. 57).\n6. By E20, local status predicts well-being and self-esteem, independently of acceptance (p. 58). ∎\n\n## Scholium\n\nThings are not always equal: people gladly join a prestigious group even to be low in it, and they do not always choose their groups, like the neighbourhood they grow up in or, under constraint, school and work (p. 57-58).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["A14", "D05", "E18", "E19", "E20", "T016"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["A14", "D05", "E18", "E19", "E20", "T016"], "mentions": ["A14", "D05", "E18", "E19", "E20", "T016"], "corollaires": [], "mtime": 1794591716.0731022}, {"id": "T019", "file": "theses/T019.md", "type": "these", "partie": "3", "titre": "Le statut, désirable et jamais acquis, motive sans fin", "enonce": "Le désir de statut ne se rassasie pas, à la différence de celui de pouvoir, parce que le statut, donné par les autres, ne se possède jamais une fois pour toutes. Vécu comme instable, il tourne vers l'opinion d'autrui ; et une récompense désirable mais imprévisible est celle qui suscite les efforts les plus persistants.", "titre_en": "Status, desirable and never secured, motivates without end", "enonce_en": "The desire for status is not satiated, unlike that for power, because status, given by others, is never possessed once and for all. Experienced as mutable, it turns people towards others' opinion; and a desirable but unpredictable reward is the kind that elicits the most persistent strivings.", "citation": "", "pages": [59, 60, 61], "depends_on": ["T002", "E21", "E22", "T018"], "contre": ["R13"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. L'histoire montre que la quête du statut accompagne celle de l'argent et du pouvoir : chez Weber, la richesse ou le pouvoir suffisent rarement aux groupes (p. 59).\n2. Par E21, la préférence pour le statut ne plafonne pas, celle pour le pouvoir si (p. 59).\n3. Par T002, le statut est donné par les autres et peut toujours être repris : on ne le possède jamais une fois pour toutes ; il est vécu comme instable et mutable (p. 59-60).\n4. Par E22, le haut statut pousse ainsi à surveiller ce que pensent les autres, à la différence du pouvoir, qui rend égocentrique (p. 60).\n5. Par T018, le statut est une récompense très désirable ; or, selon les études classiques de l'apprentissage, une récompense désirable dont l'obtention ne se maîtrise pas suscite les efforts les plus persistants (p. 61). ∎", "body_en": "## Demonstration\n\n1. History shows that the pursuit of status accompanies that of money and power: in Weber, wealth or power is rarely enough for groups (p. 59).\n2. By E21, preference for status does not level off, preference for power does (p. 59).\n3. By T002, status is given by others and can always be taken back: it is never possessed once and for all; it is experienced as insecure and mutable (p. 59-60).\n4. By E22, high status thus leads people to monitor what others think, unlike power, which makes them egocentric (p. 60).\n5. By T018, status is a highly desirable reward; yet, according to classic studies of learning, a desirable reward whose attainment cannot be controlled elicits the most persistent strivings (p. 61). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E21", "E22", "T002", "T018"], "sections": ["Démonstration"], "demo_refs": ["E21", "E22", "T002", "T018"], "mentions": ["E21", "E22", "T002", "T018"], "corollaires": [], "mtime": 1794591716.074102}, {"id": "T020", "file": "theses/T020.md", "type": "these", "partie": "3", "titre": "Le schème récompense l'acceptation du bas statut", "enonce": "Pour que la hiérarchie fonctionne, certains doivent accepter le bas statut et continuer à contribuer. Outre quelques compensations, le schème leur offre un respect modeste : déférer comme attendu valide le consensus du groupe et fait paraître raisonnable. Le prix de cette dignité est la déférence.", "titre_en": "The schema rewards acceptance of low status", "enonce_en": "For the hierarchy to function, some must accept low status and keep contributing. Besides some compensations, the schema offers them a modest respect: deferring as expected validates the group's consensus and makes one look reasonable. The price of this dignity is deference.", "citation": "", "pages": [61, 62, 63, 64], "depends_on": ["T012", "E18", "E23"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. La perte d'engagement des membres de bas statut menace la coopération ; il faut qu'ils défèrent et continuent de soutenir l'effort (p. 61).\n2. Par E18, ils reçoivent une part, moindre, du succès, et passent pour plus chaleureux ; s'y ajoutent la gloire d'un groupe prestigieux et l'appartenance ; mais ils paient un prix en estime que les autres ne paient pas (p. 61-62).\n3. Par T012, le consensus sur la valeur de chacun prend une qualité de réalité ; adossé aux croyances communes, il paraît ce que « la plupart des gens » jugeraient, donc juste et légitime (p. 62).\n4. En déférant au membre jugé plus compétent, le membre de bas statut endosse ce consensus « raisonnable » et paraît lui-même raisonnable : il gagne un respect de base (p. 62-63).\n5. Par E23, ce respect est accordé de façon normative, anticipé, et accroît l'engagement envers le groupe (p. 63).\n6. Ce respect est moindre que l'estime, mais donne une dignité de membre qui partage les critères du groupe ; il naît comme effet secondaire de la conformité à la norme fondamentale, et son prix est la déférence (p. 63-64). ∎", "body_en": "## Demonstration\n\n1. The loss of involvement of low-status members threatens cooperation; they must defer and keep supporting the effort (p. 61).\n2. By E18, they receive a share, a smaller one, of success, and are seen as warmer; add the reflected glory of a prestigious group and belonging; but they pay a price in esteem that others do not (p. 61-62).\n3. By T012, the consensus on each member's value takes on a quality of reality; backed by common beliefs, it seems what \"most people\" would judge, hence right and legitimate (p. 62).\n4. By deferring to the member judged more competent, the low-status member endorses this \"reasonable\" consensus and looks reasonable too: he or she gains a baseline respect (p. 62-63).\n5. By E23, this respect is granted normatively, anticipated, and increases commitment to the group (p. 63).\n6. This respect is less than esteem, but grants the dignity of a member who shares the group's standards; it arises as a side effect of conformity to the basic norm, and its price is deference (p. 63-64). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["E18", "E23", "T012"], "sections": ["Démonstration"], "demo_refs": ["E18", "E23", "T012"], "mentions": ["E18", "E23", "T012"], "corollaires": [], "mtime": 1794590968.4130745}, {"id": "T021", "file": "theses/T021.md", "type": "these", "partie": "3", "titre": "La stabilité tient au consensus des autres et aux croyances de statut", "enonce": "Les hiérarchies interpersonnelles sont stables malgré la rivalité pour un statut vécu comme instable, parce que leur stabilité ne dépend pas de ce que chacun pense mériter, mais du consensus des autres, appuyé sur des sanctions et sur des croyances de statut claires et lentes à changer, qui répondent aussi au besoin de chacun de savoir où il se tient.", "titre_en": "Stability rests on others' consensus and on status beliefs", "enonce_en": "Interpersonal hierarchies are stable despite rivalry for a status experienced as insecure, because their stability depends not on what each thinks they deserve, but on the consensus of others, backed by sanctions and by clear, slow-changing status beliefs, which also meet each person's need to know where they stand.", "citation": "", "pages": [64, 65, 66, 67], "depends_on": ["T012", "T019", "E24", "E09"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T019, le statut est vécu comme instable et chacun le désire ; pourtant, par E24, les hiérarchies se forment vite et durent (p. 64-65).\n2. Si la stabilité exigeait l'accord des estimations personnelles, la rivalité la menacerait ; mais, par T012, le consensus porte sur ce que les *autres* estiment (p. 65).\n3. Par E09, revendiquer plus que les autres ne vous accordent vous fait rejeter ; la norme est une norme précisément parce qu'elle est sanctionnée, et ces sanctions adossent la stabilité, tout en nourrissant l'insécurité ressentie (p. 65-66).\n4. La stabilité dépend donc de la capacité des membres à s'accorder sur la valeur de chaque autre, ce qu'ils font en puisant dans les mêmes croyances de statut (p. 66).\n5. Ces croyances servent aussi un intérêt tourné vers soi : elles disent « où l'on se tient » et apaisent l'incertitude ; or l'incertitude accroît la préférence pour la structure et la hiérarchie (p. 67). ∎\n\n## Scolie\n\nLa stabilité a un coût : quand les désaccords privés sur les rangs sont nombreux, la performance du groupe souffre (p. 66).", "body_en": "## Demonstration\n\n1. By T019, status is experienced as insecure and everyone desires it; yet, by E24, hierarchies form quickly and last (p. 64-65).\n2. If stability required agreement of personal estimates, rivalry would threaten it; but, by T012, the consensus bears on what *others* estimate (p. 65).\n3. By E09, claiming more than others grant gets one rejected; the norm is a norm precisely because it is sanctioned, and these sanctions backstop stability, while feeding the felt insecurity (p. 65-66).\n4. Stability therefore depends on members' ability to agree on each other's value, which they do by drawing on the same status beliefs (p. 66).\n5. These beliefs also serve a self-oriented interest: they tell \"where you stand\" and assuage uncertainty; and uncertainty increases the preference for structure and hierarchy (p. 67). ∎\n\n## Scholium\n\nStability has a cost: when private disagreements over rank are frequent, group performance suffers (p. 66).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["E09", "E24", "T012", "T019"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["E09", "E24", "T012", "T019"], "mentions": ["E09", "E24", "T012", "T019"], "corollaires": [], "mtime": 1794590968.4130745}, {"id": "T022", "file": "theses/T022.md", "type": "these", "partie": "4", "titre": "Les croyances de statut relient le groupe et l'interaction", "enonce": "Les croyances de statut relient le statut des groupes auxquels on appartient à l'estime reçue dans les interactions, et elles permettent de coordonner les jugements de valeur pour qu'ils portent le poids du groupe. Le besoin de telles croyances pousse à chercher et à exagérer les différences, et à en faire un enjeu politique.", "titre_en": "Status beliefs link the group and the interaction", "enonce_en": "Status beliefs link the status of the groups one belongs to with the esteem received in interaction, and they make it possible to coordinate judgements of worth so that they carry the weight of the group. The need for such beliefs drives people to look for and exaggerate differences, and makes them a political stake.", "citation": "", "pages": [68, 69, 70], "depends_on": ["D06", "T011"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T011, le schème comprend, à côté de la norme, des croyances de statut sur les différences sociales ; par D06, elles ordonnent des « types » d'acteurs selon la valeur et la compétence (p. 68-69).\n2. Elles *relient* le statut du groupe (racial, professionnel) à l'estime dans les rencontres, au restaurant ou au travail, et permettent de *coordonner* les jugements de valeur (p. 69).\n3. Elles donnent ainsi des avantages ou des désavantages fondés sur le groupe, non sur les seuls attributs personnels : c'est leur lien avec l'inégalité (p. 69).\n4. Le besoin de croyances partagées pousse à chercher, exagérer et utiliser les différences ; les groupes peuvent aussi se forger des signes distinctifs, comme les goûts et les manières de classe (p. 70).\n5. Faire naître des croyances favorables est donc un projet politique, qui ne réussit que si elles deviennent largement répandues (p. 70). ∎", "body_en": "## Demonstration\n\n1. By T011, the schema comprises, beside the norm, status beliefs about social differences; by D06, they rank \"types\" of actors by worth and competence (p. 68-69).\n2. They *link* the status of the group (racial, occupational) to esteem in encounters, at a restaurant or at work, and make it possible to *coordinate* judgements of worth (p. 69).\n3. They thus give advantages or disadvantages based on the group, not on personal attributes alone: this is their link to inequality (p. 69).\n4. The need for shared beliefs drives people to look for, exaggerate and use differences; groups can also create distinguishing signs, like class tastes and manners (p. 70).\n5. Fostering favourable beliefs is therefore a political project, which succeeds only if they become widely held (p. 70). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D06", "T011"], "sections": ["Démonstration"], "demo_refs": ["D06", "T011"], "mentions": ["D06", "T011"], "corollaires": [], "mtime": 1794590968.4145787}, {"id": "T023", "file": "theses/T023.md", "type": "these", "partie": "4", "titre": "Une croyance de statut exige que le groupe défavorisé concède", "enonce": "La simple différence suscite le favoritisme pour son groupe, qui produit des vues concurrentes et non une croyance de statut. Celle-ci n'existe que lorsque le groupe défavorisé lui-même admet, comme un fait social, que la société voit l'autre groupe comme plus estimable et compétent.", "titre_en": "A status belief requires the disfavoured group to concede", "enonce_en": "Mere difference evokes favouritism for one's own group, which produces competing views, not a status belief. A status belief exists only when the disfavoured group itself accepts, as a social fact, that society sees the other group as more worthy and competent.", "citation": "", "pages": [71], "depends_on": ["A08", "D06", "T022"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T022, les croyances de statut portent sur des différences de groupe ; or, par A08, reconnaître une différence suffit à préférer son propre groupe (p. 71).\n2. Ce favoritisme produit des vues concurrentes sur le groupe le meilleur ; il ne suffit pas à une croyance de statut (p. 71).\n3. Par D06, une croyance de statut ordonne les groupes, et cet ordre doit être reconnu par tous : c'est sa marque distinctive (p. 71).\n4. Il faut donc qu'un groupe surmonte sa tendance à se voir meilleur et concède que la communauté voit l'autre comme meilleur ; toute théorie de la genèse des croyances doit en rendre compte (p. 71). ∎", "body_en": "## Demonstration\n\n1. By T022, status beliefs bear on group differences; yet, by A08, recognising a difference is enough to prefer one's own group (p. 71).\n2. This favouritism produces competing views about which group is better; it is not enough for a status belief (p. 71).\n3. By D06, a status belief ranks groups, and that ranking must be acknowledged by all: this is its hallmark (p. 71).\n4. One group must therefore overcome its tendency to see itself as better and concede that the community sees the other as better; any theory of how beliefs develop must account for this (p. 71). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A08", "D06", "T022"], "sections": ["Démonstration"], "demo_refs": ["A08", "D06", "T022"], "mentions": ["A08", "D06", "T022"], "corollaires": [], "mtime": 1794591716.074102}, {"id": "T024", "file": "theses/T024.md", "type": "these", "partie": "4", "titre": "Leur troisième ordre donne leur force aux croyances de statut", "enonce": "Parce qu'on tient une croyance de statut pour ce que pense « la plupart des gens », on s'attend à ce que les autres agissent et vous jugent selon elle, et l'on doit en tenir compte qu'on y adhère ou non. Ce caractère de troisième ordre donne leur force aux croyances et crée l'avantage de statut.", "titre_en": "Their third-order character gives status beliefs their force", "enonce_en": "Because one takes a status belief to be what \"most people\" think, one expects others to act and judge one according to it, and must take it into account whether or not one endorses it. This third-order character gives beliefs their force and creates status advantage.", "citation": "", "pages": [71, 72, 73], "depends_on": ["D10", "D13", "T023"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T023, une croyance de statut est reconnue par tous ; par D10, elle est tenue pour ce que pense la plupart des gens, non pour une opinion personnelle (p. 71).\n2. On peut la tenir à ce titre sans l'endosser ; l'écart entre les deux niveaux crée une « ignorance plurielle » fragile, par où les croyances peuvent s'effondrer (p. 71-72).\n3. Si l'on suppose les autres attachés à une croyance, on s'attend à ce qu'ils agissent et vous jugent selon elle ; on doit en tenir compte, qu'on l'approuve ou non : c'est sa force (p. 72).\n4. Le diplômé d'une université d'État qui postule dans une firme habituée à l'Ivy League doit anticiper d'être sous-estimé et coordonner ses réponses en conséquence (p. 72).\n5. Les croyances déclenchent ainsi une coordination implicite qui façonne jugements et conduites, et crée l'avantage de statut (D13) (p. 72-73). ∎", "body_en": "## Demonstration\n\n1. By T023, a status belief is acknowledged by all; by D10, it is taken as what most people think, not as a personal opinion (p. 71).\n2. One can hold it as such without endorsing it; the gap between the two levels creates a fragile \"pluralistic ignorance\", through which beliefs can collapse (p. 71-72).\n3. If one assumes others hold a belief, one expects them to act and judge one according to it; one must take it into account, approving or not: this is its force (p. 72).\n4. The state-college graduate applying to a firm used to hiring from the Ivy League must anticipate being underestimated and coordinate responses accordingly (p. 72).\n5. Beliefs thus trigger an implicit coordination that shapes judgements and behaviour, and creates status advantage (D13) (p. 72-73). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D10", "D13", "T023"], "sections": ["Démonstration"], "demo_refs": ["D10", "D13", "T023"], "mentions": ["D10", "D13", "T023"], "corollaires": [], "mtime": 1794590968.4161358}, {"id": "T025", "file": "theses/T025.md", "type": "these", "partie": "4", "titre": "Il faut un savoir commun pour se coordonner", "enonce": "Pour former des jugements consensuels sur lesquels agir sans risque, il ne suffit pas que les croyances de statut soient partagées : il faut qu'elles soient un savoir commun. Les stéréotypes américains de tous les groupes qui structurent l'inégalité contiennent de telles croyances ; et chaque communauté peut avoir les siennes.", "titre_en": "Coordination requires common knowledge", "enonce_en": "To form consensual judgements on which to act without risk, it is not enough that status beliefs be shared: they must be common knowledge. American stereotypes of all the groups that pattern inequality contain such beliefs; and each community can have its own.", "citation": "", "pages": [73, 74, 75, 76], "depends_on": ["D11", "T024", "E27", "E25", "E26"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Les croyances donnent un raccourci pour juger vite la valeur d'autrui ; mais la hiérarchie exige des jugements *consensuels* (p. 73-74).\n2. Par D11, il faut pour cela un savoir commun : si les croyances sont seulement partagées, on ne sait qu'après coup si l'on sera soutenu ; si elles sont communes, on peut le présumer avant de prendre le risque (p. 74-75).\n3. Par E27, on se coordonne plus volontiers quand l'information est un savoir commun ; l'interdépendance coopérative est une telle situation, et les croyances de statut, par T024, en sont l'outil (p. 75).\n4. Par E25, les stéréotypes des groupes qui structurent l'inégalité contiennent des croyances de statut consensuelles, tenues pour ce que pensent la plupart des Américains (p. 75-76).\n5. Par E26, des communautés ont aussi leurs propres croyances ; comme on appartient à plusieurs, on répond à des croyances variées selon les contextes (p. 76). ∎", "body_en": "## Demonstration\n\n1. Beliefs provide a shorthand for quickly judging others' value; but the hierarchy requires *consensual* judgements (p. 73-74).\n2. By D11, this requires common knowledge: if beliefs are only shared, one learns only afterwards whether one will be supported; if they are common, one can presume it before taking the risk (p. 74-75).\n3. By E27, people coordinate more readily when information is common knowledge; cooperative interdependence is such a situation, and status beliefs, by T024, are its tool (p. 75).\n4. By E25, stereotypes of the groups that pattern inequality contain consensual status beliefs, taken as what most Americans think (p. 75-76).\n5. By E26, communities also have their own beliefs; since people belong to several, they respond to varied beliefs across contexts (p. 76). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D11", "E25", "E26", "E27", "T024"], "sections": ["Démonstration"], "demo_refs": ["D11", "E25", "E26", "E27", "T024"], "mentions": ["D11", "E25", "E26", "E27", "T024"], "corollaires": [], "mtime": 1794590968.41714}, {"id": "T026", "file": "theses/T026.md", "type": "these", "partie": "4", "titre": "Le contenu des croyances : compétence et valeur sociale", "enonce": "Les croyances de statut associent un groupe à une compétence générale (caractéristiques diffuses) ou bornée (caractéristiques spécifiques). Leur valeur sociale tient surtout à la compétence présumée ; la part morale est faible, et les groupes de haut statut sont même vus comme moins chaleureux.", "titre_en": "The content of beliefs: competence and status-worthiness", "enonce_en": "Status beliefs associate a group with general competence (diffuse characteristics) or bounded competence (specific characteristics). Their status-worthiness rests mainly on presumed competence; the moral element is weak, and high-status groups are even seen as less warm.", "citation": "", "pages": [77, 78, 79, 80], "depends_on": ["D14", "D15", "E25", "E13", "T014"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D14, les croyances qui lient une différence à la compétence générale ont les effets les plus larges : genre, race, éducation et profession en sont (p. 77).\n2. Par D15, d'autres croyances lient une différence à une compétence bornée, qui ne compte que là où elle sert (p. 77-78).\n3. La valeur sociale associée à un groupe est la plus difficile à cerner ; par E25, statut et compétence sont pourtant presque confondus dans les stéréotypes (p. 78).\n4. Un élément moral existe, issu de la tension entre meneurs et suiveurs (T014) : on veut que le haut statut serve le groupe (p. 78-79).\n5. Mais, par E25, les groupes de haut statut sont vus comme moins chaleureux, et, par E13, le haut statut suscite un léger soupçon moral (p. 79).\n6. Les croyances n'assurent donc pas l'orientation morale du haut statut : leur valeur sociale tient surtout à la compétence générale présumée et au respect reconnu qu'elle vaut (p. 79-80). ∎", "body_en": "## Demonstration\n\n1. By D14, beliefs that link a difference with general competence have the broadest effects: gender, race, education and occupation are such (p. 77).\n2. By D15, other beliefs link a difference with a bounded competence, which counts only where it is relevant (p. 77-78).\n3. The status-worthiness associated with a group is the hardest to pin down; by E25, status and competence nonetheless nearly merge in stereotypes (p. 78).\n4. A moral element exists, arising from the tension between leaders and followers (T014): people want high status to serve the group (p. 78-79).\n5. But, by E25, high-status groups are seen as less warm, and, by E13, high status arouses a slight moral suspicion (p. 79).\n6. Beliefs therefore do not assure the moral orientation of high status: their status-worthiness rests mainly on presumed general competence and the acknowledged respect it earns (p. 79-80). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["D14", "D15", "E13", "E25", "T014"], "sections": ["Démonstration"], "demo_refs": ["D14", "D15", "E13", "E25", "T014"], "mentions": ["D14", "D15", "E13", "E25", "T014"], "corollaires": [], "mtime": 1794591716.075103}, {"id": "T027", "file": "theses/T027.md", "type": "these", "partie": "4", "titre": "La généralisation du statut relie le micro et le macro", "enonce": "Parce que les croyances de statut biaisent les attentes dans chaque rencontre orientée vers un but, les hiérarchies interpersonnelles prennent, d'un contexte à l'autre, des formes semblables quant aux catégories avantagées. Elles cessent d'être un bruit aléatoire : elles médiatisent l'accès aux ressources et offrent une démonstration apparemment valide de la supériorité des groupes favorisés, qui renforce les croyances.", "titre_en": "Status generalization links micro and macro", "enonce_en": "Because status beliefs bias expectations in every goal-oriented encounter, interpersonal hierarchies take similar shapes across contexts as to which categories are advantaged. They cease to be random noise: they mediate access to resources and offer an apparently valid demonstration of the superiority of favoured groups, which reinforces the beliefs.", "citation": "", "pages": [80, 81], "depends_on": ["D16", "A05", "T026"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D16, l'identité de groupe façonne la compétence perçue et donc l'estime et l'influence locales (p. 80).\n2. Par A05, une croyance devient saillante si les membres diffèrent sur la caractéristique ou si elle est pertinente pour la tâche ; elle biaise alors les attentes, qui ont des effets autoréalisateurs (p. 80-81).\n3. Par T026, l'avantage ainsi donné tient à l'identité de groupe, non aux attributs individuels : la femme, à poste et salaire égaux, est un peu désavantagée pour une promotion (p. 81).\n4. Les rencontres orientées vers un but (école, travail, santé) médiatisent l'accès aux biens qui mesurent l'inégalité ; les croyances leur donnent des formes semblables partout (p. 81).\n5. La hiérarchie ainsi produite démontre en apparence la supériorité des groupes favorisés, ce qui renforce les croyances ; elle tisse l'inégalité de groupe dans des organisations dites « méritocratiques » (p. 81). ∎", "body_en": "## Demonstration\n\n1. By D16, group identity shapes perceived competence and hence local esteem and influence (p. 80).\n2. By A05, a belief becomes salient if members differ on the characteristic or if it is relevant to the task; it then biases expectations, which have self-fulfilling effects (p. 80-81).\n3. By T026, the advantage thus conferred depends on group identity, not individual attributes: the woman, with the same position and pay, is slightly disadvantaged for a promotion (p. 81).\n4. Goal-oriented encounters (school, work, health) mediate access to the outcomes by which inequality is measured; beliefs give them similar shapes everywhere (p. 81).\n5. The hierarchy thus produced seemingly demonstrates the superiority of favoured groups, which reinforces the beliefs; it weaves group inequality into ostensibly \"meritocratic\" organisations (p. 81). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A05", "D16", "T026"], "sections": ["Démonstration"], "demo_refs": ["A05", "D16", "T026"], "mentions": ["A05", "D16", "T026"], "corollaires": [], "mtime": 1794590968.4181435}, {"id": "T028", "file": "theses/T028.md", "type": "these", "partie": "4", "titre": "Les croyances de statut naissent des rencontres biaisées", "enonce": "Si un facteur extérieur (ressources, savoir, technique) avantage systématiquement les membres d'un groupe dans leurs rencontres avec ceux d'un autre, la hiérarchie d'influence qui y émerge, consensuelle en apparence, est attribuée à la différence de groupe ; répétée, elle fait naître chez tous une croyance de statut, que chacun transmet ensuite en traitant les autres selon elle.", "titre_en": "Status beliefs arise from biased encounters", "enonce_en": "If an outside factor (resources, knowledge, technology) systematically advantages members of one group in their encounters with members of another, the influence hierarchy that emerges, apparently consensual, is attributed to the group difference; repeated, it gives everyone a status belief, which each then passes on by treating others according to it.", "citation": "", "pages": [82, 83, 84, 85, 86], "depends_on": ["A09", "E28", "E29", "T023"], "contre": ["R08"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par A09, les groupes acquièrent la richesse avant le statut ; mais cela ne dit pas par quels processus naît une croyance que, par T023, même le groupe défavorisé doit accepter (p. 82).\n2. La théorie de la construction du statut part des rencontres coopératives entre membres de groupes différents, où des hiérarchies d'influence apparaissent presque toujours (p. 82-83).\n3. Si un facteur biaisant avantage systématiquement un groupe, l'influence obtenue paraît révéler une supériorité ; la source de la hiérarchie restant obscure et la différence saillante, on associe l'une à l'autre (p. 83).\n4. Répétées, ces rencontres poussent même le groupe défavorisé à croire que « la plupart des gens » jugeraient l'autre plus estimable (p. 83-84).\n5. Par E28, c'est ce qu'on observe : deux rencontres suffisent, si la hiérarchie paraît consensuelle ; par E29, inférer les traits d'un groupe est spontané (p. 84-85).\n6. Une fois acquise, la croyance s'enseigne par la manière de traiter les autres, et peut se diffuser largement, d'autant plus que l'association entre différence et facteur biaisant est forte et les rencontres fréquentes (p. 86). ∎", "body_en": "## Demonstration\n\n1. By A09, groups acquire wealth before status; but this does not say through what processes a belief arises that, by T023, even the disfavoured group must accept (p. 82).\n2. Status construction theory starts from cooperative encounters between members of different groups, in which influence hierarchies nearly always emerge (p. 82-83).\n3. If a biasing factor systematically advantages one group, the influence it gains seems to reveal superiority; since the source of the hierarchy is obscure and the difference salient, people associate the one with the other (p. 83).\n4. Repeated, these encounters lead even the disfavoured group to believe that \"most people\" would see the other as more worthy (p. 83-84).\n5. By E28, this is what is observed: two encounters suffice, if the hierarchy appears consensual; by E29, inferring a group's traits is spontaneous (p. 84-85).\n6. Once acquired, the belief is taught through how others are treated, and can spread widely, the more so as the association between difference and biasing factor is strong and encounters frequent (p. 86). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A09", "E28", "E29", "T023"], "sections": ["Démonstration"], "demo_refs": ["A09", "E28", "E29", "T023"], "mentions": ["A09", "E28", "E29", "T023"], "corollaires": [], "mtime": 1794591716.075103}, {"id": "T029", "file": "theses/T029.md", "type": "these", "partie": "4", "titre": "Le genre comme différence de statut", "enonce": "Le genre réunit les conditions de la construction du statut : une différence saillante partout et une interdépendance coopérative fréquente et intime. Il suffit qu'une division du travail donne aux hommes le contrôle des ressources pour que des croyances de statut diffuses les favorisent ; elles ancrent alors la supériorité masculine dans l'identité d'homme, au-delà de la force ou des ressources de chacun.", "titre_en": "Gender as a status difference", "enonce_en": "Gender combines the conditions for status construction: a difference salient everywhere and frequent, intimate cooperative interdependence. It is enough that a division of labour give men control of resources for diffuse status beliefs to favour them; these then root male superiority in the identity of being a man, beyond each man's strength or resources.", "citation": "", "pages": [86, 87, 88, 89], "depends_on": ["T028", "E30"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Les origines historiques des croyances sur la supériorité masculine sont perdues ; mais le genre a des traits qui rendent très probable l'action des processus de T028 (p. 86-87).\n2. Lié à la reproduction, le sexe/genre est une différence saillante dans tous les contextes, catégorisée presque instantanément, et qui crée une interdépendance coopérative fréquente et intime (p. 87).\n3. Il ne manque qu'un avantage *constant* ; par E30, une division du travail qui donne aux hommes le contrôle des ressources, dans certaines circonstances, le fournit (p. 87-88).\n4. Par T028, ce contrôle biaise les hiérarchies d'influence en faveur des hommes et nourrit des croyances diffuses largement répandues (p. 88).\n5. Ces croyances avantagent alors les hommes même face à des femmes aussi fortes qu'eux et qui ne sont pas mères allaitantes : elles consolident la domination en l'enracinant dans l'identité de groupe (p. 88). ∎\n\n## Scolie\n\nLe genre est unique par son lien à la reproduction ; l'histoire des croyances sur la race ou la classe est autre, mais des facteurs biaisants y ont aussi joué : richesse, armes, techniques, esclavage (p. 88-89).", "body_en": "## Demonstration\n\n1. The historical origins of beliefs in male superiority are lost; but gender has features that make the processes of T028 highly likely to operate (p. 86-87).\n2. Tied to reproduction, sex/gender is a difference salient in all contexts, categorised almost instantly, and creates frequent, intimate cooperative interdependence (p. 87).\n3. Only a *consistent* advantage is missing; by E30, a division of labour giving men control of resources, under some circumstances, provides it (p. 87-88).\n4. By T028, this control biases influence hierarchies in men's favour and feeds widely held diffuse beliefs (p. 88).\n5. These beliefs then advantage men even over women who are as strong as they are and are not nursing mothers: they consolidate dominance by rooting it in group identity (p. 88). ∎\n\n## Scholium\n\nGender is unique in its link to reproduction; the history of beliefs about race or class is different, but biasing factors operated there too: wealth, guns, technology, slavery (p. 88-89).", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["E30", "T028"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["E30", "T028"], "mentions": ["E30", "T028"], "corollaires": [], "mtime": 1794590968.419144}, {"id": "T030", "file": "theses/T030.md", "type": "these", "partie": "4", "titre": "Deux éléments font naître une croyance de statut", "enonce": "Au-delà de la construction du statut, deux éléments semblent nécessaires : un contexte qui associe une différence reconnue à un ordre de rang d'apparence valide, et une validation de cette association par un public plus large qui l'accepte ou ne la conteste pas. On les retrouve dans la formation du statut des organisations, par association et par évaluateurs tiers.", "titre_en": "Two elements give rise to a status belief", "enonce_en": "Beyond status construction, two elements seem necessary: a context that associates a recognised difference with an apparently valid rank order, and validation of that association by a wider audience that accepts it or does not challenge it. They are found in the formation of organisational status, through association and third-party evaluators.", "citation": "", "pages": [89, 90, 91], "depends_on": ["T028", "E31", "E32"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par T028, les rencontres créent des c
