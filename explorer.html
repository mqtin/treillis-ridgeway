 influent et moins compétent.", "titre_en": "Ridgeway and Diekema: third parties against the dominator", "enonce_en": "(Ridgeway and Diekema.) In four-person same-sex groups, when a confederate aggressively attacks another, the two witnessing participants spontaneously attack the attacker; the dominator gains no more influence than a neutral confederate with the same arguments, and is even perceived as less influential and less competent.", "citation": "", "pages": [31, 32, 33], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nProtocole et résultats (p. 31-32) ; les dominateurs sont jugés moins compétents que les complices neutres (p. 33). Le dispositif ne permettait pas de montrer que la compétence perçue était la base de l'influence (p. 32).", "body_en": "## In Ridgeway\n\nDesign and results (p. 31-32); dominators are perceived as less competent than neutral confederates (p. 33). The design did not allow showing that perceived competence was the basis of influence (p. 32).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3580787}, {"id": "E06", "file": "premisses/E06.md", "type": "etude", "partie": "P", "titre": "Boehm : les sociétés humaines bornent la domination", "enonce": "(Boehm et coll.) Une vaste documentation anthropologique montre des contraintes contre les conduites dominatrices dans une grande variété de sociétés humaines.", "titre_en": "Boehm: human societies constrain domineering", "enonce_en": "(Boehm and colleagues.) Wide anthropological evidence shows constraints on domineering behaviour across a large variety of human societies.", "citation": "", "pages": [32], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCité à l'appui du système de contrôle social révélé par l'expérience avec Diekema (p. 32).", "body_en": "## In Ridgeway\n\nCited in support of the social control system revealed by the experiment with Diekema (p. 32).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3590748}, {"id": "E07", "file": "premisses/E07.md", "type": "etude", "partie": "P", "titre": "Anderson et Kilduff : la dominance passe par la compétence perçue", "enonce": "(Anderson et Kilduff.) Dans des groupes d'étudiants en MBA, les personnalités dominantes obtiennent statut et influence, mais en persuadant leurs coéquipiers de leur compétence supérieure : la compétence perçue médiatise leur ascension.", "titre_en": "Anderson and Kilduff: dominance works through perceived competence", "enonce_en": "(Anderson and Kilduff.) In groups of MBA students, dominant personalities attain status and influence, but by convincing their teammates of their superior competence: perceived competence mediates their rise.", "citation": "", "pages": [33], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nIls ne pouvaient pas revendiquer le statut par la seule dominance, indépendamment de la compétence perçue (p. 33).", "body_en": "## In Ridgeway\n\nThey could not claim status through take-charge dominance alone, independently of perceived competence (p. 33).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3590748}, {"id": "E08", "file": "premisses/E08.md", "type": "etude", "partie": "P", "titre": "Le style affirmé donne une impression de compétence", "enonce": "Une conduite proactive, tournée vers la tâche, dans un style verbal et non verbal affirmé et confiant mais non menaçant, donne une impression de compétence indépendamment de la compétence réelle, et mène au statut ; une dominance menaçante, elle, ne passe pas pour de la compétence.", "titre_en": "Assertive style conveys competence", "enonce_en": "Proactive, task-directed behaviour in an assertive, confident but non-threatening verbal and nonverbal style gives an impression of competence independent of actual competence, and leads to status; threatening dominance is not taken as competence.", "citation": "", "pages": [33, 114], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRésultats rassemblés au chapitre 2 (p. 33) et repris au chapitre 5 : les conduites qui expriment confiance et agentivité créent une impression de compétence, au moins chez les Nord-Américains ; on suppose qu'une telle assurance vient d'une compétence réelle (p. 114). Des écarts mineurs aux usages (des baskets rouges) qui attirent l'attention produisent le même effet (p. 114).", "body_en": "## In Ridgeway\n\nFindings gathered in chapter 2 (p. 33) and taken up in chapter 5: behaviour conveying confidence and agency creates an impression of competence, at least among North Americans; people assume such confidence comes from real competence (p. 114). Minor nonconformity (red sneakers) that attracts attention has the same effect (p. 114).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3600743}, {"id": "E09", "file": "premisses/E09.md", "type": "etude", "partie": "P", "titre": "Anderson et coll. : un consensus de second ordre", "enonce": "(Anderson et coll.) Dans des groupes orientés vers une tâche, les évaluations du statut des autres concordent fortement ; chacun estime avec justesse la vue des autres sur son propre rang, et ceux qui se placent plus haut que les autres ne les placent sont moins aimés et moins acceptés.", "titre_en": "Anderson and colleagues: a second-order consensus", "enonce_en": "(Anderson and colleagues.) In task-oriented groups, ratings of others' status agree strongly; each accurately estimates others' view of their own standing, and those who rate themselves higher than others rate them are less liked and less accepted.", "citation": "", "pages": [40, 51], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\n« Connaître sa place » est ainsi imposé par une pression implicite du groupe (p. 40). L'estimation de son propre statut y est aussi juste que celle de n'importe quel autre membre (p. 51).", "body_en": "## In Ridgeway\n\n\"Knowing your place\" is thus enforced by implicit group pressure (p. 40). Self-estimates of status are as accurate as any other single member's estimate (p. 51).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3610759}, {"id": "E10", "file": "premisses/E10.md", "type": "etude", "partie": "P", "titre": "Troyer et Younts : les attentes d'autrui l'emportent", "enonce": "(Troyer et Younts.) Quand on apprend que ses coéquipiers attendent de soi plus ou moins de compétence qu'on n'en attend soi-même, ce sont les attentes des autres qui prédisent le mieux la conduite et l'influence.", "titre_en": "Troyer and Younts: others' expectations prevail", "enonce_en": "(Troyer and Younts.) When people learn that their teammates expect more or less competence of them than they expect of themselves, it is the others' expectations that best predict behaviour and influence.", "citation": "", "pages": [40], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nÉtude conduite dans le cadre de la théorie des états d'attente (p. 40).", "body_en": "## In Ridgeway\n\nA study conducted within expectation states theory (p. 40).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3610759}, {"id": "E11", "file": "premisses/E11.md", "type": "etude", "partie": "P", "titre": "Anderson, Willer et coll. : on défère quand les autres savent", "enonce": "(Anderson, Willer et coll.) Des participants qui se croient peu doués pour la tâche à venir veulent pourtant un statut élevé si leurs scores restent anonymes ; ils préfèrent un statut bas quand les autres connaissent leur score.", "titre_en": "Anderson, Willer and colleagues: deferring when others know", "enonce_en": "(Anderson, Willer and colleagues.) Participants who believe they have low ability at an upcoming task still want high status if their scores stay anonymous; they prefer low status when the others know their score.", "citation": "", "pages": [41], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLa déférence à la compétence supérieure vient de la pression des attentes des autres, non d'un doute personnel sur ses capacités (p. 41).", "body_en": "## In Ridgeway\n\nDeference to superior competence results from the pressure of others' expectations, not from personal doubts about one's ability (p. 41).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3620746}, {"id": "E12", "file": "premisses/E12.md", "type": "etude", "partie": "P", "titre": "Van Vugt : on quitte les groupes autocratiques", "enonce": "(Van Vugt et coll.) Les membres de groupes dirigés de façon autocratique sont quatre fois plus susceptibles de quitter le groupe que ceux de groupes dirigés démocratiquement.", "titre_en": "Van Vugt: people leave autocratic groups", "enonce_en": "(Van Vugt and colleagues.) Members of autocratically run groups are four times more likely to leave the group than members of democratically led groups.", "citation": "", "pages": [43], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nIllustration de l'instabilité des hiérarchies de dominance (p. 43).", "body_en": "## In Ridgeway\n\nAn illustration of the instability of dominance hierarchies (p. 43).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3620746}, {"id": "E13", "file": "premisses/E13.md", "type": "etude", "partie": "P", "titre": "Hahl et Zuckerman : le soupçon qui entoure le haut statut", "enonce": "(Hahl et Zuckerman.) Parce que la revendication d'un statut élevé a un motif ambigu, les membres de haut statut sont jugés moins attentionnés et moins authentiques que ceux de bas statut, sauf preuve crédible de leurs intentions prosociales.", "titre_en": "Hahl and Zuckerman: the suspicion around high status", "enonce_en": "(Hahl and Zuckerman.) Because a claim to high status has an ambiguous motive, higher-status members are seen as more inconsiderate and inauthentic than lower-status members unless they give credible evidence of prosocial intent.", "citation": "", "pages": [44, 79], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCité pour la tension entre meneurs et suiveurs (p. 44), puis pour le contenu moral des croyances de statut (p. 79).", "body_en": "## In Ridgeway\n\nCited for the tension between leaders and followers (p. 44), then for the moral content of status beliefs (p. 79).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3630743}, {"id": "E14", "file": "premisses/E14.md", "type": "etude", "partie": "P", "titre": "Anderson, Hildreth et Howland : un motif fondamental", "enonce": "(Anderson, Hildreth et Howland.) Le désir de statut remplit quatre critères d'un motif humain fondamental : effets durables sur le bien-être et la santé, large éventail de conduites motivées, fin en soi irréductible à l'appartenance, présence dans toutes les cultures.", "titre_en": "Anderson, Hildreth and Howland: a fundamental motive", "enonce_en": "(Anderson, Hildreth and Howland.) The desire for status meets four criteria of a fundamental human motive: lasting effects on well-being and health, a wide range of motivated behaviour, an end in itself not reducible to belonging, presence across cultures.", "citation": "", "pages": [50], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRevue de la recherche en sciences sociales qui conclut que le désir de statut est un motif fondamental (p. 50).", "body_en": "## In Ridgeway\n\nA review of social scientific research concluding that the desire for status is a fundamental motive (p. 50).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.364075}, {"id": "E15", "file": "premisses/E15.md", "type": "etude", "partie": "P", "titre": "On surveille le statut et on le perçoit juste", "enonce": "On guette les moindres signes de statut, les siens et ceux des autres (le bureau d'angle, les émotions de fierté ou de honte, le ton, le regard), et l'on perçoit avec justesse le statut des autres comme le sien.", "titre_en": "People monitor status and perceive it accurately", "enonce_en": "People vigilantly watch the smallest signs of status, their own and others' (the corner office, displays of pride or shame, voice tone, eye contact), and accurately perceive others' status as well as their own.", "citation": "", "pages": [50, 51], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExemples (p. 50-51) ; la perception qu'un membre a du statut de chacun est très proche du classement moyen du groupe, et l'estimation de son propre statut l'est autant (p. 51).", "body_en": "## In Ridgeway\n\nExamples (p. 50-51); a member's perception of each person's status is very close to the group's average ranking, and so is the estimate of one's own status (p. 51).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.364582}, {"id": "E16", "file": "premisses/E16.md", "type": "etude", "partie": "P", "titre": "Le manque de respect suscite colère et agression", "enonce": "Se sentir manquer de respect provoque typiquement la colère, l'une des sources de colère les plus communes ; préparés à penser au statut, des participants disent qu'ils agresseraient plus fortement quelqu'un qui les a tachés sans s'excuser.", "titre_en": "Disrespect provokes anger and aggression", "enonce_en": "Feeling disrespected typically provokes anger, one of the more common sources of anger; primed to think about status, participants say they would aggress more strongly against someone who spilled something on them without apologising.", "citation": "", "pages": [51, 52], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRevue sur la colère (p. 51-52) et expérience de Griskevicius et coll. (p. 52).", "body_en": "## In Ridgeway\n\nA review on anger (p. 51-52) and the experiment by Griskevicius and colleagues (p. 52).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3655896}, {"id": "E17", "file": "premisses/E17.md", "type": "etude", "partie": "P", "titre": "Menace de statut et choix politiques", "enonce": "Rendre saillant le changement démographique qui fera des Blancs une minorité accroît chez des participants blancs l'adhésion aux idéologies conservatrices et l'opposition aux aides sociales (Craig et Richeson ; Wetts et Willer). Le sentiment d'être méprisé par les élites pèse autant que le déclin économique dans le vote d'électeurs blancs ruraux (Hochschild, Cramer, Mutz) ; la menace sur le statut subjectif nourrit le populisme de droite (Gidron et Hall ; Williams).", "titre_en": "Status threat and political choices", "enonce_en": "Making salient the demographic change that will make whites a minority increases white participants' endorsement of conservative ideologies and opposition to welfare (Craig and Richeson; Wetts and Willer). Feeling looked down on by elites weighs as much as economic decline in the votes of rural white voters (Hochschild, Cramer, Mutz); threat to subjective status fuels right-wing populism (Gidron and Hall; Williams).", "citation": "", "pages": [52, 53, 146], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExposé au chapitre 3 (p. 52-53) et repris au chapitre 6, avec les travaux de Gidron et Hall et de Williams (p. 146).", "body_en": "## In Ridgeway\n\nSet out in chapter 3 (p. 52-53) and taken up in chapter 6, with the work of Gidron and Hall and of Williams (p. 146).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3655896}, {"id": "E18", "file": "premisses/E18.md", "type": "etude", "partie": "P", "titre": "Ce que rapporte le haut statut", "enonce": "Les membres de haut statut reçoivent davantage d'attention et de parole, plus de réponses positives et moins de désaccords, plus d'influence et une plus grande part des récompenses extérieures ; ceux de bas statut, jugés moins compétents, sont jugés plus chaleureux.", "titre_en": "What high status brings", "enonce_en": "High-status members receive more attention and floor time, more positive responses and fewer disagreements, more influence and a greater share of external rewards; low-status members, seen as less competent, are seen as warmer.", "citation": "", "pages": [55], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nSchéma documenté à maintes reprises par la recherche sur les états d'attente (p. 55).", "body_en": "## In Ridgeway\n\nA pattern repeatedly documented by expectation states research (p. 55).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3665898}, {"id": "E19", "file": "premisses/E19.md", "type": "etude", "partie": "P", "titre": "Les émotions du statut", "enonce": "Le haut statut suscite des émotions positives et la fierté ; le bas statut, la tristesse et, en cas d'échec, la culpabilité ou la honte. Ces liens sont des stéréotypes culturels partagés (Tiedens et coll.).", "titre_en": "The emotions of status", "enonce_en": "High status evokes positive emotions and pride; low status, sadness and, when things go wrong, guilt or shame. These links are shared cultural stereotypes (Tiedens and colleagues).", "citation": "", "pages": [57], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nMême quand le groupe réussit, le mérite va aux membres de haut statut, envers qui ceux de bas statut éprouvent de la reconnaissance (p. 57). Dans les vignettes de Tiedens, le membre fier est supposé de haut statut, le coupable ou le triste de bas statut (p. 57).", "body_en": "## In Ridgeway\n\nEven when the group succeeds, credit goes to high-status members, towards whom low-status members feel appreciation (p. 57). In Tiedens's vignettes, the proud member is assumed high status, the guilty or sad one low status (p. 57).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3665898}, {"id": "E20", "file": "premisses/E20.md", "type": "etude", "partie": "P", "titre": "Le statut local prédit le bien-être", "enonce": "(Anderson, Kraus et coll. ; Smith, Tyler et Huo.) Le statut dans les groupes locaux (amis, travail, voisinage) prédit fortement les émotions positives et la satisfaction de vivre, indépendamment du sentiment d'être aimé ; les changements de statut entraînent des changements de bien-être, et le respect dans les groupes en face à face est lié à l'estime de soi.", "titre_en": "Local status predicts well-being", "enonce_en": "(Anderson, Kraus and colleagues; Smith, Tyler and Huo.) Status in local groups (friends, work, neighbourhood) strongly predicts positive feelings and life satisfaction, independently of feeling liked; changes in status bring changes in well-being, and respect in face-to-face groups is linked to self-esteem.", "citation": "", "pages": [58], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLa plombière respectée de ses pairs peut être plus heureuse que le médecin de bas statut parmi ses collègues (p. 58).", "body_en": "## In Ridgeway\n\nThe plumber respected among her fellow plumbers may feel more well-being than the physician who is low status among her colleagues (p. 58).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.367589}, {"id": "E21", "file": "premisses/E21.md", "type": "etude", "partie": "P", "titre": "Hays et Greer : le désir de statut ne se rassasie pas", "enonce": "(Hays et Greer.) La préférence pour une position croît sans plafond avec le statut qu'elle confère, alors que la préférence pour le pouvoir plafonne ; en bas de la hiérarchie on cherche plutôt du pouvoir, plus haut plutôt du statut, y compris chez les golfeurs professionnels.", "titre_en": "Hays and Greer: the desire for status is not satiated", "enonce_en": "(Hays and Greer.) Preference for a position rises without ceiling with the status it confers, while preference for power levels off; at the bottom of the hierarchy people seek power, higher up status, including among professional golfers.", "citation": "", "pages": [59, 60], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExpériences et étude d'archives (p. 59). Leur interprétation : une fois assez de pouvoir pour contrôler sa situation, le pouvoir ajouté rapporte peu ; le statut, lui, ne se possède jamais une fois pour toutes (p. 59-60).", "body_en": "## In Ridgeway\n\nExperiments and an archival study (p. 59). Their interpretation: once there is enough power to control one's circumstances, added power brings little; status, by contrast, is never possessed once and for all (p. 59-60).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.367589}, {"id": "E22", "file": "premisses/E22.md", "type": "etude", "partie": "P", "titre": "Le statut tourne vers les autres, le pouvoir vers soi", "enonce": "(Blader et coll.) Les personnes de haut statut dans un contexte interpersonnel cherchent davantage à adopter le point de vue d'autrui que celles de bas statut ; les positions de pouvoir rendent au contraire plus égocentrique.", "titre_en": "Status orients towards others, power towards self", "enonce_en": "(Blader and colleagues.) People of high status in an interpersonal context engage in more perspective-taking than low-status people; positions of power, by contrast, make people more egocentric.", "citation": "", "pages": [60], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCette attention est intéressée (que pensez-vous de moi ?) ; les personnes de bas statut prédisent en fait mieux la conduite des autres, et l'effet disparaît quand le statut local devient position de pouvoir (p. 60).", "body_en": "## In Ridgeway\n\nThis attention is self-interested (what do you think of me?); low-status people actually predict others' behaviour better, and the effect disappears when local status becomes a position of power (p. 60).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3688717}, {"id": "E23", "file": "premisses/E23.md", "type": "etude", "partie": "P", "titre": "Ridgeway et Nakagawa : le respect pour la déférence raisonnable", "enonce": "(Ridgeway et Nakagawa, trois études.) Le membre de bas statut qui défère dans un désaccord est respecté comme raisonnable, qu'il défère à l'évaluateur ou à un autre ; 70 % des participants choisiraient de déférer en anticipant ce respect ; et le respect reçu accroît l'engagement envers le groupe et réduit l'envie de le quitter.", "titre_en": "Ridgeway and Nakagawa: respect for reasonable deference", "enonce_en": "(Ridgeway and Nakagawa, three studies.) The low-status member who defers in a disagreement is respected as reasonable, whether deferring to the evaluator or to another; 70 percent of participants would choose deference, anticipating that respect; and the respect received increases commitment to the group and reduces the wish to leave.", "citation": "", "pages": [62, 63], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes trois études (p. 62-63). Que l'on récompense autant la déférence envers un autre qu'envers soi montre un processus normatif (p. 63).", "body_en": "## In Ridgeway\n\nThe three studies (p. 62-63). That deference to another is rewarded as much as deference to self shows a normative process (p. 63).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3698702}, {"id": "E24", "file": "premisses/E24.md", "type": "etude", "partie": "P", "titre": "Les hiérarchies interpersonnelles sont stables", "enonce": "Les hiérarchies de statut interpersonnelles se forment vite et, une fois formées, se maintiennent d'une réunion du groupe à l'autre : elles ont une « adhérence » qui résiste au changement.", "titre_en": "Interpersonal hierarchies are stable", "enonce_en": "Interpersonal status hierarchies form quickly and, once formed, are maintained across repeated meetings of the group: they have a \"stickiness\" that resists change.", "citation": "", "pages": [64, 65, 156], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nL'une des observations empiriques les plus communes (p. 64-65), depuis les premières études (p. 156).", "body_en": "## In Ridgeway\n\nOne of the most common empirical observations (p. 64-65), since the earliest studies (p. 156).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3698702}, {"id": "E25", "file": "premisses/E25.md", "type": "etude", "partie": "P", "titre": "Fiske : les stéréotypes de groupe contiennent des croyances de statut", "enonce": "(Fiske et coll.) Les stéréotypes américains de tous les groupes qui structurent l'inégalité (race, âge, genre, classe, profession, éducation) comportent des croyances de statut ; ils sont consensuels et tenus pour ce que pense « la plupart des Américains » ; statut et compétence y sont presque confondus (r ≈ 0,90), et les groupes de haut statut y sont jugés moins chaleureux.", "titre_en": "Fiske: group stereotypes contain status beliefs", "enonce_en": "(Fiske and colleagues.) American stereotypes of all the groups that pattern inequality (race, age, gender, class, occupation, education) contain status beliefs; they are consensual and taken as what \"most Americans\" think; status and competence nearly define each other (r ≈ .90), and high-status groups are seen as less warm.", "citation": "", "pages": [75, 76, 78, 79], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDonnées sur le caractère de troisième ordre (p. 75-76), sur la corrélation statut-compétence (p. 78) et sur la moindre chaleur prêtée aux groupes de haut statut (p. 79).", "body_en": "## In Ridgeway\n\nEvidence on the third-order character (p. 75-76), on the status-competence correlation (p. 78) and on the lower warmth attributed to high-status groups (p. 79).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.370871}, {"id": "E26", "file": "premisses/E26.md", "type": "etude", "partie": "P", "titre": "Bianchi : les croyances de statut des programmeurs libres", "enonce": "(Bianchi et coll.) Les programmeurs du logiciel libre forment leurs propres croyances de statut sur les signes de valeur, et des normes pour ignorer certaines croyances de la société (éducation, âge) ; une proposition signée d'un programmeur de haut statut est plus souvent acceptée.", "titre_en": "Bianchi: the status beliefs of open-source programmers", "enonce_en": "(Bianchi and colleagues.) Open-source programmers form their own status beliefs about the signs of worth, and norms for ignoring some wider beliefs (education, age); a suggestion bearing the name of a high-status programmer is more likely to be accepted.", "citation": "", "pages": [76, 92], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExemple de croyances propres à une communauté (p. 76), repris pour l'avantage de statut en ligne (p. 92).", "body_en": "## In Ridgeway\n\nAn example of community-specific beliefs (p. 76), taken up for status advantage online (p. 92).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3718703}, {"id": "E27", "file": "premisses/E27.md", "type": "etude", "partie": "P", "titre": "Le savoir commun autorise la coordination risquée", "enonce": "Dans des jeux où travailler ensemble rapporte plus, mais seulement si les deux le font, les participants prennent plus volontiers ce risque quand les règles sont un savoir commun que quand elles sont seulement partagées ou privées.", "titre_en": "Common knowledge licenses risky coordination", "enonce_en": "In games where working together pays more, but only if both do, participants more readily take that risk when the rules are common knowledge than when they are merely shared or private.", "citation": "", "pages": [75], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes chercheurs en concluent que l'esprit traite le savoir commun comme une catégorie à part, qui autorise à se coordonner pour un gain mutuel (p. 75).", "body_en": "## In Ridgeway\n\nThe researchers conclude that the mind represents common knowledge as a distinct category that licenses coordination for mutual gain (p. 75).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3718703}, {"id": "E28", "file": "premisses/E28.md", "type": "etude", "partie": "P", "titre": "Les expériences de la construction du statut", "enonce": "Une différence artificielle (un « style de réponse »), associée à une petite différence de paie, suffit, après deux rencontres où la paie produit une différence d'influence, à faire naître chez tous des croyances de statut de troisième ordre favorables au groupe mieux payé, jugé aussi moins attentionné ; sans la hiérarchie d'influence, ou si un participant la conteste, aucune croyance ne se forme. Les croyances se transmettent ensuite par la manière dont on traite les autres.", "titre_en": "The status construction experiments", "enonce_en": "An artificial difference (a \"response style\"), tied to a small pay difference, is enough, after two encounters in which pay produces a difference in influence, to give everyone third-order status beliefs favouring the better-paid group, also seen as less considerate; without the influence hierarchy, or if a participant challenges it, no belief forms. Beliefs are then passed on through how others are treated.", "citation": "", "pages": [84, 85, 86], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nSérie d'expériences (p. 84-85) ; contestation (p. 85) ; tout facteur biaisant, pas seulement la paie (p. 86) ; transmission par le traitement, simulations de diffusion et données interculturelles de Brashears (p. 86).", "body_en": "## In Ridgeway\n\nA series of experiments (p. 84-85); challenge (p. 85); any biasing factor, not only pay (p. 86); transmission through treatment, diffusion simulations and Brashears's cross-cultural data (p. 86).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3728707}, {"id": "E29", "file": "premisses/E29.md", "type": "etude", "partie": "P", "titre": "Hamilton : on infère spontanément les traits d'un groupe", "enonce": "(Hamilton et coll.) Avec très peu d'indices qu'un individu appartient à un groupe dont les membres agissent de même, on infère spontanément les traits du membre typique de tout le groupe.", "titre_en": "Hamilton: people spontaneously infer group traits", "enonce_en": "(Hamilton and colleagues.) With very little evidence that an individual belongs to a group whose members act alike, people spontaneously infer the traits of the typical member of the whole group.", "citation": "", "pages": [85], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes groupes étant fondamentaux dans la vie humaine, la pensée, même automatique, est accordée aux groupes autant qu'aux individus (p. 85).", "body_en": "## In Ridgeway\n\nGroups being fundamental to human life, thinking, even at an automatic level, is tuned to groups as well as individuals (p. 85).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3738718}, {"id": "E30", "file": "premisses/E30.md", "type": "etude", "partie": "P", "titre": "Wood, Eagly et Huber : division sexuelle du travail et ressources", "enonce": "(Wood et Eagly ; Huber.) Toutes les sociétés développent une division sexuelle du travail, enracinée dans l'interdépendance pour la reproduction ; la domination masculine s'associe aux circonstances où des contraintes biologiques (force du haut du corps, mobilité des mères allaitantes) donnent aux hommes le contrôle de la production des ressources valorisées.", "titre_en": "Wood, Eagly and Huber: gendered division of labour and resources", "enonce_en": "(Wood and Eagly; Huber.) All societies develop a gendered division of labour, rooted in interdependence for reproduction; male dominance is associated with circumstances in which biological constraints (upper-body strength, the mobility of nursing mothers) give men control over the production of valued resources.", "citation": "", "pages": [87, 88], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCe sont des théories compatibles avec les données ; les origines historiques de la domination masculine restent inconnues (p. 87-88).", "body_en": "## In Ridgeway\n\nThese are theories consistent with the evidence; the historical origins of male dominance remain unknown (p. 87-88).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3738718}, {"id": "E31", "file": "premisses/E31.md", "type": "etude", "partie": "P", "titre": "Une autorité légitime suffit à créer une croyance de statut", "enonce": "Quand une autorité légitime fournit une information d'apparence valide reliant une différence de groupe (entre universités) à des destins hiérarchisés (le succès économique des diplômés), les participants forment des croyances de statut sur cette différence.", "titre_en": "A legitimate authority suffices to create a status belief", "enonce_en": "When a legitimate authority provides apparently valid information linking a group difference (between colleges) to ranked life outcomes (graduates' economic success), participants form status beliefs about that difference.", "citation": "", "pages": [89, 90], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nComme dans les expériences de construction du statut (p. 89-90).", "body_en": "## In Ridgeway\n\nAs in the status construction experiments (p. 89-90).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3750207}, {"id": "E32", "file": "premisses/E32.md", "type": "etude", "partie": "P", "titre": "Le statut des organisations", "enonce": "(Sauder et coll.) Le statut des organisations naît et se propage par association (s'allier à une organisation prestigieuse élève) et par des évaluateurs tiers : critiques, guides, classements ; ces classements biaisent les jugements de qualité et donnent un avantage sur le marché.", "titre_en": "The status of organisations", "enonce_en": "(Sauder and colleagues.) Organisational status arises and spreads through association (partnering with a prestigious organisation raises one's own) and through third-party evaluators: critics, guides, rankings; these rankings bias judgements of quality and give market advantage.", "citation": "", "pages": [90, 91, 92], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nL'application de messagerie qui s'associe à Facebook, le guide Michelin, le classement de *U.S. News & World Report*, qui pèse même pour ceux qui le jugent douteux, parce que sa publicité en fait un savoir commun (p. 90-91) ; avantages sur le marché (p. 91-92).", "body_en": "## In Ridgeway\n\nThe messaging app that partners with Facebook, the Michelin guide, the *U.S. News & World Report* ranking, which matters even to those who doubt it, because its publicity makes it common knowledge (p. 90-91); market advantages (p. 91-92).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3760276}, {"id": "E33", "file": "premisses/E33.md", "type": "etude", "partie": "P", "titre": "Les expériences sur l'inférence de troisième ordre", "enonce": "Des évaluateurs qui jugent une candidate au poste de chef de police un peu meilleure que le candidat peuvent préférer l'homme, plus facile à « vendre » ; on préfère le candidat aux diplômes prestigieux comme choix sûr, même si l'on sait les autres ouverts à un candidat hors norme, tant que cette ouverture n'est pas un savoir commun.", "titre_en": "The third-order inference experiments", "enonce_en": "Evaluators who judge a woman candidate for police chief slightly better than the man may still favour the man, easier to \"sell\"; people favour the candidate with high-status credentials as the safe choice, even knowing others may be open to an unconventional one, as long as that openness is not common knowledge.", "citation": "", "pages": [95], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExpériences de Ridgeway et de ses collègues (p. 95).", "body_en": "## In Ridgeway\n\nExperiments by Ridgeway and her colleagues (p. 95).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3766491}, {"id": "E34", "file": "premisses/E34.md", "type": "etude", "partie": "P", "titre": "Dilemmes sociaux : le statut récompense qui contribue", "enonce": "Dans les dilemmes sociaux, où contribuer coûte à l'individu alors que tous gagneraient à coopérer, les groupes accordent statut et influence à ceux qui contribuent malgré le coût, quelle que soit leur compétence perçue ; à l'inverse, quand la réussite est cruciale, ils défèrent à un membre très compétent même s'il est égoïste.", "titre_en": "Social dilemmas: status rewards contributors", "enonce_en": "In social dilemmas, where contributing is costly to the individual although all would gain from cooperating, groups award status and influence to those who contribute despite the cost, whatever their perceived competence; conversely, when success is crucial, they defer to a highly competent member even if selfish.", "citation": "", "pages": [98, 99], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nDilemmes sociaux (p. 98-99) ; le coéquipier arrogant et doué pendant le grand match (p. 99).", "body_en": "## In Ridgeway\n\nSocial dilemmas (p. 98-99); the arrogant, gifted teammate during the big game (p. 99).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3766491}, {"id": "E35", "file": "premisses/E35.md", "type": "etude", "partie": "P", "titre": "Kilduff et Galinsky : un état d'esprit suffit à fonder une hiérarchie", "enonce": "(Kilduff et Galinsky.) Dans des trios homogènes, le membre placé au hasard dans un état d'esprit d'« approche » agit plus proactivement et devient de plus haut statut que celui placé en « prévention » ; la différence persiste quand le groupe se retrouve un ou deux jours plus tard, indépendamment de la personnalité.", "titre_en": "Kilduff and Galinsky: a mind-set suffices to found a hierarchy", "enonce_en": "(Kilduff and Galinsky.) In homogeneous triads, the member randomly given an \"approach\" mind-set acts more proactively and gains higher status than the one given a \"prevention\" focus; the difference persists when the group meets again a day or two later, independently of personality.", "citation": "", "pages": [102, 103], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nProtocole et résultats (p. 102-103).", "body_en": "## In Ridgeway\n\nDesign and results (p. 102-103).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3776546}, {"id": "E36", "file": "premisses/E36.md", "type": "etude", "partie": "P", "titre": "Les indices se combinent selon leur pertinence", "enonce": "Les membres d'un groupe agissent comme s'ils pondéraient et combinaient les implications de tous les indices de statut saillants selon leur pertinence pour la tâche, avec un effet d'incohérence (un indice qui contredit ce qu'on sait pèse plus) et un effet d'atténuation (un indice qui confirme pèse de moins en moins).", "titre_en": "Cues combine by relevance", "enonce_en": "Group members act as if they weighted and combined the implications of all salient status cues by their relevance to the task, with an inconsistency effect (a cue that contradicts what is known weighs more) and an attenuation effect (a confirming cue weighs less and less).", "citation": "", "pages": [104, 105], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nL'informaticienne dans un groupe mixte travaillant sur une tâche de programmation ; le chirurgien formé à Harvard qui se révèle afro-américain (p. 104-105).", "body_en": "## In Ridgeway\n\nThe woman computer scientist in a mixed-sex group working on a web-programming task; the Harvard-trained surgeon who turns out to be African American (p. 104-105).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3776546}, {"id": "E37", "file": "premisses/E37.md", "type": "etude", "partie": "P", "titre": "Les effets des caractéristiques passent par les attentes", "enonce": "Une méta-analyse montre que l'effet des caractéristiques de statut (éducation, race, genre) sur la déférence et l'influence passe par les attentes de performance ; la simple connaissance des caractéristiques d'un partenaire suffit à modifier l'acceptation de son influence.", "titre_en": "The effects of characteristics run through expectations", "enonce_en": "A meta-analysis shows that the effect of status characteristics (education, race, gender) on deference and influence runs through performance expectations; merely knowing a partner's characteristics is enough to change the acceptance of their influence.", "citation": "", "pages": [108], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCes effets ne s'expliquent pas par des différences préalables de personnalité ou de conduite entre groupes (p. 108).", "body_en": "## In Ridgeway\n\nThese effects cannot be explained by preexisting differences in personality or behaviour between groups (p. 108).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3786552}, {"id": "E38", "file": "premisses/E38.md", "type": "etude", "partie": "P", "titre": "Dovidio : l'affirmation suit le genre de la tâche", "enonce": "(Dovidio et coll.) Dans des duos mixtes, les hommes sont un peu plus affirmés, en paroles et en gestes, sur une tâche neutre, nettement plus sur une tâche masculine ; sur une tâche féminine, la hiérarchie s'inverse.", "titre_en": "Dovidio: assertiveness follows the gender typing of the task", "enonce_en": "(Dovidio and colleagues.) In mixed-sex dyads, men are modestly more assertive, verbally and nonverbally, on a neutral task, clearly more on a masculine-typed task; on a feminine-typed task, the hierarchy reverses.", "citation": "", "pages": [109, 110], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLa conduite non verbale, souvent inconsciente, réagit finement aux avantages d'attente (p. 109-110).", "body_en": "## In Ridgeway\n\nNonverbal behaviour, often unconscious, responds subtly to expectation advantages (p. 109-110).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3786552}, {"id": "E39", "file": "premisses/E39.md", "type": "etude", "partie": "P", "titre": "Shih : l'attente modifie la performance", "enonce": "(Shih et coll.) La performance en mathématiques de femmes asiatiques baisse quand on rend saillant leur genre et monte quand on rend saillante leur race.", "titre_en": "Shih: expectations change performance", "enonce_en": "(Shih and colleagues.) Asian women's performance on a math test goes down when their gender is made salient and up when their race is made salient.", "citation": "", "pages": [110], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nL'effet, documenté par la recherche sur les états d'attente, équivaut à la « menace du stéréotype » (p. 110).", "body_en": "## In Ridgeway\n\nThe effect, documented by expectation states research, is equivalent to \"stereotype threat\" (p. 110).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3796556}, {"id": "E40", "file": "premisses/E40.md", "type": "etude", "partie": "P", "titre": "Doubles standards et critères mouvants", "enonce": "Les doubles standards biaisent l'auto-évaluation des femmes dans les tâches masculines et leur orientation professionnelle (Correll) ; des professionnels de l'investissement suivent moins les recommandations des femmes ; pour un poste de chef de police, on justifie la préférence pour les hommes par le critère, études ou expérience, qui les favorise (Uhlmann et Cohen).", "titre_en": "Double standards and shifting criteria", "enonce_en": "Double standards bias women's self-assessments at male-typed tasks and their career choices (Correll); investment professionals attend less to women's recommendations; for a police chief job, people justify preferring men by whichever criterion, education or experience, favours them (Uhlmann and Cohen).", "citation": "", "pages": [111], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes trois études (p. 111).", "body_en": "## In Ridgeway\n\nThe three studies (p. 111).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3796556}, {"id": "E41", "file": "premisses/E41.md", "type": "etude", "partie": "P", "titre": "Les récompenses créent des attentes", "enonce": "Un « honneur » sans valeur matérielle (être invité à une réception avec un dignitaire) donne plus d'influence dans la tâche suivante (Hysom et coll.) ; des jetons de même valeur mais de la couleur associée aux participants de haut statut se vendent plus cher (Thye).", "titre_en": "Rewards create expectations", "enonce_en": "An \"honour\" with no material value (being invited to a reception with a dignitary) brings more influence in the next task (Hysom and colleagues); chips of the same value but of the colour associated with high-status participants fetch higher prices (Thye).", "citation": "", "pages": [112, 113], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nLes deux expériences (p. 112-113).", "body_en": "## In Ridgeway\n\nThe two experiments (p. 112-113).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3811965}, {"id": "E42", "file": "premisses/E42.md", "type": "etude", "partie": "P", "titre": "Bendersky et Shah : le statut des extravertis décline", "enonce": "(Bendersky et Shah.) Dans des équipes de MBA notées, les extravertis gagnent d'abord du statut puis le perdent, les autres étant déçus de leur performance ; les membres plus névrotiques, d'abord bas, montent un peu.", "titre_en": "Bendersky and Shah: extraverts' status declines", "enonce_en": "(Bendersky and Shah.) In graded MBA teams, extraverts gain status at first and then lose it, as others are disappointed with their performance; more neurotic members, low at first, rise a little.", "citation": "", "pages": [115, 116], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nNi l'extraversion ni la dominance ne sont particulièrement corrélées à la compétence réelle (p. 115-116).", "body_en": "## In Ridgeway\n\nNeither extraversion nor dominance is particularly correlated with actual competence (p. 115-116).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3811965}, {"id": "E43", "file": "premisses/E43.md", "type": "etude", "partie": "P", "titre": "La générosité des membres de haut statut", "enonce": "Les membres de haut statut se montrent plus généreux et plus coopératifs que ceux de bas statut, surtout quand leur légitimité est menacée ; cette générosité peut disparaître quand la hiérarchie devient plus légitime.", "titre_en": "The generosity of high-status members", "enonce_en": "High-status members show more generosity and cooperation than low-status members, especially when their legitimacy is threatened; this generosity may disappear as the hierarchy becomes more legitimate.", "citation": "", "pages": [116], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nReflet de l'insécurité du statut et du besoin de prouver son orientation vers le groupe (p. 116).", "body_en": "## In Ridgeway\n\nA reflection of the insecurity of status and of the need to prove group orientation (p. 116).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.382203}, {"id": "E44", "file": "premisses/E44.md", "type": "etude", "partie": "P", "titre": "L'obéissance suit les caractéristiques diffuses", "enonce": "(Ridgeway et coll.) À influence égale, un membre de haut statut avantagé par des caractéristiques diffuses (plus âgé, titulaire d'un master) obtient plus d'obéissance à ses ordres qu'un membre devenu influent par un meilleur score à un test d'expertise malgré un moindre diplôme.", "titre_en": "Compliance follows diffuse characteristics", "enonce_en": "(Ridgeway and colleagues.) At equal influence, a high-status member advantaged by diffuse characteristics (older, holding an MA) obtains more compliance with directives than a member who became influential through a higher score on an expertise test despite less education.", "citation": "", "pages": [117, 118], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nProtocole et résultat (p. 117-118).", "body_en": "## In Ridgeway\n\nDesign and result (p. 117-118).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.382203}, {"id": "E45", "file": "premisses/E45.md", "type": "etude", "partie": "P", "titre": "Le rejet des subordonnés qui s'affirment", "enonce": "Une conduite dominante et autopromotionnelle d'une femme blanche ou d'un homme afro-américain en contexte professionnel suscite résistance et antipathie, et réduit leur employabilité ; chez les femmes, ce sont les conduites de dominance explicites (les ordres) qui la déclenchent ; les femmes de couleur échappent parfois au rejet par une « invisibilité intersectionnelle ».", "titre_en": "Backlash against assertive subordinates", "enonce_en": "Dominant, self-promoting behaviour from a white woman or an African American man in a professional context evokes resistance and dislike, and reduces their hireability; for women, it is explicit dominance (directives) that triggers it; women of color sometimes escape backlash through \"intersectional invisibility\".", "citation": "", "pages": [52, 118, 119], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nTravaux de Rudman et coll. et réaction envers les hommes afro-américains (p. 52) ; études et méta-analyse (p. 118) ; invisibilité intersectionnelle (p. 118-119).", "body_en": "## In Ridgeway\n\nWork by Rudman and colleagues and the reaction to African American men (p. 52); studies and a meta-analysis (p. 118); intersectional invisibility (p. 118-119).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.383709}, {"id": "E46", "file": "premisses/E46.md", "type": "etude", "partie": "P", "titre": "Korver-Glenn : les biais raciaux dans l'immobilier", "enonce": "(Korver-Glenn.) Les biais de statut raciaux dans les transactions immobilières produisent une discrimination qui s'accumule au fil des étapes de l'achat ou de la vente d'un logement.", "titre_en": "Korver-Glenn: racial bias in real estate", "enonce_en": "(Korver-Glenn.) Racial status biases in real estate transactions produce discrimination that accumulates over the stages of buying or selling a home.", "citation": "", "pages": [131], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExemple clair de l'accumulation de petits biais (p. 131).", "body_en": "## In Ridgeway\n\nA clear example of small biases accumulating (p. 131).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.383709}, {"id": "E47", "file": "premisses/E47.md", "type": "etude", "partie": "P", "titre": "Des pratiques organisationnelles biaisées", "enonce": "Les présupposés sur les groupes dominants s'inscrivent dans les structures des organisations : la semaine de travail suppose un « travailleur idéal » sans charge d'enfants, le surtravail des postes bien payés pénalise les femmes, l'école valorise des styles de classe moyenne blanche, et des grilles de classification des emplois, construites en comité, paient mieux les emplois masculins (Nelson et Bridges).", "titre_en": "Biased organisational practices", "enonce_en": "Assumptions about dominant groups are embedded in organisational structures: the workweek implies an \"ideal worker\" with no childcare duties, overwork in well-paid jobs penalises women, schools value white middle-class styles, and job classification systems, built in committee, pay men's jobs better (Nelson and Bridges).", "citation": "", "pages": [132, 133], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nExemples (p. 132) ; ces pratiques persistent par inertie (p. 132) ; le cas des grilles de classification (p. 133).", "body_en": "## In Ridgeway\n\nExamples (p. 132); these practices persist through inertia (p. 132); the case of classification systems (p. 133).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3847175}, {"id": "E48", "file": "premisses/E48.md", "type": "etude", "partie": "P", "titre": "Zou et Cheryan : deux dimensions de la position raciale", "enonce": "(Zou et Cheryan.) La position des groupes raciaux aux États-Unis se lit sur deux dimensions : l'(in)compétence perçue et l'« étrangeté » culturelle. Les Blancs sont vus compétents et culturellement adaptés, les Asiatiques compétents mais très étrangers, les Latinos moins compétents et un peu étrangers, les Afro-Américains moins compétents mais peu étrangers.", "titre_en": "Zou and Cheryan: two dimensions of racial position", "enonce_en": "(Zou and Cheryan.) The position of racial groups in the United States reads on two dimensions: perceived (in)competence and cultural \"foreignness\". Whites are seen as competent and culturally adept, Asians as competent but very foreign, Latinx people as less competent and somewhat foreign, African Americans as lower in competence but only slightly foreign.", "citation": "", "pages": [138], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRidgeway lit la première dimension comme plus essentialisée, la seconde comme acquise (p. 138).", "body_en": "## In Ridgeway\n\nRidgeway reads the first dimension as more essentialised, the second as acquirable (p. 138).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3847175}, {"id": "E49", "file": "premisses/E49.md", "type": "etude", "partie": "P", "titre": "Turco : la culture sportive du capital-investissement", "enonce": "(Turco.) Dans le capital-investissement, culture masculine où le sport scelle les liens d'affaires, les rares investisseurs afro-américains pouvaient s'intégrer en montrant leur savoir sportif ; les femmes, même en cultivant le sport, restaient exclues des réunions où se nouaient les affaires.", "titre_en": "Turco: the sports culture of leveraged buyouts", "enonce_en": "(Turco.) In the leveraged buyout industry, a male culture where sport seals business ties, the few African American investors could fit in by displaying sports knowledge; women, even when cultivating sport, remained excluded from the gatherings where deals were made.", "citation": "", "pages": [139], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nÉtude citée au chapitre 6 (p. 139).", "body_en": "## In Ridgeway\n\nA study cited in chapter 6 (p. 139).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3857746}, {"id": "E50", "file": "premisses/E50.md", "type": "etude", "partie": "P", "titre": "Les indices de classe forment un ensemble flou", "enonce": "Les Américains tiennent la classe pour acquise et changeante, moins essentielle que la race ou le genre ; on lit pourtant la classe sur les visages, par des signes d'émotion positive ; et les indices de classe (profession, éducation, accent, tenue, goûts, quartier, origine) forment un ensemble flou.", "titre_en": "Class cues form a fuzzy set", "enonce_en": "Americans hold class to be achieved and changeable, less essential than race or gender; yet people read class from faces, through cues of positive emotion; and class cues (occupation, education, accent, dress, tastes, residence, background) form a fuzzy set.", "citation": "", "pages": [140], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nRecherche psychologique citée au chapitre 6, avec le rappel de l'habitus chez Bourdieu (p. 140).", "body_en": "## In Ridgeway\n\nPsychological research cited in chapter 6, with a reminder of Bourdieu's habitus (p. 140).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3867736}, {"id": "E51", "file": "premisses/E51.md", "type": "etude", "partie": "P", "titre": "Les croyances de genre changent peu", "enonce": "Malgré l'entrée massive des femmes dans l'emploi, les croyances de genre n'ont changé que modestement : les femmes sont vues plus proches des hommes pour l'« indépendance » et l'« intelligence », mais en retrait pour l'« affirmation », la « compétitivité » et l'« audace », et toujours plus chaleureuses.", "titre_en": "Gender beliefs change little", "enonce_en": "Despite women's massive entry into paid work, gender beliefs have changed only modestly: women are seen as closer to men in \"independence\" and \"intelligence\", but behind in \"assertiveness\", \"competitiveness\" and \"boldness\", and still warmer.", "citation": "", "pages": [143], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nFaute de changement équivalent dans le partage des charges familiales (p. 143).", "body_en": "## In Ridgeway\n\nFor want of an equivalent change in family responsibilities (p. 143).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3867736}, {"id": "E52", "file": "premisses/E52.md", "type": "etude", "partie": "P", "titre": "Les groupes défavorisés partagent les croyances de troisième ordre", "enonce": "Les personnes de bas statut socio-économique ne diffèrent pas des autres dans les croyances qu'elles prêtent à « la plupart des gens » sur leurs groupes ; elles les endossent moins personnellement.", "titre_en": "Disadvantaged groups share the third-order beliefs", "enonce_en": "People of lower socioeconomic status do not differ from others in the beliefs they attribute to \"most people\" about their groups; they endorse them less personally.", "citation": "", "pages": [144], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nÉtudes citées au chapitre 6 (p. 144).", "body_en": "## In Ridgeway\n\nStudies cited in chapter 6 (p. 144).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.387775}, {"id": "E53", "file": "premisses/E53.md", "type": "etude", "partie": "P", "titre": "La diversité vécue comme menace", "enonce": "Des Blancs, mais non des membres de minorités, s'inquiètent davantage d'injustice en postulant dans une organisation affichant une politique de diversité ; des hommes blancs y montrent une réaction cardiovasculaire de menace.", "titre_en": "Diversity felt as a threat", "enonce_en": "Whites, but not racial minorities, express more concern about unfairness when applying to an organisation with pro-diversity policies; white men show cardiovascular threat responses.", "citation": "", "pages": [145], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nÉtudes de psychologie sociale citées au chapitre 6 (p. 145).", "body_en": "## In Ridgeway\n\nSocial psychological studies cited in chapter 6 (p. 145).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.387775}, {"id": "E54", "file": "premisses/E54.md", "type": "etude", "partie": "P", "titre": "Major : reconnaître le biais est désagréable", "enonce": "(Major et coll.) Reconnaître qu'on a été avantagé sans le mériter, ou discriminé plutôt que jugé sur son mérite, suscite des émotions désagréables.", "titre_en": "Major: recognising bias is unpleasant", "enonce_en": "(Major and colleagues.) Recognising that one was advantaged without deserving it, or discriminated against rather than judged on merit, evokes unpleasant emotions.", "citation": "", "pages": [148, 149], "depends_on": [], "contre": [], "lien_explicite": null, "statut_revision": "brouillon", "body": "## Chez Ridgeway\n\nCité à l'appui du déni du statut (p. 148-149).", "body_en": "## In Ridgeway\n\nCited in support of the denial of status (p. 148-149).", "sections_en": ["In Ridgeway"], "demo_refs_en": [], "sections": ["Chez Ridgeway"], "demo_refs": [], "mentions": [], "corollaires": [], "mtime": 1794590968.3887732}, {"id": "T001", "file": "theses/T001.md", "type": "these", "partie": "1", "titre": "Le statut, une invention culturelle", "enonce": "Les hiérarchies de statut sont une invention humaine pour gérer les situations d'interdépendance coopérative et compétitive. Elles résultent d'un schème culturel, appris et partagé, qui s'est peut-être posé sur des résidus évolutifs mais ne s'y réduit pas, comme le langage.", "titre_en": "Status as a cultural invention", "enonce_en": "Status hierarchies are a human invention for managing situations of cooperative and competitive interdependence. They result from a cultural schema, learned and shared, which may rest on evolutionary residues but is not reducible to them, like language.", "citation": "“Status hierarchies, I claim, are a human invention to manage social situations”", "pages": [2, 3, 4, 10], "depends_on": ["D03", "D04"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Argumentation\n\n1. La condition humaine est faite d'une tension : on dépend des autres pour vivre et obtenir ce qu'on veut, et cette coopération crée une rivalité sur ses termes et sur ses fruits (D03) (p. 2-3).\n2. Les hiérarchies de statut sont l'invention qui gère cette tension : un schème culturel, ensemble de règles apprises et partagées (D04), dont la mise en œuvre produit la hiérarchie observable (p. 3).\n3. La thèse est controversée, car la hiérarchie est ancienne, universelle, et certains lui donnent des racines primates ; mais le statut fonctionne à l'évidence comme un processus socioculturel de croyances et d'attentes partagées (p. 4).\n4. Le statut est donc comme le langage : profondément culturel et appris, mais quelque chose qu'on est peut-être prédisposé à apprendre (p. 4). ∎\n\n## Scolie\n\nRidgeway annonce une « histoire profonde » du statut, ni revue descriptive de la recherche ni guide pour obtenir du statut (p. 2). Son terrain est surtout les États-Unis contemporains (p. 10).", "body_en": "## Argument\n\n1. The human condition contains a tension: people depend on others to live and get what they want, and this cooperation creates a rivalry over its terms and its fruits (D03) (p. 2-3).\n2. Status hierarchies are the invention that manages this tension: a cultural schema, a set of learned and shared rules (D04), whose enactment produces the observable hierarchy (p. 3).\n3. The claim is controversial, since hierarchy is ancient, universal, and some give it primate roots; but status clearly functions as a sociocultural process of shared beliefs and expectations (p. 4).\n4. Status is therefore like language: deeply cultural and learned, but something we may be predisposed to learn (p. 4). ∎\n\n## Scholium\n\nRidgeway announces a \"deep story\" of status, neither a descriptive review of research nor a how-to guide for attaining status (p. 2). Her ground is mostly the contemporary United States (p. 10).", "sections_en": ["Argument", "Scholium"], "demo_refs_en": ["D03", "D04"], "sections": ["Argumentation", "Scolie"], "demo_refs": ["D03", "D04"], "mentions": ["D03", "D04"], "corollaires": [], "mtime": 1794590968.3994467}, {"id": "T002", "file": "theses/T002.md", "type": "these", "partie": "1", "titre": "Le statut est relationnel, social, donné, consensuel et public", "enonce": "Le statut est une relation d'évaluation entre acteurs ; il suppose un critère de valeur partagé par un groupe, qui est le tiers implicite de toute relation de statut ; il est accordé par les autres, non pris ; il est consensuel, car le haut et le bas connaissent leur rang ; il est public, car il existe aux yeux d'un groupe.", "titre_en": "Status is relational, social, given, consensual, and public", "enonce_en": "Status is an evaluative relation between actors; it presupposes a standard of value shared by a group, the implicit third party of every status relation; it is granted by others, not taken; it is consensual, since high and low both know their rank; it is public, since it exists in the eyes of a group.", "citation": "“That status is given, not taken, is one of its fundamental features.”", "pages": [10, 11, 12], "depends_on": ["D01", "A04"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par D01, le statut est un classement comparatif : nul n'a un statut haut ou bas sinon par rapport à d'autres ; le moins estimé n'est pas sans estime, il l'est moins (p. 10).\n2. C'est un classement *social* : il suppose un critère partagé de ce qui « compte », extérieur aux deux acteurs, celui du groupe, qui est le tiers implicite de la relation ; les critères variant d'un groupe à l'autre, le statut est une relation à plusieurs niveaux (p. 10-11).\n3. Le statut dépend donc des évaluations des autres : par A04, il ne se saisit pas, il ressemble à une réputation et doit être accordé (p. 11).\n4. Le critère étant une croyance culturelle partagée, haut et bas reconnaissent leur rang : la reine du bal et Suzie Glutz savent où se tient l'autre ; le bas statut ne juge pas forcément son rang mérité, mais sait comment le groupe le voit (p. 11-12).\n5. Le groupe agissant comme observateur, le classement est public : l'approbation ou la désapprobation existent aux yeux d'un public, d'où une grande part de leur poids émotionnel (p. 12). ∎", "body_en": "## Demonstration\n\n1. By D01, status is a comparative ranking: no one has high or low status except in relation to others; the least esteemed is not without esteem, but less esteemed (p. 10).\n2. It is a *social* ranking: it presupposes a shared standard of what \"counts\", external to the two actors, that of the group, which is the implicit third party of the relation; since standards vary between groups, status is a multilevel relation (p. 10-11).\n3. Status therefore depends on others' evaluations: by A04, it cannot be seized, it resembles a reputation and must be granted (p. 11).\n4. Since the standard is a shared cultural belief, high and low both recognise their rank: the prom queen and Suzie Glutz know where each other stands; the low-status actor need not find her rank deserved, but knows how the group sees her (p. 11-12).\n5. Since the group acts as an observer, the ranking is public: approval or disapproval exist in the eyes of an audience, hence much of their emotional weight (p. 12). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A04", "D01"], "sections": ["Démonstration"], "demo_refs": ["A04", "D01"], "mentions": ["A04", "D01"], "corollaires": [], "mtime": 1794590968.4009836}, {"id": "T003", "file": "theses/T003.md", "type": "these", "partie": "1", "titre": "La hiérarchie de statut, solution bornément fonctionnelle", "enonce": "En accordant estime et influence en proportion de la contribution perçue au but commun, la hiérarchie de statut motive les contributions, coordonne les avis divergents et canalise la rivalité vers l'effort commun. Elle est fonctionnelle, mais bornément, car le statut récompense une valeur *perçue* ; et sa fonctionnalité n'explique pas comment elle se forme.", "titre_en": "The status hierarchy as a boundedly functional solution", "enonce_en": "By granting esteem and influence in proportion to perceived contribution to the shared goal, the status hierarchy motivates contributions, coordinates diverging views, and channels rivalry into the shared effort. It is functional, but boundedly so, since status rewards *perceived* value; and its functionality does not explain how it forms.", "citation": "“a “boundedly functional” organizational solution”", "pages": [7, 8, 12, 13, 14], "depends_on": ["D02", "D03", "E01", "E02"], "contre": ["R02"], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par E01, une hiérarchie d'estime et d'influence (D02) émerge en quelques minutes dans les groupes orientés vers un but, même entre égaux (p. 7-8).\n2. L'interdépendance (D03) pose deux problèmes : organiser l'effort collectif (motiver et coordonner) et gérer l'intérêt de chacun à diriger l'effort à son profit (p. 12-13).\n3. Par E02, la hiérarchie accorde estime et influence en échange de la valeur perçue pour l'effort commun (p. 13).\n4. Le statut récompense donc la contribution (motivation) ; l'influence va aux meilleures contributions perçues (coordination) ; et la rivalité se convertit en concours de contributions, ce qui atténue sans l'abolir le problème de l'intérêt compétitif (p. 13).\n5. La valeur étant *perçue*, et les perceptions biaisables, la solution n'est que « bornément » fonctionnelle (p. 14).\n6. Mais la fonctionnalité ne dit ni comment ces hiérarchies apparaissent ni pourquoi elles l'emportent sur d'autres, comme la pure dominance : il faut une explication plus profonde (p. 14). ∎\n\n## Scolie\n\nRidgeway endosse l'essentiel de cette lecture « bornément fonctionnelle » (p. 14) ; c'est son pouvoir explicatif qu'elle conteste, d'où la suite du livre.", "body_en": "## Demonstration\n\n1. By E01, a hierarchy of esteem and influence (D02) emerges within minutes in goal-oriented groups, even among equals (p. 7-8).\n2. Interdependence (D03) poses two problems: organising the collective effort (motivating and coordinating) and managing each member's interest in running the effort to their own advantage (p. 12-13).\n3. By E02, the hierarchy grants esteem and influence in exchange for perceived value to the shared effort (p. 13).\n4. Status thus rewards contribution (motivation); influence goes to the best perceived contributions (coordination); and rivalry becomes a contest of contributions, which mitigates without abolishing the competitive interest problem (p. 13).\n5. Since value is *perceived*, and perceptions can be biased, the solution is only \"boundedly\" functional (p. 14).\n6. But functionality says neither how these hierarchies develop nor why they prevail over others, such as pure dominance: a deeper explanation is needed (p. 14). ∎\n\n## Scholium\n\nRidgeway endorses the main points of this \"boundedly functional\" reading (p. 14); it is its explanatory power that she disputes, hence the rest of the book.", "sections_en": ["Demonstration", "Scholium"], "demo_refs_en": ["D02", "D03", "E01", "E02"], "sections": ["Démonstration", "Scolie"], "demo_refs": ["D02", "D03", "E01", "E02"], "mentions": ["D02", "D03", "E01", "E02"], "corollaires": [], "mtime": 1794590968.4009836}, {"id": "T004", "file": "theses/T004.md", "type": "these", "partie": "1", "titre": "Statut, pouvoir et richesse sont distincts mais réciproques", "enonce": "Le statut diffère du pouvoir et de la richesse : il est donné, eux sont pris et possédés ; il est culturel, eux plus directement matériels. Mais une fois établi, il va de pair avec eux, et la relation est largement réciproque : le haut statut ouvre l'accès aux ressources et au pouvoir, et la richesse finit par produire des croyances de statut.", "titre_en": "Status, power and wealth are distinct but reciprocal", "enonce_en": "Status differs from power and wealth: it is given, they are taken and possessed; it is cultural, they are more directly material. But once established it co-occurs with them, and the relationship is largely reciprocal: high status opens access to resources and power, and wealth ends up producing status beliefs.", "citation": "", "pages": [14, 15, 16], "depends_on": ["T002", "A02", "A03"], "contre": [], "lien_explicite": true, "statut_revision": "brouillon", "body": "## Démonstration\n\n1. Par A02, le pouvoir force l'obéissance sans le consentement ; le statut ne donne que l'influence, la capacité de persuader (p. 14).\n2. Par A03, le pouvoir vient du contrôle des ressources ; pouvoir et richesse sont donc des formes d'inégalité étroitement liées (p. 15).\n3. Par T002, le statut est donné par les évaluations des autres, alors que richesse et pouvoir sont pris et possédés ; et il est pleinement culturel, fait de croyances sur « ce qui compte » et « qui compte plus » (p. 15).\n4. Pourtant le statut coïncide souvent avec le pouvoir et les ressources : le haut statut place pour recevoir une plus grande part des ressources du groupe, que le contrôle convertit en pouvoir (p. 15-16).\n5. Les hiérarchies de statut font l'intermédiaire entre les individus et l'accès aux ressources dans les institutions qui distribuent revenus, éducation, emploi, santé ; et, à l'inverse, la richesse et le pouvoir finissent par engendrer des croyances qui peignent les riches comme « meilleurs » (p. 16). ∎", "body_en": "## Demonstration\n\n1. By A02, power forces compliance without consent; status brings only influence, the capacity to persuade (p. 14).\n2. By A03, power comes from control of resources; power and wealth are therefore closely related forms of inequality (p. 15).\n3. By T002, status is given by others' evaluations, whereas wealth and power are taken and possessed; and it is fully cultural, made of beliefs about \"what counts\" and \"who counts more\" (p. 15).\n4. Yet status often co-occurs with power and resources: high status positions one to receive a larger share of the group's resources, which control converts into power (p. 15-16).\n5. Status hierarchies mediate between individuals and access to resources in the institutions that distribute income, education, jobs, health care; and conversely, wealth and power end up producing beliefs that portray the rich as \"better\" (p. 16). ∎", "sections_en": ["Demonstration"], "demo_refs_en": ["A02", "A03", "T002"], "sections": ["Démonstration"], "demo_refs": ["A02", "A03", "T002"], "mentions": ["A02", "A03", "T002"], "corollaires": [], "mtime": 1794590968.40199}, {"id": "T005", "file": "theses/T005.md", "type": "these", "partie": "2", "titre": "La dominance n'est pas le fondement des hiérarchies de statut", "enonce": "Une hiérarchie de dominance peut organiser une production collective, mais ma
